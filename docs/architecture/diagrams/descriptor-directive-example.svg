="171.4754"/><line style="stroke:#000000;stroke-width:1;" x1="10" x2="622.8837" y1="171.4754" y2="171.4754"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="102.1576" x="15" y="188.4414">integrity_rules</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10.92" x="152.4975" y="188.4414">&#160;&#160;&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="147.4975" x2="147.4975" y1="171.4754" y2="194.5433"/><line style="stroke:#000000;stroke-width:1;" x1="10" x2="622.8837" y1="194.5433" y2="194.5433"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="127.4975" x="15" y="211.5093">validation_criteria</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10.92" x="152.4975" y="211.5093">&#160;&#160;&#160;</text><line style="stroke:#000000;stroke-width:1;" x1="147.4975" x2="147.4975" y1="194.5433" y2="217.6113"/><rect fill="none" height="207.6113" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="612.8837" x="10" y="10"/><rect fill="#F1F1F1" height="69.2038" rx="5" ry="5" style="stroke:#F1F1F1;stroke-width:1.5;" width="481.9382" x="667" y="72.3981"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="471.9382" x="672" y="89.3641">Record version-impacting changes with migration notes when required.</text><line style="stroke:#000000;stroke-width:1;" x1="667" x2="1148.9382" y1="95.466" y2="95.466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465.6243" x="672" y="112.432">Keep artifact schema version fields consistent with supported contract.</text><line style="stroke:#000000;stroke-width:1;" x1="667" x2="1148.9382" y1="118.534" y2="118.534"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="402.6245" x="672" y="135.4999">Validate repository-wide compatibility after doctrine updates.</text><rect fill="none" height="69.2038" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="481.9382" x="667" y="72.3981"/><rect fill="#F1F1F1" height="46.1358" rx="5" ry="5" style="stroke:#F1F1F1;stroke-width:1.5;" width="496.1482" x="660" y="159.9321"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="405.8305" x="665" y="176.898">Breaking doctrine changes require explicit upgrade guidance.</text><line style="stroke:#000000;stroke-width:1;" x1="660" x2="1156.1482" y1="183" y2="183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="486.1482" x="665" y="199.9659">Artifact version metadata must not drift from actual schema expectations.</text><rect fill="none" height="46.1358" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="496.1482" x="660" y="159.9321"/><rect fill="#F1F1F1" height="46.1358" rx="5" ry="5" style="stroke:#F1F1F1;stroke-width:1.5;" width="470.6123" x="672.5" y="223.9321"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="413.4745" x="677.5" y="240.898">Version-affecting doctrine changes include compatibility notes.</text><line style="stroke:#000000;stroke-width:1;" x1="672.5" x2="1143.1123" y1="247" y2="247"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="460.6123" x="677.5" y="263.9659">Validation checks pass across shipped doctrine artifacts after updates.</text><rect fill="none" height="46.1358" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="470.6123" x="672.5" y="223.9321"/><path d="M611,160 L624,160 C640.4924,160 643.8715,154.4454 660,151 C672.4871,148.3325 685.3527,145.7 698.3473,143.1293" fill="none" style="stroke:#000000;stroke-width:1;stroke-dasharray:3,3;"/><path d="M698.9498,146.1949 L700.6465,142.6774 L697.7448,140.0637 L706.0