# Divergence register, machine-readable: the form of every entry of both blocks of
# divergence-register.md, the human-readable page, which presents them (the pack-schema entries
# one by one, the context-read and activation entries in a table). DivergenceRegisterTest fails
# when an id is listed twice here or is on one of the two and not the other. The blocks are pack
# schemas (DIV-001..099, ADR-0017), context read (DIV-101..110, ADR-0018), activation
# (DIV-201..245, ADR-0020; DIV-238 is claimed by the step-enhancements mission; DIV-208 withdrawn before it landed, so its id stays taken; DIV-201 and DIV-202 were proposed until PR B), pack-level files (DIV-301..399, ADR-0042), procedures and
# toolguide guides (DIV-401..499, ADR-0043), mission types (DIV-501..599, ADR-0044) and registration (DIV-601..699, ADR-0065). Consumers: the
# conformance gate (#72) and the pack doctor parity test (#115) read this file; a difference from
# core that is not listed here with status `open` fails them, so a `proposed` entry is not yet
# enforced.
#
# Schema, one list item per divergence:
#   id         DIV-NNN, unique, never reused
#   surface    the file, field or behavior that differs
#   core       what core does at the pinned commit 9554e7b2
#   service    what this repository does
#   rationale  why the difference is deliberate
#   ruling     the decision that makes it deliberate (open-questions, spec ruling R, plan call P, ADR)
#   status     open (the difference stands) | aligned (core now agrees) | retired (no longer relevant)
#              | withdrawn (recorded in error or twice; the id stays taken)
#              | proposed (recorded ahead of the operation being built; page-only intent, not yet
#                enforced by the gate)
#   since      date the entry was added, YYYY-MM-DD
#   evidence   list of strings: core file:line, charter file, import change id (C1-C16, see the mission research), corpus case
#   note       optional: why an entry is withdrawn, aligned or retired
#
# Evidence paths of core are relative to core's src/charter/ unless they start with a repository name.
- id: DIV-001
  surface: An action that is not a graph node, in the action-context answer
  core: Falls back to the non-bootstrap context (activation/context.py).
  service: Answers 404 action_not_found.
  rationale: >-
    A silent fallback hides a wrong action name. The contract refuses it and the shadow comparison
    maps the refusal to core's fallback.
  ruling: contracts/charter/CHANGELOG.md, Provisional (the second item); ADR-0016 decision 4
  status: withdrawn
  since: 2026-10-19
  note: Recorded as DIV-101 in the context-read block; the id stays taken.
  evidence:
    - "core: activation/context.py"
    - "charter: contracts/charter/CHANGELOG.md#provisional, the second item"

- id: DIV-002
  surface: A scope edge to a node the graph does not declare
  core: Skips that artifact (activation/context_renderers/delivery_table.py).
  service: Lists the artifact with a null label.
  rationale: >-
    The contract states the dangling edge instead of dropping it, so a consumer can see the
    defect. The scenario pins this answer and says core omits it.
  ruling: contracts/charter/CHANGELOG.md, Provisional (the third item); ADR-0016 decision 4
  status: withdrawn
  since: 2026-10-19
  note: Recorded as DIV-102 in the context-read block; the id stays taken.
  evidence:
    - "core: activation/context_renderers/delivery_table.py"
    - "charter: contracts/charter/CHANGELOG.md#provisional, the third item"

- id: DIV-003
  surface: pack_level_missing, the diagnostic for a missing pack level
  core: An advisory, not at every level and not for a pack with no pack.yaml (offering/packs/pack_validator.py:727-767).
  service: >-
    A non-blocking diagnostic at every level and for a pack with no pack.yaml. It becomes a
    refusal when core ADR 2026-10-11-2 closes its deprecation window.
  rationale: The service is deliberately stricter than core. Open-packs was brought into line.
  ruling: open-questions Q13 (2026-10-18); contracts/charter/CHANGELOG.md, Provisional (the PackSummary.diagnostics item)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/packs/pack_validator.py:727-767"
    - "core: offering/drg/org_pack_loader.py:519-566"
    - "charter: contracts/charter/CHANGELOG.md#provisional, the PackSummary.diagnostics item"
    - "charter: docs/plans/open-questions.md, Q13"

- id: DIV-004
  surface: pack.yaml, pack_version
  core: Required for built-in packs only (offering/packs/pack_descriptor.py:143-148).
  service: >-
    Required at every level, as a non-empty string. A missing, null or empty value is refused by
    the schema.
  rationale: >-
    One rule for every pack level. Q13 already requires it and open-packs declares it everywhere,
    so no real pack changes.
  ruling: open-questions Q13 (2026-10-18); R4 (2026-10-19)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/packs/pack_descriptor.py:143-148"
    - "charter: contracts/packs/schemas/pack-descriptor.schema.json: pack_version is required at every level as a non-empty string (import change C9, and its C13 exception; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"
    - "charter: docs/adr/0017-pack-schemas-imported-as-canonical-json-schema.md, Amendment 2026-10-19"

- id: DIV-005
  surface: Unknown keys in pack.yaml
  core: Reported as an error. Core reports the key twice, as a drg and as a pack finding, when the pack has a drg/fragment.yaml, and once otherwise.
  service: >-
    Tolerated, with a warning on the pack listing: the diagnostic pack_unknown_key. The schema's
    top level stays open for this.
  rationale: >-
    A newer pack should still register on an older service, and the author is told about the key.
    The operator chose tolerance with a warning.
  ruling: R5 (2026-10-19); plan call P1; superseded by ADR-0036 ruling 1 (2026-10-27)
  status: retired
  since: 2026-10-19
  note: >-
    Retired 2026-10-28 (#195, ADR-0036 decision 3): the schema is closed and an unknown key makes
    pack.yaml unreadable, as in core; the pack_unknown_key warning is no longer raised.
  evidence:
    - "core: offering/packs/pack_descriptor.py:88 (extra=\"forbid\")"
    - "core: offering/drg/org_pack_loader.py:547-560 (the second report, when drg/fragment.yaml exists)"
    - "charter: contracts/packs/schemas/pack-descriptor.schema.json: the top level stays open, so an unknown key is reported by the adapter and not refused (import change C9; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-006
  surface: Retired pack.yaml fields, such as accompanies_doctrine_pack
  core: Refused with a blocking finding (offering/packs/retired_fields.py:84-91).
  service: Warned like any unknown key (pack_unknown_key).
  rationale: >-
    One rule for every key the schema does not declare. This is laxer than core and is accepted.
  ruling: R13 (2026-10-19); superseded by ADR-0036 ruling 1 (2026-10-27)
  status: retired
  since: 2026-10-19
  note: >-
    Retired 2026-10-28 (#195, ADR-0036 decision 3): a retired field is an unknown key of the closed
    schema, refused as unreadable like core's blocking finding.
  evidence:
    - "core: offering/packs/retired_fields.py:84-91"
    - "charter: contracts/packs/schemas/pack-descriptor.schema.json: the top level stays open and pack_level is optional, so a retired key is reported by the adapter (import change C9; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-007
  surface: Edge endpoints in graph shards and org fragments
  core: >-
    A fragment endpoint may be a bare local id, resolved first against the pack's own nodes, then as
    a URN, then against the built-in layer (offering/drg/merge.py:580-660).
  service: URNs everywhere. A bare local id is refused with drg_schema_error by the schema pattern.
  rationale: >-
    One form for every endpoint, checked by the schema alone. The open-packs migration rewrote the
    84 bare endpoints it had.
  ruling: R6 (2026-10-19)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/merge.py:580-660"
    - "charter: contracts/packs/schemas/graph-shard.schema.json and org-fragment.schema.json: every edge endpoint matches the URN pattern, so a bare local id is refused (import change C3; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-008
  surface: Org-fragment header fields pack_name, source_kind, source_ref, layer_index, provenance_marker
  core: Accepted, and overwritten from the operator's configuration (offering/drg/org_pack_loader.py:648-655).
  service: Not authored. A fragment that carries one is refused as an unknown key.
  rationale: >-
    Core's own comment calls the pack-side copies advisory. Authored data should not carry values
    the loader replaces.
  ruling: R7 (2026-10-19)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/org_pack_loader.py:648-655"
    - "charter: contracts/packs/schemas/org-fragment.schema.json: the five header fields are removed from the closed top level (import change C6; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-009
  surface: Graph shard generated_by
  core: Required (offering/drg/models.py:441).
  service: Optional. generated_at stays required.
  rationale: >-
    The service is laxer than core here. Nothing reads the value, and a hand-written shard has no
    generator.
  ruling: R8 (2026-10-19)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/models.py:441"
    - "charter: contracts/packs/schemas/graph-shard.schema.json: generated_by is not required (import change C8; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-010
  surface: Lenient value conversions
  core: >-
    Converts a scalar role to roles, accepts schema_version "1" as an integer, lowercases role
    names and reads a quoted number as an integer.
  service: None of these is done. Each is refused by the schema.
  rationale: >-
    A file is judged as written. No open-packs file relies on a conversion.
  ruling: R9 (2026-10-19); ADR-0017 Amendment 2026-10-19
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/agent_profiles/profile.py:294-327 (scalar role to roles)"
    - "core: offering/agent_profiles/profile.py:54-55 and :93 (role lowercasing in Role)"
    - "core: activation/org_charter.py:217-235 (schema_version \"1\" to an integer)"
    - "core: pydantic lax mode, no strict config (a quoted number to an integer)"
    - "charter: contracts/packs/schemas/agent-profile.schema.json: the lenient conversions are dropped (import change C10; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16); org-charter.schema.json, which dropped them too, is deleted with the retired file (#431, DIV-303)"
    - "charter: contracts/packs/schemas/glossary-pack.schema.json and skill.schema.json (#192): a quoted confidence or a quoted boolean, which core's pydantic models convert, is refused (ADR-0039)"

- id: DIV-011
  surface: Org-fragment node kinds
  core: >-
    Canonical fragment kind name is mission_steps, with mission_step_contracts kept as the
    back-compat alias; also accepts the mission_type singular alias, and refuses actions and
    anti_patterns (offering/drg/org_pack_loader.py:72-100, 118-139).
  service: >-
    One name per concept, 15 plurals. The canonical name is the reverse of core's:
    mission_step_contracts is the one name, and core's canonical mission_steps is refused, as is
    mission_type. actions and anti_patterns are accepted.
  rationale: One name per concept, with no aliases. The glossary records the canonical names.
  ruling: R14 (2026-10-19); plan call P9
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/org_pack_loader.py:72-100 (mission_steps is the canonical plural; mission_step_contracts is the input alias)"
    - "core: offering/drg/org_pack_loader.py:118-139"
    - "charter: contracts/packs/schemas/org-fragment.schema.json: the node kind is an enum of the 15 fragment plurals (import change C5; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-012
  surface: URN node kinds
  core: Also accepts the kinds glossary and glossary_scope, both NodeKind members (offering/drg/models.py:61-66).
  service: The 15 node kinds the service models. glossary and glossary_scope are refused.
  rationale: The service has no node of those kinds, and the URN pattern is generated from the kinds it models.
  ruling: R15 (2026-10-19)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/models.py:61-66"
    - "charter: contracts/packs/schemas/graph-shard.schema.json: the URN pattern and one prefix-equals-kind branch per node kind (import changes C3 and C4; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"
    - "charter: contracts/packs/file-kinds.yaml"

- id: DIV-013
  surface: Nested sections of an agent profile and of charter.yaml
  core: Ignores unknown keys in nested sections (extra="ignore" on 8 agent-profile and 13 charter.yaml sections).
  service: Refuses them. Every nested section with declared properties is closed.
  rationale: >-
    A misspelled nested key should not pass in silence. No open-packs file is affected, which the
    corpus probe re-checks.
  ruling: spec open review item 1 (the closure of nested sections)
  status: open
  since: 2026-10-19
  evidence:
    - "charter: contracts/packs/schemas/agent-profile.schema.json and charter.schema.json: the nested sections are closed with additionalProperties false (import change C2, 8 and 13 closed schemas; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"
    - "charter: kitty-specs/pack-schemas-and-level-policy-01M5AFMA/spec.md, open review item 1"

- id: DIV-014
  surface: Nested tactics under built-in/tactics/<sub>/
  core: >-
    validate_pack does not scan the 89 nested files, although the runtime loads them
    (offering/packs/pack_validator.py).
  service: Validated like any tactic.
  rationale: A file the runtime loads should be checked.
  ruling: spec open review item 2 (nested tactics are validated)
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/packs/pack_validator.py:291-295 (_scan_files: recursive glob only for styleguides and assets)"
    - "charter: kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Corpus"

- id: DIV-015
  surface: The relation alias extends in a fragment edge
  core: Aliased at merge time (offering/drg/merge.py:100-102).
  service: Refused. The relation is a Relation value with no aliases.
  rationale: R14's one-name rule, applied to relations. The Java reader refuses it today.
  ruling: plan call P2
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/merge.py:100-102"
    - "charter: contracts/packs/schemas/org-fragment.schema.json: the edge relation is a reference to the Relation enum, which has no extends (import change C7; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-016
  surface: The asset MIME type check
  core: >-
    Asks the platform for the type, so the answer can depend on the system's mime.types files
    (offering/packs/pack_validator.py:1377-1510).
  service: >-
    Uses a fixed extension table taken from Python's built-in table of MIME types,
    without the system files.
  rationale: >-
    A verdict must not depend on the machine it runs on. A possible difference is recorded. An
    example: .xml is text/xml in the fixed table but application/xml in Debian's /etc/mime.types,
    and .yaml, .yml, .ttf and .woff2 are unknown to the fixed table while Debian's file lists
    them (application/yaml, font/ttf, font/woff2).
  ruling: plan call P8; R16
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/packs/pack_validator.py:1377-1510"
    - "charter: kitty-specs/pack-schemas-and-level-policy-01M5AFMA/plan.md, call P8"

- id: DIV-017
  surface: Validate mode, an invalid pack.yaml
  core: >-
    Stops at an invalid pack.yaml, so defects in the other files go unreported (research R3).
  service: Validate mode collects every finding. Loading stays fail-fast.
  rationale: >-
    The doctor wants the full list in one run. The comparison for #115 lists this as a known
    difference.
  ruling: FR-010; plan call P12; plan section "#115 doctor parity test design"
  status: open
  since: 2026-10-19
  evidence:
    - "charter: kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, R3 and R5"
    - "charter: kitty-specs/pack-schemas-and-level-policy-01M5AFMA/plan.md, rule row P14"

- id: DIV-018
  surface: The impacts relation and the edge impacts strength
  core: Has neither yet. The relation enum has no impacts member (offering/drg/models.py:83-148).
  service: >-
    Models both. The pack schemas' Relation enum is core's 15 values, including in_tension_with, plus impacts, 16 in all, and an edge may carry
    a numeric impacts strength. in_tension_with is today's spelling of the ADR-0028 tension: the service
    holds it as a tension beside the relationships and writes it back as written (ADR-0045); it is never
    read as impacts.
  rationale: >-
    The contract leads and core aligns at the cutover. The service's own Relation type has 15
    values, the same set without in_tension_with, which is a known difference: a tension is not a
    relation type (ADR-0045).
  ruling: ADR-0009 D1; ADR-0014 D-2; plan call P11; ADR-0028; ADR-0045
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/models.py:83-148"
    - "charter: contracts/packs/schemas/graph-shard.schema.json and org-fragment.schema.json: the Relation enum adds impacts and keeps in_tension_with, and an edge has an optional impacts number (import changes C7 and C12, and the known C7 difference; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-019
  surface: Edge provenance
  core: >-
    A merge-time marker that core stamps on each edge (offering/drg/models.py:409-412).
  service: Not authored. An edge in a graph shard that carries provenance is refused.
  rationale: >-
    Runtime provenance is not authored data. This applies the principle of R7. No open-packs edge
    carries it.
  ruling: plan call P10; R7
  status: open
  since: 2026-10-19
  evidence:
    - "core: offering/drg/models.py:409-412"
    - "charter: contracts/packs/schemas/graph-shard.schema.json: the edge has no provenance property (import change C16; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-020
  surface: Fragment node id grammar
  core: >-
    Accepts any string as a fragment node id (offering/drg/org_pack_loader.py:371, `id: str`); the
    plant `bad id!` passes `pack validate`.
  service: >-
    Requires minLength 1 and the pattern ^[A-Za-z0-9_/.-]+$ (C5, P9). The plant is refused.
  rationale: >-
    A node id becomes part of a URN and a path, so it takes a safe grammar. No open-packs node id
    falls outside it.
  ruling: R11 register decision (2026-10-20, operator); plan call P9
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/drg/org_pack_loader.py:371"
    - "charter: service/packs/src/test/resources/planted/c5-fragment-node-id-unsafe (core verdict in planted/core-verdicts.json: ok, no findings)"
    - "charter: contracts/packs/schemas/org-fragment.schema.json: the node id has minLength 1 and the pattern ^[A-Za-z0-9_/.-]+$ (import change C5; see kitty-specs/pack-schemas-and-level-policy-01M5AFMA/research.md, Import changes C1-C16)"

- id: DIV-021
  surface: charter.yaml inside a pack
  core: >-
    Never reads it: `charter pack validate` has no leg for charter.yaml (only org-charter.yaml,
    offering/packs/pack_validator.py:607-609 and 2133-2157 at 78c48ce9).
  service: >-
    Validates it with charter.schema.json, including cli_timeout_seconds, which refuses .nan and
    .inf.
  rationale: >-
    A file the pack ships should be checked against the schema that describes it, and a
    non-finite timeout is never meant.
  ruling: R11 register decision (2026-10-20, operator)
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/packs/pack_validator.py:607-609 (the call) and 2133-2157 (_check_org_charter), at 78c48ce9: the only charter leg is org-charter.yaml"
    - "charter: the service has no org-charter.yaml leg either: the file is retired and refused by name (#431, DIV-303)"
    - "charter: planted plants charter-invalid and charter-cli-timeout-not-a-number (core verdicts in planted/core-verdicts.json: ok, no findings)"

- id: DIV-022
  surface: org_fragment_missing in validate mode on a bare path
  core: >-
    validate_pack is ok for a pack with no drg/fragment.yaml; only the loader refuses it, with
    OrgPackMissingError (offering/drg/org_pack_loader.py:626-628; offering/packs/pack_validator.py:893-900).
  service: >-
    Validate mode blocks with org_fragment_missing on a bare path.
  rationale: >-
    The doctor should report at validation time what the load refuses later.
  ruling: R11 register decision (2026-10-20, operator)
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/drg/org_pack_loader.py:626-628"
    - "core: offering/packs/pack_validator.py:893-900"
    - "charter: planted plant org-fragment-missing (core verdict in planted/core-verdicts.json: ok, no findings)"

- id: DIV-023
  surface: A root *.graph.yaml in a pack
  core: >-
    Reads only drg/*.graph.yaml and drg/fragment.yaml (offering/packs/pack_validator.py:507,
    845); a root shard is never validated.
  service: Validates a root *.graph.yaml like any shard.
  rationale: A graph file the pack ships should be checked wherever it sits.
  ruling: R11 register decision (2026-10-20, operator)
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/packs/pack_validator.py:507 (drg_dir = pack_dir / \"drg\")"
    - "core: offering/packs/pack_validator.py:845 (_DRG_GRAPH_GLOB)"
    - "charter: planted plant c3-root-shard-urn-malformed (core verdict in planted/core-verdicts.json: ok, no findings)"

- id: DIV-024
  surface: pack_level_missing on a bare path with no configured level
  core: >-
    Advises PACK_LEVEL_MISSING whenever pack.yaml has no pack_level key
    (offering/packs/pack_validator.py:746-766).
  service: >-
    Raises no pack_level_missing on a bare path, where no level is configured to compare with.
  rationale: >-
    Without a configured position the service has no level to expect, so it stays silent
    instead of advising.
  ruling: R11 register decision (2026-10-20, operator)
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/packs/pack_validator.py:746-766"
    - "charter: planted plant control-no-pack-level-on-a-bare-path (core verdict in planted/core-verdicts.json: one PACK_LEVEL_MISSING advisory)"

- id: DIV-025
  surface: UTF-16 with a byte order mark
  core: >-
    Decodes it: the artifact scan hands the path to the YAML parser, which detects the encoding
    (offering/packs/pack_validator.py:288, 301), and accepts
    the plant.
  service: >-
    A UTF-16 file with a byte order mark is not UTF-8 and so not valid YAML here; it is refused.
  rationale: >-
    Pack files are UTF-8, and one reading of every file keeps a verdict the same on every machine.
  ruling: R11 register decision (2026-10-20, operator)
  status: open
  since: 2026-10-20
  evidence:
    - "core: offering/packs/pack_validator.py:288 and 301 (_yaml_parser().load(path), no explicit encoding)"
    - "charter: planted plant artifact-utf16-with-a-byte-order-mark (core verdict in planted/core-verdicts.json: ok, no findings)"

# Context read (DIV-101..110), decided in ADR-0018 and moved into this single register by operator
# ruling R10 (2026-10-19). Derived from the context-read table of divergence-register.md; the evidence
# names the conformance corpus case that pins each entry.
- id: DIV-101
  surface: An action that is not a graph node, in the action-context answer
  core: Its non-bootstrap context.
  service: Answers 404 action_not_found for an action that is not a graph node.
  rationale: >-
    Decided in ADR-0018. The shadow comparison maps the charter's 404 action_not_found to core's
    fallback and counts the pair as matching.
