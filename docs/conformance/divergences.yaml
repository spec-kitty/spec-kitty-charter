    required one that an active override of it satisfies is satisfied by that override instead
    (DIV-225).
  rationale: >-
    A required or locked floor is not opt-out: the read keeps it active so the allow list cannot
    silently drop a required artifact. Proposed with the activation resource; open since
    2026-11-08, when PR B built the effective reads.
  ruling: ADR-0020 (proposed on #123); agreed with core's activation ledger mission 2026-10-20
