id: how-we-apply-no-full-heavy-suites-in-mission
schema_version: "1.0"
name: How We Apply NO_FULL_HEAVY_SUITES_IN_MISSION
purpose: >-
  Validate mission work with targeted runs and leave the heavy runs to CI.
steps:
  - title: Run the targeted set during mission work
    description: >-
      While implementing or reviewing a work package, run the touched
      module's tests (for example ./gradlew :charter-domain:test) and
      the specific gate the change touches, and record the exact commands and
      counts in the pull request.
  - title: Leave mutation testing to the weekly scheduled run (or a manual dispatch)
    description: >-
      PIT runs only in the weekly scheduled run (or a manual dispatch), as its own task outside check; do not run
      ./gradlew pitest during mission work. Two exceptions, and no other
      (operator, 2026-11-20): one in-mission run scoped to a new module, solely
      to set its first floor; and narrowed runs for PIT tuning work (#530,
      #531), confirmed through workflow_dispatch.
  - title: Classify unrelated reds instead of widening the run
    description: >-
      A red result outside the change's blast radius is classified and left
      to CI, not chased with a broader local sweep.
failure_modes:
  - Dispatch briefs that say "run everything" without naming the targeted
    tasks.
notes: >-
  The charter makes ./gradlew verifyAll the pre-merge gate; this tactic does
  not reclassify it as a heavy suite. Which local runs count as heavy beyond
  PIT is not stated in the interview and is left to the operator.
