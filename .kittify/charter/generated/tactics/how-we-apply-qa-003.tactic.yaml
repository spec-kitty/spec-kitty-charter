id: how-we-apply-qa-003
schema_version: "1.0"
name: How We Apply QA_003 (No Fake Green)
purpose: >-
  Report test runs exactly as they ran.
steps:
  - title: Never reach green by skipping
    description: >-
      No test or scenario is skipped, disabled or quarantined to make a run
      pass; the open-packs round trip is never skipped.
  - title: Report the full outcome
    description: >-
      A pull request's Tests run section states what was run, the pass,
      fail and skip counts, and anything that did not run; a missing report
      is recorded as such, not as a pass.
  - title: Keep provisional behavior visible
    description: >-
      Scenarios that pin provisional behavior are tagged @provisional and
      still execute; they are not counted as acceptance of the final behavior.
failure_modes:
  - Quoting BUILD SUCCESSFUL as the result of a run that excluded a module.
