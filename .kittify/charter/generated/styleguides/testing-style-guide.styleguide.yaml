id: testing-style-guide
schema_version: "1.0"
title: Testing Style Guide
scope: testing
principles:
  - Test first - a failing contract scenario under contracts/charter/scenarios/
    or a failing unit test precedes production code.
  - Every contract operation is pinned by BDD scenarios run with Cucumber-JVM;
    contract scenarios are selected by the @contract tag, and provisional
    behavior is tagged @provisional.
  - Only scenarios/** is on the test classpath; fixtures stay inline in the
    scenario, never as YAML files under the contract tree.
  - Every spec-kitty-open-packs YAML file round-trips through the file-based
    layer (openPacksRoundTrip) with per-pack diagnostics asserted; never
    skipped.
  - Unit tests use JUnit 6 and AssertJ; Mockito only at port boundaries.
  - Assert outcomes, not implementation details; no fake green, no skipped or
    quarantined tests to reach green; test code is reviewed like production
    code.
  - Every scenario change gets a contracts/charter/CHANGELOG.md line.
patterns:
  - name: Outcome assertion
    description: Assert what the contract returns.
    good_example: "Assert the diagnostic codes in the response body (for example pack_level_missing), not which reader method ran."
anti_patterns:
  - name: Interaction-only test
    description: Verifying that a collaborator was called proves wiring, not
      behavior.
    bad_example: "A test whose only assertion is a Mockito verify(...) on the pack reader."
    good_example: "A test that asserts the pack listing the use case returns for a given pack tree."
  - name: Disabled to reach green
    description: Disabling a failing test hides a regression.
    bad_example: "@Disabled(\"flaky\")"
    good_example: "Fix the cause, or record the failure as an open review item and keep the test running."
tooling:
  scenarios: Cucumber-JVM
  unit: JUnit 6 with AssertJ
  doubles: Mockito
  architecture: ArchUnit
  coverage: JaCoCo
  mutation: PIT (nightly only)
quality_test: >-
  Would each new test fail if the contract it pins were broken, and pass after
  a behavior-neutral refactor?
