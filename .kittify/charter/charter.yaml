    pr_approvals: 1
    pre_commit_hooks: false
  commits: {}
  performance:
    cli_timeout_seconds: 2.0
    dashboard_max_wps: 100
  branch_strategy:
    main_branch: main
    rules: []
  charter:
    selected_paradigms:
    - behaviour-driven-development
    - specification-by-example
    - domain-driven-design
    - c4-incremental-detail-modeling
    selected_directives:
    - DIRECTIVE_001
    - DIRECTIVE_003
    - DIRECTIVE_010
