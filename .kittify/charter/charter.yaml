    - DIRECTIVE_051
    - RECONCILE_CHANGE_SCOPE_TENSIONS
    - USE_C4_MODEL_TECHNIQUES
    selected_tactics: []
    selected_styleguides:
    - java-conventions
    - given-when-then-authoring
    - testing-principles
    - test-desiderata-and-boundaries
    selected_toolguides:
    - gherkin
    - java-supply-chain
    - terminology-guard
    - test-quality-triage
    selected_procedures: []
    selected_agent_profiles: []
    selected_mission_step_contracts: []
    selected_glossary_packs: []
