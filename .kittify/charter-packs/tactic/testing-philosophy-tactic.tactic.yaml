failure_modes:
- Coverage numbers used as a substitute for scenario coverage.
id: testing-philosophy-tactic
name: Testing Philosophy
purpose: 'How the project tests: specification by example, test first, meaningful
  tests only.'
schema_version: '1.0'
steps:
- description: Every contract operation is pinned by BDD scenarios under 
    contracts/charter/scenarios/; a failing scenario or unit test comes before 
    production code.
  title: Specify behavior by example first
- description: Every file of charter's own example packs round-trips through the
    file-based layer (wholePackRoundTrip); it is never skipped, and no test reads
    spec-kitty-open-packs content (ADR-0070).
  title: Round-trip the example packs
- description: No fake green, no skipped or quarantined tests to reach green; 
    assertions on outcomes, not implementation details.
  title: Keep tests meaningful
- description: Test quality is part of every review; a test that cannot fail for
    the right reason is rejected.
  title: Review tests like production code
