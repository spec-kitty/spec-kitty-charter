enforcement: required
id: PROJECT_002
integrity_rules:
- An exception, waiver, skip or deferral that touches oracle fidelity or 
  contract compatibility is invalid regardless of who approves it.
- Skipping or quarantining the open-packs round trip, or disabling dependency 
  verification, to reach green is non-compliant.
- An exception for any other risk without scope, reason, approver and sunset or 
  review date is non-compliant.
intent: "Two failures are the costliest and are never traded for speed, scope or convenience:
  (1) the service answering governance content that differs from core's Python charter
  oracle (the wire format may differ, but the data must match closely enough that
  core does not break); (2) the service not honoring the OpenAPI contract, or an incompatible
  contract change reaching core. Also never traded away: spec-kitty-open-packs YAML
  content always round-trips without loss or rewrite, and no unverified dependency
  enters the build. No exception is granted for the first two failures."
procedures:
- Pin governance content with contract scenarios taken from core's Python 
  charter behavior, and check a divergence against the oracle before accepting 
  it; when the Java service is deliberately stricter than core, record that as 
  an operator ruling, not a silent divergence.
- Treat every edit to contracts/charter/ as a public contract change - run the 
  contract validation in ./gradlew verifyAll, add a line to 
  contracts/charter/CHANGELOG.md (scenario changes included), and keep changes 
  backward compatible for core's vendored DTOs.
- Keep the open-packs round trip (openPacksRoundTrip) green and never skipped; a
  change that cannot round-trip every open-packs YAML file does not merge.
- Admit a dependency only with strict SHA-256 entries in 
  gradle/verification-metadata.xml.
- For any other risk, an exception names its scope, the reason, the approver and
  a sunset or review date in the pull request and, when it outlives the change, 
  in docs/plans/open-questions.md.
schema_version: '1.0'
scope: Every change to the service, the charter contract, the file-based pack 
  layer, the build and its dependency set, whether it runs as a mission or as an
  Op.
title: Risk Appetite and Non-Negotiable Failures
validation_criteria:
- No pull request carries an exception against oracle fidelity or contract 
  compatibility.
- Every contract change has a matching contracts/charter/CHANGELOG.md line.
- ./gradlew verifyAll passes with strict dependency verification and the round 
  trip executed, not skipped.
