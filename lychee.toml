# External link check (job "External links" in docs-cleanliness.yml). NON-GATING: remote
# sites flake, so a failure here is reported but never reds a pull request. Internal links
# and anchors are checked at source level by scripts/docs/check_docs.py (gating).
scheme = ["https", "http"]
exclude_path = ["docs/glossary", "docs/_meta"]
# Root-relative site routes (`/glossary/`) have no file or host for lychee to resolve. Give them
# a placeholder base, then exclude it: check_docs.py links owns them.
base_url = "https://docs-site.invalid"
# This repository's own blob/tree URLs on main (templates, ADRs) only exist on main after merge;
# the internal checks own them.
exclude = [
  '^https://docs-site\.invalid',
  '^https://github\.com/spec-kitty/spec-kitty-charter/(blob|tree)/main/',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
]
accept = [200, 206, 429]
max_retries = 3
timeout = 20
max_concurrency = 8
no_progress = true
