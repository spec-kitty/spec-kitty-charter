name: Docs site

# Builds the doc-kitty docsite from docs/ on every pull request that touches the
# docs or the service, and publishes it to GitHub Pages from main. The site carries the
# service's aggregated Javadoc under /javadoc/: the `service` job calls service.yml, the
# main build workflow, and the `build` job downloads its `javadoc` artifact from this same
# run into site/public/javadoc before the site is built.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/generate_indexes.py'
      - 'scripts/docs/requirements.txt'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/generate_indexes.py'
      - 'scripts/docs/requirements.txt'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  workflow_dispatch:

permissions:
  contents: read

# One Pages publish at a time; never cancel one in flight. A pull request's run is only a check, so a newer
# push cancels it (ADR-0047: stale runs held runners during the 2026-10-31 pile-up).
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The main build workflow: verifyAll, then the `javadoc` artifact. A called workflow's permissions are
  # bounded by the calling job's, so it gets contents: read and nothing more; it needs no secrets.
  #
  # Only for a publish. On a pull request the CI gate already runs that build (ci.yml), so the `javadoc` job
  # below builds the Javadoc alone instead of building and verifying the service a second time (ADR-0047).
  service:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/service.yml
    permissions:
      contents: read

  javadoc:
    name: Javadoc (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the Javadoc
        run: ./gradlew :charter-reports:aggregateJavadoc
      - name: Upload the Javadoc
        # The same artifact service.yml uploads, so the build job below reads it either way.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc
          path: service/charter-reports/build/docs/javadoc
          if-no-files-found: error

  build:
    needs: [service, javadoc]
    # Exactly one of the two runs; build when it succeeded and nothing failed or was cancelled.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.service.result == 'success' || needs.javadoc.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # @spec-kitty/doc-toolkit is installed from GitHub Packages.
      packages: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node 22 with the GitHub Packages registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # doc-kitty 0.5.0 (Astro 7) requires Node 22.22+.
          node-version: 22.22
          registry-url: https://npm.pkg.github.com
          scope: '@spec-kitty'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        # Exactly what site/package-lock.json records, so a build on main uses the
        # same dependencies as the pull request check did.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Download the Javadoc built by service.yml
        # Published as is under /javadoc/ (site/public/javadoc is ignored by git), and walked by
        # check:built-links below like every other built page.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javadoc
          path: site/public/javadoc
      - name: Set up Python for the index generator
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Generate the changelog and ADR indexes
        # The hubs commit an empty generated block; no pull request edits them (ADR-0047).
        # Fails when an entry lacks the frontmatter its index line needs.
        working-directory: .
        run: |
          set -euo pipefail
          pip install -r scripts/docs/requirements.txt
          python3 scripts/docs/generate_indexes.py --write
      - name: Validate frontmatter and source links
        run: npm run validate
      - name: Build
        # Most pages are drafts during the bootstrap, so drafts are published
        # (as noindex pages) rather than dropped.
        env:
          DK_PUBLISH_DRAFTS: 'on'
          # Render Mermaid in the browser; the build needs no Chromium.
          DK_DIAGRAM_BUILD_RENDER: client
        run: npm run build
      - name: Check links in the built site
        run: npm run check:built-links
      - name: Check OKF export conformance
        # doc-kitty (since 0.4.0) writes dist/okf/ on every build; re-export from the built
        # content graph and validate the bundle against the OKF conformance rules.
        run: npm run check:okf
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    # An explicit status check: the implicit success() would also look at the skipped `javadoc` job upstream of
    # `build`, and skip every publish.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
