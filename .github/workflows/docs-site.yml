name: Docs site

# Builds the doc-kitty docsite from docs/ on every pull request that touches the
# docs or the service, and publishes it to GitHub Pages from main. The site carries the
# service's aggregated Javadoc under /javadoc/: the `service` job calls service.yml, the
# main build workflow, and the `build` job downloads its `javadoc` artifact from this same
# run into site/public/javadoc before the site is built.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/generate_indexes.py'
      - 'scripts/docs/requirements.txt'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/generate_indexes.py'
      - 'scripts/docs/requirements.txt'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  workflow_dispatch:

permissions:
  contents: read

# One Pages publish at a time; never cancel one in flight. A pull request's run is only a check, so a newer
# push cancels it (ADR-0047: stale runs held runners during the 2026-10-31 pile-up).
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The main build workflow: verifyAll, then the `javadoc` artifact. A called workflow's permissions are
  # bounded by the calling job's, so it gets contents: read and nothing more; it needs no secrets.
  #
  # Only for a publish. On a pull request the CI gate already runs that build (ci.yml), so the `javadoc` job
  # below builds the Javadoc alone instead of building and verifying the service a second time (ADR-0047).
  service:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/service.yml
    permissions:
      contents: read

  javadoc:
    name: Javadoc (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the Javadoc
        run: ./gradlew :charter-reports:aggregateJavadoc :contracts:bundleContract
      - name: Upload the Javadoc
        # The same artifact service.yml uploads, so the build job below reads it either way.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc
          path: service/charter-reports/build/docs/javadoc
          if-no-files-found: error
      - name: Upload the contract bundle
        # The same artifact and paths as service.yml; the site publishes it as the API reference.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-bundle
          path: |
            build/contracts/contract/charter-openapi.yaml
            build/contracts/contract/charter-openapi.yaml.sha256
          if-no-files-found: error

  build:
    needs: [service, javadoc]
    # Exactly one of the two runs; build when it succeeded and nothing failed or was cancelled.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.service.result == 'success' || needs.javadoc.result == 'success')
    runs-on: ubuntu-24.04
    # Diagrams render at build time (DocKitty 0.7.0): Mermaid through Chromium, PlantUML through the
    # self-hosted service below. The Playwright image carries Chromium and its OS libraries, so there is
    # no `playwright install` step. Pinned by the multi-arch index digest, resolved on 2026-11-02 with
    #   docker buildx imagetools inspect mcr.microsoft.com/playwright:v1.62.1-noble
    #   -> Digest: sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    # The tag equals the `playwright` pin in site/package.json. Bump the tag, the digest and the pin together.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --init
    services:
      plantuml:
        # Pinned by the multi-arch index digest of jetty-v1.2026.9 (the same as DocKitty v0.7.0 deploy.yml).
        # In a container job the service is reached by name; no port mapping is needed.
        image: plantuml/plantuml-server:jetty-v1.2026.9@sha256:065c66adc6728ba6dd353a29d4ada73f8358b68549a0f710c4bf46b43c103618
        # SANDBOX: PlantUML refuses every URL read, so a diagram cannot reach the network.
        env:
          PLANTUML_SECURITY_PROFILE: SANDBOX
    permissions:
      contents: read
      # @spec-kitty/doc-toolkit is installed from GitHub Packages.
      packages: read
    defaults:
      run:
        # A container job's default shell is sh (dash), which lacks `set -o pipefail`.
        shell: bash
        working-directory: site
    steps:
      - name: Probe the container toolchain
        # Before checkout there is no site/ directory yet, so run from the root. The image ships no pip.
        working-directory: .
        run: |
          python3 --version
          pip --version || echo "no pip in the image"
          git --version
          curl --version | head -1
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node 22 with the GitHub Packages registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # doc-kitty 0.7.0 (Astro 7) requires Node 22.22+.
          node-version: 22.22
          registry-url: https://npm.pkg.github.com
          scope: '@spec-kitty'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        # Exactly what site/package-lock.json records, so a build on main uses the
        # same dependencies as the pull request check did.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts
      # Two producers, one artifact name each: on a pull request the `javadoc` job above, on main the
      # `service` job (service.yml). Either way the artifact comes from this same run.
      - name: Download the Javadoc
        # Published as is under /javadoc/ (site/public/javadoc is ignored by git), and walked by
        # check:built-links below like every other built page.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javadoc
          path: site/public/javadoc
      - name: Download the contract bundle
        # Staged into site/openapi by the prebuild script, published under /reference/api/main/ and
        # compared with the published copy after the build. The path is relative to the workspace.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-bundle
          path: build/contracts/contract
      - name: Set up Python for the index generator
        # actions/setup-python cannot run in the Playwright image (no lsb_release), and the image ships
        # python3 without pip or venv. Install python3-venv from apt (the job runs as root; it brings pip
        # through python3-pip-whl), then use a venv.
        working-directory: .
        run: |
          set -euo pipefail
          apt-get -o Acquire::Retries=5 update -qq
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/docs-venv"
      - name: Wait for the PlantUML server
        # A hard dependency even though no doc page renders PlantUML today: the 23 schema pages each carry a
        # Schematic diagram that DocKitty builds from the schema and renders through this service.
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://plantuml:8080/svg/)" = 200 ]; then echo "PlantUML ready"; exit 0; fi
            echo "waiting for PlantUML ($i/30)"; sleep 2
          done
          echo "PlantUML did not answer 200 on http://plantuml:8080/svg/" >&2; exit 1
      - name: Restore the diagram render cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # A container job's workspace is /__w/..., not the host path; the cache action maps it itself.
          path: .dk-diagram-cache
          # Bump the 0.7.0 in the key and restore-keys together with the @spec-kitty/doc-toolkit pin in site/package.json.
          key: dk-diagram-0.7.0-${{ hashFiles('docs/**/*.md') }}
          restore-keys: |
            dk-diagram-0.7.0-
      - name: Generate the changelog and ADR indexes
        # The hubs commit an empty generated block; no pull request edits them (ADR-0047).
        # Fails when an entry lacks the frontmatter its index line needs.
        working-directory: .
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/docs-venv/bin/pip" install -r scripts/docs/requirements.txt
          "$RUNNER_TEMP/docs-venv/bin/python" scripts/docs/generate_indexes.py --write
      - name: Validate frontmatter and source links
        run: npm run validate
      - name: Build
        # Most pages are drafts during the bootstrap, so drafts are published
        # (as noindex pages) rather than dropped.
        env:
          DK_PUBLISH_DRAFTS: 'on'
          # Render Mermaid and PlantUML to static SVG at build time (Chromium from the container image).
          DK_DIAGRAM_BUILD_RENDER: build
          DK_PLANTUML_SERVER_URL: http://plantuml:8080/svg/
        run: |
          # Guard: reads the value declared above, so a later edit cannot silently fall back to client rendering.
          test "$DK_DIAGRAM_BUILD_RENDER" = build || { echo "::error::DK_DIAGRAM_BUILD_RENDER must be build"; exit 1; }
          export DK_BEOE_CACHE_DIR="$GITHUB_WORKSPACE/.dk-diagram-cache"
          npm run build
      - name: Check that every schema page carries a diagram
        # Fails closed: one built page per contracts/packs/schemas/*.json (the hub excluded), each with the
        # diagram figure DocKitty builds from the schema. The glob matching nothing is a failure. The figure must
        # hold a rendered <svg>: an unrendered figure (client-side fallback) would pass a bare class match.
        run: |
          shopt -s nullglob
          schemas=(../contracts/packs/schemas/*.json)
          pages=(dist/architecture/pack-schemas/*/index.html)
          test "${#schemas[@]}" -gt 0 || { echo "::error::no schemas under contracts/packs/schemas"; exit 1; }
          test "${#pages[@]}" -eq "${#schemas[@]}" || { echo "::error::${#pages[@]} schema pages built for ${#schemas[@]} schemas"; exit 1; }
          missing=$(grep -LE '<figure class="dk-diagram"[^>]*><svg' "${pages[@]}" || true)
          test -z "$missing" || { echo "::error::schema pages without a rendered diagram: $missing"; exit 1; }
          echo "${#pages[@]} schema pages, each with a rendered diagram"
      - name: Check the published OpenAPI contract is the bundled one
        # DocKitty's own .sha256 covers its published copy, so it always verifies. The real check is that the
        # published file is the bundle the build produced: same SHA-256 as the bundler's.
        run: |
          cd dist/reference/api/main
          sha256sum -c openapi.yaml.sha256
          published=$(sha256sum openapi.yaml | cut -d' ' -f1)
          bundled=$(cut -d' ' -f1 "$GITHUB_WORKSPACE/build/contracts/contract/charter-openapi.yaml.sha256")
          test "$published" = "$bundled" || { echo "::error::published openapi.yaml $published differs from the bundle $bundled"; exit 1; }
          echo "published openapi.yaml matches the bundle: $published"
      - name: Check links in the built site
        run: npm run check:built-links
      - name: Check OKF export conformance
        # doc-kitty (since 0.4.0) writes dist/okf/ on every build; re-export from the built
        # content graph and validate the bundle against the OKF conformance rules.
        run: npm run check:okf
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    # An explicit status check: the implicit success() would also look at the skipped `javadoc` job upstream of
    # `build`, and skip every publish.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
