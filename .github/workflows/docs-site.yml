name: Docs site

# Builds the doc-kitty docsite from docs/ on every pull request that touches the
# docs or the service, and publishes it to GitHub Pages from main. The site carries the
# service's aggregated Javadoc under /javadoc/: the `service` job calls service.yml, the
# main build workflow, and the `build` job downloads its `javadoc` artifact from this same
# run into site/public/javadoc before the site is built.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs-site.yml'
      # The service build paths (as in service.yml), so a Javadoc change republishes the site.
      - 'contracts/**'
      - 'service/**'
      - 'build-logic/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/service.yml'
  workflow_dispatch:

permissions:
  contents: read

# One Pages publish at a time; never cancel one in flight.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The main build workflow: verifyAll, then the `javadoc` artifact. A called workflow's permissions are
  # bounded by the calling job's, so it gets contents: read and nothing more; it needs no secrets.
  service:
    uses: ./.github/workflows/service.yml
    permissions:
      contents: read

  build:
    needs: service
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # @spec-kitty/doc-toolkit is installed from GitHub Packages.
      packages: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node 22 with the GitHub Packages registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # doc-kitty 0.4.0 (Astro 7) requires Node 22.22+.
          node-version: 22.22
          registry-url: https://npm.pkg.github.com
          scope: '@spec-kitty'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        # Exactly what site/package-lock.json records, so a build on main uses the
        # same dependencies as the pull request check did.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Download the Javadoc built by service.yml
        # Published as is under /javadoc/ (site/public/javadoc is ignored by git), and walked by
        # check:built-links below like every other built page.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: javadoc
          path: site/public/javadoc
      - name: Validate frontmatter and source links
        run: npm run validate
      - name: Build
        # Most pages are drafts during the bootstrap, so drafts are published
        # (as noindex pages) rather than dropped.
        env:
          DK_PUBLISH_DRAFTS: 'on'
          # Render Mermaid in the browser; the build needs no Chromium.
          DK_DIAGRAM_BUILD_RENDER: client
        run: npm run build
      - name: Check links in the built site
        run: npm run check:built-links
      - name: Check OKF export conformance
        # doc-kitty 0.4.0 writes dist/okf/ on every build; re-export from the built
        # content graph and validate the bundle against the OKF conformance rules.
        run: npm run check:okf
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
