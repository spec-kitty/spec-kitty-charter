name: CPU-time budgets (nightly)

# The CPU-time budgets (tests tagged `timing`, #316), run nightly and report-only (ADR-0057, amended 2026-11-07).
# They used to run as a step of service.yml on every pull request and push to main; that cost runner time for a
# result that gated nothing, because the budgets are report-only: the runners differ in CPU speed by about 2x, so a
# budget measures the runner as much as the code. This workflow has only the schedule and workflow_dispatch
# triggers, so no pull-request run invokes it or waits for it.
# - The budgets run alone on the runner (./gradlew :packs:timingBudgets :activations:timingBudgets --no-parallel), with
#   the same symlink property as service.yml's Verify. Their correctness checks gate in Verify.
# - A failure in the report-only budget step never fails the job: the next step raises a warning and a job-summary
#   line. The budgets are pull-only: no issue is opened and nobody is notified of an overrun; a slowdown that persists
#   across nights, seen on the Actions page, is the signal to file an issue. The test classes compile in a gating step
#   first, so breakage before the measurements (compile, dependency verification)
#   fails the job rather than being reported as a budget failure.
# spec-kitty-open-packs is checked out at the pin and synced, as in service.yml, for governance; the tests read the example packs (ADR-0070).

on:
  schedule:
    # Nightly, off the hour, clear of mutation-testing.yml (43 2 * * 1).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timing-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The pin lives in gradle.properties only (openPacksRef); Gradle reads it too.
      - name: Read the open-packs pin
        id: open-packs-pin
        run: |
          ref="$(grep '^openPacksRef=' gradle.properties | cut -d= -f2-)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::openPacksRef in gradle.properties must be 40 lowercase hex characters, but is '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out spec-kitty-open-packs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spec-kitty/spec-kitty-open-packs
          ref: ${{ steps.open-packs-pin.outputs.ref }}
          path: .open-packs
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # packs/internal and packs/qa are not committed: sync them from the checkout above and verify their digests
      # against packs/open-packs.lock.yaml, as service.yml does.
      - name: Sync and verify the packs
        run: ./gradlew syncPacks -PopenPacksDir="$GITHUB_WORKSPACE/.open-packs"

      # Compiled first and outside the report-only step, so a compile error or a dependency-verification failure fails
      # the job instead of reading as a budget over its limit. A red nightly notifies like any failed scheduled run.
      - name: Compile the budget tests
        run: ./gradlew :packs:testClasses :activations:testClasses -PrequireSymlinks=true

      # Report-only (ADR-0057): a budget over its limit never fails the job; the next step makes it visible.
      - name: Check the CPU-time budgets (report-only)
        id: timing
        continue-on-error: true
        run: ./gradlew :packs:timingBudgets :activations:timingBudgets --no-parallel -PrequireSymlinks=true

      - name: Report a CPU-time budget over its limit
        if: steps.timing.outcome == 'failure'
        run: |
          echo "::warning title=CPU-time budget over its limit::A CPU-time budget failed (report-only, ADR-0057). Read the measured times in 'Check the CPU-time budgets'; compare with other nights before treating it as a regression."
          echo "### ⚠️ A CPU-time budget is over its limit (report-only, ADR-0057)" >> "$GITHUB_STEP_SUMMARY"
          echo "The budgets do not gate anything. The measured times are in the step log of 'Check the CPU-time budgets'." >> "$GITHUB_STEP_SUMMARY"
