name: whole-pack

# The whole-pack round-trip gate (#187, epic #186): every file of the pinned spec-kitty-open-packs built-in pack is read
# into the domain, written back, read again and compared with its source by meaning, against the checked-in
# expected-red baseline (service/packs/src/test/resources/whole-pack). It uploads the report as `whole-pack-report`.
#
# A required check (epic #186, operator ruling of 2026-11-05): ci.yml calls this workflow for its `wholepack` group, so
# it feeds `CI gate / gate` (ADR-0023), and every pull request that changes what it covers has to keep packs
# round-tripping.
on:
  # Pull requests enter through the CI gate orchestrator (.github/workflows/ci.yml), which calls
  # this workflow via workflow_call; there is no direct pull_request trigger, so nothing double-runs.
  # The paths are ci.yml's `wholepack_re`: :packs also reads contracts/charter and contracts/offering.
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "service/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/whole-pack.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# When called, github.workflow is the caller's name, so a call from ci.yml gets its own group and never cancels, or is
# cancelled by, this workflow's own run on the same ref. Only this workflow's own runs cancel a superseded run; a called
# run belongs to its caller, whose own concurrency group cancels a superseded pull request run.
concurrency:
  group: whole-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'whole-pack' }}

jobs:
  whole-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The pin lives in gradle.properties only (openPacksRef); Gradle reads it too.
      - name: Read the open-packs pin
        id: open-packs-pin
        run: |
          ref="$(grep '^openPacksRef=' gradle.properties | cut -d= -f2-)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::openPacksRef in gradle.properties must be 40 lowercase hex characters, but is '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out spec-kitty-open-packs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spec-kitty/spec-kitty-open-packs
          ref: ${{ steps.open-packs-pin.outputs.ref }}
          path: .open-packs

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # A path relative to the repository root, as the docs give it, so CI covers that resolution (#322); service.yml
      # passes an absolute one.
      - name: Whole-pack round trip
        run: ./gradlew :packs:wholePackRoundTrip -PopenPacksDir=.open-packs

      - name: Show the report
        if: always()
        run: |
          report=service/packs/build/reports/whole-pack/report.md
          if [ -f "$report" ]; then sed -n '1,/^## Files/p' "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      # Uploaded on a red run too, so the per-kind and per-file result is always visible.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whole-pack-report
          path: service/packs/build/reports/whole-pack/report.md
          if-no-files-found: warn
