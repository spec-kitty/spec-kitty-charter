name: service-native

# The charter service's native executables (ADR-0046 decision 5): a GraalVM native image for each of the four targets
# core pins (linux-x64, linux-arm64, macos-arm64, windows-x64), each started and checked by
# scripts/release/smoke-service.sh before it is uploaded as the workflow artifact `native-<target>`. A missing native
# reachability hint shows up only in a native build, so it is built nightly on main and on every service release, not
# on a pull request (ADR-0060, superseding the per-PR build of ADR-0046 decision 5): it was too slow for each PR. The
# release calls it from service-release.yml with the Gradle cache off; `workflow_dispatch` runs it on demand on any
# branch, for a change that risks the native build. It is not part of `CI gate / gate` and ci.yml does not call it.
# A red night is reported as a red run of this workflow, as mutation-testing.yml's is. No notification is wired.
# It builds and publishes nothing else.
#
# Schedule: 03:11 UTC every day. Not on minute 0 or 30 (the busiest scheduler minutes), and between
# mutation-testing.yml at 02:43 UTC and sonar.yml at 04:23 UTC.
on:
  schedule:
    - cron: "11 3 * * *"
  workflow_call:
    inputs:
      cache-disabled:
        description: "Build without the Gradle cache (release runs)."
        type: boolean
        default: false
  workflow_dispatch:
    # A manual run with the cache off resolves every dependency from the network, as a release does (ADR-0079).
    inputs:
      cache-disabled:
        description: "Build without the Gradle cache, as a release does."
        type: boolean
        default: false

permissions:
  contents: read

# Nothing cancels a running build: a called run belongs to its caller, and a manual run waits for a running night
# (and the reverse), because a cancelled night is no verdict.
concurrency:
  group: service-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The contract bundle the service serves, built once on Linux. The contract tools have no pinned Windows binary
  # (contracts/build.gradle.kts), so the Windows executable packages this bundle (-PcontractBundle), checked against its
  # SHA-256; the other targets bundle the contract themselves, from the same commit.
  contract-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      - name: Bundle the contract
        run: ./gradlew :contracts:bundleContract

      - name: Upload the contract bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-contract-bundle
          path: |
            build/contracts/contract/charter-openapi.yaml
            build/contracts/contract/charter-openapi.yaml.sha256
          if-no-files-found: error
          retention-days: 7

  native:
    name: native (${{ matrix.target }})
    needs: contract-bundle
    strategy:
      # Every target is part of the release's asset set (ADR-0046 decision 4): one red target is reported, not hidden
      # behind the first failure.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            native-heap: 5g
            gradle-heap: 2g
            exe: ""
            prebuilt-bundle: false
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            native-heap: 5g
            gradle-heap: 2g
            exe: ""
            prebuilt-bundle: false
          - runner: macos-15
            target: macos-arm64
            native-heap: 4g
            gradle-heap: 1g
            exe: ""
            prebuilt-bundle: false
          - runner: windows-2025
            target: windows-x64
            native-heap: 5g
            gradle-heap: 2g
            exe: ".exe"
            prebuilt-bundle: true
    runs-on: ${{ matrix.runner }}
    # A release builds with the cache off: macos-arm64 took 35 min cold on 2026-11-18 (26.5 min warm), so 45 left too
    # little margin for a tag push (ADR-0079).
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners convert to CRLF on checkout (core.autocrlf), which breaks ./gradlew and the bash scripts
      # under Git Bash; the repository's files are LF, so they are checked out as they are.
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # GraalVM Community for Java 25: the JDK Gradle runs on and the native-image the build uses (toolchainDetection
      # is off in charter.native-image). The action and the GraalVM release are pinned as spec-kitty-events pins them, so
      # the four targets of one release are built by one compiler; the version goes to the step summary.
      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: "25.0.2"
          distribution: graalvm-community

      - name: Record the compiler
        run: |
          set -euo pipefail
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- native-image: $(native-image --version | head -n 1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      - name: Download the contract bundle
        if: matrix.prebuilt-bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-contract-bundle
          path: ${{ runner.temp }}/contract-bundle

      - name: Build the native executable
        env:
          PREBUILT: ${{ matrix.prebuilt-bundle }}
          BUNDLE_DIR: ${{ runner.temp }}/contract-bundle
          # The macOS runner has 7 GB: native-image and the Gradle JVM that forks it share it, so it gets less of both.
          # Measured on run 44802926531: 4g/1g built the image in 19m08s against 27m37s at 5g/2g; 3g thrashed in GC
          # (64-89% of each stage) and hit the job's 60-minute limit. It still swaps at 4g; a larger runner is not an option.
          NATIVE_HEAP: ${{ matrix.native-heap }}
          GRADLE_HEAP: ${{ matrix.gradle-heap }}
        run: |
          set -euo pipefail
          heaps=("-Pcharter.nativeImageHeap=$NATIVE_HEAP" "-Dorg.gradle.jvmargs=-Xmx$GRADLE_HEAP -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8")
          if [ "$PREBUILT" = true ]; then
            # The bundle must be the one its checksum names, as the Linux job wrote them.
            (cd "$(cygpath -u "$BUNDLE_DIR")" && sha256sum --check --strict charter-openapi.yaml.sha256)
            ./gradlew --no-daemon "${heaps[@]}" :deployable:nativeCompile -Pcharter.native=true "-PcontractBundle=$BUNDLE_DIR/charter-openapi.yaml"
          else
            ./gradlew --no-daemon "${heaps[@]}" :deployable:nativeCompile -Pcharter.native=true
          fi

      - name: Record memory pressure
        if: runner.os == 'macOS'
        run: |
          sysctl hw.memsize hw.ncpu vm.swapusage
          vm_stat | grep -E 'Pageouts|Swapouts|Compressions'

      - name: Read the versions the executable must report
        id: versions
        run: |
          set -euo pipefail
          service="$(awk -F= '$1 == "version" { print $2; exit }' gradle.properties)"
          contract="$(awk '/^  version:/ { sub(/^  version: */, ""); print; exit }' contracts/charter/openapi.yaml)"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"

      # The executable must answer within 30 s, and NFR-001's 5 s is reported against: a later first answer is a warning
      # with the measured time, not a red release (a first run on a hosted runner can be scanned or slowed). The time and
      # the size go to the step summary.
      - name: Start the executable and check it answers
        env:
          BINARY: service/deployable/build/native/nativeCompile/spec-kitty-charter-service${{ matrix.exe }}
          SERVICE_VERSION: ${{ steps.versions.outputs.service }}
          CONTRACT_VERSION: ${{ steps.versions.outputs.contract }}
        run: |
          set -euo pipefail
          echo "- size: $(wc -c < "$BINARY" | tr -d ' ') bytes" >> "$GITHUB_STEP_SUMMARY"
          scripts/release/smoke-service.sh "$BINARY" "$SERVICE_VERSION" "$CONTRACT_VERSION" 30 5

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: service/deployable/build/native/nativeCompile/spec-kitty-charter-service${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7
