name: CI gate

# One always-on required status check for pull requests.
#
# GitHub cannot usefully require a path-filtered workflow: a PR that does not touch the workflow's
# paths never posts its context, so a required check keyed on it waits forever and blocks the PR.
# This workflow always runs on every PR, detects which concern groups the PR actually changed,
# calls the real gate workflows (service, service-native, docs-cleanliness) only for the groups that changed, and
# the `gate` job reports a single verdict. Branch protection requires only `CI gate / gate`.
#
# The called workflows keep their own `push` (main) and `workflow_dispatch` triggers for main CI;
# they no longer trigger on `pull_request` directly — this orchestrator is the PR entry point, so
# nothing double-runs. See docs/adr/0023-ci-gate-required-check.md.
#
# Merge queue (ADR-0047): the gate also runs on `merge_group`, so the queue tests each pull request (or
# group of them) against the main it will land on. The called workflows inherit the event. On a queue
# entry the change detection diffs the queue's base against its head, not a pull request's.
#
# `pr:pause-ci` (ADR-0047): a maintainer labels a parked pull request to stop its CI during a pile-up.
# Adding the label cancels the running check; while it is on, every run skips the work and the gate
# fails, so a paused pull request never reads as green. Removing it runs CI again.
# Any other label event must not cost a CI run or cancel one: it waits for the running check, does no
# work, and its gate repeats the verdict of the last real run on the same commit.

on:
  pull_request:
    # The default three, plus the label events the pause guard needs.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # A queue entry has its own ref (refs/heads/gh-readonly-queue/main/...), so it never cancels a PR run.
  group: ci-gate-${{ github.ref }}
  # A label event about another label waits behind the running check instead of cancelling it.
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'pr:pause-ci') }}

env:
  # Both are false outside pull_request events (merge_group carries no labels).
  PAUSED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr:pause-ci') }}
  OTHER_LABEL: ${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'pr:pause-ci' }}

jobs:
  changes:
    name: Detect changed concern groups
    # Skipped while paused or for another label's event; the gate then decides without it.
    if: >-
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pr:pause-ci'))
      && !(github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
      && github.event.label.name != 'pr:pause-ci')
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ steps.detect.outputs.service }}
      native: ${{ steps.detect.outputs.native }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        env:
          # A queue entry's head is main's tip (its base) plus the pull requests queued up to and including
          # this one, so base_sha is an ancestor of head_sha and the diff is exactly what the entry adds.
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::no base or head SHA for a ${GITHUB_EVENT_NAME} event; refusing to guess the changed files"
            exit 1
          fi
          # Three-dot (merge-base) diff: exactly the PR's own changes, so main advancing since the
          # branch point does not fold main-only files in and over-detect a group the PR never touched.
          # On a queue entry the merge base is BASE itself, so this is BASE..HEAD.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          printf 'changed files:\n%s\n' "$changed"
          # Mirror the path filters of service.yml, service-native.yml and docs-cleanliness.yml exactly; a
          # change to this gate workflow itself re-runs every group (fail-safe). The native group builds the four
          # native executables (ADR-0046), so it runs only for what can change them: the contract the service
          # bundles, the service, the build and the release scripts.
          service_re='^(contracts/|service/|build-logic/|config/|gradle/|deploy/|\.gitignore$|(.*/)?\.env|[^/]+\.gradle\.kts$|gradle\.properties$|gradlew$|scripts/release/|\.github/workflows/(service|ci|contract-release|service-release)\.yml$)'
          native_re='^(contracts/|service/|build-logic/|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$|gradlew$|scripts/release/|\.github/workflows/(service-native|ci)\.yml$)'
          docs_re='^(docs/|site/|scripts/docs/|\.markdownlint-cli2\.jsonc$|cspell\.json$|lychee\.toml$|\.github/workflows/(docs-cleanliness|ci)\.yml$)'
          if printf '%s\n' "$changed" | grep -Eq "$service_re"; then echo "service=true"; else echo "service=false"; fi >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$changed" | grep -Eq "$native_re"; then echo "native=true"; else echo "native=false"; fi >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$changed" | grep -Eq "$docs_re"; then echo "docs=true"; else echo "docs=false"; fi >> "$GITHUB_OUTPUT"

  service:
    name: Service
    needs: changes
    if: needs.changes.outputs.service == 'true'
    uses: ./.github/workflows/service.yml

  native:
    name: Native executables
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/service-native.yml

  docs:
    name: Docs cleanliness
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-cleanliness.yml

  gate:
    name: gate
    needs: [changes, service, native, docs]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Another label's event repeats the last real verdict, read from this commit's check runs.
      checks: read
    steps:
      - name: Paused by pr:pause-ci
        if: env.PAUSED == 'true'
        run: |
          echo "::error::CI is paused by the pr:pause-ci label; remove the label to run it. A paused pull request does not pass the gate."
          exit 1
      - name: Repeat the last verdict on this commit (another label changed)
        if: env.PAUSED != 'true' && env.OTHER_LABEL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # This run waited behind any running check (concurrency), so the latest completed `gate` check run
          # from another run on this commit is the real verdict. None, or not a success, fails closed: push or
          # re-run to get a real one.
          verdict="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=gate&filter=all&per_page=100" --jq \
            "[.check_runs[] | select(.status == \"completed\") | select(.details_url | contains(\"/runs/$RUN_ID/\") | not)]
             | sort_by(.completed_at) | last | .conclusion // \"none\"")"
          echo "last gate verdict on $SHA: $verdict"
          if [ "$verdict" != "success" ]; then
            echo "::error::the last real CI run on this commit did not pass (verdict: $verdict); a label change does not re-run CI"
            exit 1
          fi
      - name: Require every triggered group to have passed
        if: env.PAUSED != 'true' && env.OTHER_LABEL != 'true'
        env:
          CHANGES: ${{ needs.changes.result }}
          SERVICE: ${{ needs.service.result }}
          NATIVE: ${{ needs.native.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          set -uo pipefail
          echo "changes=$CHANGES service=$SERVICE native=$NATIVE docs=$DOCS"
          # Fail closed if change detection itself did not complete.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::change detection did not succeed (result: $CHANGES); refusing to pass the gate"
            exit 1
          fi
          fail=0
          for pair in "service:$SERVICE" "native:$NATIVE" "docs:$DOCS"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::the $name CI group did not pass (result: $result)"
                fail=1
                ;;
            esac
          done
          if [ "$fail" -eq 0 ]; then
            echo "All triggered CI groups passed or were legitimately skipped."
          fi
          exit "$fail"
