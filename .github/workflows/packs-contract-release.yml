name: packs-contract-release

# Publishes a packs contract release (#559; the charter contract's release is contract-release.yml). Pushing a tag
# contract-packs-v<version> at the release's merge commit on main rebuilds the release assets at that tag with
# scripts/release/packs-contract-release-assets.sh and attaches them to a GitHub Release of the tag:
# packs-contract.tar.gz (the tracked files of contracts/packs/: file-kinds.yaml, the schemas, the classifier
# conformance cases, the CHANGELOG and the README, plus RELEASE.json naming the version, tag and commit),
# packs-contract.sha256 (one checksum per file of the archive) and
# packs-contract.tar.gz.sha256. Nothing is published unless the tag and the top heading of
# contracts/packs/CHANGELOG.md name one released version, the classifier passes the conformance cases, and the tagged
# commit is on main; the publish job refuses a tag that moved while the assets were built. The workflow file runs
# from the tagged commit, so these checks guard against mistakes, not against someone who can push tags: a tag
# ruleset on contract-packs-v* is to limit who can publish (#196; push no tag before it exists).
#
# A manual run (workflow_dispatch) is a rehearsal: it assembles the assets of the chosen ref under the tag it is
# given and uploads them as the workflow artifact `packs-contract-release`. It never creates a Release, and the
# publish job does not run. service.yml rehearses the whole path on a synthetic release on every change
# (release-rehearsal).
on:
  push:
    tags: ["contract-packs-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to rehearse (contract-packs-v<version>). Nothing is published."
        required: true
        type: string

permissions:
  contents: read

# A release is never cancelled halfway: a second run for the same tag waits.
concurrency:
  group: packs-contract-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The main check reads origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Name the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
          REHEARSED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then tag="$PUSHED"; else tag="$REHEARSED"; fi
          if ! printf '%s' "$tag" | grep -Eq '^contract-packs-v[0-9A-Za-z.+-]+$'; then
            echo "::error::The tag is not a packs contract release tag (contract-packs-v<version>)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The release procedure tags the release's merge commit on main (contracts/packs/README.md).
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag the release's merge commit on main"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble the release assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release/packs-contract-release-assets.sh "$TAG" dist

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packs-contract-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job that can write: it runs no build, only checks and attaches what assemble built.
  publish:
    needs: assemble
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs-contract-release
          path: dist

      # A sanity check that the archive and its checksum arrived together; the assets come from this run.
      - name: Check the archive against its checksum
        working-directory: dist
        run: sha256sum --check --strict packs-contract.tar.gz.sha256

      # The assets are those of the commit assemble built. A tag moved or re-pushed since then names another commit,
      # and nothing is published.
      - name: Check the tag still names the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.assemble.outputs.tag }}
          BUILT: ${{ needs.assemble.outputs.commit }}
        run: |
          set -euo pipefail
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" = tag ]; then sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"; fi
          if [ "$sha" != "$BUILT" ]; then
            echo "::error::$TAG now names $sha, but the assets were built from $BUILT"
            exit 1
          fi

      # --verify-tag refuses a tag that does not exist on the remote; an existing Release of the tag fails the step,
      # so a release is never replaced. --latest=false keeps the charter contract's release the repository's latest.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.assemble.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#contract-packs-v}"
          notes="The packs contract ${version}. What changed is in contracts/packs/CHANGELOG.md at this tag:"
          notes="${notes} https://github.com/${REPO}/blob/${TAG}/contracts/packs/CHANGELOG.md"
          notes="${notes}"$'\n\n'"Check the archive with: sha256sum --check packs-contract.tar.gz.sha256"
          notes="${notes}"$'\n'"and each file after extracting it with: sha256sum --check packs-contract.sha256"
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest=false \
            --title "Packs contract ${version}" --notes "$notes" \
            dist/packs-contract.tar.gz dist/packs-contract.tar.gz.sha256 dist/packs-contract.sha256
