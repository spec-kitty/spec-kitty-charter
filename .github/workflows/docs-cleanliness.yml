name: Docs cleanliness

# The gates that keep docs/ from drifting: lint, spelling, terminology, frontmatter,
# freshness, link and anchor integrity, ADR/changelog indexes, orphans and diagram freshness.
# Each check is its own job or step so a failure names itself. The docsite build and its
# deploy live in docs-site.yml. Rule -> check table: docs/_meta/doc-rules.yaml.
# Run the same checks locally: docs/guides/docsite.md.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/**'
      - '.markdownlint-cli2.jsonc'
      - 'cspell.json'
      - 'lychee.toml'
      - '.github/workflows/docs-cleanliness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/**'
      - '.markdownlint-cli2.jsonc'
      - 'cspell.json'
      - 'lychee.toml'
      - '.github/workflows/docs-cleanliness.yml'
  schedule:
    # Weekly, so a link that rots on its own is noticed without a docs change.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cleanliness-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool pins. Bump deliberately; the versions are what the committed config was tuned to.
  MARKDOWNLINT_CLI2_VERSION: 0.18.1
  CSPELL_VERSION: 9.2.0
  LYCHEE_VERSION: 0.21.0
  LYCHEE_SHA256: a06547250f10021dcafc6ed5bb20fca75835b65711745b63cfdda34c29ff6a73

jobs:
  docs-checks:
    name: Docs checks (frontmatter, links, terms, indexes)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      # Every step runs even if an earlier one failed, so one run shows every problem.
      - name: Check unit tests
        if: always()
        run: python -m pytest -p no:cacheprovider scripts/docs/tests -q
      - name: Frontmatter (required keys, description length, audience)
        if: always()
        run: python scripts/docs/check_docs.py frontmatter
      - name: Related references resolve
        if: always()
        run: python scripts/docs/check_docs.py related
      - name: Freshness SLA
        if: always()
        run: python scripts/docs/check_docs.py freshness
      - name: Links and anchors (source level)
        if: always()
        run: python scripts/docs/check_docs.py links
      - name: Terminology and glossary alignment
        if: always()
        run: python scripts/docs/check_docs.py terms
      - name: ADR index
        if: always()
        run: python scripts/docs/check_docs.py adr
      - name: Changelog style
        if: always()
        run: python scripts/docs/check_docs.py changelog
      - name: Orphan pages
        if: always()
        run: python scripts/docs/check_docs.py orphans

  freshness-weekly:
    # The weekly run exists to notice a page going stale on its own; the other checks only
    # change with a diff, so freshness is the one that runs here.
    name: Freshness SLA (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      - name: Freshness SLA
        run: python scripts/docs/check_docs.py freshness

  markdown-lint:
    name: Markdown lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}

  spelling:
    name: Spellcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: cspell
        # Word list: docs/_meta/spelling-words.txt (seeded from the glossary terms).
        run: npx --yes cspell@${CSPELL_VERSION} --no-progress

  diagrams:
    name: PlantUML diagrams are current
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Graphviz
        # PlantUML lays class diagrams out with Graphviz `dot`. Without it the render is an
        # error image, which the semantic comparison rightly reports as stale.
        run: sudo apt-get update -q && sudo apt-get install -y -q graphviz
      - name: Download the pinned PlantUML jar
        # check_docs.py verifies the jar against plantuml_pins.json before every use.
        run: |
          url=$(python -c "import json;print(json.load(open('scripts/docs/plantuml_pins.json'))['plantuml_jar_url'])")
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" "$url"
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml.jar" >> "$GITHUB_ENV"
      - name: Render and compare the diagrams
        env:
          PLANTUML_RENDER_DIR: ${{ runner.temp }}/rendered-diagrams
        run: python scripts/docs/check_docs.py plantuml
      - name: Upload the CI renders (to diagnose a mismatch)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-diagrams
          path: ${{ runner.temp }}/rendered-diagrams
          if-no-files-found: ignore

  external-links:
    name: External links (non-gating)
    runs-on: ubuntu-24.04
    # Remote sites flake. Reported, never required: a red here does not block a pull request.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install lychee
        run: |
          curl -fsSL -o lychee.tgz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tgz" | sha256sum -c -
          tar xzf lychee.tgz lychee
      - name: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./lychee --config lychee.toml 'docs/**/*.md'
