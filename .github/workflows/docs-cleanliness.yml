name: Docs cleanliness

# The gates that keep docs/ from drifting: lint, spelling, terminology, frontmatter,
# freshness, link and anchor integrity, ADR/changelog indexes, orphans and diagram freshness. The external link check
# asks remote sites, so it runs nightly in docs-nightly.yml, not on pull requests.
# Each check is its own job or step so a failure names itself. It also runs the unit tests of scripts/ci
# (the mutation nightly's summary script), which no other pull-request workflow runs. The docsite build and its
# deploy live in docs-site.yml. Rule -> check table: docs/_meta/doc-rules.yaml.
# Run the same checks locally: docs/guides/docsite.md.

on:
  # Pull requests enter through the CI gate orchestrator (.github/workflows/ci.yml), which calls
  # this workflow via workflow_call; there is no direct pull_request trigger, so nothing double-runs.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/**'
      - 'scripts/ci/**'
      - '.markdownlint-cli2.jsonc'
      - 'cspell.json'
      - '.github/workflows/docs-cleanliness.yml'
      - '.github/workflows/mutation-nightly.yml'
  schedule:
    # Weekly, so a page that goes stale on its own is noticed without a docs change.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cleanliness-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool pins. Bump deliberately; the versions are what the committed config was tuned to.
  MARKDOWNLINT_CLI2_VERSION: 0.18.1
  CSPELL_VERSION: 9.2.0

jobs:
  docs-checks:
    name: Docs checks (frontmatter, links, terms, indexes)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      # Every step runs even if an earlier one failed, so one run shows every problem.
      - name: Check unit tests
        if: always()
        run: python -m pytest -p no:cacheprovider scripts/docs/tests -q
      # The mutation nightly's summary script (standard library only); never PIT itself, which runs nightly only.
      - name: CI script unit tests
        if: always()
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Frontmatter (required keys, description length, audience)
        if: always()
        run: python scripts/docs/check_docs.py frontmatter
      - name: Related references resolve
        if: always()
        run: python scripts/docs/check_docs.py related
      - name: Freshness SLA
        if: always()
        run: python scripts/docs/check_docs.py freshness
      - name: Links and anchors (source level)
        if: always()
        run: python scripts/docs/check_docs.py links
      - name: Terminology and glossary alignment
        if: always()
        run: python scripts/docs/check_docs.py terms
      - name: ADR index
        if: always()
        run: python scripts/docs/check_docs.py adr
      - name: Changelog style
        if: always()
        run: python scripts/docs/check_docs.py changelog
      - name: Orphan pages
        if: always()
        run: python scripts/docs/check_docs.py orphans

  freshness-weekly:
    # The weekly run exists to notice a page going stale on its own; the other checks only
    # change with a diff, so freshness is the one that runs here.
    name: Freshness SLA (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      - name: Freshness SLA
        run: python scripts/docs/check_docs.py freshness

  markdown-lint:
    name: Markdown lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # Advisory: markdownlint findings never fail the build (and so never block the CI gate once it
    # is required). Pre-existing findings are addressed deliberately, not as a merge blocker.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}

  spelling:
    name: Spellcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: cspell
        # Word list: docs/_meta/spelling-words.txt (seeded from the glossary terms).
        run: npx --yes cspell@${CSPELL_VERSION} --no-progress

  diagrams:
    name: PlantUML diagrams are current
    # Also on the weekly schedule: a run on main saves the jar cache below and keeps it from being evicted
    # (GitHub drops a cache entry after 7 days without access), so pull requests restore it without the network.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: pip install -r scripts/docs/requirements.txt
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # PlantUML lays class diagrams out with Graphviz `dot`. Without it the render is an error image, which the
      # semantic comparison rightly reports as stale. Its packages are cached like the jar below, so an outage of
      # the runner's Ubuntu mirror cannot turn a pull request red: on 2026-11-11 `azure.archive.ubuntu.com` did
      # not resolve for over two hours and held PR #481. A miss downloads the packages through apt, which checks
      # them against the signed archive index, and saves them at once; pull requests restore what main saved.
      # A hit installs them offline with dpkg. If the runner image has drifted so the cached set no longer
      # installs, the step falls back to the mirror.
      - name: Restore the Graphviz packages
        id: graphviz-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/graphviz-debs
          key: graphviz-debs-ubuntu-24.04-v1
      - name: Download the Graphviz packages
        id: graphviz-download
        if: steps.graphviz-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/graphviz-debs/partial
          sudo apt-get update -q -o Acquire::Retries=5
          sudo apt-get install -y -q --download-only -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$HOME/.cache/graphviz-debs" graphviz
          sudo rm -rf ~/.cache/graphviz-debs/partial ~/.cache/graphviz-debs/lock
          sudo chown -R "$USER" ~/.cache/graphviz-debs
          # None when the image already ships Graphviz: then there is nothing to cache.
          echo "debs=$(find ~/.cache/graphviz-debs -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Save the Graphviz packages
        if: steps.graphviz-cache.outputs.cache-hit != 'true' && steps.graphviz-download.outputs.debs != '0'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/graphviz-debs
          key: graphviz-debs-ubuntu-24.04-v1
      - name: Install Graphviz
        run: |
          if ! command -v dot >/dev/null && ! sudo dpkg -i ~/.cache/graphviz-debs/*.deb; then
            echo "::warning::the cached Graphviz packages did not install; installing from the mirror"
            sudo apt-get update -q -o Acquire::Retries=5
            # A partial dpkg run leaves packages unconfigured; -f with no package repairs that first.
            sudo apt-get install -y -q -f -o Acquire::Retries=5
            sudo apt-get install -y -q -o Acquire::Retries=5 graphviz
          fi
          dot -V
      # The jar is cached on its pin, so a run needs no release download unless the pin changed or the entry
      # was evicted: a github.com outage on release assets (504s on 2026-11-08, #420) then cannot turn a pull
      # request red. Pull requests restore the entry runs on main save (a cache saved in a pull request is
      # scoped to it). check_docs.py verifies the jar against plantuml_pins.json before every use, cached or not.
      - name: Restore the pinned PlantUML jar
        id: plantuml-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/plantuml/plantuml.jar
          key: plantuml-jar-${{ hashFiles('scripts/docs/plantuml_pins.json') }}
      - name: Download the pinned PlantUML jar
        if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/plantuml
          url=$(python -c "import json;print(json.load(open('scripts/docs/plantuml_pins.json'))['plantuml_jar_url'])")
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o ~/.cache/plantuml/plantuml.jar "$url"
      - name: Point the check at the jar
        run: echo "PLANTUML_JAR=$HOME/.cache/plantuml/plantuml.jar" >> "$GITHUB_ENV"
      - name: Render and compare the diagrams
        env:
          PLANTUML_RENDER_DIR: ${{ runner.temp }}/rendered-diagrams
        run: python scripts/docs/check_docs.py plantuml
      - name: Upload the CI renders (to diagnose a mismatch)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-diagrams
          path: ${{ runner.temp }}/rendered-diagrams
          if-no-files-found: ignore

