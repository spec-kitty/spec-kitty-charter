name: service

# The charter service build: the charter's own contract checks (lint, bundle, closed response
# objects, breaking-change check), contract generation, unit tests, the architecture gate, the BDD
# contracts, the example-pack round-trip, the aggregated Javadoc and coverage
# (./gradlew verifyAll). It uploads three artifacts: `javadoc`, `coverage` and `contract-bundle`.
# The git-source job runs the real-git tests of the git source (:packs:gitHostTest, tag `git-host`) on a git of 2.50.1 or
# later, which verifyAll leaves out.
# The jar job builds the service's jar, starts it with scripts/release/smoke-service.sh and uploads it as
# `service-jar`, which a service release attaches (ADR-0046); the native executables are service-native.yml's.
# The release-rehearsal job runs every release rehearsal (scripts/release/rehearse-*.sh): it publishes nothing.
# docs-site.yml calls this workflow (workflow_call) and publishes the `javadoc` artifact in the docsite.
# Mutation testing is not here: it runs only on its schedule (mutation-testing.yml). Nor are the CPU-time budgets
# (#316, ADR-0057): they run nightly, report-only (timing-nightly.yml).
on:
  # Pull requests enter through the CI gate orchestrator (.github/workflows/ci.yml), which calls
  # this workflow via workflow_call; there is no direct pull_request trigger, so nothing double-runs.
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "service/**"
      - "build-logic/**"
      # build-logic's MutationFloorsTest holds this fixture to what the floor check writes.
      - "scripts/ci/fixtures/**"
      - "config/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/service.yml"
      - ".github/workflows/sonar.yml"
      - ".github/workflows/contract-release.yml"
      - ".github/workflows/service-release.yml"
      - "scripts/release/**"
      # The pack sync and its lockfile (packs/internal and packs/qa are synced from open-packs, not committed).
      - "scripts/packs/**"
      - "packs/open-packs.lock.yaml"
      # The deployable's tests check the compose example, the env template and the ignore rules (#229).
      - "deploy/**"
      - ".gitignore"
      - "**/.env*"
      # The generated Java client (#218): checked by verifyAll with the rest of the build.
      - "client-java/**"
      # HowToTest reads the how-to's generator version.
      - "docs/guides/generate-a-client.md"
  workflow_call:
    inputs:
      cache-disabled:
        description: "Build without the Gradle cache (release runs)."
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# When called, github.workflow is the caller's name, so a call from docs-site.yml gets its own group and
# never cancels, or is cancelled by, this workflow's own run on the same ref. Only this workflow's own runs
# cancel a superseded run; a called run belongs to its caller, which may be publishing the site.
concurrency:
  group: service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'service' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The breaking-change check (:contracts:checkContractCompatibility) compares against the
          # contract-charter-v* tags and refuses a shallow clone, so fetch the full history and tags.
          fetch-depth: 0
          persist-credentials: false

      # The pin lives in gradle.properties only (openPacksRef); Gradle reads it too.
      - name: Read the open-packs pin
        id: open-packs-pin
        run: |
          ref="$(grep '^openPacksRef=' gradle.properties | cut -d= -f2-)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::openPacksRef in gradle.properties must be 40 lowercase hex characters, but is '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out spec-kitty-open-packs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spec-kitty/spec-kitty-open-packs
          ref: ${{ steps.open-packs-pin.outputs.ref }}
          path: .open-packs
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      # packs/internal and packs/qa are not committed: sync them from the checkout above and verify their digests
      # against packs/open-packs.lock.yaml. Fails closed, so a pin bump without the lockfile update is red. The tests
      # read the charter-owned example packs (ADR-0070), never this checkout; the sync is for governance only.
      - name: Sync and verify the packs
        run: ./gradlew syncPacks -PopenPacksDir="$GITHUB_WORKSPACE/.open-packs"

      # -PrequireSymlinks=true: the link tests fail, rather than skip, on a runner that cannot make links (#286).
      - name: Verify
        run: ./gradlew verifyAll -PrequireSymlinks=true

      # The aggregated Javadoc (:charter-reports:aggregateJavadoc), published by docs-site.yml.
      - name: Upload the Javadoc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc
          path: service/charter-reports/build/docs/javadoc
          if-no-files-found: error

      # The aggregated JaCoCo report (:charter-reports:testCodeCoverageReport). Uploaded on a red run too,
      # when it exists, so the run still shows it.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: service/charter-reports/build/reports/jacoco/testCodeCoverageReport
          if-no-files-found: warn

      # The single-file contract bundle core vendors (:contracts:bundleContract) and its SHA-256.
      # :contracts builds into the root build directory, build/contracts.
      - name: Upload the contract bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-bundle
          path: |
            build/contracts/contract/charter-openapi.yaml
            build/contracts/contract/charter-openapi.yaml.sha256
          if-no-files-found: error

  # The git source against real git (WP18, T152, C-008, NFR-011): bare repositories served over https by `git http-backend`
  # behind a test HTTPS server, fetched by the production fetcher with the host git. The tests carry the `git-host` tag,
  # which `verifyAll` leaves out, so this job is where they run. It is required, not `continue-on-error`: the git must be
  # 2.50.1 or later, the job fails first when it is not, and -PrequireGitHost=true makes the tests fail rather than skip on
  # a git that is too old, so they cannot stay green by skipping. Everything else of the git source (argument list,
  # environment, version check, deadline) runs in `verifyAll` against a fake git.
  git-source:
    if: github.workflow != 'Docs site'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The runner image carries a recent git; when it carries an older one, the git-core PPA's is installed. Either way the
      # step ends by failing when `git --version` is lower than 2.50.1: the test is never weakened to fit the image.
      - name: Select a git of 2.50.1 or later
        run: |
          set -euo pipefail
          need=2.50.1
          at_least() { [ "$(printf '%s\n%s\n' "$need" "$1" | sort -V | head -n1)" = "$need" ]; }
          have="$(git --version | awk '{ print $3 }')"
          if ! at_least "$have"; then
            echo "git $have is older than $need; installing the git-core PPA's git"
            sudo add-apt-repository -y ppa:git-core/ppa
            sudo apt-get update
            sudo apt-get install -y git
            have="$(git --version | awk '{ print $3 }')"
          fi
          git --version
          if ! at_least "$have"; then
            echo "::error::the git-source job needs git $need or later, but the runner has $have"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      - name: Run the git-host tests
        run: ./gradlew :packs:gitHostTest -PrequireGitHost=true

  # The service's jar, the fallback a release attaches beside the native executables (ADR-0046 decision 5), started
  # and checked like them before it is uploaded.
  jar:
    if: github.workflow != 'Docs site'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      - name: Build the jar
        run: ./gradlew :deployable:bootJar

      - name: Start the jar and check it answers
        id: smoke
        run: |
          set -euo pipefail
          service="$(awk -F= '$1 == "version" { print $2; exit }' gradle.properties)"
          contract="$(awk '/^  version:/ { sub(/^  version: */, ""); print; exit }' contracts/charter/openapi.yaml)"
          jar="service/deployable/build/libs/deployable-${service}.jar"
          scripts/release/smoke-service.sh "$jar" "$service" "$contract" 60
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload the jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-jar
          path: ${{ steps.smoke.outputs.jar }}
          if-no-files-found: error
          retention-days: 7

  # The release path of contract-release.yml, run on a synthetic release in a throwaway clone with no
  # remote: an unreleased commit is refused, a released one yields the three assets. Nothing is tagged
  # on this repository and nothing is published. Skipped when the docs site calls this workflow.
  release-rehearsal:
    if: github.workflow != 'Docs site'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The rehearsal runs :contracts:check, whose breaking-change check reads the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.cache-disabled || false }}

      # Every release rehearsal, the contract's and the service's: each publishes nothing and pushes no tag.
      - name: Rehearse the releases
        run: |
          set -euo pipefail
          for rehearsal in scripts/release/rehearse-*.sh; do
            echo "== $rehearsal"
            "$rehearsal"
          done
