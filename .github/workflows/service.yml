name: service

# The charter service build: contract validation and generation, unit tests, the architecture gate,
# the BDD contracts and the spec-kitty-open-packs round-trip (./gradlew verifyAll).
on:
  pull_request:
    paths:
      - "contracts/**"
      - "service/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/service.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "service/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

env:
  # The open-packs commit the round-trip runs against. Raise it in its own change.
  OPEN_PACKS_REF: 7f063aecbdede29d05cc4d5fc9a5b13f9c7434d7

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check out spec-kitty-open-packs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spec-kitty/spec-kitty-open-packs
          ref: ${{ env.OPEN_PACKS_REF }}
          path: .open-packs

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify
        run: ./gradlew verifyAll -PopenPacksDir="$GITHUB_WORKSPACE/.open-packs"
