name: Mutation testing (nightly)

# The nightly mutation floor (#239, ADR-0062): PIT on every module that applies charter.mutation-conventions
# (kernel, missions, profiles, profiles-edge, missions-edge, packs and activations). `./gradlew pitest` is its own task, never part of
# `check` or `verifyAll`, and this workflow has only the schedule and workflow_dispatch triggers, so no pull-request
# run invokes it or waits for it.
# - `pitest --continue` runs every module even when one is below its floor; each module's checkMutationFloors
#   fails naming the module, the group, the score and the floor, and writes
#   build/reports/mutation-floors/floors.json.
# - The job summary (scripts/ci/mutation_summary.py) shows every module and group, red or green, with its margin to
#   the floor and its timed-out mutants (#389), and "no report" for a module that wrote no floors.json. The modules
#   come from the build (`mutationModules`, #388), not from a list kept beside it.
# - The rules of this paragraph are pinned by build-logic's MutationWorkflowGuardTest, and the root build fails any
#   invocation in which verifyAll or a check depends on pitest (MutationIsolation, ADR-0060, #387).
# - PIT runs in two shards (:packs, and the other modules), each on its own runner; each shard's PIT reports,
#   floors.json files and log go up as a `mutation-report-<shard>` artifact, on a red run too, kept 14 days.
# - On a scheduled run that does not succeed (red, timed out or cancelled), the alert job opens one issue labelled
#   `mutation-nightly`, or comments on the open one. A green scheduled run never touches the issue. A workflow_dispatch
#   with force_issue takes the same path whatever the result, marked as a forced test run, so the open-or-comment path
#   can be proven without breaking a floor.
# - The summary script's own unit tests run after PIT, whatever its result, so a broken summary turns the nightly red
#   but can never stop PIT from running. Pull requests run the same tests (docs-cleanliness.yml, through ci.yml).
# spec-kitty-open-packs is checked out at the pin and synced, as in service.yml, for governance; the tests read the example packs (ADR-0070).

on:
  schedule:
    # Nightly, off the hour.
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      force_issue:
        description: "Test the alert: open or comment on the mutation-nightly issue whatever the result, marked as a forced test run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PIT runs in two shards, each on its own 4-core runner (#461): :packs alone, and every other module. A full
  # :packs:pitest measured 1h06m34s alone on an idle 4-core machine (2026-11-12, 7129 mutants, 79 timed out); the six
  # other modules add ~20 min. Together they no longer fit one runner's budget, and run side by side they starve each
  # other's minions into timeouts. Each shard's mutation step has 90 minutes, >25 % headroom over :packs as measured
  # (NFR-002), and the job 100, so the copy and the upload still run when PIT runs out of time. A timeout raises the
  # mutation-nightly issue. The summary job merges both shards' reports into one table.
  pitest:
    name: pitest (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      # Both shards always report: a red :packs does not cancel the others.
      fail-fast: false
      matrix:
        include:
          - shard: packs
            tasks: ":packs:pitest"
          # -x: :packs:pitest is skipped here, and with it its checkMutationFloors finalizer.
          - shard: others
            tasks: "pitest -x :packs:pitest"
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The pin lives in gradle.properties only (openPacksRef); Gradle reads it too.
      - name: Read the open-packs pin
        id: open-packs-pin
        run: |
          ref="$(grep '^openPacksRef=' gradle.properties | cut -d= -f2-)"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::openPacksRef in gradle.properties must be 40 lowercase hex characters, but is '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out spec-kitty-open-packs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: spec-kitty/spec-kitty-open-packs
          ref: ${{ steps.open-packs-pin.outputs.ref }}
          path: .open-packs
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # packs/internal and packs/qa are not committed: sync them from the checkout above and verify their digests
      # against packs/open-packs.lock.yaml, as service.yml does.
      - name: Sync and verify the packs
        run: ./gradlew syncPacks -PopenPacksDir="$GITHUB_WORKSPACE/.open-packs"

      # --continue: a module below its floor does not stop the others, so every module reports.
      # -PrequireSymlinks=true: the link tests fail, rather than skip, on a runner that cannot make links (#286).
      # mutationModules writes build/reports/mutation-floors/modules.txt, the modules the summary expects (#388).
      # The output is kept in pitest.log beside it and uploaded with the reports: a test that fails with no mutation
      # applied leaves its module without a report, and the job log that named it can be gone before anyone reads it
      # (#461). The summary quotes PIT's lines about such tests.
      - name: Mutation testing
        timeout-minutes: 90
        run: |
          set -o pipefail
          mkdir -p build/reports/mutation-floors
          ./gradlew mutationModules ${{ matrix.tasks }} --continue -PrequireSymlinks=true 2>&1 \
            | tee build/reports/mutation-floors/pitest.log

      # Each shard's log under its own name, so the two do not overwrite each other when the summary job merges them.
      - name: Name the log after the shard
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -f build/reports/mutation-floors/pitest.log ]; then
            cp build/reports/mutation-floors/pitest.log "build/reports/mutation-floors/pitest-$SHARD.log"
          fi

      # Each module's HTML and XML report and its floors.json, with the module list and the shard's log. A module that
      # did not run simply adds nothing: the summary shows it as a "no report" row.
      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.shard }}
          path: |
            service/*/build/reports/pitest
            service/*/build/reports/mutation-floors
            build/reports/mutation-floors/modules.txt
            build/reports/mutation-floors/pitest-${{ matrix.shard }}.log
          # Stays an error though the log is present once PIT ran: if an earlier step failed, nothing is there to keep.
          if-no-files-found: error
          retention-days: 14

  # Both shards' reports in one table, whatever their results.
  summary:
    needs: pitest
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The summary script's own tests (standard library only): a broken summary turns the nightly red. They run after
      # PIT, whatever its result, so they can never keep PIT from running.
      - name: Test the summary script
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      # Both shards' artifacts merged at their repository paths; a shard that uploaded nothing leaves its modules as
      # "no report" rows.
      - name: Download the mutation reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          merge-multiple: true

      # Report-only: it exits 0 whatever the verdicts; the shards' mutation steps are what make the run red. The same
      # table is passed to the alert job as the `summary` output.
      - name: Summarise the mutation floors
        id: summary
        if: always()
        run: |
          mkdir -p build/reports/mutation-floors
          cat build/reports/mutation-floors/pitest-*.log > build/reports/mutation-floors/pitest.log 2>/dev/null || true
          python3 scripts/ci/mutation_summary.py --modules build/reports/mutation-floors/modules.txt \
            --log build/reports/mutation-floors/pitest.log > "$RUNNER_TEMP/mutation-summary.md"
          delimiter="mutation_summary_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "summary<<$delimiter"
            cat "$RUNNER_TEMP/mutation-summary.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # One open issue labelled `mutation-nightly` at a time: opened on the first red night, commented on after that.
  # Closing it is the maintainers' call once the nightly is green again. A scheduled run that is red, timed out or
  # cancelled alerts (cancel-in-progress is false, so a cancel is not a superseded run); a green one never runs this job;
  # a workflow_dispatch with force_issue runs it whatever the result, as a forced test run.
  alert:
    needs: [pitest, summary]
    if: >-
      always() && (
        (needs.pitest.result != 'success' && github.event_name == 'schedule')
        || (github.event_name == 'workflow_dispatch' && inputs.force_issue)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the mutation-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.pitest.result }}
          SUMMARY: ${{ needs.summary.outputs.summary }}
        run: |
          set -euo pipefail
          label=mutation-nightly
          # --force: creates the label, or updates it when it exists, so the step is idempotent.
          gh label create "$label" --repo "$REPO" --force --color B60205 \
            --description "The nightly mutation-testing run did not succeed (mutation-nightly.yml)"

          body="$RUNNER_TEMP/mutation-issue.md"
          {
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "**Forced test run** (workflow_dispatch with force_issue), not a scheduled alert:"
              echo "it checks that the nightly can open or comment on this issue."
              echo "The \`pitest\` job result was: **$RESULT**. Run: $RUN_URL"
            else
              echo "The nightly mutation testing run did not succeed (\`pitest\` job result: **$RESULT**): $RUN_URL"
            fi
            echo
            if [ -n "$SUMMARY" ]; then
              printf '%s\n' "$SUMMARY"
            else
              echo "The run wrote no summary; read the \`pitest\` job logs and the \`mutation-report-<shard>\` artifacts."
            fi
          } > "$body"

          # A plain label filter, not --search: the search API is eventually consistent.
          issue="$(gh issue list --repo "$REPO" --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPO" --body-file "$body"
            echo "Commented on #$issue"
          else
            title="Mutation testing nightly did not succeed"
            if [ "$EVENT" = workflow_dispatch ]; then
              title="Mutation testing nightly: forced alert test (pitest $RESULT)"
            fi
            gh issue create --repo "$REPO" --label "$label" --title "$title" --body-file "$body"
          fi
