org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Java toolchains are provisioned by CI (actions/setup-java); never downloaded by Gradle.
org.gradle.java.installations.auto-download=false
# The spec-kitty-open-packs commit the round-trip runs against. Single source of truth for the pin: read by
# Gradle (:packs:openPacksRoundTrip) and by CI (.github/workflows/service.yml). Raised to the open-packs main tip
# a2a9379, which adds java-jenny's requires edge to java-conventions (open-packs #131), collapses the duplicate
# edge pairs (#135) and qualifies the qa profiles' references to built-in:: (12333ee).
openPacksRef=a2a93794f2d8c9f3f549e94ad024ea0e386d5df4

# The service build's own version, reported as ServiceInfo.serviceVersion. It is independent of the contract's
# info.version; the service has not been released.
version=0.1.0-SNAPSHOT
