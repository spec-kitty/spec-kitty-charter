org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Java toolchains are provisioned by CI (actions/setup-java); never downloaded by Gradle.
org.gradle.java.installations.auto-download=false
# The spec-kitty-open-packs commit the round-trip runs against. Single source of truth for the pin: read by
# Gradle (:packs:openPacksRoundTrip) and by CI (.github/workflows/service.yml). Raised to the 2026-11-05 open-packs
# main tip dad323f, which merges the strict-composition packs (open-packs #121, epic #118): every pack has a
# pack.yaml, declares depends_on and qualifies its cross-pack references.
openPacksRef=dad323f7e6e68f78c00b44a5737d0cbd1262bec1

# The service build's own version, reported as ServiceInfo.serviceVersion. It is independent of the contract's
# info.version; the service has not been released.
version=0.1.0-SNAPSHOT
