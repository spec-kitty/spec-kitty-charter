org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Java toolchains are provisioned by CI (actions/setup-java); never downloaded by Gradle.
org.gradle.java.installations.auto-download=false
# The spec-kitty-open-packs commit the round-trip runs against. Single source of truth for the pin: read by
# Gradle (:packs:openPacksRoundTrip) and by CI (.github/workflows/service.yml). Raised to the 2026-11-06 open-packs
# main tip 22c14b2, which merges parts A and A2 of the #240 migration (open-packs #125, #126): relationships live
# only in the graph documents, and a directive's steps are procedure artifacts it requires through an edge.
openPacksRef=22c14b2d53cb2deb5c430c233ab7ad9463525262

# The service build's own version, reported as ServiceInfo.serviceVersion. It is independent of the contract's
# info.version; the service has not been released.
version=0.1.0-SNAPSHOT
