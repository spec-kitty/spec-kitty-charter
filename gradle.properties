# 1692a3b, which carries open-packs #248 (#241: each pack's README.md is its only document; #242: org-charter.yaml
# retired, every pack registers as it is under ADR-0073).
openPacksRef=1692a3b1dde022c871f09dab34637d2f9d6723f3

