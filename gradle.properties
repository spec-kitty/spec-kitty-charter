org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Java toolchains are provisioned by CI (actions/setup-java); never downloaded by Gradle.
org.gradle.java.installations.auto-download=false
# A download that fails with a transient error (HTTP 429, 408 or 5xx, or a network error) is tried 5 times, 2 s, 4 s,
# 8 s and 16 s apart, instead of Gradle's 3 times, 1 s and 2 s apart (ADR-0079). A 404, 401 or 403 is never retried.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
# The spec-kitty-open-packs commit that packs/internal and packs/qa are synced from (scripts/packs/sync_packs.py), for
# this repository's own governance and the usability run; charter's tests read its own example packs (ADR-0070). The
# single source of truth for the pin: Gradle's syncPacks task and CI read it. Raised to the open-packs main tip
# 1692a3b, which carries open-packs #248 (#241: each pack's README.md is its only document; #242: org-charter.yaml
# retired, every pack registers as it is under ADR-0073).
openPacksRef=1692a3b1dde022c871f09dab34637d2f9d6723f3

# The service build's own version, reported as ServiceInfo.serviceVersion. It is independent of the contract's
# info.version; the service has not been released.
version=0.1.0-SNAPSHOT
