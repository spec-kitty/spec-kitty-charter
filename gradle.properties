org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Java toolchains are provisioned by CI (actions/setup-java); never downloaded by Gradle.
org.gradle.java.installations.auto-download=false
# The spec-kitty-open-packs commit the round-trip runs against. Single source of truth for the pin: read by
# Gradle (:packs:openPacksRoundTrip) and by CI (.github/workflows/service.yml). Currently the landed open-packs main tip 01edb4e (open-packs PR #52 has merged).
openPacksRef=01edb4ebab308249a10ed4a4a01d77741ac1d14b

# The service build's own version, reported as ServiceInfo.serviceVersion. It is independent of the contract's
# info.version; the service has not been released.
version=0.1.0-SNAPSHOT
