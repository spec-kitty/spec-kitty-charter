# The charter contract's own conventions, as a Spectral-format ruleset run by vacuum
# (DM 01M57WH7P0QZWHKYGBA2R0MA3K). contracts/lint/README.md explains each convention.
#
# Run by `./gradlew :contracts:lintContract` over the bundle of contracts/charter/openapi.yaml, which
# has every $ref inlined: a property that references a schema is judged with that schema's content,
# so a citation or description on a referenced enum or scalar file holds wherever it is used.
#
# vacuum's own OpenAPI rule set is switched off and only the rules below run, so a vacuum upgrade
# cannot add rules silently. Every rule has at least one planted fixture, fixtures/<rule id>[.<case>].yaml, that
# must fail exactly that rule once bundled (`./gradlew :contracts:lintFixtures`); fixtures/clean.yaml
# passes them all.
#
# Response closure (additionalProperties false) is not a rule here: JSONPath cannot classify composed
# schemas recursively. It is the Java checker `checkClosedResponseObjects` (DM 01M584Q3NNK0B78H9NKHV7VJDK),
# see contracts/lint/README.md.
extends:
  - - vacuum:oas
    - "off"

rules:
  operation-id:
    description: Every operation has an operationId.
    severity: error
    given: $.paths[*][get,put,post,delete,options,head,patch,trace]
    then:
      field: operationId
      function: truthy

  # vacuum's built-in uniqueness check, switched on by name: a ruleset cannot compare values across
  # operations with the core functions.
  operation-operationId-unique: true

  operation-tagged:
    description: Every operation has at least one tag.
    severity: error
    given: $.paths[*][get,put,post,delete,options,head,patch,trace]
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: object
          required: [tags]
          properties:
            tags:
              type: array
              minItems: 1

  # A read answers 200, a registration answers 200 (replace) or 201 (create) with the resource and an ETag
  # (ADR-0018 D10 as amended 2026-10-25, reconciling with ADR-0026's write surface), and a removal answers 204
  # with no body (ADR-0020 D9, which supersedes ADR-0018 D10's "200 only"); every non-success answer (every
  # 4xx/5xx and the shared default) is a problem. A 304 Not Modified has no body (RFC 9110, section 15.4.5), so it
  # is not a problem either (ADR-0018 D10 amendment 2026-10-28). not-modified-has-no-body and
  # no-content-has-no-body hold the 304 and the 204 to having no body.
  error-responses-are-problems:
    description: Every response other than the 200/201/204 successes and a 304 is served as application/problem+json only, with the shared Problem or a schema whose first allOf part is the Problem.
    severity: error
    given: "$.paths[*][*].responses[?(@property != '200' && @property != '201' && @property != '204' && @property != '304')]"
    then:
      - field: content
        function: truthy
      - field: content
        function: schema
        functionOptions:
          schema:
            type: object
            minProperties: 1
            propertyNames:
              const: application/problem+json
            additionalProperties:
              type: object
              required: [schema]
              properties:
                schema:
                  oneOf:
                    - type: object
                      required: [title]
                      properties:
                        title: { const: Problem }
                    - type: object
                      required: [allOf]
                      properties:
                        allOf:
                          type: array
                          prefixItems:
                            - type: object
                              required: [title]
                              properties:
                                title: { const: Problem }

  # A conditional read's 304 (getOpenApiDocument, #208) carries headers only: RFC 9110 forbids it a body
  # (ADR-0018 D10 amendment 2026-10-28).
  not-modified-has-no-body:
    description: A 304 Not Modified response declares no content.
    severity: error
    given: "$.paths[*][*].responses['304']"
    then:
      field: content
      function: falsy

  # A removal's 204 carries headers only: RFC 9110 (section 15.3.5) forbids it a body (ADR-0020 D9).
  no-content-has-no-body:
    description: A 204 No Content response declares no content.
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: falsy

  # ADR-0020 D8: an operation declared ahead of being built carries x-reserved, naming the contract set it
  # belongs to and the issue that reserves it. It is removed, with the 501, when the operation is built.
  # The marker is judged on the operation that carries it, so a null marker (which a path to the marker itself
  # would never visit) is refused too.
  x-reserved-shape:
    description: An x-reserved marker is a mapping with the contract set the operation belongs to and the issue that reserves it ('#' and a number).
    severity: error
    given: "$.paths[*][?(@.responses)]"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          properties:
            x-reserved:
              type: object
              additionalProperties: false
              required: [contractSet, issue]
              properties:
                contractSet: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
                issue: { type: string, pattern: '^#[0-9]+$' }

  # ADR-0020 D8: a reserved operation answers 501 Not Implemented until it is built, and says so.
  reserved-operation-declares-501:
    description: An operation that carries x-reserved declares a 501 response.
    severity: error
    given: "$.paths[*][?(@.responses)]"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          if: { required: [x-reserved] }
          then:
            properties:
              responses: { required: ['501'] }

  # ADR-0020 D8: building an operation removes its 501 and its x-reserved together, so a 501 never outlives the
  # marker and an unmarked operation never claims to be unbuilt.
  built-operation-declares-no-501:
    description: An operation without x-reserved declares no 501 response.
    severity: error
    given: "$.paths[*][?(@.responses)]"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          if:
            not: { required: [x-reserved] }
          then:
            properties:
              responses:
                not: { required: ['501'] }

  # ADR-0011: every response of every operation, the shared default Problem included, declares the three
  # Charter headers (#90). Fingerprint is not required on the wire, but its absence is still declared.
  charter-headers-on-every-response:
    description: Every response of every operation declares the Charter-Contract-Version, Charter-Worktree and Charter-Source-Fingerprint headers (ADR-0011, ADR-0018 D11).
    severity: error
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].responses[*]"
    then:
      - field: headers
        function: truthy
      - field: headers
        function: schema
        functionOptions:
          schema:
            type: object
            required: [Charter-Contract-Version, Charter-Worktree, Charter-Source-Fingerprint]

  # A bare const or enum refinement (an if condition, or an allOf part narrowing a property) holds nothing
  # but that one keyword: it narrows a property described where it is declared, so it needs no description.
  property-described:
    description: Every schema property has a description; a bare const or enum refinement, holding nothing else, is exempt.
    severity: error
    given: $..properties[*]
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          anyOf:
            - type: object
              required: [description]
              properties:
                description: { type: string, minLength: 1 }
            - type: object
              required: [const]
              maxProperties: 1
            - type: object
              required: [enum]
              maxProperties: 1

  enum-snake-case:
    description: Enum values are snake_case; the pack level built-in is the one spelling with a hyphen.
    severity: error
    given: $..enum[*]
    then:
      function: pattern
      functionOptions:
        match: "^([a-z][a-z0-9]*(_[a-z0-9]+)*|built-in)$"

  pack-level-token-spelling:
    description: The pack level built-in is spelled built-in, never built_in, builtin or another case.
    severity: error
    given: $..enum
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: array
          items:
            anyOf:
              - const: built-in
              - not:
                  type: string
                  pattern: "^[Bb][Uu][Ii][Ll][Tt][-_ ]?[Ii][Nn]$"

  resource-property-cited:
    description: Every property of a resource schema (a titled object schema) carries x-source or x-derived; the shared Problem is exempt.
    severity: error
    given: $..[?(@.properties && @.title && @.title != 'Problem')].properties[*]
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: object
          anyOf:
            - required: ["x-source"]
            - required: ["x-derived"]

  x-source-shape:
    description: An x-source citation is a mapping with a non-empty repository path and the symbol that produces the value.
    severity: error
    given: "$..['x-source']"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: object
          additionalProperties: false
          required: [path, symbol]
          properties:
            path: { type: string, minLength: 1 }
            symbol: { type: string, minLength: 1 }

  x-derived-shape:
    description: An x-derived citation is a mapping with the rule that computes the value and its non-empty list of contract inputs.
    severity: error
    given: "$..['x-derived']"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: object
          additionalProperties: false
          required: [rule, inputs]
          properties:
            rule: { type: string, minLength: 1 }
            inputs:
              type: array
              minItems: 1
              items: { type: string, minLength: 1 }

  x-provisional-shape:
    description: An x-provisional marker is a mapping whose open_decision names what is not decided yet.
    severity: error
    given: "$..['x-provisional']"
    then:
      function: schema
      functionOptions:
        forceValidationOnCurrentNode: true
        schema:
          type: object
          additionalProperties: false
          required: [open_decision]
          properties:
            open_decision: { type: string, minLength: 1 }
