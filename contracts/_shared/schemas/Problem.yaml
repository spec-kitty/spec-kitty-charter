title: Problem
description: >-
  The only non-2xx body of any module. A problem details object in the sense of
  RFC 9457, served as application/problem+json.
type: object
additionalProperties: false
required:
  - title
  - status
properties:
  type:
    type: string
    description: A URI reference that identifies the kind of problem. Absent means about:blank.
  title:
    type: string
    description: A short, human-readable summary of the kind of problem. It does not change between occurrences.
  status:
    type: integer
    minimum: 400
    maximum: 599
    description: The HTTP status code of this occurrence.
  detail:
    type: string
    description: >-
      A human-readable explanation specific to this occurrence of the problem. On a 400 without a code for a
      malformed request parameter it names where the parameter is (query, path or header), its name, the value it
      carried (quoted, its quotes, backslashes and control characters escaped, cut after 64 code points) and what it
      accepts, for example: The query parameter kind is "bogus", which is not one of tactic, directive, ... or
      mission_step_contract. It is for a person to read; a client branches on the status, never on the detail.
  instance:
    type: string
    description: A URI reference that identifies this occurrence of the problem.
  code:
    type: string
    description: A stable machine-readable code for the problem, such as the name of a refusal reason. Consumers branch on it, never on the title.
  requiredBy:
    type: array
    description: >-
      Only on a 409 artifact_required or artifact_locked: one entry per pack that requires or locks the
      artifact, so a client can name every one (ADR-0020 D10, ADR-0012 D7). Packs, not artifacts: a skipped
      report's requiredBy lists artifacts.
    items:
      $ref: RequiringPack.yaml
  violations:
    type: array
    description: >-
      On a 422 activation_invalid, one entry per refused part of the request body; on the 422 validation_failed of a
      registration, one entry per fault of the pack; on a 409 artifact_referenced, one per referring artifact, so a
      client need not parse detail (ADR-0020 D10). At most 100 are listed: when more parts are refused, the first 100 are, and detail ends with the
      count of those left out.
    maxItems: 100
    items:
      $ref: RefusalViolation.yaml
  packs:
    type: array
    description: >-
      Only on a refusal of the pack composition (the pack_dependency_*, pack_parent_unresolved,
      pack_level_violation, pack_name_conflict, pack_duplicate_id, pack_sibling_conflict and pack_reference_*
      codes): the packs the refusal names, the pack that broke the rule first, each with its descriptorPackId (the
      pack_id its pack.yaml declares), its packId (the identifier it is configured under) and its name, so a client
      need not parse detail.
    items:
      $ref: RefusalPack.yaml
