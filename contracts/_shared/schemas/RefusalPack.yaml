title: RefusalPack
description: >-
  A pack a refusal names: the pack that broke the rule, or a pack the rule relates it to. It carries both of the
  pack's identities, as OfferingPack and HoldingPack do, so a client reads which pack to fix without parsing detail:
  descriptorPackId is the pack_id its own pack.yaml declares, the one a dependency edge names, and packId is the
  identifier the pack is configured under, the one every pack-scoped path takes.
type: object
additionalProperties: false
required:
  - descriptorPackId
  - packId
  - name
properties:
  descriptorPackId:
    type: string
    minLength: 1
    maxLength: 64
    description: The pack_id (ULID) the pack's pack.yaml declares.
    x-derived:
      rule: The pack_id of the pack's descriptor.
      inputs:
        - the pack.yaml of the pack the refusal names
  packId:
    type: string
    minLength: 1
    description: The identifier the pack is configured under, the one a path /packs/{packId} takes.
    x-derived:
      rule: The configured identifier of the pack.
      inputs:
        - the project configuration that lists the pack
  name:
    type: string
    minLength: 1
    maxLength: 64
    description: The name the pack's pack.yaml gives, the handle a pack-qualified reference uses.
    x-derived:
      rule: The name of the pack's descriptor.
      inputs:
        - the pack.yaml of the pack the refusal names
