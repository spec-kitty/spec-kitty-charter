title: RequiringPack
description: A pack that requires or locks an artifact, and the extends chain it does so through (ADR-0020 D10).
type: object
additionalProperties: false
required:
  - packId
  - via
properties:
  packId:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    minLength: 1
    maxLength: 63
    description: >-
      The id of the pack that requires or locks the artifact: a pack id, a kebab slug of at most 63 characters
      (ADR-0075 decision 2).
    x-derived:
      rule: The pack whose presets mark the artifact must-have, or whose policy locks it (ADR-0031, ADR-0012).
      inputs:
        - the request body and the packs the activation names
  via:
    type: array
    description: >-
      The extends chain the requirement or lock is inherited through, from the pack the activation names to
      packId; empty when that pack declares it itself. It is empty as well for a pack reached over depends_on and
      not over parent_pack, which is no extends chain.
    items:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 1
      maxLength: 63
    x-derived:
      rule: The extends chain from a pack the activation names to packId.
      inputs:
        - the request body and the packs the activation names
