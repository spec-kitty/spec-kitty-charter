# Must pass (landing pass): allowEmptyValue is a Parameter Object field a Header Object may carry (OAS 3.1).
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          headers:
            X-Probe:
              description: A header that may be empty.
              allowEmptyValue: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
