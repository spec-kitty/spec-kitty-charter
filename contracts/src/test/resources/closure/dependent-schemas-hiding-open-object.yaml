# Must report: A dependentSchemas entry that hides an open object property.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    additionalProperties: false
                    properties:
                      k:
                        type: string
                    dependentSchemas:
                      k:
                        properties:
                          extra:
                            type: object
