# Must report: the _links map is let by, but its Link value is a position and is open.
openapi: 3.1.0
info:
  title: Charter closure fixture
  version: 1.0.0-SNAPSHOT
paths:
  /activations/{activationId}:
    get:
      operationId: getActivation
      responses:
        '200':
          description: The activation.
          content:
            application/json:
              schema:
                title: Activation
                type: object
                additionalProperties: false
                properties:
                  _links:
                    description: The relations of the answer.
                    allOf:
                      - title: Links
                        type: object
                        additionalProperties:
                          title: Link
                          type: object
                          additionalProperties: true
                          required:
                            - href
                          properties:
                            href:
                              type: string
