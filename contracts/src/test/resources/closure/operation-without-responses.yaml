# Must fail (landing pass): an operation with no responses declares no response, so nothing it answers is judged.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: probe
  /judged:
    get:
      responses:
        '200':
          description: A judged body, so the document has at least one response schema.
          content:
            application/json:
              schema:
                type: string
