# Must pass: A member with additionalProperties true on a closed holder: a conjunction narrows, it never reopens.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    additionalProperties: false
                    properties:
                      k:
                        type: string
                    anyOf:
                      - required: [k]
                        additionalProperties: true
                      - minProperties: 0
