# Must pass: The exactly-one-of idiom on a closed holder.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    additionalProperties: false
                    properties:
                      k:
                        type: string
                      j:
                        type: string
                    oneOf:
                      - required: [k]
                      - required: [j]
