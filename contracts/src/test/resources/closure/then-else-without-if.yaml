# Must report (review 6, finding 1): without an if, then and else have no effect, so they close nothing.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    then:
                      additionalProperties: false
                    else:
                      additionalProperties: false
