# Must report: A member with minProperties and patternProperties, beside null.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    anyOf:
                      - minProperties: 1
                        patternProperties:
                          '^x-':
                            type: string
                      - type: 'null'
