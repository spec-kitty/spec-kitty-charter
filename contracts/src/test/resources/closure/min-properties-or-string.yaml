# Must report: Round-5 probe 4: a minProperties member beside a string.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    oneOf:
                      - minProperties: 1
                      - type: string
