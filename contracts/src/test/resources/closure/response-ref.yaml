# Must report: a response left as a $ref in the bundle, so its schema cannot be judged.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          $ref: '#/components/responses/Probe'
  /judged:
    get:
      responses:
        '200':
          description: A judged body, so the document has at least one response schema.
          content:
            application/json:
              schema:
                type: string
