# Must report (pre-PR squad): a response header is a position, and an open object there is open.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          headers:
            X-Probe:
              description: An open object header.
              schema:
                type: object
          content:
            application/json:
              schema:
                type: string
