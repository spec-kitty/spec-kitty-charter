# Must pass (landing pass): an operation whose every response has no body has responses, and nothing to judge.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    delete:
      responses:
        '204':
          description: Deleted.
        '404':
          description: Not found, without a body.
  /judged:
    get:
      responses:
        '200':
          description: A judged body, so the document has at least one response schema.
          content:
            application/json:
              schema:
                type: string
