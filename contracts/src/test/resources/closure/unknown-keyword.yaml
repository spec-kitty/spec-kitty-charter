# Must report: A keyword the checker does not understand (unevaluatedProperties), even though it would close the object.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    additionalProperties: false
                    unevaluatedProperties: false
