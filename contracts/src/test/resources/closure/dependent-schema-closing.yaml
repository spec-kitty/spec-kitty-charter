# Must report: A dependentSchemas entry that closes the object only when k is present.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: object
                    dependentSchemas:
                      k:
                        additionalProperties: false
