# Must report: Round-5 probe 5: a required member with a negated refinement, beside null.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    anyOf:
                      - required: [k]
                        not:
                          properties:
                            k:
                              const: a
                      - type: 'null'
