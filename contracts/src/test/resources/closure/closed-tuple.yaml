# Must pass: A tuple closed by items false whose prefixItems are closed or not objects.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  probe:
                    type: array
                    items: false
                    prefixItems:
                      - type: object
                        additionalProperties: false
                        properties:
                          k:
                            type: string
                      - type: string
