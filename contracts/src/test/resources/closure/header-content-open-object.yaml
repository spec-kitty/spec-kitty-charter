# Must report (pre-PR squad): a response header given by content is a position like a body media type.
openapi: 3.1.0
info:
  title: Closure probe
  version: 1.0.0
paths:
  /probe:
    get:
      responses:
        '200':
          description: The probe.
          headers:
            X-Probe:
              description: An open object header.
              content:
                application/json:
                  schema:
                    type: object
          content:
            application/json:
              schema:
                type: string
