# Single data authority for the pack vocabulary (plan, "Vocabulary kept in sync").
#
# Read by the Java adapter and by the tests. The schemas in schemas/ are edited in place (R20);
# the URN alternation, the per-kind URN prefix branches and the fragment kind enum in them
# repeat the kind lists below, and VocabularyEqualityTest fails when they differ. A kind is
# added here and in the schemas in the same change.
#
# Shape
#   node_kinds       The service's DRG node kind tokens (NodeKind.java), in schema order.
#   artifact_kinds   The artifact kind tokens (ArtifactKind.java). Each is also a node kind.
#   fragment_kinds   Fragment node `kind` plural -> node kind. One name per concept (R14).
#   files            Rules that map a pack file to the schema that validates it, each with an
#                    optional `content_form`.
#   exclusions       Rules for files that are not pack content or have no schema, each with a
#                    reviewable reason.
#   payloads         Rules for files with no schema (`match`, `kind`, `content_form`, all
#                    required), consulted only when no `files` or `exclusions` rule matches.
#   retired          Rules for files of a retired layout (`match`, `reason`, both required;
#                    ADR-0044 decision 6). A retired file is refused by name in the store's load and
#                    in validate mode, YAML and Markdown alike, is never a companion, is bucketed
#                    `retired:<match>` by the whole-pack gate and is digested in the fingerprint
#                    tail. Optional; consulted after `exclusions` and before `payloads`, and
#                    no file may match a `retired` rule and a `files` or `exclusions` rule, but
#                    for one known overlap, pinned by RetiredFilesTest: a README directly in the
#                    old built-in `missions/mission-steps/` is excluded, never read either way.
#   Any other top-level key fails when the table loads.
#
# Content form
#   `content_form` says how a file is read, held, written and compared: `yaml` (the default, so
#   the existing `files` rules do not write it), `markdown`, `text` or `bytes`. A file's
#   extension and an asset's `mime` never choose it. `yaml`, `markdown` and `bytes` are built;
#   `text` is declared but not built yet (no mission has built it: #192 shipped text companions
#   under ADR-0039, not a form). A rule naming it fails when the table loads, until the mission
#   that first needs it builds and admits it.
#   The form decides how the store holds a file: a `bytes` file is held by its rule's kind
#   (`asset-payload` as an asset file, `template` as a template), and a `bytes` rule of any other
#   kind fails when the table loads. A `files` rule has a schema and is `yaml` or `markdown`; one
#   naming `bytes` fails when the table loads. A `payloads` rule has no schema and is `bytes`, the
#   only form the store holds a schema-less file in; one naming another form fails when the table
#   loads.
#   A `markdown` rule (`match`, `schema`, `content_form: markdown`) reads its files into the
#   Markdown model: optional frontmatter, optional H1 `title`, `preamble`, and the H2 `sections`
#   in order, each `{title, content}`. Files compare by that model and are written canonically.
#   Its `schema` is a structure schema in schemas/ (Draft 2020-12, standard keywords only, loaded
#   when the table loads; one that does not load fails the table). It validates the model as the
#   JSON tree {frontmatter?, title?, preamble, sections: [{title, content}]}, with `frontmatter`
#   and `title` left out, not null, when the document has none. The toolguide guide rule (#194),
#   the pack document rule `*/pack.md` (#260) and the two mission step rules (#194, ADR-0044)
#   declare it.
#
# Matching
#   `match` is a glob over the file's path relative to the directory that holds the pack
#   directories (`<checkout>/packs/`), written with forward slashes. `*` matches within one path
#   segment, `**/` matches zero or more whole segments, every other character is literal. There
#   is no trailing `**`: a rule spans nested files with `**/*`.
#   No file may match more than one rule across `files` and `exclusions`, and no file may match
#   more than one `payloads` rule; a payload rule overlaps the other two by design and only the
#   first match counts. The only overlap check is PackFileKindTest, over its sample paths; a file
#   that matches nothing is left unclassified, not refused.

node_kinds:
  - directive
  - tactic
  - styleguide
  - toolguide
  - paradigm
  - procedure
  - agent_profile
  - mission_step_contract
  - glossary_pack
  - skill
  - anti_pattern
  - asset
  - template
  - action
  - mission_type

artifact_kinds:
  - directive
  - tactic
  - styleguide
  - toolguide
  - paradigm
  - procedure
  - agent_profile
  - mission_step_contract
  - glossary_pack
  - skill
  - anti_pattern
  - asset
  - template
  - mission_type

fragment_kinds:
  directives: directive
  tactics: tactic
  styleguides: styleguide
  toolguides: toolguide
  paradigms: paradigm
  procedures: procedure
  agent_profiles: agent_profile
  mission_step_contracts: mission_step_contract
  glossary_packs: glossary_pack
  skills: skill
  anti_patterns: anti_pattern
  assets: asset
  templates: template
  mission_types: mission_type
  actions: action

files:
  - match: "*/pack.yaml"
    schema: pack-descriptor
  - match: "**/*.graph.yaml"
    schema: graph-shard
  - match: "*/drg/fragment.yaml"
    schema: org-fragment
  - match: "*/org-charter.yaml"
    schema: org-charter
  - match: "**/*.directive.yaml"
    schema: directive
  - match: "**/*.tactic.yaml"
    schema: tactic
  - match: "**/*.styleguide.yaml"
    schema: styleguide
  - match: "**/*.toolguide.yaml"
    schema: toolguide
  - match: "**/*.paradigm.yaml"
    schema: paradigm
  - match: "**/*.procedure.yaml"
    schema: procedure
  - match: "**/*.agent.yaml"
    schema: agent-profile
  - match: "**/*.step-contract.yaml"
    schema: mission-step-contract
  - match: "**/*.asset.yaml"
    schema: asset
  - match: "**/*.glossary-pack.yaml"
    schema: glossary-pack
  - match: "**/*.skill.yaml"
    schema: skill
  # Pack-level files (#195, ADR-0042): activation presets and the pack manifest, in their sanitized shapes.
  - match: "*/presets/*.yaml"
    schema: preset
  - match: "*/pack-manifest.yaml"
    schema: pack-manifest
  # A project file. It is not expected inside a pack; the rule exists so that a stray one is
  # validated, not silently ignored.
  - match: "**/charter.yaml"
    schema: charter
  # A toolguide's guide (#194): the Markdown companion its guide_path names, <id>.guide.md beside
  # the toolguide. This rule is the guide companion's own (same schema, same form), so the
  # companion ownership rule admits the toolguide's guide here and refuses any other companion.
  - match: "**/toolguides/*.guide.md"
    schema: toolguide-guide
    content_form: markdown
  # A pack's description (#260, ADR-0042 decision 8): pack.md at the pack root, held in the Pack as its document
  # through the markdown content form. Only the root file is the document; a pack.md deeper in the pack is not.
  - match: "*/pack.md"
    schema: pack-document
    content_form: markdown
  # Mission types (#194, ADR-0044): one file per type, missions/<id>/<id>.mission-type.yaml; a file anywhere else is
  # refused by placement, not skipped, so the rule matches the token anywhere.
  - match: "**/*.mission-type.yaml"
    schema: mission-type
  # A mission step's prompt and guidelines (#194, ADR-0044): Markdown companions beside their mission type, named by the
  # step's derived prompt_path and guidelines_path. Each rule is its companion's own.
  - match: "*/missions/*/steps/*.prompt.md"
    schema: mission-step-prompt
    content_form: markdown
  - match: "*/missions/*/steps/*.guidelines.md"
    schema: mission-step-guidelines
    content_form: markdown

exclusions:
  - match: "built-in.source.yaml"
    reason: >-
      The source declaration of the built-in pack. No model in core at 9554e7b2.
  - match: "**/templates/plan-field-declaration.yaml"
    reason: >-
      A mission template's plan-field declaration. No model in core at 9554e7b2.
  # Orientation notes beside a mission type and its templates (#194, ADR-0044), as for assets (R4). Named per place,
  # never by a missions/** glob, so a README under a retired directory is refused with it, not excluded. One place
  # still overlaps: a README directly in the old built-in missions/mission-steps/ reads as one beside a mission type
  # named mission-steps, and is excluded, since exclusions come before retired rules; it is never read either way
  # (RetiredFilesTest pins this).
  - match: "*/missions/README.md"
    reason: >-
      Orientation notes on the pack's mission types. Not pack content.
  - match: "*/missions/*/README.md"
    reason: >-
      Orientation notes beside the mission type they describe. Not pack content.
  - match: "*/missions/*/templates/**/README.md"
    reason: >-
      Orientation notes beside the mission templates they describe. Not pack content and not templates.
  # Asset and template round trip (#193): the README exclusion and the payloads section below.
  - match: "*/assets/**/README.md"
    reason: >-
      Orientation notes beside the assets they describe. Not pack content and not an asset
      payload (operator ruling R4, #193).
  # `*` matches a leading dot within one segment and `**/` zero or more whole segments, so these
  # cover a hidden file at any depth under a pack's `assets/` or top-level `templates/`. A hidden
  # file a `files` rule maps (a `.x.asset.yaml`) keeps that kind: `files` rules are consulted first.
  - match: "*/assets/**/.*"
    reason: >-
      Hidden files under assets/ (a file manager's .DS_Store, a .gitkeep, the store's own
      .pack-write-*.tmp temporary file) are not pack content and not asset payloads (#193).
  - match: "*/missions/*/.*"
    reason: >-
      Hidden files beside a mission type (the store's own .pack-write-*.tmp temporary file, a .DS_Store) are not pack
      content (#194).
  - match: "*/missions/*/steps/.*"
    reason: >-
      Hidden files beside a mission type's step companions (the store's own .pack-write-*.tmp temporary file) are not
      pack content (#194).
  - match: "*/missions/*/templates/**/.*"
    reason: >-
      Hidden files under a mission type's templates/ are not pack content and not templates (#194).
  - match: "*/templates/**/.*"
    reason: >-
      Hidden files under templates/ (a file manager's .DS_Store, a .gitkeep, the store's own
      .pack-write-*.tmp temporary file) are not pack content and not templates (#193).

# The retired mission tier (#194, ADR-0044 decision 6): files of these families are refused by name, in the load and in
# validate mode, so a stale one cannot hide. Each rule is anchored to a layout the pinned packs held (the mission tier at
# the pack root, as qa and cave-kitty had it, or under missions/, as the built-in pack had it), so a payload elsewhere
# that merely shares a name (an asset called governance-profile.yaml, a template under templates/mission-steps/) is
# never retired. Removed when the service is incorporated into core and no supported pack holds the old layout.
retired:
  - match: "*/mission_types/*.yaml"
    reason: the mission-type file moved to missions/<id>/<id>.mission-type.yaml (ADR-0044)
  - match: "*/missions/mission_types/*.yaml"
    reason: the mission-type file moved to missions/<id>/<id>.mission-type.yaml (ADR-0044)
  - match: "*/missions/*/mission.yaml"
    reason: folded into the mission-type file (ADR-0044)
  - match: "*/missions/*/mission-runtime.yaml"
    reason: folded into the mission-type file (ADR-0044)
  - match: "*/missions/*/governance-profile.yaml"
    reason: folded into the mission-type file (ADR-0044)
  - match: "*/mission_types/*/governance-profile.yaml"
    reason: folded into the mission-type file (ADR-0044)
  - match: "*/missions/mission_types/*/governance-profile.yaml"
    reason: folded into the mission-type file (ADR-0044)
  - match: "*/missions/*/expected-artifacts.yaml"
    reason: folded into the mission-type steps (ADR-0044)
  - match: "*/missions/*/actions/*/index.yaml"
    reason: folded into the mission-type steps' references (ADR-0044)
  - match: "*/mission-steps/**/*"
    reason: folded into the mission-type steps and their companions (ADR-0044)
  - match: "*/missions/mission-steps/**/*"
    reason: folded into the mission-type steps and their companions (ADR-0044)
  - match: "*/missions/*/command-templates/*"
    reason: folded into the mission-type steps' prompts (ADR-0044)

# Files with no schema (#193, ADR-0040): consulted only when no files or exclusions rule matches.
payloads:
  - match: "*/assets/**/*"
    kind: asset-payload
    content_form: bytes
  - match: "*/templates/**/*"
    kind: template
    content_form: bytes
  # A mission type's templates (#194, ADR-0044), deferred here by ADR-0040: template payloads, id <type>/<path>.
  - match: "*/missions/*/templates/**/*"
    kind: template
    content_form: bytes
