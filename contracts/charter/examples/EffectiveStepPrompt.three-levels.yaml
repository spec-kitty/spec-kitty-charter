summary: >-
  Four enhancements in force at three levels fill spdd:reasons-block of software-dev/plan, in the order of ADR-0066
  decision 5: level first, so the built-in fragment leads although its enhancement id sorts last; then pack name, so
  the org pack architecture-notes (configured as zz-org-arch) precedes spdd (configured as aa-spdd), the reverse of
  their configured ids; then the enhancement id. The project fragment closes the list although its id sorts first.
