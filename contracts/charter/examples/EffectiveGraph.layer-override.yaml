summary: >-
  The effective graph of an activation in which the project pack replaced the org pack's directive DIRECTIVE_010 whole,
  and a step of the software-dev mission type that scopes it. The edge into DIRECTIVE_010 ends at the version in force,
  and the override is listed with the level that won and the level that lost. The directive node links its effective read; the
  step and the mission type, which the pack-scoped artifact routes do not serve, link nothing. self is the graph.
