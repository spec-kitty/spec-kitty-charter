  The effective context of one action that lists two directives in force that are in tension, neither scoped by an
  action or a mission type (appliesThrough project). The tension is listed once from the smaller URN with its first
  writer's words and the tactic in force that reconciles both sides, which the context need not list itself (ADR-0045
  decision 10).
