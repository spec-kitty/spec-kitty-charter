summary: 'java-jenny under the activation "project", read at depth=1 from the built-in example pack of the charter (ADR-0070).
  The activation selects java-jenny, DIRECTIVE_001, 003 and 010 and the java-conventions and boring-code-review style guides
  from that pack. The list is complete, not abridged. java-jenny requires DIRECTIVE_003, DIRECTIVE_010 and the java-conventions
  style guide, all selected and in force; DIRECTIVE_001 is reached through DIRECTIVE_010 (hops 2) and is in force because
  the pack''s policy locks it (required true, reason locked). Every entry carries edge, the words of the edge it was reached
  through, whatever its relation: DIRECTIVE_003 is a requires entry whose edge states a when and a reason, java-conventions
  a reason alone, and the requires edges of DIRECTIVE_010 and 001 state neither, so their edge is {}. boring-code-review is
  a suggests entry in force because a preset of the pack requires it (reason required), with the when and reason of its edge.
  autonomous-operation-protocol is a suggests entry out of force (inactive, not_selected) with the words of its edge. The
  procedure adversarial-squad-deployment is not listed: java-jenny requires it, but the activation does not select it, so
  it is out of force and a requires target is not a suggestion; implementer-ivan is not listed either, because the activation
  does not select it (W1). required is the member of the effective set (a preset requires the artifact or a pack locks it),
  not the relation. self is this request, artifact the pack-scoped read of the winner''s pack, up the activation.'
