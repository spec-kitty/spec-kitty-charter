summary: >-
  java-jenny under the activation "project", read at depth=1 from the built-in pack of spec-kitty-open-packs at a2a9379. The
  activation selects what this repository's charter.yaml selects (its directives, paradigms, style guides and the gherkin
  and java-supply-chain toolguides; the two toolguides the pack does not hold are left out) and java-jenny itself. The list
  is complete, not abridged. java-jenny requires DIRECTIVE_010, 025, 030, 034 and 051 and the java-conventions style guide,
  all selected and in force; DIRECTIVE_001 is reached through DIRECTIVE_051 (hops 2). Every entry carries edge, the words of
  the edge it was reached through, whatever its relation: DIRECTIVE_030 and DIRECTIVE_034 are requires entries whose edges
  state a when and a reason, java-conventions a reason alone, and the requires edges of DIRECTIVE_010, 025, 051 and 001
  state neither, so their edge is {}. DIRECTIVE_041 is a suggests entry in force with the when and reason of its edge.
  DISCIPLINED_REFACTORING and USE_MUTATION_TESTING_TO_VALIDATE_TEST_QUALITY are suggests entries out of force (inactive,
  not_selected), each with the words of its edge. DIRECTIVE_024 is not listed:
  java-jenny requires it, but the charter does not select it, so it is out of force and a requires target is not a suggestion;
  implementer-ivan is not listed either, because the activation does not select it (W1). required is false on every entry:
  it is the member of the effective set (a preset requires the artifact or a pack locks it), not the relation. self is this
  request, artifact the pack-scoped read of the winner's pack, up the activation.
