summary: >-
  An activation with two tensions in force: one a tactic in force reconciles, and one nothing reconciles, whose finding
  offers both resolutions. Its source is required by the governing pack, so only the target has an exclude link;
  follow it with If-Match set to this answer's revision, quoted, and an empty body.
value:
