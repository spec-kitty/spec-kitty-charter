value:
  id: specify
  title: Specification
  description: Define user scenarios and acceptance criteria
  onDemand: false
  prompt: |
    ---
    description: Create a mission specification
    ---
    # /spec-kitty.specify - Create Mission Specification

    **Version**: 0.11.0+

    <!-- spdd:reasons-block:start -->
    <!-- spdd:reasons-block:end -->

    ## WORKING DIRECTORY: Stay in the repository root checkout

    **IMPORTANT**: Specify works in the repository root checkout. NO worktrees are created.
  guidelines: |
    # Specify Action - Governance Guidelines

    These guidelines govern the quality and authorship standards for mission specification work in the software-dev mission. They were extracted from the command template and are injected at runtime via the charter context bootstrap.
  expectedInputArtifacts: []
  expectedOutputArtifacts:
    - artifactKey: input.spec.main
      artifactClass: input
      pathPattern: spec.md
      blocking: true
      templatePath: templates/spec-template.md
      _links:
        skeleton:
          href: /api/v1/packs/core/artifacts/mission_type/software-dev/skeletons/spec-template.md
  substeps:
