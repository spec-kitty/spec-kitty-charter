summary: 'java-jenny read from the built-in example pack of the charter (ADR-0070), depth=1, with the built-in, org-base and
  project example packs loaded. agentProfile is the service''s answer verbatim. The governance list is the service''s complete
  answer, verbatim and in urn order: implementer-ivan (lineage), DIRECTIVE_001 (requires, reached through DIRECTIVE_010, hops
  2), DIRECTIVE_003 (requires, when and reason), DIRECTIVE_010 and the procedure adversarial-squad-deployment (requires, edge
  {}), boring-code-review and autonomous-operation-protocol (suggests, when and reason) and styleguide:java-conventions (requires,
  a reason alone: the edge FR-001 names). None of the real entries has held false: the pack holds every target. Invented and
  illustrative: directive:DIRECTIVE_099, an entry no pack holds, added only to show what held false looks like (packId null,
  no artifact link); its place in the list and its edge are made up. Every edge of the other entries is checked against the
  pack graph files by ProfileExamplesEdgeTest.'
