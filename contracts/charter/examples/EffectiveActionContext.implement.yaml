summary: >-
  The effective context of one action: the directive in force that the step scopes (appliesThrough action), a directive
  in force that no action and no mission type scopes (appliesThrough project), the enhancer in force of the step itself,
  and a tactic the first directive suggests that the activation does not select, listed as a suggestion with the edge's
  when and reason and the appliesThrough of the directive that suggests it. self is the context; effective-artifact is the step's read under the activation and artifact
  its read in main, the pack of the step's place; prompt is the step's effective prompt,
  offered because software-dev is in force.
