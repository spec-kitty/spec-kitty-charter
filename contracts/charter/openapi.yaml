openapi: 3.1.0
info:
  title: Charter API
  version: 0.2.0-SNAPSHOT
  summary: The charter of one project, its offering and its packs' artifacts.
  description: >-
    The contract of the charter service. This file holds the document header and the map from
    each path to the file that defines it; every definition lives in a small file next to it.
    Behavior is pinned by the contract scenarios under scenarios/ and, from roadmap step 3, by the
    conformance corpus.
servers:
  - url: /api/v1
security:
  - charterWorktreeToken: []
tags:
  - name: Service
    description: What the service says about itself, and the API root a client starts from.
  - name: Offering
    description: The Charter Packs the service is configured with, in the merge order.
  - name: Directives
    description: >-
      The directive registrations of a Charter Pack: register and replace a directive, which is read
      through Artifacts.
  - name: Styleguides
    description: >-
      The styleguide registrations of a Charter Pack: register and replace a styleguide, which is read
      through Artifacts.
  - name: Paradigms
    description: >-
      The paradigm registrations of a Charter Pack: register and replace a paradigm, which is read
      through Artifacts.
  - name: Toolguides
    description: >-
      The toolguide registrations of a Charter Pack: register and replace a toolguide, which is read
      through Artifacts.
  - name: Registration
    description: >-
      The whole Charter Pack: register it from an archive or from a source and poll the registration's status,
      read the stored pack, and remove one artifact or one registered relationship from it (ADR-0065). Declared in
      full: an operation not built yet carries x-reserved and answers 501 until it is (ADR-0020 D8).
  - name: Relationships
    description: The relationships registered between a Charter Pack's components.
  - name: Artifacts
    description: >-
      The artifacts of a Charter Pack of every served kind, read through one paged list and one
      item.
  - name: AgentProfiles
    description: >-
      The agent profiles of a Charter Pack: the pack-scoped read of one profile with its governance. The profile
      is served under the same artifact tree as the other kinds, by its own path, because the generic item read never
      renders a profile body.
  - name: EffectiveAgentProfiles
    description: >-
      The agent profiles of an activation: the read of one profile under an activation, with its governance and the
      state of each entry. Its own tag, so that the :profiles-edge slice implements it in a controller of its own beside
      the activation set's: the generic effective read of an artifact never renders a profile body.
  - name: EffectiveMissionTypes
    description: >-
      The mission types of an activation: the mission type the layer merge keeps under an activation, in the Artifact
      envelope, its steps and its skeletons, as the pack that holds the winner stores them, with every link under the
      activation. Its own tag, so that the :missions-edge slice implements it in a controller of its own beside the
      pack-scoped reads, as EffectiveAgentProfiles does for a profile: the generic effective read of an artifact never
      renders a mission type body.
  - name: MissionTypes
    description: >-
      The mission types of a Charter Pack: a mission type in the Artifact envelope, its steps with their stored
      prompt and guidelines, and its skeletons, the starting shapes of the documents its steps produce. A mission
      type is listed, filtered and referenced through Artifacts; its item and sub-resources are read here.
  - name: Activation
    description: >-
      The activation set (ADR-0020): active charters the service stores under an opaque id, their writes and their
      effective reads, and the packs an activation builds on. Declared in full: an operation not built yet carries
      x-reserved and answers 501 until it is (ADR-0020 D8).
