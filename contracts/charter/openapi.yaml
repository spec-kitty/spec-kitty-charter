  /activations/{activationId}:
    $ref: paths/activations_activationId.yaml
  /activations/{activationId}/selections/{kind}/{artifactId}:
    $ref: paths/activations_activationId_selections_kind_artifactId.yaml
  /activations/{activationId}/exclusions/{kind}/{artifactId}:
