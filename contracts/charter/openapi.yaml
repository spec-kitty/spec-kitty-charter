openapi: 3.1.0
info:
  title: Charter API
  version: 0.1.0-SNAPSHOT
  summary: The charter of one project, its offering and its packs' artifacts.
  description: >-
    The contract of the charter service. This file holds the document header and the map from
    each path to the file that defines it; every definition lives in a small file next to it.
    Behavior is pinned by the contract scenarios under scenarios/ and, from roadmap step 3, by the
    conformance corpus.
servers:
  - url: /api/v1
security:
  - charterWorktreeToken: []
tags:
  - name: Service
    description: What the service says about itself, and the API root a client starts from.
  - name: Offering
    description: The Charter Packs the service is configured with, in the merge order.
  - name: Directives
    description: >-
      The directive registrations of a Charter Pack: register and replace a directive, which is read
      through Artifacts.
  - name: Styleguides
    description: >-
      The styleguide registrations of a Charter Pack: register and replace a styleguide, which is read
      through Artifacts.
  - name: Paradigms
    description: >-
      The paradigm registrations of a Charter Pack: register and replace a paradigm, which is read
      through Artifacts.
  - name: Toolguides
    description: >-
      The toolguide registrations of a Charter Pack: register and replace a toolguide, which is read
      through Artifacts.
  - name: Relationships
    description: The relationships registered between a Charter Pack's components.
  - name: Artifacts
    description: >-
      The artifacts of a Charter Pack of every served kind, read through one paged list and one
      item.
  - name: Activation
    description: >-
      The activation set (ADR-0020): active charters the service stores under an opaque id, their writes and their
      effective reads. Declared in full and reserved: every operation answers 501 until it is built (ADR-0020 D8).
paths:
  /:
    $ref: paths/root.yaml
  /info:
    $ref: paths/info.yaml
  /openapi.yaml:
    $ref: paths/openapi.yaml
  /offering:
