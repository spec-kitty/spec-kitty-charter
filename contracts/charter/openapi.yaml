openapi: 3.1.0
info:
  title: Charter API
  version: 0.1.0-SNAPSHOT
  summary: Read-only answers of the charter of one project.
  description: >-
    The contract of the charter service. This file holds the document header and the map from
    each path to the file that defines it; every definition lives in a small file next to it.
    Behavior is pinned by the contract scenarios under scenarios/ and, from roadmap step 3, by the
    conformance corpus.
servers:
  - url: /api/v1
security:
  - charterWorktreeToken: []
tags:
  - name: Service
    description: What the service says about itself.
  - name: Directives
    description: The directives of a Charter Pack.
  - name: Styleguides
    description: The styleguides of a Charter Pack.
  - name: Paradigms
    description: The paradigms of a Charter Pack.
  - name: Toolguides
    description: The toolguides of a Charter Pack.
  - name: Relationships
    description: The relationships registered between a Charter Pack's components.
  - name: Artifacts
    description: >-
      The artifacts of a Charter Pack of every served kind, read through one paged list and one
      item.
paths:
  /info:
    $ref: paths/info.yaml
  /openapi.yaml:
    $ref: paths/openapi.yaml
  /packs/{packId}/relationships:
    $ref: paths/packs_packId_relationships.yaml
  /packs/{packId}/artifacts:
    $ref: paths/packs_packId_artifacts.yaml
  /packs/{packId}/artifacts/directive:
    $ref: paths/packs_packId_artifacts_directive.yaml
  /packs/{packId}/artifacts/directive/{artifactId}:
    $ref: paths/packs_packId_artifacts_directive_artifactId.yaml
  /packs/{packId}/artifacts/styleguide:
    $ref: paths/packs_packId_artifacts_styleguide.yaml
  /packs/{packId}/artifacts/styleguide/{artifactId}:
    $ref: paths/packs_packId_artifacts_styleguide_artifactId.yaml
  /packs/{packId}/artifacts/paradigm:
    $ref: paths/packs_packId_artifacts_paradigm.yaml
  /packs/{packId}/artifacts/paradigm/{artifactId}:
    $ref: paths/packs_packId_artifacts_paradigm_artifactId.yaml
  /packs/{packId}/artifacts/toolguide:
    $ref: paths/packs_packId_artifacts_toolguide.yaml
  /packs/{packId}/artifacts/toolguide/{artifactId}:
    $ref: paths/packs_packId_artifacts_toolguide_artifactId.yaml
  /packs/{packId}/artifacts/{kind}/{artifactId}:
    $ref: paths/packs_packId_artifacts_kind_artifactId.yaml
components:
  securitySchemes:
    charterWorktreeToken:
      type: http
      scheme: bearer
      description: >-
        The per-worktree token that proves the client to the service (ADR-0011). There is one token
        per worktree service. The launcher (issue #70) generates it, passes it to the service in the
        environment and to its one client in the Authorization header as Bearer <token>; the scheme
        name is matched without regard to case. It is never put in a URL, a command line or a log. Every operation requires it, the
        info operation included. A request without it, or with a malformed or wrong one, is a 401.
        A request a browser makes is a 403 whatever it carries: an Origin, Sec-Fetch-Site or
        Sec-Fetch-Mode header, or a Host whose name is not localhost, 127.0.0.1 or [::1] (the port is
        not judged), which is how DNS rebinding reaches a loopback service. The token proves the
        client to the service, not the service to the client: no answer, the info operation's
        included, is an identity proof of the server. Both refusals are answered before the request is
        routed, so an unknown path is a 401 and not a 404, and before any pack file is read. The
        guard does not cover the servlet container: container-level 400s, a malformed request the
        connector rejects before the service sees it (a bad path encoding, an oversized header, a
        missing Host), answer before the guard and carry no Charter header.
