get:
  operationId: getPackArtifact
  summary: Get one artifact of a Charter Pack by kind and identity.
  description: >-
    One artifact of one pack in the common envelope: kind, id, packId, _links, and exactly one
    kind-named member holding the artifact in its kind's own representation, the member kind names.
    _links holds self and collection, the list of the pack's artifacts of that kind. A kind that is not
    a slug breaks the parameter's schema and is a 400 Problem without a code, before anything is read.
    Then the pack is judged: an identifier that matches no configured pack, by name or by declared
    pack_id, is a 404 pack_not_found, whatever the kind. Then a slug that names no kind the service
    serves is a 404 kind_not_found, and an id the pack does not hold is the not-found code of its kind
    (tactic_not_found, directive_not_found, styleguide_not_found, paradigm_not_found,
    toolguide_not_found or mission_step_contract_not_found; a procedure the pack does not hold is artifact_not_found).
    The kinds this read serves are tactic, directive, styleguide, paradigm, toolguide, procedure and
    mission_step_contract. An agent_profile is a kind of the pack that the
    literal operation getPackAgentProfile answers, with the profile and its governance, and its not-found code is
    artifact_not_found; this templated read never carries a profile body. An asset and a skill are listed kinds
    too, answered by their own literal reads: this templated read refuses them 404 kind_not_found, naming the literal
    path, and never carries an asset or a skill member. The item of a mission_type is answered
    by getPackMissionType, GET /packs/{packId}/artifacts/mission_type/{missionTypeId}, a literal path the service
    prefers over this templated one, in the same envelope with member missionType; mission_type is listed and
    filtered like the other kinds, and its references are read on the templated references path.
    A configured
    pack whose directory is missing or that has no readable pack.yaml (none, or an invalid one;
    operator ruling of 2026-10-31), whatever kind and id the request names, or a pack holding a file
    the fingerprint covers that cannot be read or a directory that cannot be listed, is a 500
    pack_unreadable. A pack whose pack.yaml reads but whose aggregate or revision then cannot be read is, to
    the caller, a pack that is not there: a 404 pack_not_found, for every kind this read serves, a
    mission_step_contract included. The answer is verified against
    the source fingerprint and carries it; inputs that change while it is read are stale_input. Every
    item this read serves carries the pack revision as its ETag (#487): for a kind with a write (a directive, a
    styleguide, a paradigm or a toolguide) it is the If-Match token of that write, and for a kind with no write (a
    tactic, a procedure or a mission_step_contract) it names the revision the item was read at, the token a DELETE of
    the item sends. The read takes no If-None-Match and never answers 304. There is no write on this templated
    path: a writable kind is replaced on its own path, PUT /packs/{packId}/artifacts/<kind>/{artifactId},
    and a PUT to the item of a kind that has no write (a tactic) is a 405 Problem without a code, not
    kind_not_found.
  tags:
    - Artifacts
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/ArtifactKind.yaml
    - $ref: ../parameters/ArtifactId.yaml
  responses:
    '200':
      description: The artifact.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          description: >-
            The pack revision the item was read at, for optimistic concurrency on a later write or DELETE. Sent for
            every kind this read serves: the writable kinds (directive, styleguide, paradigm and toolguide), a
            procedure, a tactic and a mission_step_contract. The read takes no If-None-Match and never answers 304.
            The agent_profile read, getPackAgentProfile, carries it too.
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            tactic:
              $ref: ../examples/Artifact.tactic.yaml
            mission-step-contract:
              $ref: ../examples/Artifact.mission-step-contract.yaml
            procedure:
              $ref: ../examples/Artifact.procedure.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ArtifactNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
delete:
  operationId: deletePackArtifact
  summary: Remove one artifact from a Charter Pack.
  description: >-
    Removes the artifact, its companion files, its outgoing edges from registered.graph.yaml and every preset item of
    the pack that names it (a preset key left empty is deleted, since every preset list needs at least one item), and
    answers 204 with an ETag, the pack's new revision (ADR-0065 D4, FR-005). A DELETE never rewrites a file the author
    wrote. It is synchronous: it reads no source and does one bounded compose. It requires If-Match on the pack
    revision, as every sub-resource write does: absent is 428, a stale revision is 412, checked under the registry
    lock. The pack is judged first: an identifier that matches no configured pack is 404 pack_not_found; then a slug
    that names no kind the service serves is 404 kind_not_found; then an id the pack does not hold is the
    not-found code of its kind (tactic_not_found, directive_not_found, styleguide_not_found, paradigm_not_found,
    toolguide_not_found, mission_type_not_found or mission_step_contract_not_found), the code the item read answers on
    the same path, and artifact_not_found for a procedure, as the item read answers it, and for an agent_profile,
    which getPackAgentProfile answers likewise. An asset and a skill are listed but not removed: a DELETE of one is
    404 kind_not_found, whether the pack holds it or not. An agent
    profile is removed as the writable kinds are, with the If-Match of the ETag getPackAgentProfile gave. A mission
    type is removed with its step prompt and guidelines files and its skeletons, the files
    under its templates/, as one removal under one impact check: every check below judges them together (#99, D10). The
    literal mission type read path has no DELETE of its own, so a DELETE sent to it is this operation. A
    step contract is removed as the five kinds are. Then, in this order: 409 artifact_referenced while another artifact
    or pack still refers to it, judged against the tree after the removal, from the edges, the preset items and the
    descriptor overrides entries of every configured pack, so a referrer the same request removes does not count and
    the data-only fields of ADR-0064 D11 never do; a mission type is also referred to by every step contract whose
    mission names it and by every edge that names one of its action nodes (action:<type>/<step>) at either end, and
    its skeletons by the edges that name them; its packs member (at most 100) names the referring packs and its
    violations name every referring artifact, a preset item or a descriptor overrides entry included; 409
    governance_policy_violation (the REMOVE operation of the write gate, ADR-0030 D3), which fires only when an
    ancestor of the pack holds the id and locks it, so a pack removes its own artifact freely; and 409
    registration_conflict when a source shard or drg/fragment.yaml the author wrote declares the artifact's node (or,
    for a mission type, the node of one of its skeletons or action nodes) or holds an edge from it, which a DELETE never
    rewrites (register the whole pack instead). A client sends in If-Match the ETag the item read answered (every
    pack item read carries the pack revision, a mission type and a step contract included), or *, as for any kind. PR A is strict: when the
    closures that contain the pack, after the removal, no longer compose or break a rule, the answer is 422 with the
    composition code or one of override_not_permitted, enhances_cycle, conflicting_relations, self_override and
    override_cycle, naming the packs, and nothing is written. A refused DELETE changes nothing: no file, edge or preset
    item is removed. A DELETE does not consult activations: a saved selection of the removed artifact reads as stale and
    is dropped on the next write. The version history is kept.
    While charter.registration.enabled is off (the default) the answer is 503 pack_source_unavailable before the pack, the
    path or If-Match is judged (ADR-0065 D13).
  tags:
  - Registration
  parameters:
  - $ref: ../parameters/PackId.yaml
  - $ref: ../parameters/ArtifactKind.yaml
  - $ref: ../parameters/ArtifactId.yaml
  - $ref: ../parameters/IfMatch.yaml
  responses:
    '204':
      description: The artifact was removed; no body. The ETag is the pack's new revision.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the removal, quoted.
          required: true
          schema:
            type: string
            pattern: ^"sha256:[0-9a-f]{64}"$
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        The pack, the kind or the artifact the path names is not there: 404 pack_not_found, kind_not_found or
        the not-found code of the kind (directive_not_found, tactic_not_found and so on, as on getPackArtifact;
        artifact_not_found for a procedure or an agent_profile; mission_type_not_found for a mission type, as on getPackMissionType;
        mission_step_contract_not_found for a step contract), each its own code. The pack is judged first, then the
        kind, then the id.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            pack-not-found:
              summary: No configured pack matches the identifier.
              value:
                title: Pack not found
                status: 404
                code: pack_not_found
                detail: Pack nope was not found.
            kind-not-found:
              summary: The path names a kind the service does not remove.
              value:
                title: Kind not found
                status: 404
                code: kind_not_found
                detail: The service removes no artifact of kind skill.
            directive-not-found:
              summary: The pack holds no artifact with the asked kind and id; the code is the one of the kind.
              value:
                title: Directive not found
                status: 404
                code: directive_not_found
                detail: Pack qa has no directive GUARD.
    '409':
      description: >-
        The removal conflicts with the state of the packs: artifact_referenced, another artifact or pack still refers to
        the artifact (packs names the referring packs, at most 100, and violations name every referring artifact), and
        for a mission type a step contract bound to it or an edge that names one of its action nodes or skeletons;
        governance_policy_violation, an ancestor of the pack holds the id and locks it (the REMOVE operation of the
        write gate); or registration_conflict, the artifact is written in the pack's author-written graph documents
        (a source shard or drg/fragment.yaml), or for a mission type one of its skeletons or action nodes is, which a
        DELETE never rewrites. Nothing is written.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            artifact-referenced:
              summary: Another pack's edge refers to the artifact.
              value:
                title: Artifact referenced
                status: 409
                code: artifact_referenced
                detail: directive:GUARD of pack qa is referred to by tactic:review of pack acme-review-pack.
                packs:
                  - descriptorPackId: 01M4P01D5TWB5FKZGNNQG3943R
                    packId: acme-review-pack
                    name: acme-review-pack
                violations:
                  - pointer: ''
                    code: referenced_by
                    detail: tactic:review of pack acme-review-pack requires directive:GUARD.
    '412':
      $ref: ../responses/PackPreconditionFailed.yaml
    '422':
      description: >-
        PR A is strict: the closures that contain the pack, after the removal, fail to compose or break a rule, so the
        removal is refused and nothing is written. The code is one of the eleven pack composition codes or of
        override_not_permitted, enhances_cycle, conflicting_relations, self_override and override_cycle, with the packs
        member naming the root pack of the closure and the packs involved; validation_failed when the pack that would
        result does not revalidate. The composition codes answer 422 here, in place of 500.
        A stored activation whose closure the write joins and whose step enhancement in force would fill a slot
        the prompt in force of its step does not declare is refused with prompt_slot_missing (C38), the activation
        named in the detail, and nothing is written.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '503':
      $ref: ../responses/PackRemovalUnavailable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
