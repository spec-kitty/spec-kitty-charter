post:
  operationId: registerPackToolguide
  summary: Register a new toolguide in a Charter Pack.
  description: >-
    Registers a net-new toolguide (functional registration, ADR-0026): the whole pack aggregate is revalidated
    and committed atomically. The id is optional in the body; the server answers 201 with a Location to the
    created toolguide and an ETag revision. The body carries exactly one of guide (the Markdown) or guideUri
    (fetched once by the service before it takes the pack's write lock); the answer carries the stored guide
    with its H1 written from the title. A body that names an already-registered id is a 409
    registration_conflict; a malformed body, an invalid guide or a refused fetch is a 422 validation_failed,
    and the pack is left unchanged. The toolguides of a pack are registered at POST
    /packs/{packId}/artifacts/toolguide, under the artifact tree; the answer is the toolguide in the Artifact
    envelope the item read answers (GET /packs/{packId}/artifacts/toolguide/{artifactId}), with the same
    _links, and the path of Location is its _links.self.href. Registration is not yet advertised by a link: no
    answer carries an edit link.
  tags:
    - Toolguides
  parameters:
    - $ref: ../parameters/PackId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/ToolguideRegistration.yaml
  responses:
    '201':
      description: The toolguide was created.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Location:
          description: The URI of the created toolguide; its path is the _links.self.href of the answer.
          schema:
            type: string
        ETag:
          description: The pack revision after the write, for optimistic concurrency.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            toolguide:
              $ref: ../examples/Artifact.toolguide.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ToolguideNotFound.yaml
    '409':
      description: >-
        The registration conflicts with the pack's current state (registration_conflict: a duplicate id on POST, or
        the guide's file <id>.guide.md already claimed by another artifact of the pack).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '422':
      description: >-
        The registration is well-formed but breaks a pack invariant or schema (validation_failed): among others, it
        carries both or neither of guide and guideUri, a null one or an empty guideUri; its body is over the body limit (7 MiB
        by default); its guide is over the guide cap of UTF-8 (1 MiB by default, configurable via
        charter.guide-fetch.max-size), holds an unpaired surrogate or is not a valid guide (the detail names the
        rule); its id or title breaks a toolguide rule; or the service refused to fetch its guideUri (the
        detail names the reason and the host). An empty guide or a list over 256 items breaks a constraint the
        schema declares and is refused 400 Bad Request before the controller (ADR-0041 decision 2).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
