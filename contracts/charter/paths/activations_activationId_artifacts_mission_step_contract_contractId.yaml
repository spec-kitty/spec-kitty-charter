get:
  operationId: getEffectiveMissionStepContract
  summary: Get the step contract in force under an activation.
  description: >-
    It answers the layer-merge winner of the step contract in the activation's merged closure, the version
    getEffectiveArtifact names for the same id, in the Artifact envelope as the pack read of a step contract does, with
    packId the pack that holds the winner. It is answered whatever the contract's state under the activation. Every link
    stays under the activation but artifact: _links holds self, collection (the activation's effective artifacts of kind
    mission_step_contract), mission-type (getEffectiveMissionType) when the closure holds the mission type its mission
    names, step (getEffectiveMissionStep) when the winning mission type declares the step its action names, and
    artifact, the pack read of the winner in the pack that holds it. A delegation candidate of a kind the service lists
    that the closure holds links effective-artifact, its read under the activation. This literal path is preferred over
    the templated getEffectiveArtifact, which carries no body, so a step's step-contract link never leaves the
    activation (D11). An unknown activation is a 404 activation_not_found, then a step contract no pack of the closure
    holds a 404 mission_step_contract_not_found; a pack of the closure that is no longer configured, a closure that
    cannot compose or merge, and a winner whose pack cannot read it are 500 with their code, and inputs that change while
    it is read are stale_input. The answer is one verified read and carries the source fingerprint it verified. No ETag.
  tags:
    - EffectiveMissionTypes
  parameters:
    - $ref: ../parameters/ActivationId.yaml
    - $ref: ../parameters/StepContractId.yaml
  responses:
    '200':
      description: The step contract in force, in the Artifact envelope.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            specify:
              $ref: ../examples/Artifact.activation-mission-step-contract.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationMissionStepContractNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
