parameters:
- $ref: ../parameters/ActivationId.yaml
get:
  operationId: listEffectiveAssets
  summary: List the assets in force under an activation.
  description: >-
    The assets of the activation's closure (FR-009, research R2 and R3; ADR-0074 decision 9 as amended 2026-11-12): for
    each asset id a pack of the closure holds, the copy the layer merge keeps across the levels (a project copy over an
    org or built-in one), each with its id, its media type as that copy's sidecar writes it and whether it declares how
    it runs. An asset is in force when a pack of the closure holds it: it is never selected, denied or cascaded to, so
    no item carries a state, and the activation's document changes nothing here. The effective list
    (listEffectiveArtifacts) does not take kind asset, which it answers 400: this collection is where an activation's
    assets are listed. The items are in id order and the list is unpaged, deliberately: a closure holds few assets. A
    closure that holds no asset answers 200 with an empty list.

    Each item links effective-artifact, its read under this activation (getEffectiveAsset), and artifact, the
    pack-scoped read of the winning copy (getPackAsset). _links holds self and up (the activation).

    The order of the refusals: an unknown activation is a 404 activation_not_found, the only reason this read answers
    404. A pack of the closure that is no longer configured, a closure that cannot compose or merge, and a winner's
    pack that cannot be read are 500, with their code (pack_unreadable also for a layer override that the mutability
    level forbids); stale_input and internal_error may be retried. The answer is never partial: the winners and the
    descriptors are read against one source fingerprint, which the answer carries, and inputs that change between the
    two are stale_input.

    ETag identifies the representation: it changes with the activation's revision and with any pack of the
    activation's closure, and it does not change when a pack outside the closure changes. A matching If-None-Match is a
    304 without a body, and a tag of another representation never matches (RFC 9110 section 13.1.2).
  tags:
  - EffectiveAssets
  parameters:
  - $ref: ../parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: The assets in force under the activation, in id order.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/AssetList.yaml
          examples:
            project-override:
              $ref: ../examples/AssetList.activation.yaml
    '304':
      $ref: ../responses/NotModified.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/UnknownActivation.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
