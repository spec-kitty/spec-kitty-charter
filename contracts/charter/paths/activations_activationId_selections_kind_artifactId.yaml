parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/SelectableKindPath.yaml
- $ref: ../parameters/ArtifactIdPath.yaml
put:
  operationId: selectActivationArtifact
  summary: Select an artifact, or a mission type, optionally with a cascade.
  description: >-
    Adds the artifact to selected and clears its own exclusion, as charter activate does (ADR-0013 D3); kind
    mission_type is a kind like any other (one kind model, IC-20): the mission type joins selected.mission_type, and a
    cascade from it reaches the steps it holds, crossed like requires (Q1, decision DM-01M6RCXTS0SMDNTWZ8G7GJ2P5S;
    rule W20), so what those steps reach within the cascade's kinds is selected. With cascade, walks the graph into
    the named kinds from it: the walk stops at a deactivated artifact and reports it, unless includeDeactivated is
    true, which walks through the deactivated artifacts of the cascade's kinds and clears their exclusions: of what
    the walk reaches within those kinds and of each lineage ancestor it passes through whose kind is among them (a
    cleared ancestor is never selected). A deactivated artifact outside the cascade's kinds keeps its exclusion: the
    walk stops there and reports it, as it does without includeDeactivated (ADR-0059 amendment of 2026-11-06). The walk crosses enhances like any other
    relation, from the enhancer to what it enhances (ADR-0059 D2, as amended on 2026-11-06), so selecting an
    enhancer with a cascade selects its target and selecting a target selects no enhancer. One write, one new revision; answers the ActivationChange and the new ETag. Requires If-Match (ADR-0020
    D6). Absent means none: when selected holds no list for the kind, the select adds one that holds exactly the
    artifact (and what the cascade reaches), as it would to []. A write that changes nothing answers 200 with the
    same revision and an empty applied and cleared. A path id the activation's closure does not hold is 404
    artifact_not_found (mission_type_not_found for kind mission_type); a kind outside the path's enum is 422
    activation_invalid with a violation at the path; an unknown id in the body is 422. An If-Match that is neither * nor one quoted revision breaks its pattern and is 400 before anything
    else is judged. Then the preconditions, in this order: 428 without If-Match, 404 activation_not_found, 412 when
    stale; each comes before any 422, a fault of the body included (a member the
    schema does not declare, a null, a cascade token outside its kinds). A stored deny entry a pack upgrade put on the required or locked floor is tolerated (ADR-0059 D4): it
    never refuses the write, so the write answers no 409. Stale ids are dropped on write (ADR-0059 amendment of 2026-11-06): the write first removes from the
    stored document every id the activation's closure no longer declares (a pack upgrade removed it), in selected,
    deactivated and selected.mission_type, and lists them in dropped; such a write is never a no-op, so it answers a
    new revision. A pack pinned to a version no pack of the closure holds is dropped too (B1, decision
    DM-01M6RN5Y406SB4KA13QYMQ2P8J): the pin leaves packs and is listed in droppedPins, which also makes a new
    revision. A path id the closure no longer holds is still 404 artifact_not_found and nothing is dropped, even when
    the stored document still names it. An
    unknown pack is not dropped: the write is still 422 activation_invalid (unknown_pack), and only a
    replaceActivation recovers the document.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/SelectionRequest.yaml
  responses:
    '200':
      description: The selection was applied.
      headers:
        Charter-Contract-Version: &id001
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree: &id002
          $ref: ../headers/CharterWorktree.yaml
        ETag: &id004
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationArtifactNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
delete:
  operationId: unselectActivationArtifact
  summary: Unselect an artifact or a mission type.
  description: >-
    Removes the artifact from selected (a mission type from selected.mission_type) and changes nothing else; applied
    lists it and cleared is empty. Requires If-Match (ADR-0020 D6). Absent means none: when selected holds no list
    for the kind, nothing of the kind is selected, so there is nothing to remove. A write that changes nothing (the
    id is not in the list, or the kind holds no list) answers 200 with the same revision and an empty applied and
    cleared. A path id the activation's closure does not hold, and the stored document does not name either, is 404
    artifact_not_found (mission_type_not_found for kind mission_type), judged after every 422; a kind outside the path's enum is 422 activation_invalid with a violation at the path.
    An If-Match that is neither * nor one quoted revision breaks its pattern and is 400 before anything
    else is judged. Then the preconditions, in this order: 428 without If-Match, 404 activation_not_found, 412 when
    stale; each comes before any 422, the path's kind included. Stale ids are dropped on write (ADR-0059 amendment of 2026-11-06): the write first removes from the
    stored document every id the activation's closure no longer declares (a pack upgrade removed it), in selected,
    deactivated and selected.mission_type, and lists them in dropped; such a write is never a no-op, so it answers a
    new revision. A pack pinned to a version no pack of the closure holds is dropped too (B1, decision
    DM-01M6RN5Y406SB4KA13QYMQ2P8J): the pin leaves packs and is listed in droppedPins, which also makes a new
    revision. A path id the closure no longer holds but the stored document still names, in selected, is not
    refused: it is dropped with every other stale id, listed in dropped
    and not in applied, and the write answers 200 with a new revision. A path id that is neither held by the closure
    nor in that stored list is still 404 artifact_not_found (mission_type_not_found) and nothing is dropped. An
    unknown pack is not dropped: the write is still 422 activation_invalid (unknown_pack), and only a
    replaceActivation recovers the document.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  responses:
    '200':
      description: The artifact was unselected.
      headers:
        Charter-Contract-Version: *id001
        Charter-Worktree: *id002
        ETag: *id004
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationArtifactNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
