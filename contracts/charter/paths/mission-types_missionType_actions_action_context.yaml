get:
  operationId: getActionContext
  summary: Read the governance that applies to one action of one mission type.
  description: >-
    The offering's walk for one action: what the merged graph says governs the action, from the
    DRG node action:<missionType>/<action>. Five breadth-first steps (scope from the action node,
    requires, suggests up to depth, requires of the suggested, vocabulary), each artifact once,
    sorted by the full URN string. Each entry says which relation listed it, its parent via, and
    its distance hops from the action. The answer also carries the offering's load diagnostics.
    This read is the offering's walk for good: it applies no activation, exclusion or selection.
    What applies in one project is the activation set's operation (issue #103), built on this
    walk; type-wide scope, the mission type node's scope edges, is reached through that operation
    and not this one. An unknown mission type or action is a 404, never an empty answer. Two
    answers differ from core's on purpose until the conformance corpus decides them (issue #9): an
    action that is not a node of the graph answers 404 action_not_found, where core falls back to
    its non-bootstrap context, and a scope target the graph does not declare is listed with a null
    label, where core skips the artifact. The registered divergences are in
    docs/api/divergence-register.md.
  tags:
    - Context
  x-provisional:
    open_decision: >-
      the registered divergences from core (docs/api/divergence-register.md) are decided by the
      conformance corpus (issue #9), including the 404 for an action that is not a graph node and
      the entry for a scope target the graph does not declare
  parameters:
    - $ref: ../parameters/MissionType.yaml
    - $ref: ../parameters/Action.yaml
    - $ref: ../parameters/Depth.yaml
  responses:
    '200':
      description: The action-scoped context.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActionContext.yaml
          examples:
            software-dev-plan:
              $ref: ../examples/ActionContext.software-dev-plan.yaml
    '404':
      $ref: ../responses/ActionNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
