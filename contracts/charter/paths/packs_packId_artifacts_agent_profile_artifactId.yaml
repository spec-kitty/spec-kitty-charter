get:
  operationId: getPackAgentProfile
  summary: Get one agent profile of a Charter Pack, with its governance.
  description: >-
    One agent profile of one pack in the Artifact envelope: kind agent_profile, id, packId, _links, the profile as the
    pack stores it in agentProfile and, in governance, the artifacts its governance walk lists over the pack's composed
    depends_on closure (the lineage through specializes_from, then what the profile and its ancestors require, suggest
    and cite in the vocabulary), each with how it was reached, whether the place its edge leads to holds it and, when
    it does, the pack whose copy wins the layer merge of the closure: the walk follows the merged closure, so where a
    pack of the closure overrides an artifact, the entry's packId and artifact link name the winning copy, whose edges
    the walk followed. That holds for the profile itself too: when another pack of the closure wins the layer merge for
    the requested profile, agentProfile is the copy of the requested pack, as the read of the pack, while the governance
    follows the edges of the winning copy, so the two can disagree. The walk lists every target its closure holds,
    including a requires target that cannot be activated (a template or an asset), which the activation-scoped read
    (getEffectiveAgentProfile) omits along with every target that is not in force. The walk is the action context's walk with a lineage step in place of scope, and depth is the number of suggests hops it
    follows, 0 or 1 (default 0). Every entry carries edge, the when and the reason of the edge it was reached through,
    whatever its relation (FR-004); edge is an empty object where that edge states neither word, and it is always
    present. Where more than one edge could reach an entry, the words are those of the edge of its via, the parent the
    walk keeps. The generic artifact item read (getPackArtifact) never renders a profile body: this literal path is the
    read of the kind, and a DELETE or the references of a profile stay on the generic paths.

    The pack is judged first: an identifier that matches no configured pack, by name or by declared pack_id, is a 404
    pack_not_found. A profile this pack does not hold is a 404 artifact_not_found, one that only a pack of its closure
    holds included: the read is of the pack's own profile. A configured pack without a readable pack.yaml, or a pack
    holding a file the fingerprint covers that cannot be read, is a 500 pack_unreadable. A closure that cannot compose
    or merge refuses the read with the composition code the references read is refused with, the packs member naming the
    packs; the pack-scoped reads of the other artifacts of the pack still answer. The body and the governance are one
    verified read against the source fingerprint, which the answer carries; inputs that change while it is read are
    stale_input.

    The ETag is the pack revision, as a directive's is, for the DELETE of the profile that needs it in If-Match. It is a
    concurrency token over the committed content of this pack and not the Charter-Source-Fingerprint, which is the
    freshness digest of the whole source that this read verified, not a digest of the closure. It is not a cache
    validator of this answer: governance is walked over the pack's whole depends_on closure, so a change to a dependency
    pack (a requires edge it adds, or a copy it overrides) can change governance while the ETag stays the same, and the
    same ETag is answered for depth 0 and depth 1. The read therefore takes no If-None-Match and never answers 304, and a
    client that keeps the governance revalidates it by reading again, or by comparing Charter-Source-Fingerprint, which
    changes with any pack. The tag stays the pack revision because DELETE compares If-Match to the pack revision; a tag
    over the closure would make the profile's delete precondition fail whenever a dependency changed.
  tags:
    - AgentProfiles
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/ArtifactId.yaml
    - $ref: ../parameters/Depth.yaml
  responses:
    '200':
      description: The agent profile and its governance.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          description: >-
            The pack revision the profile was read at, quoted: the value a later DELETE of the profile sends in If-Match.
            It names the pack's committed content, not the closure the governance was walked over or the depth, so it
            does not change when a dependency pack changes the governance; it is a write precondition, not a cache
            validator of the governance.
          required: true
          schema:
            type: string
            pattern: ^"sha256:[0-9a-f]{64}"$
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            agent-profile:
              $ref: ../examples/Artifact.agent_profile.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        The pack or the profile the path names is not there, refused with 404. The pack is judged first: an identifier
        that matches no configured pack is pack_not_found. Then a profile the pack does not hold is artifact_not_found.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            pack-not-found:
              summary: No configured pack matches the identifier.
              value:
                title: Pack not found
                status: 404
                code: pack_not_found
                detail: Pack nope was not found.
            artifact-not-found:
              summary: The pack holds no agent profile with the asked identity.
              value:
                title: Artifact not found
                status: 404
                code: artifact_not_found
                detail: Pack built-in has no agent_profile nobody.
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
