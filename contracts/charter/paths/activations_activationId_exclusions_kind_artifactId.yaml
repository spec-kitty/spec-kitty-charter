parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/ActivatableKindPath.yaml
- $ref: ../parameters/ArtifactIdPath.yaml
put:
  operationId: deactivateActivationArtifact
  summary: Deactivate an artifact, optionally with a cascade.
  description: >-
    Adds the artifact to deactivated and removes it from selected, as charter deactivate does. With cascade, removes
    the reached artifacts from selected, records a deny entry only for the named artifact, and keeps an artifact
    another active one still reaches, or an active enhancer references (skippedShared). A cascade never removes an
    artifact a pack requires or locks: it is kept, with what it reaches, and a selected one the cascade reached is
    reported in skippedShared when another active artifact still references it, named by that artifact; one only the
    floor keeps is not reported. A named artifact a pack requires or locks is 409, naming every requiring pack, and
    nothing is stored; only the deny entry the write adds is judged against that floor, so a stored one a pack
    upgrade put on it is tolerated (ADR-0059 D4). Requires If-Match (ADR-0020 D6): 428 without it, 404
    activation_not_found, 412 when stale and 400 when it is not one quoted revision come before any 422, a fault of
    the body included. A
    cascading deactivate removes the reached artifacts from selected only where the kind holds a list; an absent
    kind selects none (absent means none), so there is nothing to remove, and the deny entry on the named artifact
    excludes it. A write that changes nothing (the id is already denied and not selected) answers 200 with the same
    revision and an empty applied and cleared. A path id the activation's closure does not hold is 404
    artifact_not_found; a kind outside the path's enum, mission_type included, is 422 activation_invalid with a
    violation at the path. A document a pack upgrade made stale has one way out: while it stores an id the closure no longer holds, every
    per-artifact and preset write of the activation is 422 activation_invalid, and an unselect or re-activate of
    that id is 404 artifact_not_found; a replaceActivation without the stale ids recovers it.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/ExclusionRequest.yaml
  responses:
    '200':
      description: The artifact was deactivated.
      headers:
        Charter-Contract-Version: &id001
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree: &id002
          $ref: ../headers/CharterWorktree.yaml
        ETag: &id004
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationArtifactNotFound.yaml
    '409':
      $ref: ../responses/ArtifactPolicyRefused.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
delete:
  operationId: reactivateActivationArtifact
  summary: Re-activate an artifact.
  description: >-
    Removes the artifact from deactivated and changes nothing else; the key is left out when its list empties. The
    id is in cleared and in applied (removed from deactivated). Requires If-Match (ADR-0020 D6). A write that
    changes nothing (the id is not in the list) answers 200 with the same revision and an empty applied and
    cleared. A re-activate adds no deny entry, so it is never 409. A path id the activation's closure does not hold is 404 artifact_not_found; a kind outside the path's
    enum, mission_type included, is 422 activation_invalid with a violation at the path. A document a pack upgrade made stale has one way out: while it stores an id the closure no longer holds, every
    per-artifact and preset write of the activation is 422 activation_invalid, and an unselect or re-activate of
    that id is 404 artifact_not_found; a replaceActivation without the stale ids recovers it.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  responses:
    '200':
      description: The exclusion was cleared.
      headers:
        Charter-Contract-Version: *id001
        Charter-Worktree: *id002
        ETag: *id004
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationArtifactNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
