parameters:
- $ref: ../parameters/ActivationId.yaml
get:
  operationId: getActivationSkippedReport
  summary: Read the skipped report of an activation.
  description: >-
    What the effective set leaves out, and why (ADR-0013 D4, ADR-0020 D7). Reserved: it answers 501 until it is
    built (ADR-0020 D8).
  tags:
  - Activation
  x-reserved:
    contractSet: activation
    issue: '#125'
  responses:
    '200':
      description: The answer.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationSkippedReport.yaml
          examples:
            nothing-skipped:
              $ref: ../examples/ActivationSkippedReport.nothing-skipped.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '501':
      $ref: ../responses/NotImplemented.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
