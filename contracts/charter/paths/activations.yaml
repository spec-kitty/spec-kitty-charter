post:
  operationId: createActivation
  summary: Create an activation with an id the service mints.
  description: >-
    Stores the document under a ULID the service mints and answers 201 with the Activation, its Location and its
    ETag (ADR-0020 D3). A client with a stable id of its own uses PUT instead. The document is validated against
    its closure, the packs it names and their depends_on and parent_pack closure (every configured pack when it names none): an
    unknown pack, kind or artifact is 422 activation_invalid with violations, and a deny entry on an artifact a
    pack of the closure locks is 409 artifact_locked, and one on an artifact a pack of the closure requires is 409
    artifact_required, naming the pack, unless an active override of it satisfies the requirement in the document as it will be stored: an artifact that overrides it (an overrides edge of the merged closure) and is in force, selected or required, within the language filter and bound to a mission type in force, not denied and not hidden by an override itself. An enhancement never satisfies, and a locked artifact is never satisfied by an override (operator ruling Q9, research R12). The create judges every deny entry of the body. A body over
    1 MiB, an unknown member or a null is 422 activation_invalid. A body that sends activatedKinds or missionTypes is
    422 validation_failed, with one violation per member at its pointer naming its replacement (selected.mission_type
    for missionTypes; selected.<kind> for activatedKinds): the two members are not part of the document since the one
    kind model (IC-20), and no deprecation window applies. A pack pinned to a version no pack of the
    closure holds is 422 activation_invalid (version_not_held): the create keeps the refusal for a pin in its own
    body, while the other writes drop such a pin (ActivationChange.droppedPins). A deny entry on a mission type is
    judged as on any kind: on a locked one it is 409, and on a required one it is 409 unless an override satisfies it. Nothing is stored on a refusal.
  tags:
  - Activation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/ActivationConfig.yaml
  responses:
    '201':
      description: The activation was created.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Location:
          $ref: ../headers/Location.yaml
        ETag:
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Activation.yaml
          examples:
            minimal:
              $ref: ../examples/Activation.minimal.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '409':
      $ref: ../responses/ArtifactPolicyRefused.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '503':
      $ref: ../responses/RegistryBusy.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
