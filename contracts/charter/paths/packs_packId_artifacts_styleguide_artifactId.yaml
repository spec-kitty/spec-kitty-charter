put:
  operationId: putPackStyleguide
  summary: Register (create or replace) a styleguide of a Charter Pack by identity.
  description: >-
    Idempotent create-or-replace of a styleguide by id (functional registration, ADR-0026): the whole pack
    aggregate is revalidated and committed atomically. Answers 201 when it created the styleguide, 200 when it
    replaced one, each with an ETag revision. If-Match carries optimistic concurrency: a stale precondition is
    a 412 (a plain Problem, not a refusal code). A malformed body is a 422 validation_failed, and the pack is
    left unchanged. A styleguide is replaced at PUT /packs/{packId}/artifacts/styleguide/{artifactId}, under
    the artifact tree; the answer is the styleguide in the Artifact envelope the item read of the same path
    answers, with the same _links. Registration is not yet advertised by a link: no answer carries an edit
    link.
  tags:
    - Styleguides
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/ArtifactId.yaml
    - name: If-Match
      in: header
      required: false
      description: Optimistic concurrency on the pack revision; a stale value is refused 412.
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/StyleguideRegistration.yaml
  responses:
    '200':
      description: The styleguide was replaced.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the write.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            styleguide:
              $ref: ../examples/Artifact.styleguide.yaml
    '201':
      description: The styleguide was created.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the write.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/Artifact.yaml
          examples:
            styleguide:
              $ref: ../examples/Artifact.styleguide.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/PackNotFound.yaml
    '409':
      description: >-
        The registration conflicts with the pack's current state: governance_policy_violation, a write the mutability level of the pack that owns the artifact does not permit (ADR-0012).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '412':
      $ref: ../../_shared/responses/Problem.yaml
    '422':
      description: >-
        The registration is well-formed but breaks a pack invariant or schema (validation_failed): among others, one of
        its lists is null or holds a null item (a list is sent as an array, [] where it may be empty, and an optional
        one may be left out), or its body is over the body limit (1 MiB; refused validation_failed before it is read).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
