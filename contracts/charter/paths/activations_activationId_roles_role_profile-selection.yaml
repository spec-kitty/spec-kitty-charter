parameters:
- $ref: ../parameters/ActivationId.yaml
- name: role
  in: path
  required: true
  description: >-
    The role a step asks for, as a profile's role or alt-roles name it: a role token, a letter-first kebab slug of at most 64
    characters (lower-case letters and digits in hyphen-separated runs, ADR-0075 decision 2). The reserved role generic is never asked for: it marks a fallback profile and
    fits no role (ADR-0068), so the pattern refuses it as a 400 Problem without a code. The pattern spells that
    exclusion without a lookahead, which not every JSON Schema regular-expression dialect has.
  schema:
    type: string
    pattern: '^(?:(?:[a-fh-z][a-z0-9]*|g(?:[a-df-z0-9][a-z0-9]*|e(?:[a-mo-z0-9][a-z0-9]*|n(?:[a-df-z0-9][a-z0-9]*|e(?:[a-qs-z0-9][a-z0-9]*|r(?:[a-hj-z0-9][a-z0-9]*|i(?:[abd-z0-9][a-z0-9]*|c[a-z0-9]+)?)?)?)?)?)?)(?:-[a-z0-9]+)*|generic(?:-[a-z0-9]+)+)$'
    maxLength: 64
get:
  operationId: selectAgentProfile
  summary: Select the agent profile that fills a role under an activation.
  description: >-
    Which agent profile fills the role {role} under the activation (ADR-0032 decision 1, ADR-0069 decision 4, ADR-0068;
    rulings D1 to D4 of slice G): the service answers the profile, every tied profile, or the fallback, so a client
    never walks the profiles itself. The candidates are the agent profiles the activation puts in force, each the
    winner of the layer merge, read with its own declared fields (not inherited ones); a profile that enhances another
    profile is never a candidate. The order, in which every filter runs before the tier is picked:

    1. Reserved roles. generic is refused by the path pattern (400). operator is served only by a human-performed
    profile (performer human) and never falls back.
    2. Pin. When a pack of the closure pins the role in its policy.yaml role_pins, only the pinned profile and its
    in-force specializations (specializes_from, directly or through a chain) remain.
    3. Performer. A human-performed profile remains only for operator, or when the role is pinned to it.
    4. Role fit. A profile remains when the role is its role (fit primary) or one of its alt-roles (fit alt).
    5. Context. A specialization (a profile with an in-force specializes_from ancestor) that declares languages or
    frameworks in its specialization-context remains only when every asked dimension it declares holds the asked
    value and at least one asked dimension matches; a root, a specialization that declares neither and the pinned
    profile always remain. language and framework are optional; with neither asked, such a specialization never
    remains.
    6. Tier. The best fit left: primary over alt.
    7. Depth. The longest in-force specializes_from chain.
    8. Priority. The highest routing-priority, an absent one counting as 50.
    9. Tie. Every profile left is answered, in the order of its pack in the closure, then by id; tie is true when more
    than one is.
    10. None. With no profile left, the fallback in force (the fallback_profile of the most derived declaring pack of
    the closure) is answered with fit fallback; for operator, or with no fallback in force, the read is refused 404
    no_profile_matched.

    The refusals come in this order. An activationId or role outside its pattern, or a language or framework outside
    its pattern, is a 400 Problem without a code. An unknown activation is 404 activation_not_found. A closure that
    cannot compose or merge answers its 500. Then two packs of the closure, neither derived from the other, that
    declare different fallback profiles are 422 fallback_profile_conflict, and two packs of the closure that pin the
    role to different profiles are 422 role_pin_conflict, whether or not a profile would match. Then no matching
    profile and no fallback is 404 no_profile_matched. Every refusal comes before the ETag is compared, so none is a
    304. stale_input and internal_error may be retried; the answer is never partial.

    Each candidate links effective-artifact, its read under this activation (getEffectiveAgentProfile). The ETag
    follows the rule of the effective reads: it names the role and the asked context, and changes with the
    activation's revision (what it puts in force) and with any file of a pack of its closure (the profiles' bodies,
    the policies with their pins and the descriptors with their fallbacks), and not with a pack outside it; a matching
    If-None-Match is a 304 without a body.
  tags:
  - EffectiveAgentProfiles
  parameters:
  - $ref: ../parameters/IfNoneMatch.yaml
  - name: language
    in: query
    required: false
    description: The language of the work the role is asked for, matched against a specialization's languages.
    schema:
      $ref: ../schemas/LanguageToken.yaml
  - name: framework
    in: query
    required: false
    description: The framework of the work the role is asked for, matched against a specialization's frameworks.
    schema:
      type: string
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9+#._-]*$
  responses:
    '200':
      description: The profile that fills the role, every tied profile, or the fallback.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ProfileSelectionRead.yaml
          examples:
            match:
              $ref: ../examples/ProfileSelectionRead.match.yaml
            tie:
              $ref: ../examples/ProfileSelectionRead.tie.yaml
    '304':
      $ref: ../responses/NotModified.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        Refused with 404, in this order: the activation (activation_not_found, also for an activation this client may
        not see, so ids do not leak), then a role no profile in force fills, with no fallback in force or for the role
        operator (no_profile_matched).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            activation-not-found:
              $ref: ../examples/CharterRefusal.activation-not-found.yaml
            no-profile-matched:
              summary: No profile in force fills the role, and operator never falls back.
              value:
                title: No profile matched
                status: 404
                code: no_profile_matched
                detail: No agent profile in force under the activation a-1 fills the role operator, and the role operator
                  never falls back.
    '422':
      description: >-
        The closure's packs disagree on what selection reads, refused with 422 before any profile is matched: two packs,
        neither derived from the other, declare different fallback profiles (fallback_profile_conflict), or two packs
        pin the role to different profiles (role_pin_conflict). Each detail names the packs.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            fallback-profile-conflict:
              summary: Two unrelated packs of the closure declare different fallback profiles.
              value:
                title: Fallback profile conflict
                status: 422
                code: fallback_profile_conflict
                detail: The packs team-a, team-b of the activation a-1's closure, neither derived from the other, declare
                  different fallback profiles.
            role-pin-conflict:
              summary: Two packs of the closure pin the role to different profiles.
              value:
                title: Role pin conflict
                status: 422
                code: role_pin_conflict
                detail: The packs team-a, team-b of the activation a-1's closure pin the role reviewer to different
                  profiles.
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
