get:
  operationId: listPacks
  summary: List the Charter Packs of the charter offering.
  description: >-
    Every Charter Pack the service loaded, in layer order (built-in, then org, then project) and,
    within a layer, in the order the packs are configured. A pack that fails to load refuses the
    whole read with a 500; the listing is never partial.
  tags:
    - Packs
  responses:
    '200':
      description: The pack listing.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/PackListing.yaml
          examples:
            built-in:
              $ref: ../examples/PackListing.built-in.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
