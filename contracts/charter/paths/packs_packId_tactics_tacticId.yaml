get:
  operationId: getPackTactic
  summary: Get one tactic of a Charter Pack by identity.
  description: >-
    One tactic of one pack. An identifier that matches no configured pack, by name or by declared
    pack_id, is a 404 pack_not_found; a pack without that tactic is a 404 tactic_not_found. A
    configured pack whose directory is missing, or a pack holding a file the fingerprint covers that
    cannot be read or a directory that cannot be listed, is a 500 pack_unreadable. The answer is
    verified against the source fingerprint and carries it; inputs that change while it is read are
    stale_input.
  tags:
    - Tactics
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/TacticId.yaml
  responses:
    '200':
      description: The tactic.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Tactic.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/TacticNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
