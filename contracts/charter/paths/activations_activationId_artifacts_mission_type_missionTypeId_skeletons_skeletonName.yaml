get:
  operationId: getActivationMissionSkeleton
  summary: Get one skeleton of the mission type in force under an activation.
  description: >-
    Reserved (ADR-0020 D8, issue #99): declared in full and answered 501 until it is built. Once built, it answers a
    skeleton of the pack that holds the layer-merge winner of the mission type, as getPackMissionSkeleton does
    (skeletons are not merged on their own), with skeletonName spelled as there (D9) and every link under the
    activation. An unknown activation is a 404 activation_not_found, then an unknown mission type a 404
    mission_type_not_found, then a name that does not decode to a skeleton of that pack's type a 404
    skeleton_not_found. No ETag. No link points at this operation while it is reserved.
  tags:
    - MissionTypes
  x-reserved:
    contractSet: activation
    issue: '#99'
  parameters:
    - $ref: ../parameters/ActivationId.yaml
    - $ref: ../parameters/MissionTypeId.yaml
    - $ref: ../parameters/SkeletonName.yaml
  responses:
    '200':
      description: The skeleton of the mission type in force.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/MissionSkeleton.yaml
          examples:
            spec-template:
              $ref: ../examples/MissionSkeleton.activation-spec-template.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationMissionTypeNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '501':
      $ref: ../responses/NotImplemented.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
