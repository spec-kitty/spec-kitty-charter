parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/ArtifactId.yaml
get:
  operationId: getEffectiveAgentProfile
  summary: Read the effective agent profile under an activation, with its lineage, its governance and the state of each entry.
  description: >-
    One agent profile under an activation (ADR-0020 D7; operator decisions of 2026-11-09; R8, #102): the winner the layer
    merge keeps across the levels of the activation's closure, with the pack and the level that hold it, its state,
    reason, policy and required as listEffectiveArtifacts gives them for the same profile, the effective profile in
    agentProfile, its lineage and, in governance, the artifacts its governance walk lists, each with how it was reached
    and the facts of its own winner (pack, level, state, reason). The effective profile resolves enhances and
    specializes_from (rulings D5, D6 and D7 of ADR-0078): each profile of the chain, the in-force specializes_from
    ancestors and the profile itself, is merged with its own in-force enhancers, then the chain is folded root to leaf by
    per-field replacement, identity fields never merged and never inherited (EffectiveAgentProfileRead). lineage lists
    the in-force ancestors, nearest first, each with its pack and depth, and is empty for a root. A profile that
    enhances another agent profile answers its own stored body, and _links.enhances is the read of the profile it
    enhances under this activation. _links.self is this request, with depth when the request sent one;
    _links.artifact is the pack-scoped read of the winner's pack, which answers the stored profile, before any enhancer
    is merged or any field inherited; and _links.up is the activation. The generic read getEffectiveArtifact never
    carries a body: this literal path is the read of the kind. Selection (selectAgentProfile) judges each candidate by
    its own declared fields, never by this effective profile.

    The walk is the one of getPackAgentProfile, judged by the activation instead of by the pack's closure alone: the
    lineage through specializes_from, then what the profile and its ancestors require, suggest and cite in the
    vocabulary, and depth is the number of suggests hops it follows, 0 or 1 (default 0). An artifact that is in force is
    listed with the step that reached it. A suggestion that is out of force is listed with state inactive and reason
    not_selected. Every entry carries edge, the when and the reason of the edge it was reached through (FR-004), whatever
    its relation (specializes_from, requires, suggests or vocabulary) and whether it is in force or not; edge is an empty
    object where that edge states neither word, and it is always present, so a wordless entry looks the same in force and
    out of force. Where more than one edge could reach an entry, the words are those of the edge of its via, the parent the
    walk keeps. Everything else that is out of force is not listed and seeds nothing: an
    ancestor that is not in force is dropped, with what only it requires (operator ruling W1, decision
    01M7115WE6WQ7Q41HSS9ZHD1F3). This diverges from the cascade of the activation writes, which passes an ancestor
    through. The profile the walk starts from is exempt: it is answered whatever its own state, and the state is
    reported on the read. An entry that is listed links, for the kinds the generic artifact route serves,
    effective-artifact (its read under this activation) and artifact (the pack-scoped read of its winner).

    Where this read differs from the pack-scoped read of the same profile (getPackAgentProfile): a requires target of a
    kind that cannot be activated (a template or an asset) is listed there and is omitted here, because an activation
    holds no state for it; and a specializes_from, requires or vocabulary target that is not in force is omitted here
    altogether, while the pack-scoped read lists every target its closure holds. Under an activation only a suggests
    target that is not in force still appears, as an off-state candidate with state inactive and reason not_selected.

    The order of the refusals: an unknown activation is a 404 activation_not_found; then an id that no pack of the
    activation's closure holds as an agent_profile is a 404 artifact_not_found, judged before any If-None-Match, so a
    name no pack holds is a 404 whatever the header says. A pack of the closure that is no longer configured, a closure
    that cannot compose or merge, and a winner whose pack cannot read it are 500, with their code
    (override_not_permitted for a layer override that the mutability level forbids, #639); so is an in-force enhancement
    of a profile of the chain that would drop part of the profile it enhances, content stored before the rule that
    refuses it at registration (profile_enhancement_drops_field, its packs member naming the enhancing pack first);
    stale_input and internal_error may be retried. The answer is never partial. The body, the lineage and the governance
    are one verified read against the source fingerprint, which the answer carries.

    ETag identifies the representation the request names: it changes with the activation's revision, with any pack of
    the activation's closure, the packs of the profile's enhancers and ancestors among them, and with the profile and
    the depth, and it does not change when a pack outside the closure changes. A matching If-None-Match is a 304 without a body, and a tag of another representation never matches
    (RFC 9110 section 13.1.2).
  tags:
  - EffectiveAgentProfiles
  parameters:
  - $ref: ../parameters/IfNoneMatch.yaml
  - $ref: ../parameters/Depth.yaml
  responses:
    '200':
      description: The effective agent profile under the activation, with its lineage and its governance.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/EffectiveAgentProfileRead.yaml
          examples:
            java-jenny:
              $ref: ../examples/EffectiveAgentProfileRead.java-jenny.yaml
    '304':
      $ref: ../responses/NotModified.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        What the path names is not there, refused with 404, in this order: the activation (activation_not_found, also for
        an activation this client may not see, so ids do not leak), then a profile that no pack of the activation's
        closure holds (artifact_not_found).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            activation-not-found:
              $ref: ../examples/CharterRefusal.activation-not-found.yaml
            artifact-not-found:
              summary: No pack of the activation's closure holds the agent profile.
              value:
                title: Artifact not found
                status: 404
                code: artifact_not_found
                detail: No pack of the activation's closure holds the agent_profile nobody.
    '500':
      description: >-
        The configured packs cannot be read, do not compose or merge, or changed while the read was answered, as
        OfferingUnreadable describes for every effective read (pack_unreadable, the composition codes,
        prompt_slot_missing, stale_input and internal_error); or an in-force enhancement of a profile of the chain
        would drop part of the profile it enhances (profile_enhancement_drops_field, rulings D5 and D7): a list item,
        a sub-field or a value of a top-level field it declares is missing or changed, or it declares a non-empty
        excluding. That content was stored before the rule that refuses it at registration (422), so the stored packs
        are at fault, not the request. Its detail names the enhancing pack, the profiles and the field, and its packs
        member lists the enhancing pack first. The answer is never partial. A refusal carries no source fingerprint
        header.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            profile-enhancement-drops-field:
              summary: An enhancer stored before the rule leaves out the specialization of the profile it enhances.
              value:
                title: Profile enhancement drops field
                status: 500
                code: profile_enhancement_drops_field
                detail: >-
                  The agent profile reviewer-team of pack team enhances reviewer and would drop part of its
                  specialization; an enhancement keeps every list item, sub-field and value of the profile it enhances
                packs:
                  - descriptorPackId: 01M7DFBF00000000000000TEAM
                    packId: team
                    name: team
            pack-unreadable:
              summary: A configured pack has no pack.yaml.
              value:
                title: Pack unreadable
                status: 500
                code: pack_unreadable
                detail: pack qa has no pack.yaml
            stale-input:
              summary: The inputs changed while the read was answered.
              value:
                title: Stale input
                status: 500
                code: stale_input
                detail: The inputs changed while the artifacts were read; read them again.
    default:
      $ref: ../../_shared/responses/Problem.yaml
