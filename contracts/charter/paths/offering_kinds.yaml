get:
  operationId: getKindTaxonomy
  summary: Read the kind taxonomy, every kind and every relation with the kinds it may connect.
  description: >-
    The kind taxonomy of the charter's model (R18, #112): every node kind, in NodeKind order, with its plural, whether
    it is an artifact, whether an activation selects it and whether a graph document may name it; and every relation,
    in RelationType order and then in_tension_with (held as a tension, ADR-0028), with whether it is directed, whether
    it is derived and the source and target kinds it may connect (ADR-0064 decision 13). A kind the pack artifact list
    serves links that list as a template (artifacts, /api/v1/packs/{packId}/artifacts?kind=<kind>). The answer is the
    model's, not the configured packs': it is the same whatever packs are configured, reads no pack file and never
    carries Charter-Source-Fingerprint. The answer carries a strong ETag, the SHA-256 digest of the JSON body it
    serves; a request whose If-None-Match matches it is answered 304 without a body. It holds none of core's
    organization facts (effective_when_absent, selection_overlayable, org_requirable). Like every operation it needs
    the worktree token.
  tags:
    - Offering
  parameters:
    - name: If-None-Match
      in: header
      required: false
      description: >-
        One or more entity tags of a taxonomy the client holds, or *. Compared weakly (RFC 9110, section 13.1.2):
        when * is sent or any listed tag matches the current ETag, the answer is 304. A value that is not an
        entity-tag list matches nothing, so the answer is 200. It is read only after the request passed the browser
        and token checks: a refused request is a 403 or 401 whatever it carries.
      schema:
        type: string
  responses:
    '200':
      description: The kind taxonomy.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          $ref: ../headers/KindTaxonomyETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/KindTaxonomy.yaml
          examples:
            model:
              $ref: ../examples/KindTaxonomy.model.yaml
    '304':
      description: >-
        The If-None-Match was * or matched the current ETag: the client already holds this taxonomy. There is no
        body. The answer carries the ETag again.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          $ref: ../headers/KindTaxonomyETag.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
