get:
  operationId: getPackGlossaryTerm
  summary: Get one term of a glossary context of a Charter Pack.
  description: >-
    One term of one glossary context of one pack (#106, ADR-0049 decision 3, ADR-0074 decision 11): the term as its
    context's file declares it, in camel case, with its URN term:<context-id>/<term-id>, which the path mirrors, and the
    id of the context that holds it. _links holds self and up, the context's read (getPackGlossaryContext). A member
    the file does not state is absent. A term is an item of its context, not an artifact: it is read here, and listed
    only inside its context.

    The segments are judged in path order: an identifier that matches no configured pack, by name or by declared
    pack_id, is a 404 pack_not_found; then a context the pack does not hold is a 404 artifact_not_found whose detail
    names the context; then a term the context does not hold is a 404 artifact_not_found whose detail names the term
    and its context. A configured pack without a readable pack.yaml, or a pack holding a file the fingerprint covers
    that cannot be read, is a 500 pack_unreadable. The answer is verified against the source fingerprint and carries
    it; inputs that change while it is read are stale_input.

    The ETag is the pack revision the term was read at, quoted, as the context's read answers it. The read takes no
    If-None-Match and never answers 304.
  tags:
    - Glossaries
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/ContextId.yaml
    - $ref: ../parameters/TermId.yaml
  responses:
    '200':
      description: The term.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/PackRevisionETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/GlossaryTerm.yaml
          examples:
            term:
              $ref: ../examples/GlossaryTerm.mission.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        The pack, the glossary context or the term the path names is not there, refused with 404, judged in path order.
        An identifier that matches no configured pack (by name or by declared pack_id) is pack_not_found. Then a
        context the pack does not hold is artifact_not_found, whose detail is glossary context `<contextId>` is not
        held. Then a term the context does not hold is artifact_not_found, whose detail is term `<termId>` is not held
        in glossary context `<contextId>`. A client error: the request named something that is not there.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            pack-not-found:
              summary: No configured pack matches the identifier.
              value:
                title: Pack not found
                status: 404
                code: pack_not_found
                detail: Pack nope was not found.
            context-not-held:
              summary: The pack holds no glossary context with the asked identity.
              value:
                title: Artifact not found
                status: 404
                code: artifact_not_found
                detail: glossary context `nothing` is not held
            term-not-held:
              summary: The context holds no term with the asked identity.
              value:
                title: Artifact not found
                status: 404
                code: artifact_not_found
                detail: term `nothing` is not held in glossary context `spec-kitty-core`
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
