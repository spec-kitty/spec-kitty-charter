put:
  operationId: putPackRelationship
  summary: Register a relationship edge in a Charter Pack.
  description: >-
    Registers a relationship edge, idempotent on the unordered {from, to} pair (FR-009, last-write-wins):
    re-registering a pair, in either orientation, replaces it. A new pair answers 201 and a replaced one
    200, each with an ETag revision (ADR-0018 D10 as amended) and a RelationshipRegistered body: the
    registered edge as relationship, and _links holding artifacts, the list of the pack's artifacts. There
    is no self link and no Location: this path has no GET. The from endpoint must resolve within the
    pack (else 409 registration_conflict); to may be external, but a to the compose of the pack cannot
    resolve is refused before anything is written (422): pack_reference_pack_missing, a qualified to naming
    a pack outside the pack's depends_on closure; pack_reference_unqualified, a bare to that only another
    pack holds; pack_reference_artifact_missing, a qualified to naming an artifact the named pack does not
    hold. The three are 500 on the reads and 422 here (CharterRefusalCode, x-refusal operations), and their
    packs member names the pack registered into first. The whole pack is committed atomically and
    answers an ETag revision. A relationship write is a sub-resource write: it requires an If-Match
    precondition (none supplied is 428), and a stale precondition is 412. Both 412 and 428 are plain
    Problem bodies, not refusal codes.
  tags:
    - Relationships
  parameters:
    - $ref: ../parameters/PackId.yaml
    - name: If-Match
      in: header
      required: false
      description: Optimistic concurrency on the pack revision; required for this sub-resource write (428 when absent).
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/RelationshipRegistration.yaml
  responses:
    '200':
      description: The relationship replaced one already registered for the same unordered pair.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the write.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/RelationshipRegistered.yaml
          examples:
            requires:
              $ref: ../examples/RelationshipRegistered.requires.yaml
    '201':
      description: The relationship was registered; no edge was registered for the pair before.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the write.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/RelationshipRegistered.yaml
          examples:
            requires:
              $ref: ../examples/RelationshipRegistered.requires.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../../_shared/responses/Problem.yaml
    '409':
      description: >-
        The relationship conflicts with the pack's state: registration_conflict, its from does not resolve; or
        governance_policy_violation, an edge the mutability level of the pack that owns its from does not permit
        (ADR-0012).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '412':
      $ref: ../../_shared/responses/Problem.yaml
    '422':
      description: >-
        The relationship is well-formed but breaks a schema or invariant (validation_failed), or its body is over the
        body limit (1 MiB; refused validation_failed before it is read), or its to cannot resolve in the compose of
        the pack (pack_reference_pack_missing, pack_reference_unqualified or pack_reference_artifact_missing, each with
        a packs member).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '428':
      $ref: ../../_shared/responses/Problem.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
delete:
  operationId: deletePackRelationship
  summary: Remove one registered relationship edge from a Charter Pack.
  description: >-
    Removes the edge of the unordered {from, to} pair, only from registered.graph.yaml, the shard putPackRelationship
    writes, and answers 204 with an ETag, the pack's new revision (ADR-0065 D4, FR-006; decision
    DM-01M6TQ62HXYF362GAFS2BZ3PGF). A DELETE never rewrites a file the author wrote. from and to are required query
    parameters, each a PackQualifiedReference, in either orientation: a URN may hold a slash (action:<type>/<step>), so
    the pair is not a path segment. It is synchronous and requires If-Match on the pack revision, as every
    sub-resource write does: absent is 428, a stale revision is 412, checked under the registry lock. The pack is
    judged first: an identifier that matches no configured pack is 404 pack_not_found; a pair on which no graph
    document of the pack holds an edge and no derived relation joins the two is 404 relationship_not_found. 409
    relationship_not_registered answers a pair the pack holds only outside registered.graph.yaml (the author wrote the
    edge in a source shard or drg/fragment.yaml), or a derived relation (a guard's implemented_by, ADR-0064 D7), and a
    pair held both in registered.graph.yaml and in an author-written document: the author wrote it, and a 204 that left
    the edge in force would mislead. The fixed reason says to register the whole pack; nothing is written. PR A is
    strict: when a closure that contains the pack, after the removal, no longer composes or breaks a rule, the answer
    is 422 with the composition code or one of override_not_permitted, enhances_cycle, conflicting_relations,
    self_override and override_cycle, naming the packs, and nothing is written. The version history is kept. The
    operation is reserved until the removal service is built (ADR-0020 D8).
  tags:
  - Registration
  x-reserved:
    contractSet: pack-registration
    issue: '#10'
  parameters:
  - $ref: ../parameters/PackId.yaml
  - name: from
    in: query
    required: true
    description: >-
      One end of the pair: a URN <kind>:<id> or a pack-qualified <pack-name>::<kind>:<id>. The pair is unordered, so the
      edge is found whichever end the registration wrote as its from.
    schema:
      $ref: ../schemas/PackQualifiedReference.yaml
  - name: to
    in: query
    required: true
    description: The other end of the pair, spelled as from.
    schema:
      $ref: ../schemas/PackQualifiedReference.yaml
  - $ref: ../parameters/IfMatch.yaml
  responses:
    '204':
      description: The registered edge was removed; no body. The ETag is the pack's new revision.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          description: The pack revision after the removal, quoted.
          required: true
          schema:
            type: string
            pattern: ^"sha256:[0-9a-f]{64}"$
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: >-
        The pack, or the edge, the request names is not there: 404 pack_not_found, or relationship_not_found when no
        graph document of the pack holds an edge on the pair and no derived relation joins it.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            pack-not-found:
              summary: No configured pack matches the identifier.
              value:
                title: Pack not found
                status: 404
                code: pack_not_found
                detail: Pack nope was not found.
            relationship-not-found:
              summary: The pack holds no edge on the pair.
              value:
                title: Relationship not found
                status: 404
                code: relationship_not_found
                detail: Pack qa holds no relationship between directive:GUARD and procedure:review.
    '409':
      description: >-
        relationship_not_registered: the pack holds an edge on the pair that is not in registered.graph.yaml (authored in
        a source shard or drg/fragment.yaml, or derived), or holds the pair both there and in an author-written document.
        Register the whole pack to change it; nothing is written.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
          examples:
            relationship-not-registered:
              summary: The edge is authored in the pack's own graph documents.
              value:
                title: Relationship not registered
                status: 409
                code: relationship_not_registered
                detail: >-
                  The relationship between directive:GUARD and procedure:review is not in registered.graph.yaml: register
                  the whole pack to change it.
    '412':
      $ref: ../responses/PackPreconditionFailed.yaml
    '422':
      description: >-
        PR A is strict: a closure that contains the pack, after the removal, fails to compose or breaks a rule, so the
        removal is refused and nothing is written. The code is one of the eleven pack composition codes or of
        override_not_permitted, enhances_cycle, conflicting_relations, self_override and override_cycle, with the packs
        member naming the root pack of the closure and the packs involved; validation_failed when the pack that would
        result does not revalidate. The composition codes answer 422 here, in place of 500.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '501':
      $ref: ../responses/NotImplemented.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
