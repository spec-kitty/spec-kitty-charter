parameters:
- $ref: ../parameters/ActivationId.yaml
get:
  operationId: getEffectiveGraph
  summary: Read the graph of the offering filtered by an activation.
  description: >-
    The graph of the merged closure under the activation (ADR-0020 D7, FR-018): the nodes in force, the edges among them
    resolved through the layer overrides, and the layer overrides applied. An edge is dropped with either endpoint, an
    edge from an overridden version is absent and an edge to one ends at the winner, so a client reads, from either end,
    what an enhancer enhances. The answer carries an ETag over the activation's revision and the packs of its closure,
    and answers 304 on a matching If-None-Match.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: The answer.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/EffectiveGraph.yaml
          examples:
            one-edge:
              $ref: ../examples/EffectiveGraph.one-edge.yaml
            layer-override:
              $ref: ../examples/EffectiveGraph.layer-override.yaml
    '304':
      $ref: ../responses/NotModified.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
