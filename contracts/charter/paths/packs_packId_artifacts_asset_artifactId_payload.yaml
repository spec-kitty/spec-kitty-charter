get:
  operationId: getPackAssetPayload
  summary: Read the payload of one asset of a Charter Pack, its bytes.
  description: >-
    The payload file the asset names (#105, ADR-0074 decisions 11 and 13), byte for byte: the bytes the pack holds at
    assets/<path>, whatever they are, text or binary. The asset is addressed by its id, never by the file's path, so a
    read cannot ask for a file outside the pack.

    The Content-Type is the asset's mime, as the sidecar writes it, when it is a well-formed type/subtype: the one rule
    validate applies, a slash with text on both sides (a malformed mime is the policy finding asset_mime_invalid). It is
    application/octet-stream when the mime is not well-formed, and also, as a limit of the transport and not a second
    rule, when a well-formed mime cannot be written as a header value. The payload ignores Accept: it has the one form
    its mime gives, so no Accept is refused with 406, and an Accept that names another type (application/json) is
    answered the same bytes and the same Content-Type. Every 200 carries X-Content-Type-Options: nosniff and
    Content-Security-Policy: sandbox; default-src 'none', so a client never guesses another type from the bytes and a
    browser that opens the payload runs it in a sandbox that loads nothing. No Content-Disposition is answered, on
    purpose: the payload is read by programs (a guard runner, core's client), and nosniff plus the sandbox already
    contain a browser that opens it.

    The pack is judged first, then the asset, as getPackAsset judges them: 404 pack_not_found, then 404
    artifact_not_found; 500 pack_unreadable. The bytes are read in the same verified read as the asset, against the
    source fingerprint the 200 carries; inputs that change while it is read are stale_input. The ETag is the pack
    revision, quoted, as getPackAsset answers it. If-None-Match is compared weakly (RFC 9110, section 13.1.2), once the
    pack and the asset are found: * or a listed tag that matches the ETag answers 304 without a body, and a value that
    is not an entity-tag list matches nothing.
  tags:
    - Assets
  parameters:
    - $ref: ../parameters/PackId.yaml
    - $ref: ../parameters/ArtifactId.yaml
    - $ref: ../parameters/IfNoneMatch.yaml
  responses:
    '200':
      description: >-
        The payload's bytes, exactly as the pack holds them, with the asset's mime as the Content-Type when it is
        well-formed and application/octet-stream otherwise.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          description: The pack revision the payload was read at, quoted, as getPackAsset answers it.
          required: true
          schema:
            type: string
            pattern: ^"sha256:[0-9a-f]{64}"$
        X-Content-Type-Options:
          $ref: ../headers/XContentTypeOptions.yaml
        Content-Security-Policy:
          $ref: ../headers/ContentSecurityPolicy.yaml
      content:
        '*/*':
          schema:
            type: string
            format: binary
            description: The payload file's bytes, unchanged.
    '304':
      $ref: ../responses/NotModified.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/AssetNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
