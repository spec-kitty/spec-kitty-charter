parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/PresetId.yaml
put:
  operationId: applyActivationPreset
  summary: Apply a preset.
  description: >-
    Applies one preset the activation's closure holds (ADR-0059 D6). Each key the preset lists replaces that key of
    the document: each selected.<kind> it lists becomes exactly its members, and activatedKinds and missionTypes are
    replaced when it lists them; a key it does not list is left as it is. A preset lists a key when it holds at least
    one member for it, so an empty list counts as not listed. The preset is expanded into the document, so writing
    the document back never applies it twice. Without force a member the document denies is not selected and its
    deny entry stays; with force true the deny entries of the preset's members are cleared and reported as cleared
    (ADR-0020 D6). applied lists every id the write added to or removed from selected, deactivated or missionTypes;
    a kind is never an entry. A preset no pack of the activation's closure holds is 404 preset_not_found; when two
    packs of the closure hold one preset id, the last in merge order wins. A preset member the closure does not hold
    (a preset a pack upgrade left stale) is 422 activation_invalid with an unknown_artifact violation at the whole
    request (pointer ""), since the write has no body list to point into; nothing is stored. Requires If-Match
    (ADR-0020 D6). An If-Match that is neither * nor one quoted revision breaks its pattern and is 400 before anything
    else is judged. Then the preconditions, in this order: 428 without If-Match, 404 activation_not_found, 412 when
    stale; each comes before any 422, a fault of the body included, and before the preset is judged. One write, one new revision; answers the
    ActivationChange and the new ETag. A write that changes nothing answers 200 with the same revision and an empty
    applied and cleared. Stale ids are dropped on write (ADR-0059 amendment of 2026-11-06): the write first removes from the
    stored document every id the activation's closure no longer declares (a pack upgrade removed it), in selected,
    deactivated and missionTypes, and lists them in dropped; such a write is never a no-op, so it answers a new
    revision. A path id the closure no longer holds is still 404 artifact_not_found and nothing is dropped. An
    unknown pack or a pinned version the closure does not hold is not dropped: the write is still 422
    activation_invalid (unknown_pack, version_not_held), and only a replaceActivation recovers the document.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/PresetApplication.yaml
  responses:
    '200':
      description: The preset was applied.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationPresetNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
