parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/PresetId.yaml
put:
  operationId: applyActivationPreset
  summary: Apply a preset.
  description: >-
    Expands the preset into selected, so writing the document back never applies it twice. Without force it never
    removes a deny entry; with force true it clears the exclusions of the ids the preset lists and reports them
    as cleared. Requires If-Match (ADR-0020 D6). Reserved: it answers 501 until it is built (ADR-0020 D8). Which
    members a preset sets, and whether it replaces or unites them, is open before the operation is built (ADR-0020,
    amendment of 2026-10-31, open question 6).
  tags:
  - Activation
  x-reserved:
    contractSet: activation
    issue: '#125'
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/PresetApplication.yaml
  responses:
    '200':
      description: The preset was applied.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '501':
      $ref: ../responses/NotImplemented.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
