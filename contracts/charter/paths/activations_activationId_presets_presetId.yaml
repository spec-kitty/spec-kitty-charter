parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/PresetId.yaml
put:
  operationId: applyActivationPreset
  summary: Apply a preset.
  description: >-
    Applies one preset the activation's closure holds (ADR-0059 D6). A preset may name any kind (one kind model,
    IC-20; Q3, decision DM-01M6RCY40CQQTHC130RWF43W0D), skill, glossary_pack and mission_type included, and every
    kind of the preset is applied: each selected.<kind> it lists becomes exactly its members (its
    activated_mission_types become selected.mission_type); a key it does not list is left as it is. A preset has no
    kind gate: a pack whose preset carries the key activated_kinds is refused as 500 pack_unreadable when it is loaded (a 422 when the pack is registered is planned, PR A). A preset lists a key when it
    holds at least
    one member for it, so an empty list counts as not listed. The preset is expanded into the document, so writing
    the document back never applies it twice. Without force a member the document denies is not selected and its
    deny entry stays; with force true the deny entries of the preset's members are cleared and reported as cleared
    (ADR-0020 D6). applied lists every id the write added to or removed from selected or deactivated, mission types
    included; a kind is never an entry. A preset no pack of the activation's closure holds is 404 preset_not_found;
    when two
    packs of the closure hold one preset id, the last in merge order wins. A preset member the closure does not hold
    (a preset a pack upgrade left stale) is 422 activation_invalid with an unknown_artifact violation at the whole
    request (pointer ""), since the write has no body list to point into; nothing is stored. Requires If-Match
    (ADR-0020 D6), the quoted revision or the current getActivation tag (a closure tag that no longer matches is 412; the answer keeps the revision as its ETag). An If-Match that is neither * nor one quoted sha256 tag (the revision or the getActivation tag) breaks its pattern and is 400 before anything
    else is judged. Then the preconditions, in this order: 428 without If-Match, 404 activation_not_found, 412 when
    stale; each comes before any 422, a fault of the body included, and before the preset is judged. One write, one new revision; answers the
    ActivationChange and the new ETag. A write that changes nothing answers 200 with the same revision and an empty
    applied and cleared. Stale ids are dropped on write (ADR-0059 amendment of 2026-11-06): the write first removes from the
    stored document every id the activation's closure no longer declares (a pack upgrade removed it), in selected,
    deactivated and selected.mission_type, and lists them in dropped; such a write is never a no-op, so it answers a
    new revision. A pack pinned to a version no pack of the closure holds is dropped too (B1, decision
    DM-01M6RN5Y406SB4KA13QYMQ2P8J): the pin leaves packs and is listed in droppedPins, which also makes a new
    revision. A stale preset member the stored document already names is dropped and put back, which is still a
    write that dropped an id, so it is judged and refused 422 as above. A preset the closure no longer holds is still 404 preset_not_found and nothing is dropped. An
    unknown pack is not dropped: the write is still 422 activation_invalid (unknown_pack), and only a
    replaceActivation recovers the document.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/PresetApplication.yaml
  responses:
    '200':
      description: The preset was applied.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        ETag:
          $ref: ../headers/ActivationETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/ActivationChange.yaml
          examples:
            selected:
              $ref: ../examples/ActivationChange.selected.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationPresetNotFound.yaml
    '412':
      $ref: ../responses/PreconditionFailed.yaml
    '415':
      $ref: ../responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../responses/ActivationInvalid.yaml
    '428':
      $ref: ../responses/PreconditionRequired.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    '503':
      $ref: ../responses/RegistryBusy.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
