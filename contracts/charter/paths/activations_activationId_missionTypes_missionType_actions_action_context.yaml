parameters:
- $ref: ../parameters/ActivationId.yaml
- $ref: ../parameters/MissionTypePath.yaml
- $ref: ../parameters/ActionPath.yaml
get:
  operationId: getEffectiveActionContext
  summary: Read what governs one action under an activation.
  description: >-
    The effective context of the action (ADR-0020 D7, FR-019): the artifacts in force of the merged closure that apply
    to the action under the ownership rule (the action's walk, then what its mission type scopes, then what no action
    and no mission type scopes; EffectiveActionContext states the rule), each with its appliesThrough, with the
    enhancers in force, and the skipped report. Never the offering's walk, which answers what the offering says. An unknown mission type or action is 404 mission_type_not_found or
    action_not_found, judged against the merged closure of the activation's packs whether or not the mission type is in
    force. A mission type that the activation does not put in force answers the context with no artifacts and no
    enhancements, and lists the mission type in missionTypeNotInForce. An unknown mission type or action is 404, and a
    closure that cannot merge is 500, before any 304. The answer carries an ETag over the activation's
    revision, the packs of its closure, the mission type, the action and the depth, and answers 304 on a matching
    If-None-Match.
  tags:
  - Activation
  parameters:
  - $ref: ../parameters/IfNoneMatch.yaml
  - $ref: ../parameters/Depth.yaml
  responses:
    '200':
      description: The effective context.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
        ETag:
          $ref: ../headers/EffectiveETag.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/EffectiveActionContext.yaml
          examples:
            implement:
              $ref: ../examples/EffectiveActionContext.implement.yaml
    '304':
      $ref: ../responses/NotModified.yaml
    '400':
      $ref: ../../_shared/responses/Problem.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/ActivationNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
