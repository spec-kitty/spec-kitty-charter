get:
  operationId: listPackStyleguides
  summary: List the styleguides of a Charter Pack.
  description: >-
    The readable styleguides of one pack, each with its relationships populated (FR-013), in the order
    the pack's storage lists them. A styleguide mints no relationships, so the relationships array is
    always empty. An identifier that matches no configured pack, by name or by declared pack_id, is a 404
    pack_not_found; a configured pack whose directory is missing, or a pack holding a file the fingerprint
    covers that cannot be read, is a 500 pack_unreadable. A pack without styleguides answers an empty list.
    The answer is verified against the source fingerprint and carries it.
  tags:
    - Styleguides
  parameters:
    - $ref: ../parameters/PackId.yaml
  responses:
    '200':
      description: The pack's styleguides.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/Styleguide.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/PackNotFound.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
post:
  operationId: registerPackStyleguide
  summary: Register a new styleguide in a Charter Pack.
  description: >-
    Registers a net-new styleguide (functional registration, ADR-0026): the whole pack aggregate is
    revalidated and committed atomically. The id is optional in the body; the server answers 201 with a
    Location to the created styleguide and an ETag revision. A body that names an already-registered id is
    a 409 registration_conflict; a malformed body is a 422 validation_failed, and the pack is left
    unchanged.
  tags:
    - Styleguides
  parameters:
    - $ref: ../parameters/PackId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/StyleguideRegistration.yaml
  responses:
    '201':
      description: The styleguide was created.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Location:
          description: The URI of the created styleguide.
          schema:
            type: string
        ETag:
          description: The pack revision after the write, for optimistic concurrency.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../schemas/Styleguide.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/StyleguideNotFound.yaml
    '409':
      description: The registration conflicts with the pack's current state (duplicate id or policy).
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '422':
      description: The registration is well-formed but breaks a pack invariant or schema.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/CharterRefusal.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
