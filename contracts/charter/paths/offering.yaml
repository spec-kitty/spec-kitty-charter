get:
  operationId: getOffering
  summary: List the configured packs in force.
  description: >-
    The packs the service is configured with (ADR-0020 D1), each with its id, the level it is
    configured at, the name and the version its pack.yaml gives, and the link to its artifacts. The
    order is the merge order: by configured level (built-in, then org, then project), then by pack id
    in code-point order, so Zeta comes before alpha. The level is the configured one, never the
    pack_level a pack.yaml declares. Merging is not applied yet (#10, #11): the offering lists the
    packs, not a merged result. The answer is one read verified against the source fingerprint, and
    carries it. A configured pack whose directory is missing, or whose pack.yaml is there but cannot
    be read or is invalid, or any input the fingerprint covers that cannot be read, refuses the whole
    answer with a 500 pack_unreadable; inputs that change while it is read refuse it with
    stale_input, which may be retried. Like every operation it needs the worktree token.
  tags:
    - Offering
  responses:
    '200':
      description: The configured packs, in the merge order.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Offering.yaml
          examples:
            three-levels:
              $ref: ../examples/Offering.three-levels.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
