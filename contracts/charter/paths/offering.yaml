get:
  operationId: getOffering
  summary: List the configured packs in force.
  description: >-
    The packs the service is configured with (ADR-0020 D1), each with its id, its descriptor pack_id, the
    level storage serves it at, the name and the version its pack.yaml gives, the dependencies it
    resolved (dependsOn) and the link to its artifacts. The order is the merge order: dependencies
    before the packs that need them, each level contiguous (built-in, then org, then project), and the
    packs no dependency relates in configured-level, then pack-id code-point order, so Zeta comes
    before alpha. The level is the one storage serves the pack at:
    the pack_level its pack.yaml declares, org when it declares no valid one (ADR-0038); the offering
    never recomputes it from pack.yaml. Merging is not applied yet (#10, #11): the offering lists
    the packs, not a merged result. The answer is one read verified against the source fingerprint, and
    carries it. A configured pack whose directory is missing, that has no pack.yaml, or whose pack.yaml
    cannot be read or is invalid, or a file of it is invalid or cannot be read (an asset sidecar whose payload the
    pack does not hold included), or any input the fingerprint covers that cannot be read, refuses the whole
    answer with a 500 pack_unreadable, because the offering names and composes every configured pack whole (the
    pack-scoped reads judge only the artifact they name); inputs that change while it is read refuse it with
    stale_input, which may be retried. A compose the resolver cannot serve is refused whole with a 500 as
    well, because the configured packs are broken, not the request: pack_dependency_cycle (depends_on and parent_pack edges both count),
    pack_dependency_unknown, pack_dependency_out_of_range (also two ranges on one pack that share no
    version; a range or a pack_version that is no PEP 440 value is pack_unreadable, above), pack_parent_unresolved, pack_level_violation
    (a dependency or a parent further from built-in than the pack), pack_name_conflict, pack_duplicate_id,
    pack_sibling_conflict (two packs of one level that change or define one artifact with no
    overrides edge settling it, or that hold one preset id with no parent_pack line between them), pack_reference_unqualified, pack_reference_pack_missing and pack_reference_artifact_missing (a
    qualified reference to a pack of the closure that does not hold the artifact). Each names the
    violating pack in detail and in the packs member of the body, with the pack_id and name of every pack it
    names. Like every operation it needs the worktree token.
  tags:
    - Offering
  responses:
    '200':
      description: The configured packs, in the merge order.
      headers:
        Charter-Contract-Version:
          $ref: ../headers/CharterContractVersion.yaml
        Charter-Worktree:
          $ref: ../headers/CharterWorktree.yaml
        Charter-Source-Fingerprint:
          $ref: ../headers/CharterSourceFingerprint.yaml
      content:
        application/json:
          schema:
            $ref: ../schemas/Offering.yaml
          examples:
            three-levels:
              $ref: ../examples/Offering.three-levels.yaml
    '401':
      $ref: ../responses/Unauthorized.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '500':
      $ref: ../responses/OfferingUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
