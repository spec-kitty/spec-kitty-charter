name: depth
in: query
required: false
description: >-
  How many suggests hops the walk follows from the artifacts the action scopes. 0 lists no
  suggested artifact. Scope is one hop and requires is transitive, so neither depends on depth.
  The seam in core maps its own concepts onto it: a first load asks for 2, a load after a recorded
  load asks for 1, and the public bundle read asks for 0. The first-load state stays in core's
  seam (ADR-0011 D3); the service keeps no state about earlier reads. A later version may raise
  the maximum, which is a compatible change. A depth outside the range is a 400 Problem, not a
  charter refusal.
schema:
  type: integer
  format: int32
  minimum: 0
  maximum: 2
  default: 2
