name: kind
in: path
required: true
description: >-
  The kind of the artifact, as its token: tactic, directive, styleguide, paradigm, toolguide,
  procedure, asset, skill, agent_profile, mission_type or mission_step_contract. For agent_profile the templated item
  read is not the one that answers: the literal operation getPackAgentProfile does. An asset and a skill are answered
  by their own literal reads too; the templated item read refuses them 404 kind_not_found and names the literal path.
  A removal (deletePackArtifact) does not remove an asset or a skill: it refuses them 404 kind_not_found, as a kind
  it does not remove. A mission_step_contract is
  served by the generic item read; the item of a mission_type is answered by getPackMissionType, whose
  literal path the service prefers, and its references read and its removal (deletePackArtifact, which
  removes the listed kinds but the asset and the skill, mission_type and mission_step_contract included) take this parameter like
  any other kind. The
  parameter is a slug, not an enum: a value that is not a slug (Tactic, -tactic) is a 400 Problem
  without a code, before the pack is judged, and a slug that names no served kind is answered 404
  kind_not_found by the service, after the pack is found.
schema:
  $ref: ../schemas/Slug.yaml
