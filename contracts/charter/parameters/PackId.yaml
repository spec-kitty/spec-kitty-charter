name: packId
in: path
required: true
description: >-
  The id the Charter Pack is registered under: the name the service's pack registry gives it, a kebab slug of at most
  63 characters (ADR-0075 decision 2). It is not the pack.yaml's pack_id.
schema:
  type: string
  minLength: 1
  maxLength: 63
  pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
