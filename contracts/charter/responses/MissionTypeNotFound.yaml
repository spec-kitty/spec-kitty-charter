description: >-
  The pack or the mission type the path names is not there, refused with 404. The pack is judged first: an identifier
  that matches no configured pack (by name or by declared pack_id) is pack_not_found. Then a mission type the pack
  does not hold is mission_type_not_found. A configured pack whose directory is missing or that has no readable
  pack.yaml is not this answer: it is pack_unreadable (500).
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      pack-not-found:
        summary: No configured pack matches the identifier.
        value:
          title: Pack not found
          status: 404
          code: pack_not_found
          detail: Pack nope was not found.
      mission-type-not-found:
        $ref: ../examples/CharterRefusal.pack-mission-type-not-found.yaml
