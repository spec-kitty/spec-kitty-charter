description: >-
  The pack holds no document, no README.md, refused with 404 pack_document_not_found; or the identifier matches no
  configured pack (by name or by declared pack_id), or names a built-in pack, which is read-only and has no document
  read, refused with 404 pack_not_found. The pack is judged first. A client error: the request named a document the
  pack does not hold. A pack that holds the document carries a doc link, so a client that follows the link does not
  meet this answer.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      pack-document-not-found:
        $ref: ../examples/CharterRefusal.pack_document_not_found.yaml
      pack-not-found:
        summary: No configured pack matches the identifier.
        value:
          title: Pack not found
          status: 404
          code: pack_not_found
          detail: Pack qa was not found.
