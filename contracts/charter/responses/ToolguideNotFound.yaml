description: >-
  The identifier matches no configured pack (by name or by declared pack_id), or the pack has no such toolguide,
  refused with 404 pack_not_found. The toolguide kind adds no dedicated not-found refusal code (WP04 reserved only the
  validation/conflict write-path tokens); the pack-scoped pack_not_found answers an absent toolguide sub-resource too.
  A client error: the request named something that is not there. A configured pack whose directory is missing, or a
  pack holding a file the fingerprint covers that cannot be read or a directory that cannot be listed, is not this
  answer: it is pack_unreadable (500) on every read.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Charter-Source-Fingerprint:
    $ref: ../headers/CharterSourceFingerprint.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      toolguide-not-found:
        summary: The pack has no toolguide with the asked identity.
        value:
          title: Pack not found
          status: 404
          code: pack_not_found
          detail: Pack qa has no toolguide git.
