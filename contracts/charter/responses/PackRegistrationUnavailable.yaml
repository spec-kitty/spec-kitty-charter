description: >-
  The service cannot take the registration now, refused with 503 and a Problem. Either the registration queue is full
  (two registrations run and eight wait, ADR-0065 D8), or ten uploads of registerPackFromArchive are open already
  (their bodies are still arriving), which both carry Retry-After and no code, or registration is
  switched off (charter.registration.enabled is false, which is the default) or the source kind's own flag
  (charter.pack-sources.<kind>.enabled) is off, or the system git is missing or older than 2.50.1 for a git source,
  which carry the code pack_source_unavailable. The upload of registerPackFromArchive is also refused 503
  pack_storage_full, without Retry-After, when the volumes lack room for the declared length and for what the open
  uploads will write (about three times the archive bound at most for one), before the body is read.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Retry-After:
    description: Seconds the client waits before it re-sends. Sent when the queue is full or ten uploads are open; absent when registration is switched off.
    required: false
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: ../../_shared/schemas/Problem.yaml
