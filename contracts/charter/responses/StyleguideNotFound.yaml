description: >-
  The identifier matches no configured pack (by name or by declared pack_id), or the pack has no
  such styleguide, refused with 404. The code is pack_not_found or styleguide_not_found. A client error:
  the request named something that is not there. A configured pack whose directory is missing, or a
  pack holding a file the fingerprint covers that cannot be read or a directory that cannot be listed,
  is not this answer: it is pack_unreadable (500) on every read.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Charter-Source-Fingerprint:
    $ref: ../headers/CharterSourceFingerprint.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      styleguide-not-found:
        summary: The pack has no styleguide with the asked identity.
        value:
          title: Styleguide not found
          status: 404
          code: styleguide_not_found
          detail: Pack qa has no styleguide java-style.
