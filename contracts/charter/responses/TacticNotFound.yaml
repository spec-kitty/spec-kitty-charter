description: >-
  The identifier matches no configured pack (by name or by declared pack_id), or the pack has no such tactic, refused with 404. The code is
  pack_not_found or tactic_not_found. A client error: the request named something that is not there. A
  configured pack whose directory is missing, or a pack with an unreadable file or a directory
  that cannot be listed, is not this answer: it is pack_unreadable (500) on every read.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Charter-Source-Fingerprint:
    $ref: ../headers/CharterSourceFingerprint.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      tactic-not-found:
        $ref: ../examples/CharterRefusal.tactic-not-found.yaml
