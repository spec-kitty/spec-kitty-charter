description: >-
  The pack registry's write lock was not free in time: a registration, a per-artifact pack write or another activation write
  holds it. The write changed nothing and can be sent again; Retry-After says when. A plain Problem with no code.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Retry-After:
    description: Seconds the client waits before it re-sends the write.
    required: true
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: ../../_shared/schemas/Problem.yaml
