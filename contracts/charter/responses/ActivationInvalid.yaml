description: >-
  A request the service refuses, with 422 activation_invalid: a body that is not JSON, a member stated twice in one
  object (duplicate_member, never read last-wins), a scalar of another type than the declared one (unreadable_body: no
  "1" or 1.0 for schemaVersion, no number or boolean for an id), a document or body that fails the schema, or one that names an unknown pack, kind, artifact or mission type, a duplicate pack, a pack pinned to a version other
  than the one the service holds (violation version_not_held, whose detail names the held and the pinned version), or a cascade
  that mixes all with kinds. violations lists each refused part by its JSON Pointer (ADR-0020 D9, D10). A kind outside
  the path's enum is 422 too, with a violation at the path. A depth below 0 or past the int32 range is refused with
  the violations below_minimum and above_maximum, at /depth.

  A create or replace can also answer 422 validation_failed, not activation_invalid: a body that sends activatedKinds
  or missionTypes, members the document no longer has, is refused with one violation per member, code removed_member,
  at its pointer (/activatedKinds, /missionTypes). One removed_member makes the whole refusal validation_failed, with
  any other violation of the body listed beside it.

  A write that would store a document whose closure puts in force a step enhancement filling a slot the prompt in
  force of its step does not declare answers 422 prompt_slot_missing (C38, ADR-0066 decision 8), naming the
  enhancement, its pack, the slot, the step and the pack that holds the prompt in force, before the document is stored.
