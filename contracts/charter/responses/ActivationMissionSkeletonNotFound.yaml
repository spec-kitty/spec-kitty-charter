description: >-
  The activation, the mission type or the skeleton the path names is not there, refused with 404, judged in that
  order: activation_not_found for an activation no document is stored under (or one this client may not see); then
  mission_type_not_found for a mission type the activation's merged closure does not hold; then skeleton_not_found for
  a name that does not decode (D9) to a skeleton of the pack that holds the winning type.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      activation-not-found:
        $ref: ../examples/CharterRefusal.activation-not-found.yaml
      mission-type-not-found:
        $ref: ../examples/CharterRefusal.mission-type-not-found.yaml
      skeleton-not-found:
        summary: The name does not decode to a skeleton of the pack that holds the winning type.
        value:
          title: Skeleton not found
          status: 404
          code: skeleton_not_found
          detail: Mission type software-dev of activation a-1 has no skeleton nope.md.
