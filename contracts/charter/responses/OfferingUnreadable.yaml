description: >-
  A configured Charter Pack could not be read, the packs do not compose, the packs changed while the read was
  answered, or the service failed unexpectedly, refused with 500. The answer is never partial. The code names the
  reason: one of the ten composition codes (pack_dependency_cycle, pack_dependency_unknown,
  pack_dependency_out_of_range, pack_parent_unresolved, pack_level_violation, pack_name_conflict,
  pack_duplicate_id, pack_sibling_conflict, pack_reference_unqualified, pack_reference_pack_missing),
  when the configured packs cannot be served together, with the packs member naming the packs involved, the
  violating pack first; or one of three others: pack_unreadable, when a configured pack's directory is missing, it
  has no readable pack.yaml, or a file the fingerprint covers cannot be read or a directory cannot be
  listed; stale_input, when the
  packs or the project configuration changed while the read was answered, which may be retried; and
  internal_error, an unexpected failure, which may be retried. A refusal carries no source
  fingerprint header.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      pack-unreadable:
        summary: A configured pack has no pack.yaml.
        value:
          title: Pack unreadable
          status: 500
          code: pack_unreadable
          detail: pack qa has no pack.yaml
      pack-level-violation:
        summary: A pack depends on a pack further from built-in than itself.
        value:
          title: Pack level violation
          status: 500
          code: pack_level_violation
          detail: >-
            pack `house-pack` (01M4P01D5TWB5FKZGNNQG3943R) at org depends on pack `team-pack`
            (01M4P01D5TWB5FKZGNNQG3943W) at project; a pack may take a dependency or a parent only at its own
            level or one nearer built-in
          packs:
            - packId: 01M4P01D5TWB5FKZGNNQG3943R
              name: house-pack
            - packId: 01M4P01D5TWB5FKZGNNQG3943W
              name: team-pack
      stale-input:
        summary: The inputs changed while the read was answered.
        value:
          title: Stale input
          status: 500
          code: stale_input
          detail: The inputs changed while the artifacts were read; read them again.
