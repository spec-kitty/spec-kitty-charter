description: >-
  A configured Charter Pack could not be loaded or merged, or the service failed unexpectedly,
  refused with 500. The answer is never partial. The code names the reason, for example
  pack_level_mismatch or unresolved_edge_endpoint; an unexpected failure is internal_error.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Charter-Source-Fingerprint:
    $ref: ../headers/CharterSourceFingerprint.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
