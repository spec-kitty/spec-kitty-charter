description: >-
  What the path of a preset application names does not exist, refused with 404: the activation
  (activation_not_found, also for an activation this client may not see, so ids do not leak), or a preset no pack
  of the activation's closure holds (preset_not_found), including one only a pack outside the closure holds. An id
  in the request path that is not there is 404.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      activation-not-found:
        $ref: ../examples/CharterRefusal.activation-not-found.yaml
      preset-not-found:
        $ref: ../examples/CharterRefusal.preset-not-found.yaml
