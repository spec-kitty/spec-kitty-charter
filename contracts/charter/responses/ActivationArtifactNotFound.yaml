description: >-
  What the path of a per-artifact write names does not exist, refused with 404: the activation
  (activation_not_found, also for an activation this client may not see, so ids do not leak), an artifact
  the activation's closure does not hold (artifact_not_found), or, for a select or an unselect of kind
  mission_type, a mission type the closure does not hold (mission_type_not_found). An id in the request
  path that is not there is 404; an unknown id inside the request body is 422 activation_invalid.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
content:
  application/problem+json:
    schema:
      $ref: ../schemas/CharterRefusal.yaml
    examples:
      activation-not-found:
        $ref: ../examples/CharterRefusal.activation-not-found.yaml
      artifact-not-found:
        $ref: ../examples/CharterRefusal.artifact-not-found.yaml
      mission-type-not-found:
        $ref: ../examples/CharterRefusal.mission-type-not-found.yaml
