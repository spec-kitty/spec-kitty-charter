description: >-
  The service does not take the removal now, refused with 503 and a Problem. Either registration is switched off
  (charter.registration.enabled is false, which is the default), answered with the code pack_source_unavailable before the
  pack, the path or the If-Match is read (ADR-0065 D13), or the pack registry's write lock was not free in time (a
  registration or another pack write holds it), which carries Retry-After and no code. Nothing is removed, and the removal
  can be sent again once the registry is free.
headers:
  Charter-Contract-Version:
    $ref: ../headers/CharterContractVersion.yaml
  Charter-Worktree:
    $ref: ../headers/CharterWorktree.yaml
  Retry-After:
    description: Seconds the client waits before it re-sends. Sent when the registry lock was busy; absent when registration is switched off.
    required: false
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: ../../_shared/schemas/Problem.yaml
    examples:
      registration-switched-off:
        summary: Registration is switched off, so no pack write is taken; the Problem carries the code.
        value:
          title: Pack source unavailable
          status: 503
          code: pack_source_unavailable
          detail: 'Registration is switched off: charter.registration.enabled is not true.'
      registry-busy:
        summary: The registry lock was not free in time; a plain Problem, with Retry-After.
        value:
          title: Service Unavailable
          status: 503
