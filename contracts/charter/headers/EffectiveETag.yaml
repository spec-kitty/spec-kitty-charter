description: >-
  A strong entity tag of a read that depends on the packs of an activation's closure (the two built effective reads,
  listEffectiveArtifacts and getActivationSkippedReport, and getActivation; the reserved effective graph and action
  context declare it when they are built): an opaque digest that changes when the activation's revision or a pack of its closure changes, and,
  for the effective reads, with the query (kind, state and cursor); a pack outside the closure leaves it unchanged. In
  double quotes. Opaque to consumers, who compare it and never parse it.
required: true
schema:
  type: string
  pattern: ^"sha256:[0-9a-f]{64}"$
