description: >-
  The digest of the inputs the answers depend on, as ServiceInfo.sourceFingerprint: per configured
  pack in order, `pack.yaml`, every loaded file (tactic, directive, styleguide, toolguide and paradigm
  files, `*.tactic.yaml`, `*.directive.yaml`, `*.styleguide.yaml`, `*.toolguide.yaml` and
  `*.paradigm.yaml`, at any depth) and the declared graph inputs (root `*.graph.yaml` shards, the
  registered-relationship shard among them, then `drg/fragment.yaml`), each as its path under the
  pack's configured name and its bytes; and, when configured, `config.yaml` and `charter.yaml` under
  the project configuration directory, with presence. On every 200 answer of a verified read
  (getServiceInfo, getOffering, listPackArtifacts, getPackArtifact and getPackAgentProfile), the digest that read verified: it
  digested the inputs before and after loading them and they agreed. It is sent on, and required on, the 200 of every
  verified read, and on no other answer, so only those 200s declare it (#175). Never on a refusal or a
  failure; a read whose inputs changed while it was answered is refused with stale_input instead. A
  registration (POST, PUT) never sends it: the concurrency token of a write is its ETag, not this
  digest. getOpenApiDocument never sends it: it reads no pack file. Two reads of the activation set never
  send it either: getActivation reports a change through its ETag, which covers the activation's revision and the
  closure's own digest (it judges denyNotApplied against the closure's packs), and listActivationPacks the same way. The
  effective artifact list, the skipped report, the effective graph, the effective action context and the read of one
  artifact (listEffectiveArtifacts, getActivationSkippedReport, getEffectiveGraph, getEffectiveActionContext and
  getEffectiveArtifact) are verified reads and send it on their 200. Set once. The
  freshness work (#73) compares it; this version only reports it (ADR-0011).
required: true
schema:
  $ref: ../schemas/Sha256Digest.yaml
