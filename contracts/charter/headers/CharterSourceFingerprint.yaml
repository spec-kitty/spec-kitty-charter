description: >-
  The digest of the inputs the answers depend on, as ServiceInfo.sourceFingerprint: every pack file
  the service loads, and config.yaml and charter.yaml under the project configuration directory,
  with presence. On every 200 answer, the digest that answer's read verified: it digested the inputs
  before and after loading them and they agreed. Never on a refusal or a failure; a read whose inputs
  changed while it was answered is refused with stale_input instead. Set once. The freshness work (#73)
  compares it; this version only reports it (ADR-0011).
required: false
schema:
  $ref: ../schemas/Sha256Digest.yaml
