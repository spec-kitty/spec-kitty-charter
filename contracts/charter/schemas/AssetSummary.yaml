title: AssetSummary
description: >-
  One asset as an AssetList lists it: its id, its media type as the sidecar writes it, and whether it declares how it
  runs. In a pack (listPackAssets) it is the pack's asset, and _links holds self, the asset's own read (getPackAsset),
  which answers the whole descriptor and links its payload. Under an activation (listEffectiveAssets) it is the copy
  the layer merge keeps, and _links holds effective-artifact, its read under the activation (getEffectiveAsset), and
  artifact, the winning copy's read in its pack (getPackAsset).
type: object
additionalProperties: false
required:
  - id
  - mime
  - executable
  - _links
properties:
  id:
    type: string
    maxLength: 64
    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    description: The asset's identity within its pack, as Asset.id.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Asset.java
      symbol: Asset.id
  mime:
    type: string
    minLength: 1
    description: The media type exactly as the sidecar writes it, as Asset.mime.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Asset.java
      symbol: Asset.mime
  executable:
    type: boolean
    description: Whether the asset declares how it runs (its executable block); the asset's own read answers the block.
    x-derived:
      rule: True exactly when the sidecar declares an executable block.
      inputs:
        - the asset's sidecar, assets/<path>.asset.yaml
  _links:
    $ref: Links.yaml
x-source:
  path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Asset.java
  symbol: Asset
