title: TensionReconcilers
description: >-
  The artifacts in force that reconcile a tension, each once, sorted by URN: each holds a reconciles_tension edge to both sides in
  the merged closure (ADR-0045 decision 9). A reconciles_tension edge to one side only reconciles nothing. Empty when no
  artifact in force reconciles the pair.
