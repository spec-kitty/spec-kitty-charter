title: StyleguideRegistration
description: >-
  The registration body of a styleguide: its fields only. A styleguide mints no relationships (its references
  are bare citation strings), so — unlike a directive — this body carries no relationships array; a
  cross-authored edge is registered through PUT /packs/{packId}/relationships. On POST to the collection the id
  is optional (the server answers with Location); on PUT the id is taken from the path. The tooling map is
  carried as ordered {tool, configuration} entries and the structural-lint-config tree as its JSON text,
  matching the read shape.
  A list in this body is never null and holds no null item: a list is sent as an array, [] where it may be empty, and
  an optional one may be left out. A null list, or a null item in one, is refused 422 validation_failed before the body
  is bound, whatever else the body breaks (the detail names the list and the item, counted from 0); a null field inside
  an object item breaks a constraint this schema declares and is refused 400 Bad Request. The body is at most 1 MiB; a
  larger body is refused 422 validation_failed before it is read.
type: object
additionalProperties: false
required:
  - schemaVersion
  - title
  - scope
  - principles
properties:
  id:
    type: string
    description: The styleguide's identity; optional on POST (server-assigned via Location), path-supplied on PUT.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/StyleguideIdentifier.java
      symbol: StyleguideIdentifier.value
  schemaVersion:
    type: string
    description: The schema version the styleguide declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.schemaVersion
  title:
    type: string
    description: The styleguide's title.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.title
  scope:
    type: string
    description: The scope category token (code, docs, architecture, testing, operations, glossary).
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/StyleguideScope.java
      symbol: StyleguideScope.token
  principles:
    type: array
    description: The styleguide's principles, in authored order; must not be empty.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.principles
  patterns:
    type: array
    description: The positive patterns, in authored order; when present, must not be empty.
    items:
      $ref: StyleguidePattern.yaml
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.patterns
  antiPatterns:
    type: array
    description: The anti-patterns, in authored order; when present, must not be empty.
    items:
      $ref: StyleguideAntiPattern.yaml
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.antiPatterns
  tooling:
    type: array
    description: The tooling map as ordered {tool, configuration} entries.
    items:
      $ref: StyleguideToolEntry.yaml
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.tooling
  qualityTest:
    type: ['string', 'null']
    description: The quality test; null when the styleguide declares none.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.qualityTest
  structuralLintConfig:
    type: ['string', 'null']
    description: The structural-lint-config tree as its canonical JSON text; null when the styleguide declares none.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.structuralLintConfig
  appliesToLanguages:
    type: array
    description: The languages the styleguide applies to, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.appliesToLanguages
  references:
    type: array
    description: The bare citation strings, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Styleguide.java
      symbol: Styleguide.references
