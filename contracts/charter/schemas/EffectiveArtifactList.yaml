title: EffectiveArtifactList
description: >-
  The artifacts of the merged closure under an activation, one page at a time (ADR-0020 D7): every artifact with its
  state, so "in force" is state active (operator ruling Q1). The summary counts the whole set and is identical on every
  page; it moved here from Activation (ADR-0059 D5) because it depends on the packs, so it is answered with
  governanceFingerprint and covered by this read's ETag. Items are ordered by kind, then by id in code-point order, and
  paged by a keyset cursor.
type: object
additionalProperties: false
required:
- activationId
- revision
- governanceFingerprint
- summary
- items
- pageInfo
- _links
properties:
  activationId:
    allOf:
    - $ref: ActivationId.yaml
    description: The activation's id.
    x-derived:
      rule: The {activationId} path segment, or the ULID the service minted on POST (ADR-0020 D2, D3).
      inputs:
      - parameters/ActivationId.yaml
  revision:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The activation's revision: sha256: and the hex SHA-256 of the RFC 8785 (JCS) serialization of its canonical
      config.
    x-derived:
      rule: SHA-256 over the JCS serialization of the canonical ActivationConfig.
      inputs:
      - schemas/ActivationConfig.yaml
  governanceFingerprint:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The source fingerprint, as ServiceInfo.sourceFingerprint, of the packs of the activation's closure that this
      answer was computed from; with revision, it ties the answer to both the document and the packs.
    x-derived:
      rule: The source fingerprint of the packs the answer was computed from.
      inputs:
      - schemas/ServiceInfo.yaml#/properties/sourceFingerprint
  summary:
    $ref: ActivationSummary.yaml
  items:
    type: array
    items:
      $ref: EffectiveArtifact.yaml
    description: The artifacts of this page.
    x-derived:
      rule: The effective set of the merged closure, filtered by kind and state and paged by (kind, id).
      inputs:
      - schemas/ActivationConfig.yaml
  pageInfo:
    $ref: ../../_shared/schemas/PageInfo.yaml
  _links:
    $ref: Links.yaml
