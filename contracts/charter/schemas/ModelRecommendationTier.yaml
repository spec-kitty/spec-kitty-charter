      symbol: ModelRecommendationTier.effective
  source:
    type: string
    enum:
    - step
    - request
    description: Where the effective tier comes from, the request's modelTier or the step's model_tier.
    x-source:
      path: service/routing-edge/src/main/java/ai/speckitty/charter/routing/application/ModelRecommendationTier.java
      symbol: ModelRecommendationTier.source
  offer:
    allOf:
    - $ref: CostTier.yaml
    description: The asked step's model_tier, when the step declares one; absent otherwise, and when no step is asked.
    x-source:
      path: service/routing-edge/src/main/java/ai/speckitty/charter/routing/application/ModelRecommendationTier.java
      symbol: ModelRecommendationTier.offer
