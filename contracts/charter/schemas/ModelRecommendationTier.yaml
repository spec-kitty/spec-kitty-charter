title: ModelRecommendationTier
description: >-
  The effective model tier of a recommendation (ADR-0080 decision 12), present when the request asks for a tier or the
  asked step offers one: the request's modelTier (source request), else the step's model_tier (source step). It
  combines with the task type's tierConstraint and replaces neither.
type: object
additionalProperties: false
required:
- effective
- source
properties:
  effective:
    allOf:
    - $ref: CostTier.yaml
    description: The effective tier.
    x-source:
