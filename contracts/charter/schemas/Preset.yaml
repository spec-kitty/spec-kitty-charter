title: Preset
description: >-
  One activation preset of a Charter Pack (presets/<id>.yaml, ADR-0042), as listPackPresets and getPackPreset answer
  it: a named selection of artifacts that applyActivationPreset puts in force. A preset is a pack-level value, not an
  artifact. For each activatable kind it lists, it carries one array, activated<Plural> in camel case, named after the
  file's activated_<plural> key; a kind the preset lists nothing of is left out, never an empty array. Each item says whether it is must-have. The file's schema_version is not answered.
type: object
additionalProperties: false
required:
  - id
  - description
  - _links
properties:
  id:
    type: string
    description: The preset's identity, its file stem; the presetId of its path.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Preset.java
      symbol: Preset.id
  description:
    type: string
    minLength: 1
    description: What applying the preset puts in force.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Preset.java
      symbol: Preset.description
  activatedDirectives:
    type: array
    minItems: 1
    description: >-
      The directives applying the preset selects, in the order the file lists them (activated_directives). Left out when the
      preset lists none.
    items:
