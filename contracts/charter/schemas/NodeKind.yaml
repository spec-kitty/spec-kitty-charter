title: NodeKind
description: >-
  The kind of a DRG node, by its URN token: one per artifact kind, plus action and term. A glossary context's
  token is glossary_context, not its artifact kind's glossary (ADR-0053 decision 13); a term
  (term:<context-id>/<term-id>) is an edge target, never a declared node. Core's retiring glossary node kind is not
  part of this contract. It lists the authored kinds only: a guard and a lifecycle are
  nodes of the graph that no read of this contract names, so no schema typed by NodeKind (EffectiveGraphNode,
  NodeReference) can carry one. A routing catalog (ADR-0080) is listed though no graph declares it and no edge names
  it: it is an activatable artifact, which an activation layers, overrides and reports. Adding guard or lifecycle later is a Breaking change for EffectiveGraphNode,
  NodeReference and every SkippedReport carrier.
type: string
enum:
  - directive
  - tactic
  - styleguide
  - toolguide
  - paradigm
  - procedure
  - agent_profile
  - glossary_context
  - term
  - skill
  - anti_pattern
  - asset
  - template
  - action
  - mission_type
  - step_enhancement
  - routing_catalog
