title: Paradigm
description: >-
  One paradigm of a Charter Pack, as the pack declares it. Its relationships are graph edges, read through
  listArtifactReferences (ADR-0064).
type: object
additionalProperties: false
required:
  - id
  - schemaVersion
  - name
  - summary
  - principles
properties:
  id:
    type: string
    description: The paradigm's identity within its pack.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.id
  schemaVersion:
    type: string
    description: The schema version the paradigm file declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.schemaVersion
  name:
    type: string
    description: The paradigm's name.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.name
  summary:
    type: string
    description: The paradigm's summary.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.summary
  principles:
    type: array
    description: >-
      The paradigm's principles, in the order the author ranks them (ADR-0067); [] when the paradigm states none.
    items:
      $ref: ParadigmPrinciple.yaml
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.principles
