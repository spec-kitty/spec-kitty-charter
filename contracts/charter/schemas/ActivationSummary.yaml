title: ActivationSummary
description: Counts of the activation's artifacts for the offering it was computed from; derived, never stored.
type: object
additionalProperties: false
required:
- active
- inactive
- excluded
- required
- locked
- skipped
properties:
  active:
    type: integer
    minimum: 0
    description: Artifacts in force.
    x-derived:
      rule: The count of effective artifacts in state active.
      inputs:
      - schemas/ActivationConfig.yaml
  inactive:
    type: integer
    minimum: 0
    description: >-
      Artifacts the offering holds that are not in force and not excluded, a denied artifact that the enhancer or binding
      rule prunes included.
    x-derived:
      rule: The count in state inactive.
      inputs:
      - schemas/ActivationConfig.yaml
  excluded:
    type: integer
    minimum: 0
    description: >-
      Artifacts deactivated by the document, those whose reason is deactivated. A denied artifact that the enhancer
      rule or the mission type binding prunes is inactive, not excluded (E9).
    x-derived:
      rule: The count in state excluded.
      inputs:
      - schemas/ActivationConfig.yaml
  required:
    type: integer
    minimum: 0
    description: >-
      Artifacts a governing preset requires or a pack locks (the artifact's required member is true), in force or
      satisfied by an active override of them. Not "always active": a requirement is satisfied by the artifact or an
      override of it, never by an enhancement, and one that is an enhancer with no target in force, or is bound to a
      mission type not in force, counts in neither.
    x-derived:
      rule: The count of required artifacts, in force or satisfied.
      inputs:
      - schemas/ActivationConfig.yaml
  locked:
    type: integer
    minimum: 0
    description: >-
      Artifacts a pack locks, whatever their state: a locked artifact is in force unless it is an enhancer with no target
      in force or is bound to a mission type not in force (E9).
    x-derived:
      rule: The count of locked artifacts.
      inputs:
      - schemas/ActivationConfig.yaml
  skipped:
    type: integer
    minimum: 0
    description: >-
      Entries across the buckets of the skipped report. Each artifact is counted once: a required or locked artifact
      that the enhancer rule or the binding prunes is listed in requiredNotInForce only.
    x-derived:
      rule: The count of entries of the skipped report.
      inputs:
      - schemas/ActivationConfig.yaml
x-derived:
  rule: Counted over the effective set of the activation's config and the offering; never stored.
  inputs:
  - schemas/ActivationConfig.yaml
