title: ArtifactKindToken
description: >-
  An artifact kind this service serves, as its lower-case token: tactic, directive, styleguide,
  paradigm or toolguide, the served-kind order of a list. Other kernel kinds (procedure,
  agent_profile and the rest) are not served yet. It types only the request's ?kind= filter; a
  response's kind is an open slug, so a kind served later is additive for a client.
type: string
enum:
  - tactic
  - directive
  - styleguide
  - paradigm
  - toolguide
