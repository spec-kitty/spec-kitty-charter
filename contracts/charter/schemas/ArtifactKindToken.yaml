title: ArtifactKindToken
description: >-
  An artifact kind this service lists, as its lower-case token: tactic, directive, styleguide,
  paradigm, toolguide or agent_profile, the served-kind order of a list. An agent_profile is read
  whole by getPackAgentProfile, not by the templated item read. Other kernel kinds (procedure and
  the rest) are not served yet. It types only the request's ?kind= filter; a response's kind is an
  open slug, so a kind served later is additive for a client.
type: string
enum:
  - tactic
  - directive
  - styleguide
  - paradigm
  - toolguide
  - agent_profile
