title: Directive
description: One directive of a Charter Pack, as the pack declares it, with its relationships populated.
type: object
additionalProperties: false
required:
  - id
  - schemaVersion
  - title
  - intent
  - enforcement
  - scope
  - procedures
  - integrityRules
  - validationCriteria
  - explicitAllowances
  - references
  - relationships
properties:
  id:
    type: string
    description: The directive's identity within its pack.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.id
  schemaVersion:
    type: string
    description: The schema version the directive file declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.schemaVersion
  title:
    type: string
    description: The directive's title.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.title
  intent:
    type: string
