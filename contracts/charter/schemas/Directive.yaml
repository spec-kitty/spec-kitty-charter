title: Directive
description: >-
  One directive of a Charter Pack, as the pack declares it. Its relationships are graph edges, read through
  listArtifactReferences (ADR-0063).
type: object
additionalProperties: false
required:
  - id
  - schemaVersion
  - title
  - intent
  - enforcement
  - scope
  - integrityRules
  - validationCriteria
  - explicitAllowances
properties:
  id:
    type: string
    description: The directive's identity within its pack.
