title: OverriddenArtifact
description: >-
  An artifact active overrides concern, listed once, and in overriddenBy every active artifact whose overrides edge
  reaches it. In the overridden bucket the overrides are applied and the artifact is out of force; in overrideNotApplied
  the target is locked, so it and its overriders stay in force.
type: object
additionalProperties: false
required:
- kind
- artifactId
- overriddenBy
properties:
  kind:
    allOf:
    - $ref: ActivatableKind.yaml
    description: The kind of the overridden artifact.
    x-derived:
      rule: The kind of the target of the overrides edge.
      inputs:
      - schemas/ActivationConfig.yaml
  artifactId:
    allOf:
    - $ref: ArtifactId.yaml
    description: The declared id of the overridden artifact.
    x-derived:
      rule: The id of the target of the overrides edge.
      inputs:
      - schemas/ActivationConfig.yaml
  overriddenBy:
    type: array
    minItems: 1
    items:
      $ref: ArtifactReference.yaml
    description: >-
      Every active artifact whose overrides edge reaches the artifact (in the overridden bucket directly or through a
      chain), sorted by the level of the pack that holds the version in force of each (built-in, then org, then
      project), then by full URN in Unicode code point order (operator ruling of 2026-11-12 on #439).
    x-derived:
      rule: >-
        The artifacts of the effective set with an overrides edge to the artifact (rules E9, E14, C27), sorted by the
        level of their winning pack, then by URN.
      inputs:
      - schemas/ActivationConfig.yaml
