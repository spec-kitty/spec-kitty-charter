title: ParadigmRegistration
description: >-
  The registration body of a paradigm: its fields only. A paradigm carries no relationships: every relationship is
  authored in the pack's graph documents and registered through PUT /packs/{packId}/relationships, the only
  operation that writes one (ADR-0064). On POST to the collection the id is optional (the server answers with
  Location); on PUT the id is taken from the path.
  A member this schema does not declare is refused 422 validation_failed, naming the member, before the body is bound
  and nothing is written (ADR-0064).
  A list in this body is never null and holds no null item: a list is sent as an array, [] where it may be empty, and
  an optional one may be left out. A null list, or a null item in one, is refused 422 validation_failed before the body
  is bound, whatever else the body breaks (the detail names the list and the item, counted from 0); a null field inside
  an object item breaks a constraint this schema declares and is refused 400 Bad Request. The body is at most 1 MiB; a
  larger body is refused 422 validation_failed before it is read.
type: object
additionalProperties: false
required:
  - schemaVersion
  - name
  - summary
properties:
  id:
    type: string
    maxLength: 128
    description: The paradigm's identity; optional on POST (server-assigned via Location), path-supplied on PUT.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/ParadigmIdentifier.java
      symbol: ParadigmIdentifier.value
  schemaVersion:
    type: string
    description: The schema version the paradigm declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.schemaVersion
  name:
    type: string
    description: The paradigm's name.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.name
  summary:
    type: string
    description: The paradigm's summary.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.summary
  principles:
    type: array
    minItems: 1
    description: >-
      The paradigm's principles, in the order the author ranks them (ADR-0067). Optional; when sent, at least one,
      with names unique ignoring case and surrounding whitespace. A repeated name or a blank name or description is
      refused 422 validation_failed and nothing is written.
    items:
      $ref: Principle.yaml
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Paradigm.java
      symbol: Paradigm.principles
