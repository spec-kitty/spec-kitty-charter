title: MissionStep
description: >-
  One step of a mission type (the action action:<type>/<id>), from its steps or its on_demand_steps: its stored
  fields, its prompt and guidelines files as stored, byte for byte (slot markers such as
  <!-- spdd:reasons-block:start --> included; the composed prompt is not this read's), its expected input and output
  artifacts, and its substeps.
  _links holds self, mission-type (the type's read) and, on each expected output artifact whose templatePath names a stored skeleton of the type, skeleton.
  Under an activation (getEffectiveMissionStep) it holds profile-selection too: the step's profile selection under the
  same activation (selectAgentProfileForStep), which answers the profile of the role the step names.
type: object
additionalProperties: false
required:
  - id
  - title
  - onDemand
  - expectedInputArtifacts
  - expectedOutputArtifacts
  - substeps
  - _links
properties:
  id:
    type: string
    description: The step's id, unique across the type's steps and on-demand steps.
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.id
  title:
    type: string
    description: The step's title.
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.title
  description:
    type: string
    description: The step's one-line description, at most 160 characters; absent when the step declares none.
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.description
  role:
    type: string
    pattern: '^(?:(?:[a-fh-z][a-z0-9]*|g(?:[a-df-z0-9][a-z0-9]*|e(?:[a-mo-z0-9][a-z0-9]*|n(?:[a-df-z0-9][a-z0-9]*|e(?:[a-qs-z0-9][a-z0-9]*|r(?:[a-hj-z0-9][a-z0-9]*|i(?:[abd-z0-9][a-z0-9]*|c[a-z0-9]+)?)?)?)?)?)?)(?:-[a-z0-9]+)*|generic(?:-[a-z0-9]+)+)$'
    maxLength: 64
    description: >-
      The role that runs the step, a role token (a letter-first kebab slug) of at most 64 characters such as implementer; absent when
      none is declared. Never the reserved generic, which marks a fallback profile and fits no role a step asks for
      (ADR-0068 decision 4); the pattern spells that exclusion without a lookahead, as selectAgentProfile's role does.
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.role
  modelTier:
    allOf:
      - $ref: CostTier.yaml
    description: >-
      The cost tier of model the step advises (ADR-0080 decision 12): a recommendation the client may override, which
      the model recommendation reports and flags its catalog candidates against. Absent when the step declares none.
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.modelTier
  onDemand:
    type: boolean
    description: True for a step of the type's on_demand_steps, false for one of its steps.
    x-derived:
      rule: True exactly when the step is one of MissionType.onDemandSteps.
      inputs:
        - schemas/MissionType.yaml#/properties/steps
  prompt:
    type: string
    description: >-
      The stored text of the step's prompt file, steps/<id>.prompt.md beside the mission type, byte for byte as
      UTF-8, its frontmatter included. Absent when the step has no prompt file, never an empty string.
    x-derived:
      rule: The stored bytes of the step's prompt_path companion file, as UTF-8 text; not the parsed StepDocument.
      inputs:
        - schemas/MissionStep.yaml#/properties/id
  guidelines:
    type: string
    description: >-
      The stored text of the step's guidelines file, steps/<id>.guidelines.md beside the mission type, byte for
      byte as UTF-8. Absent when the step has no guidelines file, never an empty string.
    x-derived:
      rule: The stored bytes of the step's guidelines_path companion file, as UTF-8 text; not the parsed StepDocument.
      inputs:
        - schemas/MissionStep.yaml#/properties/id
  expectedInputArtifacts:
    type: array
    description: The artifacts the step reads, in stored order; empty when the step declares none.
    items:
      $ref: MissionExpectedInput.yaml
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.expectedInputArtifacts
  expectedOutputArtifacts:
    type: array
    description: >-
      The artifacts the step produces, in stored order, each linked to its skeleton when its templatePath names a
      stored skeleton of the type; empty when the step declares none.
    items:
      $ref: MissionExpectedArtifact.yaml
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.expectedOutputArtifacts
  substeps:
    type: array
    description: >-
      The step's substeps, in stored order: a flat list, one level deep; empty when the step declares none. Each
      delegation candidate is linked to its read when the scope holds it (MissionSubstepDelegationCandidate).
    items:
      $ref: MissionSubstep.yaml
    x-source:
      path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
      symbol: MissionStep.substeps
  _links:
    $ref: Links.yaml
x-source:
  path: service/missions/src/main/java/ai/speckitty/charter/missions/domain/MissionStep.java
  symbol: MissionStep
