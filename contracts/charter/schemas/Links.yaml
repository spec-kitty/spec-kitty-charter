title: Links
description: >-
  The relations of an answer: a map from a relation name to a Link. The keys are open, so a new relation is additive;
  a client ignores a relation it does not know (ADR-0019 D3). No relation points at an operation that is not built.
  self is always the answered resource: the activation for an Activation or an ActivationChange, the report, page, graph or context for an effective read.
type: object
additionalProperties:
  $ref: Link.yaml
x-derived:
  rule: Built by the REST adapter from the request and the operations that are built (ADR-0019 D3).
  inputs:
  - openapi.yaml#/paths
