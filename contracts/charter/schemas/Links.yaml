title: Links
description: >-
  The links of a resource: an open map from a relation key in the relation table of
  docs/development/hypermedia-hateoas.md to a Link. Clients must tolerate a key they do not know.
  No relation points at an operation that is not built (ADR-0019 D3, ADR-0020 D8). self is always the
  answered resource: the activation for an Activation or an ActivationChange, the report, page, graph or
  context for an effective read.
type: object
additionalProperties:
  $ref: Link.yaml
x-derived:
  rule: >-
    The links the server writes for the answer, each keyed by its relation and built from the server
    prefix and the paths of the operations the relations name.
  inputs:
    - openapi.yaml#/servers
    - openapi.yaml#/paths
