title: SkippedReport
description: >-
  What a cascade or the effective set left out, and why (ADR-0013 D4, ADR-0020 D6). Every list may be empty, and each
  is sorted by kind and id, so the answer is byte-stable. At read (getActivationSkippedReport, and the skipped of an
  action context) each artifact that is not in force appears once, in the bucket of the first rule that decided it (a
  required or locked artifact that the enhancer rule or the binding prunes, once, in requiredNotInForce);
  denyNotApplied and overrideNotApplied list rules that were not applied, not artifacts out of force. A write's
  ActivationChange.skipped answers the read buckets as [].
type: object
additionalProperties: false
required:
- skippedByScope
- skippedDeactivated
- unreachedBehindDeactivated
- skippedShared
- staleIds
- denyNotApplied
- languageFiltered
- overridden
- missionTypeNotInForce
- overrideNotApplied
- enhancedTargetNotInForce
- pinNotHeld
- requiredNotHeld
- requiredNotInForce
properties:
  skippedByScope:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      The write report of the cascade scope: artifacts the walk reached that lie outside the cascade's kinds. Always
      empty at read (decision DM-01M6RN5MTWC98PXEVJNFQSRRJX): the kind gate is gone, so a read never leaves an artifact
      out for its kind.
    x-derived:
      rule: The reached artifacts whose kind is outside the cascade scope.
      inputs:
      - schemas/ActivationConfig.yaml
  skippedDeactivated:
    type: array
    items:
      $ref: SkippedDeactivated.yaml
    description: >-
      Artifacts the walk reached and skipped because they are deactivated. At read, the artifacts the document selects
      and denies: viaRequires is false and requiredBy is [].
    x-derived:
      rule: The reached artifacts in deactivated.
      inputs:
      - schemas/ActivationConfig.yaml
  unreachedBehindDeactivated:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      Artifacts reachable only through a deactivated artifact, so the walk never reached them. A write's report; always
      empty at read.
    x-derived:
      rule: The artifacts behind a skipped deactivated artifact.
      inputs:
      - schemas/ActivationConfig.yaml
  skippedShared:
    type: array
    items:
      $ref: SharedSkip.yaml
    description: >-
      For a cascading deactivate: artifacts kept because an active artifact still references them. A write's report;
      always empty at read.
    x-derived:
      rule: The reached artifacts another active artifact references.
      inputs:
      - schemas/ActivationConfig.yaml
  staleIds:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      The ids in selected or deactivated, mission types included, that the merged closure does not hold (ADR-0059 D4):
      a pack change removed them. The next write drops them.
    x-derived:
      rule: The ids of the document that no pack of the merged closure holds.
      inputs:
      - schemas/ActivationConfig.yaml
  denyNotApplied:
    type: array
    items:
      $ref: DenyNotApplied.yaml
    description: >-
      The deny entries not applied (ADR-0013 D2): on a locked artifact, or on a required one that nothing else
      satisfies. The artifact stays in force.
    x-derived:
      rule: The entries of deactivated that name a locked artifact or a required artifact no active override satisfies.
      inputs:
      - schemas/ActivationConfig.yaml
  languageFiltered:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      The selected artifacts the language filter excludes. The filter applies at read only, and a document with no
      languages filters nothing (#408 ruling 2).
    x-derived:
      rule: The selected artifacts whose applies_to_languages list holds none of the document's languages.
      inputs:
      - schemas/ActivationConfig.yaml
  overridden:
    type: array
    items:
      $ref: OverriddenArtifact.yaml
    description: >-
      The artifacts hidden by an active overrides edge, each once, with every active artifact that overrides it, by
      level then URN (#439).
    x-derived:
      rule: The targets of the overrides edges from active artifacts, a locked target excepted.
      inputs:
      - schemas/ActivationConfig.yaml
  missionTypeNotInForce:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      The selected artifacts bound to a mission type that is not in force. In an action context this bucket is replaced:
      it holds the requested mission type itself (kind mission_type) when that is not in force, and is empty when it
      is, so an artifact bound to another mission type that is not in force is absent there, unlike the activation-wide
      report.
    x-derived:
      rule: The selected artifacts whose mission type is not in force.
      inputs:
      - schemas/ActivationConfig.yaml
  overrideNotApplied:
    type: array
    items:
      $ref: OverriddenArtifact.yaml
    description: >-
      An override of a locked artifact, not applied: the target stays in force and so do the overriding artifacts. Each
      locked target is listed once, with every active artifact that tried to override it, by level then URN (#439).
    x-derived:
      rule: The active overrides edges whose target is locked.
      inputs:
      - schemas/ActivationConfig.yaml
  enhancedTargetNotInForce:
    type: array
    items:
      $ref: EnhancerWithoutTarget.yaml
    description: >-
      The selected enhancers none of whose targets is in force, each with its targets. An enhancer does not stand on its
      own. A target is a NodeReference: it may be a step of a mission type (kind action, id <missionType>/<step>), which
      is never in force as an artifact, so an enhancer of a step the closure does not hold names it here; an enhancer of
      a step of a mission type that is not in force is listed in missionTypeNotInForce instead (in an action context that
      bucket holds the requested mission type only, so such an enhancer is listed in neither there).
    x-derived:
      rule: The selected enhancers whose enhances targets are all out of force.
      inputs:
      - schemas/ActivationConfig.yaml
  pinNotHeld:
    type: array
    items:
      $ref: PackPin.yaml
    description: >-
      The version pins of the document that no pack holds (B1), each as it was stored. A write drops such a pin into
      droppedPins; a read reports it.
    x-derived:
      rule: The packs entries whose version no pack of the activation's closure holds.
      inputs:
      - schemas/ActivationConfig.yaml
  requiredNotHeld:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      The must-have items of a governing preset that no pack of the closure holds (A10). They are not on the required
      floor.
    x-derived:
      rule: The must-have items of the governing presets that the merged closure does not hold.
      inputs:
      - schemas/ActivationConfig.yaml
  requiredNotInForce:
    type: array
    items:
      $ref: RequiredNotInForce.yaml
    description: >-
      The required artifacts that cannot stand in force: an enhancer none of whose targets is in force, or an artifact
      bound to a mission type not in force. Each is also out of force in the list, with required true. Such an artifact
      is listed once, here, and not again in enhancedTargetNotInForce or missionTypeNotInForce. Only an artifact an
      activation can select is listed (an ArtifactReference-kind): no preset or pack lock can name a step, so the
      required floor holds activatable kinds only and this list never names one.
    x-derived:
      rule: The required artifacts kept out by the enhancer rule or by the mission type binding.
      inputs:
      - schemas/ActivationConfig.yaml
  skippedByDepth:
    type: array
    items:
      $ref: ArtifactReference.yaml
    description: >-
      Present only when the request sent a cascade and a depth (IC-21, FR-043): the suggests targets one hop past the bound, the next
      frontier of the walk, so a client knows whether a deeper depth would reach more. Absent when no depth was sent or there was no cascade;
      an empty list says the bound cut nothing.
    x-derived:
      rule: The suggests targets the walk would cross at one hop more than depth, not yet reached.
      inputs:
      - schemas/ActivationConfig.yaml
x-derived:
  rule: The skipped report of the walk or the effective set (ADR-0013 D4).
  inputs:
  - schemas/ActivationConfig.yaml
