title: Relation
description: >-
  The relation of a DRG edge. Meanings are in docs/architecture/logical-model.md. Each relation names
  the source and target kinds it may connect (ADR-0064 decision 13); impacts, replaces and delegates_to
  are retired (slice F). A tension between two rules is not a value of this enum (not a
  relation type of the service): the service holds a
  graph document's in_tension_with edge as a tension beside the relationships,
  and does not answer it as a relationship (ADR-0045). reconciles_tension points at the sides of a
  pair joined by a tension.
type: string
enum:
  - requires
  - suggests
  - applies
  - scope
  - vocabulary
  - instantiates
  - refines
  - specializes_from
  - enhances
  - overrides
  - reconciles_tension
  - rejects
