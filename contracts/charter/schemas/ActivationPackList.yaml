title: ActivationPackList
description: >-
  The packs an activation builds on: its composition closure, in dependency order (dependencies and parent_pack parents first); items reuse the offering's pack
  shape (OfferingPack, with ResolvedDependency for dependsOn). _links holds self, the closure read.
type: object
additionalProperties: false
required:
- packs
- _links
properties:
  packs:
    type: array
    description: >-
      Every pack of the closure, in dependency order: dependencies and `parent_pack` parents before the packs that need them, each level
      contiguous, as the offering orders them. A document that names packs has at least one, so the list is empty
      only for a document without packs on a service that has no configured pack: without packs the closure is every
      configured pack.
    items:
      $ref: OfferingPack.yaml
    x-derived:
      rule: >-
        The depends_on and parent_pack closure rooted at the document's packs (every configured pack when it has none), composed and
        ordered as the offering.
      inputs:
      - schemas/ActivationConfig.yaml#/properties/packs
      - schemas/Offering.yaml
  _links:
    $ref: Links.yaml
