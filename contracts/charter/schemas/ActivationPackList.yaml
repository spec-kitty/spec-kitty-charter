title: ActivationPackList
description: >-
  The packs an activation builds on: its composition closure, in dependency order; items reuse the offering's pack
  shape (OfferingPack, with ResolvedDependency for dependsOn). _links holds self, the closure read.
type: object
additionalProperties: false
required:
- packs
- _links
properties:
  packs:
    type: array
    description: >-
      Every pack of the closure, in dependency order: dependencies before the packs that need them, each level
      contiguous, as the offering orders them. Never empty: a document names at least one pack, and without packs
      the closure is every configured pack.
    items:
      $ref: OfferingPack.yaml
    x-derived:
      rule: >-
        The depends_on closure rooted at the document's packs (every configured pack when it has none), composed and
        ordered as the offering.
      inputs:
      - schemas/ActivationConfig.yaml#/properties/packs
      - schemas/Offering.yaml
  _links:
    $ref: Links.yaml
