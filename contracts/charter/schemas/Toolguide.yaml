title: Toolguide
description: One toolguide of a Charter Pack, as the pack declares it. A toolguide mints no relationships.
type: object
additionalProperties: false
required:
  - id
  - schemaVersion
  - tool
  - title
  - guidePath
  - summary
  - commands
  - appliesToLanguages
  - lastUpdated
  - references
properties:
  id:
    type: string
    description: The toolguide's identity within its pack.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.id
  schemaVersion:
    type: string
    description: The schema version the toolguide file declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.schemaVersion
  tool:
    type: string
    description: The tool the guide is about.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.tool
  title:
    type: string
    description: The toolguide's title.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.title
  guidePath:
    type: string
    description: The relative *.md path of the guide body.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.guidePath
  summary:
    type: string
    description: The toolguide's summary.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.summary
  commands:
    type: array
    description: The commands the toolguide lists, in authored order with duplicates kept.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.commands
  appliesToLanguages:
    type: array
    description: The languages the toolguide applies to, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.appliesToLanguages
  lastUpdated:
    type: ['string', 'null']
    description: The last-updated text; null when the file declares none.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.lastUpdated
  references:
    type: array
    description: The bare citation strings the toolguide points at, in authored order with duplicates kept.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Toolguide.java
      symbol: Toolguide.references
