title: RelationRow
description: >-
  One relation of the model, with the kinds it may connect (ADR-0064 decision 13). The tension between two rules is a
  relation of its own pair class (ADR-0028, ADR-0045 decision 1), so its row is tension, held as a tension; every other
  row is held as a relationship.
type: object
additionalProperties: false
required:
  - relation
  - heldAs
  - directed
  - derived
  - endpoints
properties:
  relation:
    description: The relation's token, as graph documents write it.
    allOf:
      - $ref: TaxonomyRelation.yaml
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.token
  heldAs:
    type: string
    enum:
      - relationship
      - tension
    description: >-
      How the service holds an edge of the relation, the pair class its identity counts it in: tension for tension,
      which stands beside the one structural relationship of its pair; relationship for every other relation.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.PairClass
  directed:
    type: boolean
    description: >-
      Whether the relation holds from source to target only; false for tension, where the two rules pull against each
      other and either orientation states the same tension.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.directionality
  derived:
    type: boolean
    description: >-
      Whether the relation is only ever derived from an artifact's own field and never authored as an edge; true only
      for implemented_by.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.derived
  endpoints:
    type: array
    minItems: 1
    description: >-
      The source and target kinds an edge of the relation may connect, sources in kind order and, under each source,
      targets in kind order. An edge whose kinds are not listed is refused relationship_endpoint_not_allowed.
    items:
      $ref: EndpointPair.yaml
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.endpoints
x-source:
  path: service/packs/src/main/java/ai/speckitty/charter/packs/application/KindTaxonomyReadService.java
  symbol: KindTaxonomyReadService.RelationFacts
