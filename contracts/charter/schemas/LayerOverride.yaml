title: LayerOverride
description: >-
  One version of an artifact that a later level replaced whole (ADR-0059 D3): the artifact, the version in force
  (winner) and the version it replaced (loser). There is one record per losing version, so an artifact replaced at two
  levels has two. Only the overrides of a node of the graph are listed, which are the artifacts in force and the held
  steps whose mission type is in force; a template, an asset, a guard or a lifecycle is no node of the graph, so an
  override of one is not listed.
type: object
additionalProperties: false
required:
- artifact
- winner
- loser
properties:
  artifact:
    allOf:
    - $ref: Urn.yaml
    description: The identity of the artifact whose version a later level replaced.
    x-derived:
      rule: The URN the layer merge compared across levels.
      inputs:
      - schemas/ActivationConfig.yaml
  winner:
    $ref: LayerOverrideSide.yaml
  loser:
    $ref: LayerOverrideSide.yaml
x-derived:
  rule: A version of a node of the graph that the layer merge replaced.
  inputs:
  - schemas/ActivationConfig.yaml
