title: EffectiveArtifactReason
description: >-
  Why an artifact has its state. One reason per artifact, the first rule that applies: locked (active); the language
  filter (language_filtered); a mission type not in force (mission_type_not_in_force); a deny entry (deactivated, state
  excluded); not selected (not_selected); the target of an override from an active artifact (overridden); an enhancer
  none of whose targets is in force (enhanced_target_not_in_force); otherwise selected. A required artifact that
  nothing else satisfies is put in force with the reason required, and a required one that cannot stand in force keeps
  the reason that keeps it out (enhanced_target_not_in_force or mission_type_not_in_force). The states: active for
  selected, required and locked; excluded for deactivated; inactive for the rest.
type: string
enum:
- selected
- required
- locked
- deactivated
- not_selected
- language_filtered
- overridden
- mission_type_not_in_force
- enhanced_target_not_in_force
