title: EffectiveArtifactReason
description: >-
  Why an artifact has its state. One reason per artifact, the first rule that applies (E9, in this order): in force
  (locked, required or selected); a mission type not in force (mission_type_not_in_force); an enhancer none of whose
  targets is in force (enhanced_target_not_in_force); the language filter (language_filtered); a deny entry
  (deactivated); the target of an override from an active artifact, when the artifact is selected (overridden);
  otherwise not_selected. A required artifact that nothing else satisfies is put in force with the reason required, and
  a required one that cannot stand in force keeps the reason that keeps it out (mission_type_not_in_force or
  enhanced_target_not_in_force). The states: active for selected, required and locked; excluded for deactivated only;
  inactive for the rest, so a denied artifact that the enhancer or binding rule prunes is inactive, not excluded.
type: string
enum:
- selected
- required
- locked
- deactivated
- not_selected
- language_filtered
- overridden
- mission_type_not_in_force
- enhanced_target_not_in_force
