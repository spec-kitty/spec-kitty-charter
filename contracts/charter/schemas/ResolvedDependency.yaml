title: ResolvedDependency
description: >-
  One dependency the compose resolved (FR-020): the pack the descriptor's depends_on names, the range it
  declared and the version the held pack satisfied. The facts are derived from the resolver's closure,
  never authored: no write path carries them.
type: object
additionalProperties: false
required:
  - descriptorPackId
  - range
  - version
properties:
  descriptorPackId:
    type: string
    minLength: 1
    maxLength: 64
    description: The depended-on pack's pack_id, as the depending pack.yaml's depends_on names it. The same identity as descriptorPackId of the offering entry it points at, so a client joins an edge to its entry by equal values.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/application/ResolvedEdge.java
      symbol: ResolvedEdge.to
  range:
    type: string
    minLength: 1
    maxLength: 256
    description: The PEP 440 version-specifier set the descriptor declared for the dependency.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/application/ResolvedEdge.java
      symbol: ResolvedEdge.range
  version:
    type: string
    minLength: 1
    maxLength: 64
    description: The held pack_version that satisfied the declared range.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/application/ResolvedEdge.java
      symbol: ResolvedEdge.version
