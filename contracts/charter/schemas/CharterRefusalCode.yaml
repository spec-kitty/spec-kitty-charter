title: CharterRefusalCode
description: >-
  Why the charter refused a read. Codes are part of the contract; consumers branch on them,
  never on the title. Codes are snake_case on the wire; the integration seam in core maps them
  to core's own spellings. mission_type_not_found, action_not_found, pack_not_found and tactic_not_found are 404; every other
  code is 500. pack_not_found means the identifier matches no configured pack, neither by its
  configured name nor by the pack_id its pack.yaml declares. A missing or invalid pack.yaml never
  refuses a tactic read: the identifier lookup skips that pack. A configured pack whose directory is
  missing, or a pack with an unreadable file or a directory that cannot be listed, is pack_unreadable
  (500) on every read, because the first digest covers every configured pack. A change to pack.yaml
  during a read is stale_input, because pack.yaml is digested. internal_error refuses a failure no
  other code names; its detail is a generic sentence that says nothing about the failure, so every
  500 is a refusal.

  stale_input is raised: the packs or the project configuration changed while the answer was computed,
  so the answer and the Charter-Source-Fingerprint it would report might disagree. Every built read (the
  service info and both tactic reads) digests its inputs twice and refuses on a difference, or when the
  second digest cannot be taken, including when the load itself refused (a pack_not_found or
  tactic_not_found whose inputs changed meanwhile is stale_input). The read may be retried. A change made
  after the second digest, or one reverted between the two, goes unseen.

  mission_type_not_found and action_not_found are no longer raised: the action-context operation that
  answered them is gone. pack_level_mismatch and drg_schema_error are no longer raised: no operation
  loads and judges a pack's graph any more. All four values stay in the enum so that the contract
  keeps accepting them.

  One code is reserved for the work that raises it, so that adding it is no breaking change (ADR-0009):
  governance_policy_violation will refuse an offering in which a lower-tier pack breaks the mutability
  policy of the pack that owns an artifact (the mutability-policy epic #55, ADR-0012, steps #57 to
  #61). No operation of this version raises it. Its scenario is
  a declaration pin, not behavior: it asserts only what the x-refusal map below declares, and a unit test of
  the service fails when any main class other than the enum and its title mapping names the code.

  x-refusal declares, for every code, the HTTP status it is answered with, whether the read may be retried,
  and whether an operation of this version raises it (raised). Clients and the contract scenarios read it.

  How a consumer dispatches on a non-2xx answer. A body with a code is a charter refusal, and the
  code says why. A body without a code is a transport or routing failure (an unknown path, a
  representation the operation does not have, a method the path does not have, a request the
  server rejected before routing, a request the service refused as unauthorized (401) or
  forbidden (403) before routing it) and says nothing about the charter. internal_error is a fault of
  the service and may be retried, and so may stale_input, whose inputs changed during the read;
  every other code is a deterministic refusal, and the same read is refused the same way again
  until the request or the configured packs change.

  unresolved_edge_endpoint is no longer raised: a graph edge endpoint is a URN, and an endpoint
  that is not one is refused as drg_schema_error. The value stays in the enum so that the
  contract keeps accepting it.
type: string
enum:
  - mission_type_not_found
  - action_not_found
  - pack_level_mismatch
  - pack_unreadable
  - drg_schema_error
  - unresolved_edge_endpoint
  - internal_error
  - governance_policy_violation
  - stale_input
  - pack_not_found
  - tactic_not_found
x-refusal:
  mission_type_not_found:
    status: 404
    retryable: false
    raised: false
  action_not_found:
    status: 404
    retryable: false
    raised: false
  pack_level_mismatch:
    status: 500
    retryable: false
    raised: false
  pack_unreadable:
    status: 500
    retryable: false
    raised: true
  drg_schema_error:
    status: 500
    retryable: false
    raised: false
  unresolved_edge_endpoint:
    status: 500
    retryable: false
    raised: false
  internal_error:
    status: 500
    retryable: true
    raised: true
  governance_policy_violation:
    status: 500
    retryable: false
    raised: false
  stale_input:
    status: 500
    retryable: true
    raised: true
  pack_not_found:
    status: 404
    retryable: false
    raised: true
  tactic_not_found:
    status: 404
    retryable: false
    raised: true
