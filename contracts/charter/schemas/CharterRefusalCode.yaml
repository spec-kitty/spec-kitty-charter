title: CharterRefusalCode
description: >-
  Why the charter refused a request. Codes are part of the contract; consumers branch on them,
  never on the title. Codes are snake_case on the wire; the integration seam in core maps them
  to core's own spellings. mission_type_not_found, action_not_found, pack_not_found,
  tactic_not_found, directive_not_found, styleguide_not_found, paradigm_not_found, toolguide_not_found,
  kind_not_found, activation_not_found, artifact_not_found, preset_not_found, mission_step_contract_not_found,
  skeleton_not_found and pack_document_not_found are 404; validation_failed and
  activation_invalid are 422; registration_conflict, governance_policy_violation, artifact_required,
  artifact_locked and mission_type_not_in_force are 409; every other code is 500, but the pack registration codes below. x-refusal below gives each
  code's status. pack_not_found means the identifier matches no configured pack, neither by its
  configured name nor by the pack_id its pack.yaml declares. kind_not_found means the path names an
  artifact kind this service does not serve (any token but tactic, directive, styleguide, paradigm,
  toolguide, procedure, agent_profile and mission_step_contract; a mission_type item is read by getPackMissionType), on the generic artifact item read, listArtifactReferences, deletePackArtifact and getEffectiveArtifact,
  the last three over the listed kinds, agent_profile, mission_type and mission_step_contract included; the pack (or the activation) is judged first, so an unknown pack
  with an unknown kind is pack_not_found. A configured pack whose pack.yaml is
  missing or invalid is pack_unreadable (500) on the offering and on every artifact read (operator
  ruling of 2026-10-31). A configured pack whose directory is missing, or a pack holding a file the fingerprint covers that cannot be read or a directory that
  cannot be listed, is pack_unreadable (500) on every read, because the first digest covers every configured pack. A change to pack.yaml
  during a read is stale_input, because pack.yaml is digested. internal_error refuses a failure no
  other code names; its detail is a generic sentence that says nothing about the failure, so every
  500 is a refusal.

  stale_input is raised: the packs or the project configuration changed while the answer was computed,
  so the answer and the Charter-Source-Fingerprint it would report might disagree. Every verified read (the
  service info, the offering, and the artifact list and item) digests its inputs twice and refuses on a
  difference, or when the second digest cannot be taken, including when the load itself refused (a
  pack_not_found or an artifact's not-found code whose inputs changed meanwhile is stale_input). The read may be retried. A change made
  after the second digest, or one reverted between the two, goes unseen.

  mission_type_not_found is raised again, by the select and the unselect of an activation for kind
  mission_type, when the path names a mission type the activation's closure does not hold, and by the effective
  action context (getEffectiveActionContext), which answers it with action_not_found too when the path names an action
  the merged closure does not hold for that mission type. Both are raised by the mission type reads too
  (getPackMissionType, getPackMissionStep, getPackMissionSkeleton and their activation counterparts
  getEffectiveMissionType, getEffectiveMissionStep and getEffectiveMissionSkeleton): mission_type_not_found for a
  mission type the pack or the activation's merged closure does not hold, after the pack or the activation is judged,
  and action_not_found by the step reads for a step the type does not hold, since a step is
  the action action:<type>/<step>. The references read of a mission_type answers mission_type_not_found as the
  not-found code of its kind. mission_step_contract_not_found (404) is the not-found code of kind
  mission_step_contract on the generic item and references reads, and skeleton_not_found (404) is answered by the
  skeleton reads for a name that does not decode to a skeleton of the type. pack_level_mismatch is no longer raised: no operation
  loads and judges a pack's level any more. drg_schema_error is raised as a violation code of a refused
  registration (validation_failed), as the definition of raised below counts it: a graph document (a root
  *.graph.yaml shard or drg/fragment.yaml) that cannot be read, breaks its schema or breaks a graph rule (a
  fragment node whose body_path leaves the pack root, #254) is a violation per fault at its pack-relative file, and a registration lists every such fault beside the pack's other faults, not the first
  only. pack_level_mismatch stays in the enum so that the contract keeps accepting it.

  governance_policy_violation (409) is raised by the registration writes: a write the mutability level of
  the pack that owns its target does not permit is refused with it (ADR-0012, the mutability-policy epic
  #55). An artifact no policy names is open, and open permits every write. Each pack's policy.yaml is read, per
  pack along the composition closure of the pack written (ADR-0063); no open pack ships one yet, so every target
  of the open packs is open and none of their writes is refused with it. A lower-tier pack that breaks
  the mutability policy of an artifact it changes in the merged offering will be refused with it too,
  once the offering is merged (#10, #11).

  Six codes belong to the activation set (ADR-0020 D9, D10, #125), and every one is raised (#125, #291, #360):
  activation_not_found (404), an activation no document is stored under; artifact_not_found (404), a per-artifact
  write whose path names an artifact the activation's closure does not hold, and a read or removal on a pack path of
  an agent profile or a procedure the pack does not hold (pack read and removal), and getEffectiveArtifact or getEffectiveAgentProfile for an id no pack of
  the activation's closure holds; preset_not_found (404), a preset
  application whose path names a preset no pack of the activation's closure holds; activation_invalid (422), a
  document or body the service refuses, each refused part listed in violations (a document carrying a removed member, activatedKinds or missionTypes, is
  validation_failed, not activation_invalid); artifact_required and
  artifact_locked (409), a deactivation a pack requires or locks (a required artifact is accepted when an active
  override of it satisfies the requirement, a locked one never), whose refusal names every requiring pack in
  requiredBy. The requirement of a governing preset id is the union, across the levels (built-in, org, project), of
  the must-have items of the copy in force at each level. Within one level the copy of the pack last in closure order
  replaces the others, a child pack's copy its parent's, and a replaced copy requires nothing. A deny of an artifact
  only an earlier level's copy requires, which a later level's copy replaced, is 409 artifact_required naming that
  earlier level's pack. No operation of the activation set is reserved any more (ADR-0020 D8), and
  action_not_found is raised (above). A unit test of the service fails when any main class
  other than the enum and its mappings names a code the map marks not raised, outside the finding
  projection no operation reaches (PackFindingCode and PackFinding).

  x-refusal declares, for every code, the HTTP status it is answered with, whether the read may be retried,
  and whether an operation of this version raises it (raised). A code has one status, except where its entry
  carries an operations map: operations.<operationId>.status is the status that one operation answers the
  code with, in place of the entry's status, and every other operation answers the entry's status. Only
  the twelve operations that answer the composition codes as 422 declare one (below): getPackRegistration,
  deletePackArtifact, deletePackRelationship, putPackRelationship and the eight per-artifact writes (registerPack and
  putPack of a directive, a paradigm, a styleguide and a toolguide). A code is raised when an operation of this version
  reaches the code that refuses with it, even when no configuration of this version provokes the refusal
  (governance_policy_violation), or when an operation of this version lists it as the code of a violation inside a 422
  validation_failed: a refused registration lists every fault of the pack as a violation whose pointer is the
  pack-relative file and whose code is the code (drg_schema_error, one per fault of a graph document,
  prompt_fragment_invalid, prompt_slot_malformed, prompt_slot_not_empty). So the problem that carries such a code is
  422 at registration. A composing read answers 500 pack_unreadable naming the file for the three prompt codes
  (prompt_fragment_invalid, prompt_slot_malformed, prompt_slot_not_empty); for a graph fault (drg_schema_error) the
  refusal names no file. The declared status of such a code is kept and read as the status of the read that meets
  the fault. A code that only a part no operation reaches
  refuses with is not raised. Clients and the contract scenarios read it.

  How a consumer dispatches on a non-2xx answer. A body with a code is a charter refusal, and the
  code says why. A body without a code is a transport or routing failure (an unknown path, a
  representation the operation does not have, a method the path does not have, a request the
  server rejected before routing, a request the service refused as unauthorized (401) or
  forbidden (403) before routing it) and says nothing about the charter. internal_error is a fault of
  the service and may be retried, and so may stale_input, whose inputs changed during the read,
  registration_timed_out, whose source may answer faster next time, and pack_storage_full, whose space may be freed;
  every other code is a deterministic refusal, and the same read is refused the same way again
  until the request or the configured packs change.

  Fourteen codes belong to the whole-pack registration and the two DELETEs (ADR-0065, FR-001 to FR-006, FR-024,
  FR-025; PR A of the layer merge mission). A code is raised: false until the service that raises it is built, and the
  work package that builds the service flips it, so a code's flag follows what the service names, not what its operation
  declares: an operation that stays reserved (ADR-0020 D8) raises nothing. pack_version_conflict is raised by the
  whole-pack registration service (the same pack_version sent with another revision), artifact_referenced (a replace
  that removes an artifact another pack still refers to) and the five relation codes of the impact check,
  override_not_permitted, enhances_cycle, conflicting_relations, self_override and override_cycle (a registration that
  leaves a closure it joins breaking a relation rule), as the problem of a refused registration status
  (getPackRegistration); registration_not_found, pack_source_unavailable, registration_timed_out and pack_storage_full are
  raised by the registration job and its admission. pack_source_refused is raised by the https_archive, filesystem and
  git source fetchers; relationship_not_found and relationship_not_registered are raised by the removal of a
  relationship (deletePackRelationship).
  pack_version_conflict (409): the same pack_version was registered with another revision. artifact_referenced (409):
  another artifact or pack still refers to the artifact a DELETE or a replace removes; its packs member names the
  referring packs (at most 100) and its violations name every referring artifact. relationship_not_found (404): no
  graph document of the pack holds an edge on the pair a DELETE names and no derived relation joins it.
  relationship_not_registered (409): the pair is held outside registered.graph.yaml, authored in a source shard or
  drg/fragment.yaml or derived, or in both kinds of document; a DELETE removes only a registered edge and never rewrites
  an author file, and the fixed reason says to register the whole pack. registration_not_found (404): no registration is
  held under the id. pack_source_refused (422): a source the service refuses (a host not on the allowlist, an address
  that is not global, a bad ref, the wrong media type, a digest or commit mismatch, a descriptor whose name is not the
  target), with a reason from a fixed set: host_not_allowed, address_not_global, url_refused, redirect_refused,
  wrong_media_type, too_large, digest_mismatch, name_mismatch, source_malformed, path_refused, bad_ref and
  commit_mismatch, the first word of the problem's
  detail; a filesystem source refuses every path it will not read with the same path_refused, so the answer does
  not reveal what exists. pack_source_unavailable (503): registration, or the source kind, is switched
  off, or the system git is missing or older than 2.50.1. override_not_permitted, enhances_cycle, conflicting_relations,
  self_override and override_cycle (422): a relation the registration impact check refuses, naming the root pack of the
  closure and the packs involved (IC-15): an overrides edge onto a target that is not open, or an enhancement of a step
  whose mission type is locked (a step takes its mission type's level, OD-2; a read of such a closure answers 500
  pack_unreadable, as a forbidden layer override does), an enhances cycle or an enhancer with no route to a
  non-enhancer, an artifact that both enhances and overrides one target, an overrides edge that resolves to its own
  source, and an overrides cycle. registration_timed_out (504): the registration job's end
  state at the source deadline plus 30 seconds (NFR-008); the 504 is the planner's proposal, no earlier text gave the
  code a status, and this contract confirms it. pack_storage_full (503): less than the
  per-job peak (about three times the archive bound) is free on the staging or the pack volume (NFR-009), checked before
  anything is written, and for an upload before its body is read.

  Where they are declared (ADR-0056). A registration is asynchronous: its 409 and 422 answers, and these codes, are the
  problem of a refused status, returned in the 200 body of getPackRegistration. So the operations map of a code names
  getPackRegistration only where the problem carries another status than the entry's: the eleven composition codes,
  as 422 in place of 500, and no entry repeats the status of its own code. A code with no entry for getPackRegistration
  is carried there with the status of its entry (pack_version_conflict 409, pack_source_refused 422,
  pack_source_unavailable 503, registration_timed_out 504, pack_storage_full 503, registration_conflict 409,
  validation_failed 422). registerPackFromArchive and registerPackFromSource declare only
  their synchronous answers (202, 400, 401, 403, 412, 413, 415, 428 for the git branch-ref rule only, and 503). The two
  DELETEs are synchronous, so deletePackArtifact and deletePackRelationship answer their own 409 and 422, the
  composition codes as 422 there too. An artifact the pack does not hold is the not-found code of its kind there, as on
  getPackArtifact. The per-artifact writes (registerPack and putPack of a directive, a paradigm, a styleguide or a
  toolguide, and putPackRelationship) are synchronous as well and run the same impact check over the pack as it will be
  after the write (operator ruling DM-01M6VG6GC40AKYYFRR35SV8HVW, IC-15): they answer the composition codes as 422 and
  the five relation codes, naming the closure's root pack and the packs involved. registration_conflict, governance_policy_violation and
  validation_failed are existing codes that these operations also raise.

  The eleven codes of the pack composition are 500 like pack_unreadable, and for the same reason: the request is
  fine and the configured packs are not, so the same read is refused the same way until a pack is fixed. The
  exceptions are the twelve operations that judge a write over the closures its pack joins, which answer them as 422,
  in place of 500, because the request is what leaves the packs unable to compose: getPackRegistration (in the problem
  of a refused registration), deletePackArtifact, deletePackRelationship, putPackRelationship, and registerPackDirective,
  putPackDirective, registerPackParadigm, putPackParadigm, registerPackStyleguide, putPackStyleguide,
  registerPackToolguide and putPackToolguide. The registration of a relationship (putPackRelationship) also judges the
  request's own to against the compose of the pack it registers into: pack_reference_pack_missing (a qualified to naming a pack
  outside the source pack's depends_on closure), pack_reference_unqualified (a bare to that only another pack
  holds) and pack_reference_artifact_missing (a qualified to naming an artifact the named pack does not hold)
  answer 422 there, because the request is what is wrong, and are refused before any file is written. On
  putPackRelationship a preset or lock mismatch also answers 422 until the pack is fixed; the detail names the pack.
  A preset item or policy lock naming a held artifact only by case is pack_reference_artifact_missing, and a preset
  item whose id is outside the id grammar is pack_unreadable.
  They are pack_dependency_cycle, pack_dependency_unknown, pack_dependency_out_of_range,
  pack_parent_unresolved, pack_level_violation, pack_name_conflict, pack_duplicate_id,
  pack_sibling_conflict, pack_reference_unqualified, pack_reference_pack_missing and
  pack_reference_artifact_missing. Each one's
  detail reads as a sentence naming the pack that broke the rule, and its packs member lists the packs
  it names, that pack first, each with its descriptorPackId (the pack_id its pack.yaml declares), its packId (the configured
  identifier) and its name.

  unresolved_edge_endpoint is no longer raised: a graph edge endpoint is a URN, and an endpoint
  that is not one is refused as drg_schema_error. The value stays in the enum so that the
  contract keeps accepting it.

  Four codes belong to ADR-0066 prompt slots and fragments, and are 500: the configured packs, not the request, are
  broken. prompt_fragment_invalid is raised as a violation code of a refused registration: an invalid step
  enhancement or prompt fragment (a repeated slot, a missing, shared or orphan companion, a blank or
  frontmatter-bearing fragment, a fragment with a carriage return or byte order mark, a slot marker or an unclosed
  comment in a fragment, an enhancement without exactly one enhances edge to an
  action:<type>/<step>, an overrides edge from an enhancement, a directory that differs from the edge's type, a
  repeated id, or an absent prompt_fragments key) is listed at its file inside 422 validation_failed, and a composing
  read answers 500 pack_unreadable naming the file.
  prompt_slot_malformed (a bad, repeated, nested or unpaired slot declaration) and prompt_slot_not_empty
  (non-whitespace between paired markers at descriptor schema_version "1.0") are raised the same way, at the prompt
  file. prompt_slot_missing was reserved until the phase-2 mission (#438) built the compose check that raises it (C38):
  the prompt in force declares no slot a step enhancement in force names. It was first worded for an active or inactive
  enhancement; an enhancement that is not in force never refuses (OD-1 (B)). A composing read answers it 500; a
  registration, the impact-checked pack writes and the activation writes answer it 422 (its operations map).
  pack_reference_pack_missing and
  pack_reference_artifact_missing keep their existing meanings for references between packs; no ADR-0066 refusal
  is artifact_locked.

  mission_type_not_in_force (409) is raised by the effective-prompt read (getEffectiveStepPrompt) alone (operator ruling
  OD-5, 2026-11-12; ADR-0066 decision 9): the activation's merged closure holds the mission type of the path, and the
  activation does not put it in force. It is judged after activation_not_found, mission_type_not_found and
  action_not_found, and before the closure's 500 codes (prompt_slot_missing among them) and any 304. The two reads of an
  action answer such a mission type differently on purpose. The action context (getEffectiveActionContext) describes
  what governs the action, and for a mission type not in force the truthful description is nothing, with the reason in
  its skipped report, so it answers 200 empty. The prompt read hands a renderer the text it places in a running step; a
  mission type not in force has no step to run, and an empty prompt would be rendered as if it were one, so the
  activation's state conflicts with the request, and the client changes the activation to resolve it. A mission type
  the closure does not hold is mission_type_not_found, whatever the activation selects.
type: string
