title: RelationshipRegistration
description: >-
  A relationship edge between two components, as registered on the wire. Identity is the unordered
  {from, to} pair (ADR-0025/0027): re-registering a pair, in either orientation, replaces it
  (last-write-wins). It is the request body of PUT /packs/{packId}/relationships and an entry of an
  artifact registration's relationships array; it is also the shape in which a component's
  relationships are read back. Shared and reused by reference across the regular-artifact slices. As the
  body of PUT /packs/{packId}/relationships it is at most 1 MiB; a larger body is refused 422 validation_failed
  before it is read.
type: object
additionalProperties: false
required: [from, to, type]
properties:
  from:
    type: string
    description: The URN <kind>:<id> the relationship is authored from; must resolve within the pack.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.from
  to:
    type: string
    description: The URN <kind>:<id> the relationship is authored to; may be external to the pack.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.to
  type:
    type: string
    description: A RelationType token from the closed catalogue; directionality is derived from it.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.token
  rationale:
    type: ['string', 'null']
    description: The authored reason for the relationship; null when none is authored.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.rationale
  when:
    type: ['string', 'null']
    description: The authored edge condition; null when none is authored. It round-trips.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.when
x-source:
  path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
  symbol: Relationship
