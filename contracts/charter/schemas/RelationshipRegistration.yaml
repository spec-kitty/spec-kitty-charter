title: RelationshipRegistration
description: >-
  A relationship edge between two components, as registered on the wire. Identity is the unordered
  {from, to} pair and its pair class (ADR-0027, ADR-0045 decision 1): re-registering a slot, in either orientation,
  replaces it, and a tension stands beside the structural relationship of its pair
  (last-write-wins). It is the request body of PUT /packs/{packId}/relationships, the only write of an
  edge (ADR-0064); an artifact registration carries none. As the
  body of PUT /packs/{packId}/relationships it is at most 1 MiB; a larger body is refused 422 validation_failed
  before it is read.
type: object
additionalProperties: false
required: [from, to, type]
properties:
  from:
    type: string
    maxLength: 255
    description: >-
      The URN <kind>:<id> the relationship is authored from; must resolve within the pack. For a tension whose two
      sides the pack holds neither of, it may be the pack-qualified <pack-name>::<kind>:<id> of another pack's artifact
      (ADR-0045 decision 1).
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/infra/api/RelationshipWire.java
      symbol: RelationshipWire.MAX_ENDPOINT_LENGTH
  to:
    allOf:
    - $ref: PackQualifiedReferenceWrite.yaml
    description: >-
      The reference the relationship is authored to: the URN <kind>:<id>, which may be external to the pack, or the
      pack-qualified <pack-name>::<kind>:<id> of an artifact of another pack the writer relies on. The pack is
      provenance, so the relationship's identity stays the bare pair; a qualified `from` is refused, except for a
      tension (see from).
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.to
  type:
    type: string
    description: A RelationType token from the closed catalogue; directionality is derived from it.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/RelationType.java
      symbol: RelationType.token
  rationale:
    type: ['string', 'null']
    description: The authored reason for the relationship; null when none is authored.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.rationale
  when:
    type: ['string', 'null']
    description: The authored edge condition; null when none is authored. It round-trips.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
      symbol: Relationship.when
x-source:
  path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/Relationship.java
  symbol: Relationship
