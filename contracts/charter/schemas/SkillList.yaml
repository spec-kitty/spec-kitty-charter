title: SkillList
description: >-
  Every skill a Charter Pack holds, as listPackSkills answers it: in id order and unpaged, deliberately, because a pack
  holds few skills (paging it later would be an additive change). A pack with no skill answers an empty list. _links
  holds self.
type: object
additionalProperties: false
required:
  - items
  - _links
properties:
  items:
    type: array
    description: The pack's skills in id order.
    items:
      $ref: SkillSummary.yaml
    x-derived:
      rule: The skills of the pack, sorted by id.
      inputs:
        - the skill files under the skills/ directory of the pack
  _links:
    $ref: Links.yaml
x-derived:
  rule: The skills the service holds for the pack, read inside one verified read.
  inputs:
    - the skill files under the skills/ directory of the pack
