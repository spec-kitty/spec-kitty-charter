title: EffectiveGraphEdge
description: >-
  An edge of the graph of the merged closure under an activation. It resolves through the layer overrides: an edge
  from an overridden version is absent, and an edge to one ends at the winner. An edge is dropped with either endpoint.
type: object
additionalProperties: false
required:
- source
- relation
- target
properties:
  source:
    allOf:
    - $ref: Urn.yaml
    description: The edge's source node.
    x-derived:
      rule: The source of an offering edge whose endpoints both remain.
      inputs:
      - schemas/ActivationConfig.yaml
  relation:
    allOf:
    - $ref: Relation.yaml
    description: The edge's relation.
    x-derived:
      rule: The relation of the offering edge.
      inputs:
      - schemas/ActivationConfig.yaml
  target:
    allOf:
    - $ref: Urn.yaml
    description: The edge's target node.
    x-derived:
      rule: The target of the offering edge.
      inputs:
      - schemas/ActivationConfig.yaml
