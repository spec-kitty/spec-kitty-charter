title: Activation
description: >-
  One stored activation document (ADR-0020 D4). The ETag covers the activation's revision and the governanceFingerprint
  of the packs of its closure, because denyNotApplied (B4, FR-027) is judged against those packs when the activation is
  read: it changes when the document or a pack of the closure changes. Only getActivation answers that tag and
  denyNotApplied; createActivation, replaceActivation and the writes answer the quoted revision as their ETag and carry
  no denyNotApplied. If-Match on a write takes either tag (operator decision 01M6Y3GZFRC5WEQQ7G6GT0YMW3). Apart from denyNotApplied the answer depends only
  on the stored document: the counts are on the effective artifact list (EffectiveArtifactList.summary) and the packs
  the document builds on are on its closure read (listActivationPacks). dropped and
  droppedPins are on a replaceActivation answer only, and only when that write dropped something (A4, B1): a read never
  carries them.

  _links holds, on every answer that carries an Activation (getActivation, createActivation and replaceActivation), the
  relations a client follows from the activation it created or read, without building a path (#409, decision
  DM-01M78RKM6Q23PA9QAC80QJKQFF). Its reads: self (the activation); artifacts, the effective artifact list as an RFC
  6570 template (/api/v1/activations/{activationId}/artifacts{?kind,state}, templated true; listEffectiveArtifacts);
  packs, its closure (listActivationPacks); graph, its effective graph (getEffectiveGraph); skipped, its skipped report
  (getActivationSkippedReport); and effective-context, the action context as a template
  (/api/v1/activations/{activationId}/mission-types/{missionType}/actions/{action}/context{?depth}, templated true;
  getEffectiveActionContext); assets, the assets its closure holds (listEffectiveAssets); asset, one of them as a
  template (/api/v1/activations/{activationId}/artifacts/asset/{artifactId}, templated true; getEffectiveAsset), which a
  guard runner (asset:<id>) expands with the asset's id; and skills, the skills its closure holds
  (listEffectiveSkills). offering is the offering it chooses from (getOffering). Its writes, each with its method:
  edit (PUT, replaceActivation) and delete (DELETE, deleteActivation) on the activation itself; select
  (…/selections/{kind}/{artifactId}, PUT, selectActivationArtifact) and exclude (…/exclusions/{kind}/{artifactId},
  PUT, deactivateActivationArtifact), templated by kind and id; and apply-preset (…/presets/{presetId}, PUT,
  applyActivationPreset), templated by the preset's id. unselect and include are not on the activation: they suit an
  artifact already selected or excluded.
type: object
additionalProperties: false
required:
- activationId
- revision
- config
- _links
properties:
  activationId:
    allOf:
    - $ref: ActivationId.yaml
    description: The activation's id.
    x-derived:
      rule: The {activationId} path segment, or the ULID the service minted on POST (ADR-0020 D2, D3).
      inputs:
      - parameters/ActivationId.yaml
  revision:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The activation's revision: sha256: and the hex SHA-256 of the RFC 8785 (JCS) serialization of its canonical
      config.
    x-derived:
      rule: SHA-256 over the JCS serialization of the canonical ActivationConfig.
      inputs:
      - schemas/ActivationConfig.yaml
  config:
    $ref: ActivationConfig.yaml
  dropped:
    type: array
    minItems: 1
    items:
      $ref: ArtifactReference.yaml
    description: >-
      On a replaceActivation answer only: the ids of the body the activation's closure no longer holds that the
      replaced document named, dropped from the document stored instead of refused (A4, decision
      DM-01M6RA7XC5HC8915GZT2R3H83W), sorted. Present only when the write dropped one; config is the stored document
      without them.
    x-derived:
      rule: The ids of the body's selected and deactivated the closure does not hold and the replaced document named.
      inputs:
      - schemas/ActivationConfig.yaml
  droppedPins:
    type: array
    minItems: 1
    items:
      $ref: PackPin.yaml
    description: >-
      On a replaceActivation answer only: the version pins of the body no pack of the closure holds, dropped from
      packs instead of refused (B1, decision DM-01M6RN5Y406SB4KA13QYMQ2P8J), each as the body wrote it, in its pack
      order. Present only when the write dropped one; createActivation refuses such a pin (422 version_not_held).
    x-derived:
      rule: The body's packs entries whose version no pack of the activation's closure holds.
      inputs:
      - schemas/ActivationConfig.yaml
  denyNotApplied:
    type: array
    minItems: 1
    items:
      $ref: Urn.yaml
    description: >-
      The deny entries of the stored document that the required floor or a lock overrides (B4, FR-027): each as the URN
      of the artifact, which stays in force. Present only when there is one, so a deny entry that is applied is never
      listed. getActivationSkippedReport reports the same entries, with the reason, as denyNotApplied.
    x-derived:
      rule: The URNs of the deactivated entries that name a locked artifact or a required one no active override satisfies.
      inputs:
      - schemas/ActivationConfig.yaml
  _links:
    $ref: Links.yaml
