title: Activation
description: >-
  One stored activation document (ADR-0020 D4). The ETag is the quoted revision; the answer's bytes depend only on the
  stored document (ADR-0059 D5), so nothing derived from the offering is in it: the counts are on the effective
  artifact list (EffectiveArtifactList.summary) and the packs the document builds on are on its closure read
  (listActivationPacks).
type: object
additionalProperties: false
required:
- activationId
- revision
- config
- _links
properties:
  activationId:
    allOf:
    - $ref: ActivationId.yaml
    description: The activation's id.
    x-derived:
      rule: The {activationId} path segment, or the ULID the service minted on POST (ADR-0020 D2, D3).
      inputs:
      - parameters/ActivationId.yaml
  revision:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The activation's revision: sha256: and the hex SHA-256 of the RFC 8785 (JCS) serialization of its canonical
      config.
    x-derived:
      rule: SHA-256 over the JCS serialization of the canonical ActivationConfig.
      inputs:
      - schemas/ActivationConfig.yaml
  config:
    $ref: ActivationConfig.yaml
  _links:
    $ref: Links.yaml
