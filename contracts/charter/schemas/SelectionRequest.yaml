title: SelectionRequest
description: The body of a select (ADR-0020 D6). Send {} for no cascade.
type: object
additionalProperties: false
required: []
properties:
  cascade:
    allOf:
    - $ref: CascadeScope.yaml
    description: >-
      The kinds the selection cascades into over the graph; absent means no cascade. The walk stops at a deactivated
      artifact and reports it in the skipped report.
    x-source:
      path: docs/adr/0020-offering-and-activations.md
      symbol: D6
  includeDeactivated:
    type: boolean
    description: >-
      When true, the cascade walks through deactivated artifacts and clears their exclusions: of everything the walk
      goes through, whatever the cascade's kinds (one outside them is cleared, reported in skippedByScope and not
      selected; a lineage ancestor passed through is cleared and never selected), and of what the read-time enhances
      pull reaches from what the walk selects, within the kinds activatedKinds names (absent means none). A pulled
      artifact is never selected. Absent means false.
    x-source:
      path: docs/adr/0020-offering-and-activations.md
      symbol: D6
