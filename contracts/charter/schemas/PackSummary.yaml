title: PackSummary
description: One loaded Charter Pack and the size of the DRG it contributes.
type: object
additionalProperties: false
required:
  - name
  - level
  - packId
  - packVersion
  - parentPack
  - nodeCount
  - edgeCount
  - diagnostics
properties:
  name:
    type: string
    description: The pack name.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/CharterPack.java
      symbol: CharterPack.name
  level:
    $ref: PackLevel.yaml
  packId:
    type: ['string', 'null']
    description: The pack's ULID from pack.yaml, or null for a pack without a descriptor.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/PackDescriptor.java
      symbol: PackDescriptor.packId
  packVersion:
    type: ['string', 'null']
    description: The pack_version from pack.yaml, or null for a pack without a descriptor.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/PackDescriptor.java
      symbol: PackDescriptor.packVersion
  parentPack:
    type: ['string', 'null']
    description: The parent_pack from pack.yaml; null for a root pack.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/PackDescriptor.java
      symbol: PackDescriptor.parentPack
  nodeCount:
    type: integer
    minimum: 0
    description: The number of DRG nodes the pack declares.
    x-source:
      path: service/charter-read-app/src/main/java/ai/speckitty/charter/read/PackListingQuery.java
      symbol: PackListingQuery.summarize
  edgeCount:
    type: integer
    minimum: 0
    description: The number of DRG edges the pack declares.
    x-source:
      path: service/charter-read-app/src/main/java/ai/speckitty/charter/read/PackListingQuery.java
      symbol: PackListingQuery.summarize
  diagnostics:
    type: array
    description: Load findings that did not stop the load; empty for a clean pack.
    items:
      $ref: Diagnostic.yaml
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/CharterPack.java
      symbol: CharterPack.diagnostics
    x-provisional:
      open_decision: pack_level_missing becomes a refusal when core ADR 2026-10-11-2 closes its deprecation window
