title: ActivationConfig
description: >-
  The activation document: the state a client authors for one active charter (ADR-0020 D4). It is the body of PUT
  /activations/{activationId} and POST /activations and the config of every Activation answer. Core keeps its own
  files and maps them to and from this document (content alignment, not file shape).

  The document is packs, selected, deactivated and languages (one kind model, IC-20): mission types, steps and agent
  profiles are ordinary kinds of selected and deactivated. There is no kind gate: the former activatedKinds and
  missionTypes members are not part of the shape, and a write that sends either is refused 422 validation_failed with
  one violation per member naming its replacement (selected.mission_type for missionTypes; selected.<kind> for
  activatedKinds). A document stored at schemaVersion 1 is answered as its version 2 upgrade: its missionTypes become
  selected.mission_type, every selection is kept, and activatedKinds is discarded; the upgrade is stored on the next
  write, so its revision and ETag change once.

  One meaning for absent (ADR-0053 d10): for each selected kind, absent and [] both mean none is in force, and a list
  means exactly those. The two register the same document: the canonical form leaves an empty selected.<kind> out, so
  a client that sends [] for a kind it read as absent keeps the revision and the ETag (FR-042, decision
  DM-01M6RN62PPCMSH6M54D2HXYZEQ). Nothing is in force by default. packs and languages keep their own absent: every
  configured pack, and no language filter, while languages: [] means no language. null is never a value.

  Canonical form, which the service stores and answers: ids in their declared spelling (a write may spell an id as its
  full URN or in another case, and is normalized to the declared id, ADR-0020 D4); id and token lists deduplicated
  and sorted, except packs, which keeps merge order; an empty selected.<kind> list, and an empty selected or
  deactivated object, left out; lists sorted by Unicode code point; members in the order of this schema. An empty deny
  list is refused
  (422), never stored. The activation's revision is sha256: and the hex SHA-256 of the RFC 8785 (JCS) serialization
  of the canonical document.

  Not in the document, by ruling (2026-10-31): per-entry provenance, context activations and applied presets. Not
  stored because the packs derive it: the required floor, locked artifacts, the available artifacts and the skipped
  report.
type: object
additionalProperties: false
required:
- schemaVersion
properties:
  schemaVersion:
    type: integer
    minimum: 2
    maximum: 2
    description: >-
      The version of this document's shape: 2, the one kind model (IC-20). A write of any other version is refused
      (422); a document stored at version 1 is upgraded on read and stored as version 2 on the next write.
    x-source:
      path: contracts/offering/schemas/ActivationConfig.schema.json
      symbol: '#/properties/schemaVersion'
  packs:
    type: array
    minItems: 1
    items:
      $ref: PackPin.yaml
    description: >-
      The packs the activation builds on, the roots of its composition closure, in the order written. Absent means
      every configured pack. A pack id appears once, and names a configured pack (422 activation_invalid otherwise).
    x-source:
      path: contracts/offering/schemas/ActivationConfig.schema.json
      symbol: '#/properties/packs'
  selected:
    $ref: SelectedArtifacts.yaml
  deactivated:
    $ref: DeactivatedArtifacts.yaml
  languages:
    type: array
    items:
      $ref: LanguageToken.yaml
    description: >-
      The project's languages, as authored; languages core derives are not sent. Absent means no language filter;
      [] means no language.
    x-source:
      path: contracts/offering/schemas/ActivationConfig.schema.json
      symbol: '#/properties/languages'
x-source:
  path: contracts/offering/schemas/ActivationConfig.schema.json
  symbol: '#'
