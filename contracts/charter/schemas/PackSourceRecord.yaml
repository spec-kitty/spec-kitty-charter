title: PackSourceRecord
description: >-
  Only in the result of a POST /packs registration: what was fetched, as the request named it, answered and never
  persisted (there is no lockfile in this version). Absent for a PUT and on getPack.
type: object
additionalProperties: false
required:
- kind
properties:
  kind:
    type: string
    enum:
    - https_archive
    - git
    - filesystem
    description: The source kind.
    x-derived:
      rule: The kind of the PackSource.
      inputs:
      - schemas/PackSource.yaml
  url:
    type: string
    description: For https_archive and git, the URL as sent.
    x-derived:
      rule: The url of the PackSource.
      inputs:
      - schemas/PackSource.yaml
  ref:
    type: string
    description: For git, the ref as sent.
    x-derived:
      rule: The ref of the PackSource.
      inputs:
      - schemas/PackSource.yaml
  path:
    type: string
    description: For filesystem, the relative path as sent.
    x-derived:
      rule: The path of the PackSource.
      inputs:
      - schemas/PackSource.yaml
  commit:
    type: string
    pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
    description: For git, the commit the ref resolved to (git rev-parse HEAD), so a branch ref is recorded as the commit it
      pointed to.
    x-derived:
      rule: The commit git resolved the ref to.
      inputs:
      - schemas/PackSource.yaml
x-derived:
  rule: The PackSource of the request, with the commit git resolved.
  inputs:
  - schemas/PackSource.yaml
