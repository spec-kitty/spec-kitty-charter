title: RequiredNotInForce
description: >-
  A required artifact that cannot stand in force, and why. The requirement is reported, never silently dropped
  (decisions DM-01M6R4W3ZMSESETMQ0ZQTCZCFJ and DM-01M6RFGFW3S0YJ222QMHD2W11B).
type: object
additionalProperties: false
required:
- kind
- artifactId
- reason
properties:
  kind:
    allOf:
    - $ref: ActivatableKind.yaml
    description: The kind of the required artifact.
    x-derived:
      rule: The kind of the required artifact.
      inputs:
      - schemas/ActivationConfig.yaml
  artifactId:
    allOf:
    - $ref: ArtifactId.yaml
    description: The declared id of the required artifact.
    x-derived:
      rule: The id of the required artifact.
      inputs:
      - schemas/ActivationConfig.yaml
  reason:
    type: string
    enum:
    - enhanced_target_not_in_force
    - mission_type_not_in_force
    description: >-
      Why it stays out of force: it is an enhancer none of whose targets is in force, or it is bound to a mission type
      that is not in force. Its EffectiveArtifact entry carries the same reason and required true.
    x-derived:
      rule: The in-force rule that keeps the required artifact out.
      inputs:
      - schemas/ActivationConfig.yaml
