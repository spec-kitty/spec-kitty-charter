title: ProfileSelectionRead
description: >-
  Which agent profile fills one role under an activation (selectAgentProfile; ADR-0032 decision 1, ADR-0069 decision
  4, ruling D1 of slice G), or acts on one step by the role it names (selectAgentProfileForStep, FR-012): the role and
  the asked context, and the profiles that answer it, each with how it fits. One candidate is the answer; several are
  a tie the service does not break, in the order of their packs in the closure, then by id; a candidate with fit
  fallback is the fallback in force, answered alone because no profile fits, or because the step names no role.

  _links holds self, this request with the context it asked.
type: object
additionalProperties: false
required:
- context
- candidates
- tie
- _links
properties:
  role:
    type: string
    pattern: '^(?:(?:[a-fh-z][a-z0-9]*|g(?:[a-df-z0-9][a-z0-9]*|e(?:[a-mo-z0-9][a-z0-9]*|n(?:[a-df-z0-9][a-z0-9]*|e(?:[a-qs-z0-9][a-z0-9]*|r(?:[a-hj-z0-9][a-z0-9]*|i(?:[abd-z0-9][a-z0-9]*|c[a-z0-9]+)?)?)?)?)?)?)(?:-[a-z0-9]+)*|generic(?:-[a-z0-9]+)+)$'
    maxLength: 64
    description: >-
      The role selection read, a role token other than the reserved generic: the asked role, or the role the asked
      step names. Absent only for a step that names no role.
    x-derived:
      rule: >-
        The {role} path segment of selectAgentProfile; for selectAgentProfileForStep, the role of the step at its place
        (MissionStep.role), absent when the step declares none.
      inputs:
      - openapi.yaml#/paths
      - schemas/MissionStep.yaml#/properties/role
  context:
    $ref: ProfileSelectionContext.yaml
  candidates:
    type: array
    minItems: 1
    items:
      $ref: ProfileSelectionCandidate.yaml
    description: >-
      The answer: one profile, every tied profile in the order of its pack in the closure then by id, or the fallback
      alone.
    x-derived:
      rule: >-
        Selection over the agent profiles the activation puts in force, minus the enhancers, with the pin and the
        fallback in force (ADR-0069 decision 4, as ADR-0078 rules it).
      inputs:
      - schemas/ActivationConfig.yaml
  tie:
    type: boolean
    description: True when more than one profile is answered and the service leaves the choice to the client.
    x-derived:
      rule: True exactly when candidates holds more than one profile.
      inputs:
      - schemas/ProfileSelectionRead.yaml#/properties/candidates
  _links:
    $ref: Links.yaml
x-source:
  path: service/profiles/src/main/java/ai/speckitty/charter/profiles/domain/selection/ProfileSelection.java
  symbol: ProfileSelection.select
