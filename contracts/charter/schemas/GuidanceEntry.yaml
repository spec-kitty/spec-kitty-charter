title: GuidanceEntry
description: One artifact in an action-scoped context and the walk step that listed it.
type: object
additionalProperties: false
required:
  - urn
  - kind
  - label
  - relation
  - impacts
  - via
  - hops
properties:
  urn:
    $ref: Urn.yaml
  kind:
    $ref: NodeKind.yaml
  label:
    type: ['string', 'null']
    description: The node label, or null when the graph declares none.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/DrgNode.java
      symbol: DrgNode.label
  relation:
    description: >-
      The relation of the walk step that listed the artifact. This read answers scope, requires,
      suggests or vocabulary, and a later version may answer more.
    allOf:
      - $ref: Relation.yaml
    x-derived:
      rule: >-
        scope, requires, suggests or vocabulary: the relation of the edge the producing step
        followed, and the first step that reaches an artifact lists it.
      inputs:
        - schemas/ActionContext.yaml#/properties/guidance
  impacts:
    type: ['number', 'null']
    format: double
    minimum: -1
    maximum: 1
    description: >-
      The signed strength of the edge when its relation is impacts, from -1 (sabotages) to +1
      (reinforces); a negative strength is a tension claim. Null for every other relation, so null
      for every relation this read walks.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/DrgEdge.java
      symbol: DrgEdge.impacts
  via:
    description: >-
      The artifact's parent in the walk step that listed it: the action node for a scope entry,
      otherwise another entry of the same answer, which may itself be listed under a stronger
      relation. Following via from any entry reaches the action node in exactly hops edges, along
      edges of the graph. Among several parents at the same distance the one with the fewest hops
      is chosen, then the smallest URN.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: >-
        The node the producing step's edge starts from: the action node for a scope entry,
        otherwise another entry of the guidance.
      inputs:
        - schemas/ActionContext.yaml#/properties/action
        - schemas/ActionContext.yaml#/properties/guidance
  hops:
    type: integer
    format: int32
    minimum: 1
    description: >-
      The distance from the action node along via: 1 for a scope entry, otherwise the hops of via
      plus 1. It is the full path length, which depth does not bound: depth counts only the suggests
      steps.
    x-source:
      path: service/charter-read-app/src/main/java/ai/speckitty/charter/read/GuidanceEntry.java
      symbol: GuidanceEntry.hops
