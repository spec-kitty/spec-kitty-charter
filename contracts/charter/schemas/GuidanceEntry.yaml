title: GuidanceEntry
description: One artifact in an action-scoped context and the edge that brought it in.
type: object
additionalProperties: false
required:
  - urn
  - kind
  - label
  - relation
  - impacts
  - via
properties:
  urn:
    $ref: Urn.yaml
  kind:
    $ref: NodeKind.yaml
  label:
    type: ['string', 'null']
    description: The node label, or null when the graph declares none.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/DrgNode.java
      symbol: DrgNode.label
  relation:
    $ref: Relation.yaml
  impacts:
    type: ['number', 'null']
    format: double
    minimum: -1
    maximum: 1
    description: >-
      The signed strength of the edge when its relation is impacts, from -1 (sabotages) to +1
      (reinforces); a negative strength is a tension claim. Null for every other relation, so null
      throughout this version, whose guidance is reached by scope edges only.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/DrgEdge.java
      symbol: DrgEdge.impacts
  via:
    description: The node the edge starts from.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: The source of the scope edge that brought the artifact in.
      inputs:
        - schemas/ActionContext.yaml#/properties/action
        - schemas/ActionContext.yaml#/properties/missionType
