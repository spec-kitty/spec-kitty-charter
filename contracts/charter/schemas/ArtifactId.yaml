title: ArtifactId
description: >-
  An artifact's declared id, the tail of its URN (directive:DIRECTIVE_001 has the id DIRECTIVE_001). A write may
  use another known spelling of the same artifact; the stored document holds the declared id (ADR-0020 D4).
type: string
minLength: 1
maxLength: 128
pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
