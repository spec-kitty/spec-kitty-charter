title: ArtifactId
description: >-
  An artifact's declared id, the tail of its URN (directive:DIRECTIVE_001 has the id DIRECTIVE_001). A write may
  spell the id as the declared id, as its full URN of the list's kind (directive:DIRECTIVE_001), or as a case-insensitive
  match of either, the kind prefix included (DIRECTIVE:directive_001; ADR-0020 D4, operator ruling of 2026-11-06); the stored document holds the declared id. A match
  between two declared ids that differ only by case is refused (422 ambiguous_artifact) unless it is exactly one of
  them, and a URN of another kind than the list's is an unknown id. maxLength covers the whole string, so a declared id longer
  than 128 less the kind and the colon (118 characters for "directive:") cannot be written as a URN; it is written as
  itself.
type: string
minLength: 1
maxLength: 128
pattern: ^([A-Za-z][A-Za-z_]*:)?[A-Za-z0-9][A-Za-z0-9_.-]*$
