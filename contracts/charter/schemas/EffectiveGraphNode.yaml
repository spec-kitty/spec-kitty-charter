title: EffectiveGraphNode
description: >-
  A node of the graph of the merged closure under an activation: an artifact in force, or a step of a mission type
  (kind action) that the closure holds while its mission type is in force.

  _links holds effective-artifact, the read of the artifact the node is under the activation (getEffectiveArtifact, or
  getEffectiveMissionType for a mission_type), for a node of a kind the pack-scoped artifact routes serve, the mission
  kinds among them. A step (kind action, action:<type>/<step>) is no artifact: its effective-artifact is the read of the
  step under the activation (getEffectiveMissionStep), which answers the step of the winning mission type, or
  action_not_found when that version declares no such step. _links is absent for any other node. A node names no pack,
  so it has no artifact link; the effective-artifact read it leads to links the pack-scoped read.
type: object
additionalProperties: false
required:
- urn
- kind
properties:
  urn:
    allOf:
    - $ref: Urn.yaml
    description: The node's identity.
    x-derived:
      rule: A node of the offering's graph left by the activation filter.
      inputs:
      - schemas/ActivationConfig.yaml
  kind:
    allOf:
    - $ref: NodeKind.yaml
    description: The node's kind.
    x-derived:
      rule: The kind of the node.
      inputs:
      - schemas/ActivationConfig.yaml
  _links:
    $ref: Links.yaml
