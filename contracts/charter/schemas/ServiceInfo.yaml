title: ServiceInfo
description: >-
  What the service says about itself, so the seam in core can check it talks to the right service
  about the right files (ADR-0011). _links holds self and service-desc, the contract document the
  service was built against (RFC 8631, #208).
type: object
additionalProperties: false
required:
  - contractVersion
  - serviceVersion
  - worktree
  - sourceFingerprint
  - _links
properties:
  contractVersion:
    type: string
    description: >-
      The info.version of the contract the service was built against, for example 0.1.0. The
      contract is one document, so this version names every operation the service serves; an
      additive contract set is new operations in that document and a minor version.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/infra/api/ContractVersion.java
      symbol: ContractVersion.value
  serviceVersion:
    type: string
    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$'
    description: >-
      The version of the service build, a semantic version with an optional pre-release, for
      example 0.1.0-SNAPSHOT. It is the service's own and is independent of contractVersion.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/infra/api/ServiceVersion.java
      symbol: ServiceVersion.value
  worktree:
    type: string
    description: >-
      The opaque id of the worktree the service serves: the charter.worktree-id the service was
      started with, or, without one, an id derived from where the configured packs are. Never a
      host path.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/application/ServiceInfoQuery.java
      symbol: ServiceInfoQuery.worktree
  sourceFingerprint:
    allOf:
      - $ref: Sha256Digest.yaml
    description: >-
      A digest of the inputs the answers depend on: per configured pack in order, `pack.yaml`, every
      loaded file (tactic, directive, styleguide and paradigm files, at any depth) and the declared
      graph inputs (root `*.graph.yaml` shards, then `drg/fragment.yaml`), each as its path under the
      pack's configured name and its bytes; and, when configured, `config.yaml` and `charter.yaml`
      under the project configuration directory, with presence. The order is: packs in configured
      order; within a pack, `pack.yaml`, then the loaded files by kind and then path, then the root
      shards by name, then `drg/fragment.yaml`. An absent file and an empty one differ. The graph
      inputs are digested although no served read loads them yet. It changes whenever an input does
      and names no host path. Adding an input in a later version changes values, not shape.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/infra/storage/ProjectConfigSources.java
      symbol: ProjectConfigSources.fingerprint
  _links:
    $ref: Links.yaml
