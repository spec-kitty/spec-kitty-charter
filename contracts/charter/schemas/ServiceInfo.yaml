title: ServiceInfo
description: What the service says about itself, so the seam in core can check it talks to the right service about the right files (ADR-0011).
type: object
additionalProperties: false
required:
  - contractVersion
  - serviceVersion
  - worktree
  - sourceFingerprint
properties:
  contractVersion:
    type: string
    description: >-
      The info.version of the contract the service was built against, for example 1.0.0. The
      contract is one document, so this version names every operation the service serves; an
      additive contract set is new operations in that document and a minor version.
    x-source:
      path: service/adapter-in-rest/src/main/java/ai/speckitty/charter/rest/ContractVersion.java
      symbol: ContractVersion.value
  serviceVersion:
    type: string
    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$'
    description: >-
      The version of the service build, a semantic version with an optional pre-release, for
      example 0.1.0-SNAPSHOT. It is the service's own and is independent of contractVersion.
    x-source:
      path: service/adapter-in-rest/src/main/java/ai/speckitty/charter/rest/ServiceVersion.java
      symbol: ServiceVersion.value
  worktree:
    type: string
    description: >-
      The opaque id of the worktree the service serves: the charter.worktree-id the service was
      started with, or, without one, an id derived from where the configured packs are. Never a
      host path.
    x-source:
      path: service/charter-read-app/src/main/java/ai/speckitty/charter/read/ServiceInfoQuery.java
      symbol: ServiceInfoQuery.worktree
  sourceFingerprint:
    allOf:
      - $ref: Sha256Digest.yaml
    description: >-
      A digest of the inputs the answers depend on: every pack file the service loads, each with
      its path under its pack's configured name, in load order; and config.yaml and charter.yaml
      under the project configuration directory the service was started with, each with a
      presence marker, so an absent file and an empty one differ. It changes whenever an input
      does and names no host path. Adding an input in a later version changes values, not shape.
    x-source:
      path: service/adapter-out-yaml/src/main/java/ai/speckitty/charter/yaml/ProjectConfigSources.java
      symbol: ProjectConfigSources.fingerprint
