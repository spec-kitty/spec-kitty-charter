title: DiagnosticCode
description: >-
  A load finding that does not stop the load. Codes are snake_case on the wire; the integration
  seam in core maps them to core's own spellings. pack_level_missing: the pack has no pack.yaml,
  or its pack.yaml has no pack_level; the configured level is used. Core treats it the same way
  during the deprecation window of core ADR 2026-10-11-2; when the window closes it becomes a
  refusal in a new contract version. pack_unknown_key: retired, never raised. A pack.yaml key that
  the pack descriptor schema does not declare, a retired field included, once loaded with this
  warning; the schema is closed now (ADR-0036 decision 3), so such a pack is refused as
  pack_unreadable. The value stays in the enum so a client built against an earlier draft still
  reads it. prompt_slot_not_empty: an unversioned pack descriptor keeps legacy text between paired prompt-slot
  markers; descriptor schema_version "1.0" makes the same finding a refusal (ADR-0066). The warning is listed in the
  diagnostics of the result of a succeeded registration, and in the diagnostics of the effective-prompt read
  (getEffectiveStepPrompt), once per declared slot of the prompt in force that holds such text. file_not_held: a file of the registered tree that is not pack content (a file-kinds
  exclusion names it, or it is Markdown that no rule models), so the service does not hold it; the diagnostic's detail
  names the file and the rule's reason, and the stored pack is the registered tree less these files (#451).
type: string
enum:
  - pack_level_missing
  - pack_unknown_key
  - prompt_slot_not_empty
  - file_not_held
