title: ActionContext
description: The governance that applies to one action of one mission type.
type: object
additionalProperties: false
required:
  - action
  - missionType
  - depth
  - governanceFingerprint
  - guidance
properties:
  action:
    description: The action node the context is read for, action:<missionType>/<action>.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: action:<missionType>/<action>, from the two path parameters.
      inputs:
        - parameters/MissionType.yaml
        - parameters/Action.yaml
  missionType:
    description: The mission type node of the action, mission_type:<missionType>.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: mission_type:<missionType>, from the path parameter.
      inputs:
        - parameters/MissionType.yaml
  depth:
    type: integer
    format: int32
    minimum: 1
    description: The depth the walk followed, the depth parameter of the request or its default.
    x-derived:
      rule: The depth query parameter, or 1 when the request has none.
      inputs:
        - parameters/Depth.yaml
  governanceFingerprint:
    allOf:
      - $ref: Sha256Digest.yaml
    description: >-
      A digest of the governance the answer was computed from: the packs in force in merge order
      (pack id, version and level) and the merged graph, its nodes and edges in a canonical sorted
      order, impacts strengths included. Two answers with the same fingerprint were computed from
      the same governance; it does not change with host paths, file formatting or the order nodes
      and edges are declared in. Consumers compare it; they never parse it.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/CharterOffering.java
      symbol: CharterOffering.governanceFingerprint
  guidance:
    type: array
    description: >-
      The artifacts one scope edge away from the action node or the mission type node, each
      artifact once, sorted by URN.
    items:
      $ref: GuidanceEntry.yaml
    x-derived:
      rule: >-
        The targets of the scope edges of action:<missionType>/<action> and of
        mission_type:<missionType>, each target once (an artifact in both scopes keeps its
        action entry), sorted by the full URN string.
      inputs:
        - parameters/MissionType.yaml
        - parameters/Action.yaml
