title: ActionContext
description: The governance that applies to one action of one mission type.
type: object
additionalProperties: false
required:
  - action
  - missionType
  - depth
  - governanceFingerprint
  - guidance
  - diagnostics
properties:
  action:
    description: The action node the context is read for, action:<missionType>/<action>.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: action:<missionType>/<action>, from the two path parameters.
      inputs:
        - parameters/MissionType.yaml
        - parameters/Action.yaml
  missionType:
    description: The mission type node of the action, mission_type:<missionType>.
    allOf:
      - $ref: Urn.yaml
    x-derived:
      rule: mission_type:<missionType>, from the path parameter.
      inputs:
        - parameters/MissionType.yaml
  depth:
    type: integer
    format: int32
    minimum: 0
    description: >-
      The number of suggests hops the walk followed, the depth parameter of the request or its
      default. It has no maximum: a later version may raise the maximum the request accepts, and
      an answer then still conforms to this schema, so raising it is compatible.
    x-derived:
      rule: The depth query parameter, or 2 when the request has none.
      inputs:
        - parameters/Depth.yaml
  governanceFingerprint:
    allOf:
      - $ref: Sha256Digest.yaml
    description: >-
      A digest of the governance the answer was computed from: the packs in force in merge order
      (pack id, version and level) and the merged graph, its nodes and edges in a canonical sorted
      order, impacts strengths included. Two answers with the same fingerprint were computed from
      the same governance; it does not change with host paths, file formatting or the order nodes
      and edges are declared in. Consumers compare it; they never parse it.
    x-source:
      path: service/charter-domain/src/main/java/ai/speckitty/charter/domain/CharterOffering.java
      symbol: CharterOffering.governanceFingerprint
  guidance:
    type: array
    description: >-
      The artifacts the offering's walk lists for the action, each artifact once, sorted by URN.
      The walk has five breadth-first steps. Scope: the targets of the scope edges of the action
      node, one hop; the mission type node's scope edges are not walked. Requires: the scoped
      artifacts' requires edges, transitively. Suggests: the suggests edges of the scoped artifacts,
      up to depth hops; an artifact that is only required does not seed it, but a suggests path
      still passes through it. Requires of suggested: the requires edges of the
      suggested artifacts, transitively; the suggested artifacts' own suggests are not walked.
      Vocabulary: the vocabulary edges of everything listed, one hop. An artifact is listed by the
      first step that reaches it, so its relation is the strongest reason it applies.
    items:
      $ref: GuidanceEntry.yaml
    x-derived:
      rule: >-
        Scope from action:<missionType>/<action>; requires from the scoped artifacts; suggests from
        the scoped artifacts up to depth steps; requires from the suggested artifacts;
        vocabulary from every artifact listed. Each step is breadth-first and cycle-safe, never
        lists a node an earlier step listed, and still walks through it. Entries are sorted by the
        full URN string.
      inputs:
        - parameters/MissionType.yaml
        - parameters/Action.yaml
        - parameters/Depth.yaml
  diagnostics:
    type: array
    description: >-
      The load findings of the offering the answer was computed from: the same findings the pack
      listing reports per pack, across all packs in load order. Empty when every pack loaded
      cleanly. A scope target the graph does not declare is not a finding; it is listed with a null
      label.
    items:
      $ref: Diagnostic.yaml
    x-source:
      path: service/charter-read-app/src/main/java/ai/speckitty/charter/read/ActionContext.java
      symbol: ActionContext.diagnostics
