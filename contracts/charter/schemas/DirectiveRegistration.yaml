title: DirectiveRegistration
description: >-
  The registration body of a directive: its fields only. A directive carries no relationships: every relationship is
  authored in the pack's graph documents and registered through PUT /packs/{packId}/relationships, the only
  operation that writes one (ADR-0064). On POST to the collection the id is optional (the server answers with
  Location); on PUT the id is taken from the path.
  A member this schema does not declare is refused 422 validation_failed, naming the member, before the body is bound
  and nothing is written (ADR-0064).
  A list in this body is never null and holds no null item: a list is sent as an array, [] where it may be empty, and
  an optional one may be left out. A null list, or a null item in one, is refused 422 validation_failed before the body
  is bound, whatever else the body breaks (the detail names the list and the item, counted from 0); a null field inside
  an object item breaks a constraint this schema declares and is refused 400 Bad Request. The body is at most 1 MiB; a
  larger body is refused 422 validation_failed before it is read.
type: object
additionalProperties: false
required:
  - schemaVersion
  - title
  - intent
  - enforcement
properties:
  id:
    type: string
    maxLength: 128
    description: The directive's identity; optional on POST (server-assigned via Location), path-supplied on PUT.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/DirectiveIdentifier.java
      symbol: DirectiveIdentifier.value
  schemaVersion:
    type: string
    description: The schema version the directive declares.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.schemaVersion
  title:
    type: string
    description: The directive's title.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.title
  intent:
    type: string
    description: What the directive binds.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.intent
  enforcement:
    type: string
    description: How strictly the directive binds, as a token (required, lenient-adherence, advisory).
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Enforcement.java
      symbol: Enforcement.token
  scope:
    type: ['string', 'null']
    description: The directive's scope; null when it declares none.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.scope
  integrityRules:
    type: array
    description: The directive's integrity rules, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.integrityRules
  validationCriteria:
    type: array
    description: The directive's validation criteria, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.validationCriteria
  explicitAllowances:
    type: array
    description: The directive's explicit allowances, in authored order.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/Directive.java
      symbol: Directive.explicitAllowances
