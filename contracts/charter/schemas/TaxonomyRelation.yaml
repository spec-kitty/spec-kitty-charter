title: TaxonomyRelation
description: >-
  A relation of the charter's model, in RelationType order: every value of Relation, tension among them (ADR-0045
  decision 1), and implemented_by, which a guard derives and no one authors (ADR-0054 decision 3). Relation leaves
  implemented_by out because no relationship read or write names it; the kind taxonomy names every relation, so it
  carries its own enum. A parity test keeps it equal to the domain's relations.
type: string
enum:
  - requires
  - suggests
  - applies
  - scope
  - vocabulary
  - instantiates
  - refines
  - specializes_from
  - enhances
  - overrides
  - reconciles_tension
  - rejects
  - tension
  - implemented_by
