title: TaxonomyRelation
description: >-
  A relation of the charter's model, in RelationType order, then in_tension_with: every value of Relation and, beside
  them, implemented_by, which a guard derives and no one authors (ADR-0054 decision 3), and in_tension_with, the
  tension the service holds beside the relationships (ADR-0028, ADR-0045). Relation leaves those two out because no
  relationship read or write names them; the kind taxonomy names every relation, so it carries its own enum. A parity
  test keeps it equal to the domain's relations.
type: string
enum:
  - requires
  - suggests
  - applies
  - scope
  - vocabulary
  - instantiates
  - refines
  - specializes_from
  - enhances
  - overrides
  - reconciles_tension
  - rejects
  - implemented_by
  - in_tension_with
