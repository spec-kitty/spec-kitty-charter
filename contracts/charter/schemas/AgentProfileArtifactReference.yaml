title: AgentProfileArtifactReference
description: >-
  A tactic, toolguide or styleguide an agent profile cites, with the reason (a tactic-references, toolguide-references
  or styleguide-references item in the file).
type: object
additionalProperties: false
required:
  - id
  - rationale
properties:
  id:
    type: string
    description: >-
      The cited artifact's id, as the profile writes it: bare when the artifact is in the profile's own pack,
      `<pack>::<id>` when it is in another pack, or with the kind written out (`<pack>::tactic:<id>`).
