title: ActivationSkippedReport
description: >-
  The skipped report of an activation's effective set (ADR-0020 D7): each artifact of the merged closure that is not in
  force, once, in the bucket of the rule that decided it. It is answered with the revision and the fingerprint it was
  computed from and covered by the same ETag as the effective list.
type: object
additionalProperties: false
required:
- activationId
- revision
- governanceFingerprint
- report
- _links
properties:
  activationId:
    allOf:
    - $ref: ActivationId.yaml
    description: The activation's id.
    x-derived:
      rule: The {activationId} path segment, or the ULID the service minted on POST (ADR-0020 D2, D3).
      inputs:
      - parameters/ActivationId.yaml
  revision:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The activation's revision: sha256: and the hex SHA-256 of the RFC 8785 (JCS) serialization of its canonical
      config.
    x-derived:
      rule: SHA-256 over the JCS serialization of the canonical ActivationConfig.
      inputs:
      - schemas/ActivationConfig.yaml
  governanceFingerprint:
    allOf:
    - $ref: Sha256Digest.yaml
    description: >-
      The source fingerprint, as ServiceInfo.sourceFingerprint, of the packs of the activation's closure that this
      answer was computed from; with revision, it ties the answer to both the document and the packs.
    x-derived:
      rule: The source fingerprint of the packs the answer was computed from.
      inputs:
      - schemas/ServiceInfo.yaml#/properties/sourceFingerprint
  report:
    $ref: SkippedReport.yaml
  _links:
    $ref: Links.yaml
