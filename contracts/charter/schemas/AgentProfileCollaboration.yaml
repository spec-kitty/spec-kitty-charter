title: AgentProfileCollaboration
description: >-
  How an agent profile hands work over and what it produces (collaboration in the file). Every list is an array, []
  when the file declares none; the stored profile does not tell an absent collaboration from one with six empty lists.
type: object
additionalProperties: false
required:
  - handoffTo
  - handoffFrom
  - worksWith
  - outputArtifacts
  - operatingProcedures
  - canonicalVerbs
