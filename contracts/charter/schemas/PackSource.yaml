title: PackSource
description: >-
  The request body of POST /packs (registerPackFromSource): one source the service fetches a whole pack from, and the
  pack it registers the fetched tree as. One closed object, not a union (ADR-0065 D10): kind picks the source and
  decides which of the other members are read, and a member that is foreign to the kind is refused (the registration
  ends refused with 422 pack_source_refused and a fixed reason). The body is guarded by the shared body limit. Of the
  four source kinds of ADR-0005 only three are built: https_archive, git and filesystem. The service-stored kind is
  PUT /packs/{packId} with the archive as the body, and the published-artifact kind is deferred.
  https_archive takes url and, optionally, sha256 (the downloaded body must match it). git takes url and ref and,
  optionally, commit (the resolved commit must equal it; a branch ref without a commit needs If-Match on the target
  pack, else 428). filesystem takes path.
type: object
additionalProperties: false
required:
  - kind
  - packId
properties:
  kind:
    type: string
    enum:
      - https_archive
      - git
      - filesystem
    description: >-
      The source kind. A kind whose charter.pack-sources.<kind>.enabled flag is off, or git on a host whose system git
      is missing or older than 2.50.1, is answered 503 pack_source_unavailable.
    x-derived:
      rule: The source kind the client chose.
      inputs:
        - the request body
  packId:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    maxLength: 63
    description: >-
      The target: the configured identifier the fetched pack is registered under, the one a path /packs/{packId}
      takes. The name its pack.yaml declares must equal it.
    x-derived:
      rule: The target pack identifier the client chose.
      inputs:
        - the request body
  url:
    type: string
    pattern: '^https://\S+$'
    maxLength: 2048
    description: >-
      For https_archive and git: the https URL (a URI) of the archive or of the repository. Its host must be on the exact
      allowlist of its kind (charter.pack-sources.https.allowed-hosts or charter.pack-sources.git.allowed-hosts, both
      empty by default); a host that is not, a non-global address and a port other than 443 are refused.
    x-derived:
      rule: The URL the client chose.
      inputs:
        - the request body
  ref:
    type: string
    maxLength: 255
    description: >-
      For git: a commit id (40 or 64 lower-case hex digits), or refs/heads/<name> or refs/tags/<name> where <name>
      holds only letters, digits, dot, underscore, slash and hyphen (1 to 200 characters), never starts with a hyphen
      or a slash, and holds no .., //, @{, .lock suffix, trailing slash or dot, or control character. Anything else is
      refused before a process starts.
    x-derived:
      rule: The git ref the client chose.
      inputs:
        - the request body
  commit:
    type: string
    pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
    description: >-
      For git: the commit the ref must resolve to, 40 or 64 lower-case hex digits. A mismatch is refused. Optional.
    x-derived:
      rule: The commit the client expects the ref to resolve to.
      inputs:
        - the request body
  sha256:
    type: string
    pattern: '^[0-9a-f]{64}$'
    description: >-
      For https_archive: the SHA-256 of the archive as 64 lower-case hex digits. A downloaded body that does not match
      it is refused. Optional.
    x-derived:
      rule: The digest the client expects the archive to have.
      inputs:
        - the request body
  path:
    type: string
    minLength: 1
    maxLength: 4096
    pattern: '^(([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)/)*([^/\\.][^/\\]*|\.[^/\\.][^/\\]*|\.\.[^/\\]+)$'
    description: >-
      For filesystem: a relative path of slash-separated segments, none empty, . or .., with no leading slash and no
      backslash, resolved under the configured
      charter.pack-sources.filesystem.root and read without following links. The root is unset by default, and the
      source is then refused.
    x-derived:
      rule: The relative path the client chose.
      inputs:
        - the request body
