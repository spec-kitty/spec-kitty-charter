title: DeactivatedArtifacts
description: >-
  The deny lists: per activatable kind, the artifacts the user deactivated (ADR-0013). A deny entry wins over a
  selection and a cascade; an artifact a pack requires or locks cannot be deactivated (409). A deny entry is never
  stored for an unknown kind or a required or locked id (ADR-0020 D9).
  Absent, the activation excludes nothing.
type: object
additionalProperties: false
