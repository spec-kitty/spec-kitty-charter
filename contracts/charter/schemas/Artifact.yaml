title: Artifact
description: >-
  One artifact of a pack in the common envelope: its kind, its id, the pack, its links, and exactly
  one kind-named member holding the artifact in its kind's own representation, the member kind
  names. The other members are absent. The oneOf below documents the exactly-one rule; the
  service fills the one member itself, whatever a generated client enforces of it. An agent profile also carries
  governance, the entries its pack-scoped walk lists; no other kind does. A mission_step_contract is
  answered by the generic item read (getPackArtifact) in member missionStepContract. A mission_type is answered in
  member missionType by its own read, getPackMissionType, whose literal path the service prefers over the generic
  one. Neither of the two answers an ETag: neither kind has a write.
type: object
additionalProperties: false
required:
  - kind
  - id
  - packId
  - _links
oneOf:
  - required:
      - tactic
  - required:
      - directive
  - required:
      - styleguide
  - required:
      - paradigm
  - required:
      - toolguide
  - required:
      - procedure
  - required:
      - agentProfile
  - required:
      - missionType
  - required:
      - missionStepContract
properties:
  kind:
    type: string
    pattern: '^[a-z0-9][a-z0-9_-]*$'
    maxLength: 64
    description: >-
      The kind token; this version serves tactic, directive, styleguide, paradigm, toolguide,
      procedure, agent_profile, mission_type and mission_step_contract; a client tolerates a kind it does not know (skips the
      item). It names the one member that holds the artifact: agent_profile names agentProfile, the member of
      mission_type is missionType and the member of mission_step_contract is missionStepContract.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/ArtifactKind.java
      symbol: ArtifactKind.token
  id:
    type: string
    description: The artifact's id within its kind and pack.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/CharterArtifact.java
      symbol: CharterArtifact.localId
  packId:
    type: string
    description: The identity of the pack the artifact was read from, as the request named it.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/CharterArtifact.java
      symbol: CharterArtifact.packId
  _links:
    $ref: Links.yaml
  tactic:
    $ref: Tactic.yaml
  directive:
    $ref: Directive.yaml
  styleguide:
    $ref: Styleguide.yaml
  paradigm:
    $ref: Paradigm.yaml
  toolguide:
    $ref: Toolguide.yaml
  procedure:
    $ref: Procedure.yaml
  agentProfile:
    $ref: AgentProfile.yaml
  missionType:
    $ref: MissionType.yaml
  missionStepContract:
    $ref: MissionStepContract.yaml
  governance:
    type: array
    description: >-
      The governance of an agent profile read from its pack: the artifacts its walk lists, sorted by urn, each with how it
      was reached and whether a pack of the closure holds it. Present only with an agentProfile member, and an empty
      array when the walk lists nothing. No other kind carries it.
    items:
      $ref: PackGovernanceEntry.yaml
    x-derived:
      rule: The pack-scoped governance walk of the profile over the pack's composed depends_on closure.
      inputs:
        - schemas/PackGovernanceEntry.yaml
