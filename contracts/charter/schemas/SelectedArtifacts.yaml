title: SelectedArtifacts
description: >-
  The allow lists: per activatable kind, the artifacts the activation selects. A kind that is absent selects none of
  the kind, skill and mission_type included (ADR-0053 d10); what a pack requires or locks is in force whatever the
  lists hold. One property per ActivatableKind, so a kind outside that vocabulary is refused (422
  activation_invalid).
type: object
additionalProperties: false
properties:
  directive:
    allOf:
    - $ref: ArtifactIdList.yaml
    description: The directive ids. Absent means none of the kind; [] means none; a list means exactly those.
    x-source:
      path: contracts/offering/schemas/ActivationConfig.schema.json
      symbol: '#/$defs/SelectedArtifacts/properties/directive'
