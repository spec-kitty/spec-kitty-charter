title: SelectedArtifacts
description: >-
  The allow lists: per activatable kind, the artifacts the activation selects. A kind that is absent takes its default:
  every artifact of the kind, except skill, whose default is only the required skills. One property per ActivatableKind,
  so a kind outside that vocabulary is refused (422 activation_invalid).
type: object
additionalProperties: false
properties:
  directive:
    allOf:
    - $ref: ArtifactIdList.yaml
    description: >-
      The directive ids. Absent means every artifact of the kind; [] means none; a list means exactly those.
    x-source:
      path: contracts/offering/schemas/ActivationConfig.schema.json
      symbol: '#/$defs/SelectedArtifacts/properties/directive'
  tactic:
    allOf:
    - $ref: ArtifactIdList.yaml
    description: The tactic ids. Absent means every artifact of the kind; [] means none; a list means exactly those.
