title: ReferencedArtifact
description: >-
  One reference an artifact writes, resolved through the compose: an edge of its pack's graph documents whose source
  is the artifact, or a relation it derives (ADR-0064). It carries the target as written, the edge's relation, the
  pack that holds what it names, the bare URN it resolves to and, when the target is an artifact the service serves,
  the link to read it. A bare reference is held
  by the pack that writes it, which shadows a same-named artifact of another pack (FR-014); a pack-qualified one is
  held by the pack it names. A reference no pack of the compose holds, such as one to a kind the pack does not
  define, has no holdingPack and no artifact link. Read under an activation (listEffectiveArtifactReferences), the same
  reference also links effective-artifact, its read under the activation, when the activation's closure holds it.
type: object
additionalProperties: false
required:
  - reference
  - relation
  - urn
  - _links
properties:
  reference:
    allOf:
      - $ref: PackQualifiedReference.yaml
    description: The edge's target as the graph document writes it, bare or <pack-name>::<kind>:<id>.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/PackEdge.java
      symbol: PackEdge.target
  relation:
    $ref: Relation.yaml
  holdingPack:
    $ref: HoldingPack.yaml
  urn:
    allOf:
      - $ref: Urn.yaml
    description: The bare URN the reference resolves to; the pack is provenance and never part of it.
    x-source:
      path: service/kernel/src/main/java/ai/speckitty/charter/kernel/domain/PackQualifiedReference.java
      symbol: PackQualifiedReference.asUrn
  _links:
    $ref: Links.yaml
