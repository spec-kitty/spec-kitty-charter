  - tactic
  - styleguide
  - toolguide
  - paradigm
  - procedure
  - agent_profile
  - glossary_context
  - term
  - skill
  - anti_pattern
  - asset
  - template
  - action
  - mission_type
  - guard
  - lifecycle
  - step_enhancement
  - routing_catalog
