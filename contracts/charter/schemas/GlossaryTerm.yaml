title: GlossaryTerm
description: >-
  One term of a glossary context, as getPackGlossaryTerm answers it (ADR-0049 decision 3, ADR-0074 decision 11): the
  fields of the pack file in camel case, then its URN term:<context-id>/<term-id> and the id of the context that holds
  it. _links holds self and up, the context's read (getPackGlossaryContext). A member the file does not state is
  absent.
type: object
additionalProperties: false
required:
  - id
  - name
  - definition
  - status
  - urn
  - contextId
  - _links
properties:
  id:
    type: string
    maxLength: 64
    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    description: The term's identity within its context, the second segment of its URN.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.id
  name:
    type: string
    minLength: 1
    description: The canonical surface form of the term.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.name
  definition:
    type: string
    minLength: 1
    description: What the term means.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.definition
  status:
    type: string
    enum:
      - draft
      - active
      - deprecated
    description: The term's status (ADR-0053 decision 14), draft, active or deprecated.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/TermStatus.java
      symbol: TermStatus.token
  examples:
    type: array
    minItems: 1
    description: Example uses, in authored order; absent when the file states none.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.examples
  aliases:
    type: array
    minItems: 1
    description: Accepted alternative forms, in authored order; absent when the file states none.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.aliases
  avoid:
    type: array
    minItems: 1
    description: >-
      Forms not to use, in authored order: the one source of taboos (ADR-0049 decisions 5 and 15); absent
      when the file states none.
    items:
      type: string
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.avoid
  seeAlso:
    type: array
    minItems: 1
    description: >-
      Related terms, in authored order; absent when the file states none. Each entry is a term reference, bare
      (term:<context-id>/<term-id>, a term of the same pack) or pack-qualified (<pack>::term:<context-id>/<term-id>, a
      term of another pack), answered as written: a reference that no held context resolves is not judged here.
    items:
      type: string
      description: >-
        A bare or pack-qualified term reference whose context id and term id are each a letter-first kebab slug of at
        most 64 characters, as glossary.schema.json bounds them; the contract's pattern holds no lookahead, which its
        validator does not read, so the 64-character bound of each id is the pack schema's. The pattern writes the
        slash as [/], not as a bare slash, because OpenAPI Generator corrupts a star-slash inside the comments it
        generates. The pack name of a qualified reference is a pack id of at most 63 characters (ADR-0075 decision 2);
        the pattern does not cap it, and the service refuses a longer one (#582).
      pattern: '^([a-z0-9]+(-[a-z0-9]+)*::)?term:[a-z][a-z0-9]*(-[a-z0-9]+)*[/][a-z][a-z0-9]*(-[a-z0-9]+)*$'
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.seeAlso
  urn:
    type: string
    pattern: '^term:[a-z][a-z0-9]*(-[a-z0-9]+)*[/][a-z][a-z0-9]*(-[a-z0-9]+)*$'
    description: The term's address, term:<context-id>/<term-id>.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryTerm.java
      symbol: GlossaryTerm.urn
  contextId:
    type: string
    maxLength: 64
    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    description: The identity of the glossary context that holds the term.
    x-source:
      path: service/packs/src/main/java/ai/speckitty/charter/packs/domain/GlossaryContext.java
      symbol: GlossaryContext.id
  _links:
    $ref: Links.yaml
x-source:
