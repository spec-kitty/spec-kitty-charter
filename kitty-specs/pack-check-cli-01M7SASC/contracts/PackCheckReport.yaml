# Draft of contracts/charter/schemas/PackCheckReport.yaml (IC-05). Not served by any operation: the standard output of
# the pack-check CLI (ADR-0075 decision 9, ruling D2). Uses only the keywords ContractConformance allows.
title: PackCheckReport
description: >-
  What pack-check writes on standard output: the checks that ran over the set of packs, the packs it checked, any check
  it skipped and why, and the problems, each a Problem with the code and the shape the registration answers for the
  same fault. No operation serves it. An empty problems list is a valid set, and pack-check then exits 0; otherwise 1.
type: object
additionalProperties: false
required:
  - checks
  - packs
  - problems
properties:
  checks:
    type: array
    minItems: 1
    maxItems: 3
    description: The checks that ran over the whole set, in this order; PACK always runs.
    items:
      type: string
      enum: [PACK, CLOSURE, ROUND_TRIP]
    x-derived:
      rule: PACK; CLOSURE when every pack's composition facts could be read; ROUND_TRIP with --round-trip.
      inputs:
        - the command line
        - the packs checked
  packs:
    type: array
    minItems: 1
    description: Every pack checked, in the order given, or in name order under a config root.
    items:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
          minLength: 1
          description: The pack's directory name.
        level:
          $ref: PackLevel.yaml
        path:
          type: string
          minLength: 1
          description: The pack's directory as given on the command line.
    x-derived:
      rule: The packs of --pack or of the config root's packs directory, each at its configured or declared level.
      inputs:
        - the command line
  skipped:
    type: array
    description: Only when a check did not run although asked; today only CLOSURE, when a pack has no facts.
    items:
      type: object
      additionalProperties: false
      required: [check, reason]
      properties:
        check:
          type: string
          enum: [CLOSURE]
        reason:
          type: string
          minLength: 1
    x-derived:
      rule: The packs whose composition facts could not be read.
      inputs:
        - the packs checked
  problems:
    type: array
    description: >-
      Per pack, in order: one validation_failed problem when the pack has a violation (its instance is the pack's path);
      otherwise, when its facts could not be read, one problem with the refusal's code (e.g. pack_unreadable); then one
      validation_failed problem for its round-trip reasons. Then one problem per composition fault, with its code and
      packs. A pack never gets two problems for one cause. Empty when the set is valid.
    items:
      $ref: ../../_shared/schemas/Problem.yaml
    x-derived:
      rule: The verdicts of PACK, ROUND_TRIP and CLOSURE, as the registration words each fault.
      inputs:
        - the packs checked
