// Narrows PIT to the classes and tests named on the command line, so a mutation run covers one work package's
// classes instead of the whole module (the module default in charter.domain-conventions targets ai.speckitty.charter.*).
//
//   ./gradlew :charter-domain:pitest --no-configuration-cache --max-workers=2 \
//     -I service/charter-domain/pit-targets.init.gradle \
//     -Dpit.classes=ai.speckitty.charter.domain.PackPolicy,ai.speckitty.charter.domain.Pep440 \
//     -Dpit.tests='ai.speckitty.charter.domain.*'
//
// -Dpit.classes and -Dpit.tests are comma-separated; -Dpit.tests is optional.
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('info.solidsoft.pitest') && System.getProperty('pit.classes')) {
            p.pitest.targetClasses = System.getProperty('pit.classes').split(',') as Set
            if (System.getProperty('pit.tests')) {
                p.pitest.targetTests = System.getProperty('pit.tests').split(',') as Set
            }
        }
    }
}
