// Narrows PIT to the classes and tests named on the command line, so a mutation run covers one work package's
// classes instead of a module's whole PIT scope. A module's scope comes from charter.mutation-conventions
// (ai.speckitty.charter.*) or, in packs, from its build file: domain, application, infra.storage, infra.fetch and
// infra.archive, with their unit tests only; infra.api is not mutated. A narrowed packs run keeps the packs exclusions
// (application.config, infra.fetch.config, infra.api, *WiredTest and the whole-pack, timing, git-host and
// stress tags); pass the -P flags every packs run takes.
//
//   ./gradlew :packs:pitest --no-configuration-cache --max-workers=2 \
//     -I service/packs/pit-targets.init.gradle \
//     -PrequireSymlinks=true \
//     -Dpit.classes=ai.speckitty.charter.packs.domain.PackPolicy \
//     -Dpit.tests='ai.speckitty.charter.packs.domain.*'
//
// -Dpit.classes and -Dpit.tests are comma-separated; without -Dpit.tests the module's own target tests run. A narrowed
// run is not a floor measurement: its mutationFloors groups would hold only some of their classes, or none, so
// checkMutationFloors (#239) is skipped. The report is in build/reports/pitest as usual.
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('info.solidsoft.pitest') && System.getProperty('pit.classes')) {
            p.pitest.targetClasses = System.getProperty('pit.classes').split(',') as Set
            if (System.getProperty('pit.tests')) {
                p.pitest.targetTests = System.getProperty('pit.tests').split(',') as Set
            }
            p.tasks.matching { it.name == 'checkMutationFloors' }.configureEach { it.enabled = false }
        }
    }
}
