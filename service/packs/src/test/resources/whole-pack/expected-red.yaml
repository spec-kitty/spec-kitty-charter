# What the whole-pack gate (#187) expects NOT to round-trip yet, at the pinned open-packs commit, under the rules of
# ADR-0036. The gate passes only when the observed reds are exactly these: an unlisted red fails, and a listed item
# that round-trips fails with "remove it". When your mission turns a kind green, remove its entry in the same change.
#
# kinds: a whole gate kind with no adapter yet. files: one file of a modelled kind that is known to differ.
# empty_kinds: a modelled kind the pack has no file of; it goes stale when the pack gains one. The example packs carry
# every kind (ADR-0070), so a missing kind is fixed in the example pack, never listed here.
kinds:
  - kind: policy
    reason: >-
      The mutability policy file (ADR-0063) has no gate adapter: the gate writes through DomainRepositoryService, which
      does not write policy.yaml (only WholePackStore does, covered by PolicyRoundTripTest). The built-in example holds
      one, as the data model requires; the entry goes when the round trip models the kind.
    issue: "https://github.com/spec-kitty/spec-kitty-charter/issues/476"
files: []
empty_kinds: []
