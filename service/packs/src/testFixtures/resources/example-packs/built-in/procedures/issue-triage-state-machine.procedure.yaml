schema_version: '1.0'
id: issue-triage-state-machine
title: Issue Triage State Machine
description: |
  Triage incoming bugs and enhancements into a single current state, preserving durable handoff context for agents and durable rejection context for future maintainers. The procedure is tracker-neutral: GitHub labels are one possible carrier, but the invariant is a category plus exactly one workflow state.
entry_condition: |
  An incoming issue, support report, feature request, or bug report needs classification before it can be planned, delegated, rejected, or sent back for more information.
exit_condition: |
  The issue has one category, one state, and a durable record appropriate to that state: questions for the reporter, an agent brief, a human handoff, or an out-of-scope decision record.
steps:
- title: Read the whole issue history
  description: |
    Load the issue body, comments, labels or tracker status, prior triage notes, reporter context, and any existing out-of-scope records for similar concepts. Do not classify from the title alone.
- title: Enforce one category and one state
  description: |
    Assign one category such as bug or enhancement and one state such as needs-triage, needs-info, ready-for-agent, ready-for-human, or wontfix. If existing tracker labels conflict, surface the conflict before making changes.
- title: Reproduce or bound bugs
  description: |
    For bug reports, attempt to reproduce the behavior or identify the missing reproduction detail before moving the issue to ready-for-agent. A confirmed reproduction should feed the agent brief; an underspecified report should move to needs-info with specific questions.
- title: Create a durable agent brief for delegated work
  description: |
    When the issue is ready for an autonomous agent, write a brief that describes current behavior, desired behavior, key interfaces or contracts, acceptance criteria, and out-of-scope boundaries. Avoid file paths, line numbers, and step-by-step implementation instructions that will go stale.
- title: Route human-only work explicitly
  description: |
    If the issue requires product judgment, external credentials, manual validation, or unresolved design choices, mark it ready for a human and summarize what is known plus why it should not be delegated yet.
- title: Preserve rejected enhancement decisions
  description: |
    For rejected enhancements, create or update an out-of-scope record keyed by concept. Capture the decision, durable rationale, and prior requests so future similar issues can be recognized without relying on memory.
- title: Resume from prior triage state
  description: |
    When a reporter replies or a maintainer reopens discussion, continue from the prior triage notes rather than re-asking resolved questions.
notes: |
  Adapted from the mattpocock/skills github-triage, qa, and triage-issue workflows at commit 49cec7be019bc408e87b77670f3d442f536da254.
