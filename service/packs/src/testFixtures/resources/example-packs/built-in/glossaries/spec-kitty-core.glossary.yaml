# The Spec Kitty core vocabulary, a glossary context (ADR-0049).
schema_version: '1.0'
id: spec-kitty-core
name: Spec Kitty core
description: Canonical Spec Kitty terminology (migrated from spec_kitty_core.yaml).
tags:
- spec-kitty
- workflow
applies_to:
  paths:
  - kitty-specs/**
  - .kittify/**
  languages:
  - markdown
  - yaml
  stacks:
  - spec-kitty
terms:
- id: action-context
  name: action context
  definition: Aggregated runtime information resolved for a specific agent action, including mission slug, work package ID, base branch, workspace path, and dependency state. Passed to agents at step boundaries.
  avoid:
  - step bag
  status: active
- id: adversarial-squad
  name: adversarial squad
  definition: A bounded set of profile-loaded delegates, dispatched at an SDD point-cut, each casting a distinct doctrine lens chosen for that point-cut's question so independent perspectives converge on findings a single reviewer would miss. Optional and advisory, never a gate. Owned by the built-in adversarial-squad-deployment procedure (the single owner of when, who, and how).
  status: active
- id: advise-mode
  name: advise mode
  definition: An execution mode in which the harness proposes answers to interview questions for mission owner confirmation, without acting autonomously. The mission owner retains final authority on every decision.
  status: draft
- id: agent-skills
  name: agent skills
  definition: The skills-first agent command discovery model in which capabilities are installed as skill packages under .agents/skills/ and resolved at runtime by name.
  status: active
- id: base-branch
  name: base branch
  definition: 'At the mission level (branch-context output): alias for target_branch — the branch the mission is rooted in. At the worktree/WP level (WP prompt frontmatter): the specific git branch from which the individual lane worktree was created; may be a lane branch (e.g. kitty/mission-010-feature-lane-a) rather than the target branch itself. The same key therefore has different scopes: in branch-context JSON base_branch == target_branch; in WP frontmatter base_branch records the worktree''s immediate parent.

    '
  status: active
- id: behaviour-driven-development
  name: behaviour-driven development
  definition: A collaboration practice, not a testing methodology, that operates through Discovery (Three Amigos conversations produce concrete behavioral examples), Formulation (examples become plain-language Given/When/Then specifications), and Automation (specifications connect to executable tests). See the paradigm and the bdd-scenario-formulation tactic.
  aliases:
  - behavior-driven development
  status: active
- id: branch-strategy-gate
  name: branch strategy gate
  definition: 'The mission-create guard for PR-bound missions that requires an explicit operator or agent decision before planning artifacts are written on a primary branch. Interactive callers may confirm at the prompt; non-interactive callers record the already-made decision with --branch-strategy already-confirmed. When the recommended feature-branch path is chosen, pass --start-branch so the CLI switches before scaffold writes.

    '
  status: active
- id: build
  name: build
  definition: One checkout or worktree of one repository with its own execution context.
  status: active
- id: build-id
  name: build_id
  definition: Per-checkout/worktree identity, unique per working tree. Unchanged from pre-081.
  status: active
- id: bulk-edit
  name: bulk edit
  definition: A codebase-wide mechanical rename or terminology migration tracked as a mission with change_mode set to bulk_edit. Governed by the occurrence classification guardrail workflow.
  status: active
- id: catastrophic-backtracking
  name: catastrophic backtracking
  definition: 'A regular-expression engine failure mode in which a vulnerable pattern combined with

    adversarial input drives matching time into exponential or polynomial complexity.

    Backtracking engines (Python `re`, JavaScript, Java, .NET) attempt every possible

    partition of the input when a match fails; patterns with nested or consecutive

    non-possessive repetitions can produce O(2^N) or O(N^c) retry storms. The

    `secure-regex-catastrophic-backtracking` tactic at

    `src/doctrine/tactics/shipped/secure-regex-catastrophic-backtracking.tactic.yaml`

    codifies the four dangerous-shape patterns, the rewrite ladder (bound quantifier →

    refactor nested → possessive/atomic group → negated char class), and the escape

    hatches (drop the regex, re2, multi-pass, bounded-input cap). Every fix requires a

    wall-clock regression test asserting linear runtime on an adversarial input

    (default budget: ≤100 ms for 100 000 chars), per FR-008. Synonym "ReDoS"

    (Regular-expression Denial of Service) is acceptable only as a parenthetical.

    '
  aliases:
  - ReDoS
  status: active
- id: ceremony-commit
  name: ceremony commit
  definition: DEPRECATED. Replaced by `status commit`. This term obscures intent and is forbidden in active source. See the canonical `status commit` entry.
  status: deprecated
  see_also:
  - term:spec-kitty-core/status-commit
- id: change-mode
  name: change mode
  definition: 'A mission-level metadata flag (change_mode: bulk_edit) that activates the bulk-edit guardrail workflow, requiring an occurrence map before any work package may be approved.'
  status: active
- id: charter
  name: charter
  definition: A governance document synthesizing a project's purpose, constraints, team norms, and the body of project-specific governance artifacts — directives, tactics, and styleguides — into a durable reference artifact. Produced by the charter interview workflow.
  status: active
- id: characterization-test
  name: characterization test
  definition: 'A test that captures the observable behavior of existing code as fixture-driven assertions,

    written before any refactor of that code. The refactor must leave the characterization test

    green. See the `tdd-red-green-refactor` tactic. Distinguished from snapshot tests (overloaded

    term) and regression tests (too broad).

    '
  status: active
- id: charter-lint
  name: charter lint
  definition: Graph-native decay detection that validates the internal consistency and freshness of doctrine artifacts in the doctrine reference graph. Identifies stale references, missing edges, and definition drift.
  status: draft
- id: conflict-prediction
  name: conflict prediction
  definition: A dry-run forecast of which files will conflict and which conflicts are auto-resolvable, produced before a merge begins to help the mission owner decide whether to proceed.
  status: draft
- id: current-branch
  name: current branch
  definition: 'The git branch checked out in the main repository at the moment a spec-kitty workflow command (specify, plan, tasks, implement) is invoked. Read ephemerally from the working tree; never persisted in any mission artifact. Exposed as current_branch / CURRENT_BRANCH in branch-context JSON output. Since WP07 (FR-012), spec-kitty refuses to derive the mission target from current_branch — it reads target_branch from meta.json instead, so the branch contract is stable regardless of which branch the operator is on when driving the mission.

    '
  status: active
- id: decision-moment
  name: decision moment
  definition: A local CLI artifact representing a choice point in an interview flow (charter, specify, or plan) where the mission owner or a delegated agent must provide input before the flow can continue.
  status: draft
- id: deliberate-linearity
  name: deliberate linearity
  definition: 'A function whose body is intentionally kept long-and-linear (rather than extracted into

    named helpers) for traceability against a documented contract, code-review map, or

    output-section sequence. Deliberate linearity functions are NOT refactor candidates

    regardless of Sonar S3776 score. Identified by an explicit code comment justifying the

    structure and/or a published output-section contract that reviewers verify line-by-line.

    Refactoring a deliberately linear function without updating its contract is a regression

    in traceability. Canonical example: `src/specify_cli/cli/commands/_auth_doctor.py::render_report`

    (CC 53; intentional 7-section layout). Distinct from structural debt.

    '
  status: active
- id: diff-compliance-gate
  name: diff compliance gate
  definition: The review-time check that validates a work package diff against its occurrence map. Blocks approval if uncategorized or improperly changed occurrences are found.
  status: active
- id: directive
  name: directive
  definition: A doctrine artifact encoding a specific governance rule or constraint. The primary building block of a project's governance; referenced by agent profiles and action scopes.
  status: active
- id: doctrine-reference-graph
  name: doctrine reference graph
  definition: The directed graph of interconnected doctrine directives, tactics, and styleguides that defines a project's governance structure. Abbreviated as drg. Edges encode requires, suggests, and replaces relationships between nodes.
  status: active
- id: drg
  name: drg
  definition: Abbreviation for doctrine reference graph — the directed graph of interconnected governance artifacts (directives, tactics, styleguides) defining a project's doctrine.
  status: active
- id: evidence-bundle
  name: evidence bundle
  definition: The set of inputs provided to charter synthesis — code-reading signals, configured URLs, and bundled corpus snapshots. Determines what the harness can reason about when generating doctrine artifacts.
  status: draft
- id: feature-slug
  name: feature slug
  definition: DEPRECATED. The Terminology Canon prohibits 'feature' for the Mission domain object. Use `mission_slug` (see the canonical `mission_slug` entry).
  status: deprecated
  see_also:
  - term:spec-kitty-core/mission-slug
- id: feature-branch
  name: feature branch
  definition: 'Alias of topic branch: a short-lived branch carrying one change to a pull request. Prefer "topic branch" in canonical and operator-facing language.'
  status: deprecated
  see_also:
  - term:spec-kitty-core/topic-branch
- id: friendly-name
  name: friendly_name
  definition: The human-readable title string of a mission, used for display in dashboards and logs. Mutable — changing it does not affect routing or identity.
  status: active
- id: gate-binding
  name: gate binding
  definition: A versioned doctrine declaration attaching a named gate handler to a status-transition edge (`{on_transition, handler, handler_kind, schema_version, fail_open, provenance}`), carried by a guard of the work-package lifecycle. A binding is a field/relationship, not a standalone artefact. Do NOT confuse with the five pre-existing `*gate*` senses (branch strategy gate / diff compliance gate / dependency gate / merge dependency gate / sonar quality gate) — those are unrelated one-off guards, not doctrine-resolved lane-edge checks.
  status: active
- id: gate-handler
  name: gate handler
  definition: A named, dispatchable check registered in `GATE_REGISTRY`; the Spec-Kitty pre-review engine is the first handler, keyed to the `for_review` edge. Registry membership is the callable source; activation decides whether it runs. Do NOT confuse with the five pre-existing `*gate*` senses (branch strategy gate / diff compliance gate / dependency gate / merge dependency gate / sonar quality gate) — those are unrelated one-off guards, not doctrine-resolved dispatch callables.
  status: active
- id: glossary-chokepoint
  name: glossary chokepoint
  definition: The middleware enforcement point in the agent pipeline where glossary semantic checks are applied before generation proceeds. Configured by the strictness setting.
  status: draft
- id: harness
  name: harness
  definition: The host LLM or external system responsible for generating doctrine content during charter synthesis. Operates under a contract with spec-kitty's validation and staging pipeline; does not write artifacts directly.
  status: active
- id: implementation-concern
  name: implementation concern
  definition: Plan-level architectural unit of intent identified as IC-## in plan.md. An implementation concern captures purpose, requirements, affected surfaces, sequencing, and risks. It is not executable and is translated into one or more work packages by the tasks workflow.
  status: active
- id: lane
  name: lane
  definition: Legacy name for a work package's WP state (see `wp state`), kept in event field names (`from_lane`, `to_lane`). Canonical states are planned, claimed, in_progress, for_review, in_review, approved, done, blocked, and canceled. The alias doing means in_progress. approved means review passed and consolidation pending; done means consolidated into the target. In prose, a bare "lane" means an execution lane (as in lane branch and lane worktree); when you mean the WP's lifecycle state, say WP state.
  status: active
  see_also:
  - term:spec-kitty-core/wp-state
- id: wp-state
  name: wp state
  definition: The lifecycle state of a work package (planned, claimed, in_progress, for_review, in_review, approved, done, blocked, canceled), as the status event log records it. Older text and the event field names `from_lane`/`to_lane` call it a lane; in prose prefer WP state, so it is not confused with an execution lane. Read it with `spec-kitty agent tasks status`.
  status: active
- id: execution-lane
  name: execution lane
  definition: A group of work packages that `finalize-tasks` computes to run in sequence. In lane topologies each execution lane has one lane branch. By default (no explicit `--topology`), a Mission of at most 2 work packages, or with one lane, runs `single_branch` and has no lane branch. Not a WP state.
  status: active
- id: lane-branch
  name: lane branch
  definition: The branch that carries one execution lane's commits, named `kitty/mission-<slug>-<mid8>-lane-<id>`. It carries no copy of the Mission's status that anyone reads or writes; status lives on the resolved status surface. Consolidation removes it as its final step once it can prove the lane landed.
  status: active
- id: lane-worktree
  name: lane worktree
  definition: 'A Spec Kitty checkout of a lane branch under `.worktrees/`, provided by `spec-kitty implement` (or `spec-kitty agent action implement`). WP deliverables are written and committed there. Any status files it shows are never a status surface: nothing writes them there and no reader reads them. Never create, reuse or delete one by hand.'
  status: active
- id: coordination-worktree
  name: coordination worktree
  definition: The checkout of a Mission's coordination branch, used by the coordination topologies (`coord`, `lanes_with_coord`) to write lifecycle state. The coordination branch, not this checkout's working tree, is the lifecycle home; read status through the CLI, never from this checkout's files. Consolidation removes it as its final step.
  status: active
- id: write-checkout
  name: write checkout
  definition: The checkout a `single_branch` Mission writes in, on the Mission's write branch; usually the repository root checkout, or an owned checkout. One writer at a time.
  status: active
- id: harness-isolation-worktree
  name: harness isolation worktree
  definition: 'A checkout that an agent harness creates for an agent (for example `Agent(isolation: "worktree")`). Spec Kitty neither creates nor tracks it. It is not a lane worktree and never a status surface; do not run `spec-kitty implement` or status writes from it.'
  status: active
- id: write-branch
  name: write branch
  definition: 'The branch a Mission''s commits and, outside the coordination topologies, its status commits land on before consolidation: the Mission topic branch `kitty/mission-<slug>-<mid8>`, or the target branch when the Mission writes to it directly. The write checkout (`single_branch`) is checked out on it. Not the primary branch, which is the repository''s default branch.'
  status: active
- id: resolved-status-surface
  name: resolved status surface
  definition: The one place a Mission's status is read from and written to, as the CLI resolves it per topology. For `coord` and `lanes_with_coord` it is the coordination branch; for `single_branch` and `lanes` it is the write branch. Status commits land there. A lane checkout never shows, changes or serves the status files, and no reader reads status from a lane worktree, a coordination worktree or any other checkout's files. Read it with `spec-kitty agent tasks status --mission <handle>`.
  status: active
- id: approved
  name: approved
  definition: WP state meaning review passed, feedback resolved, and the WP is ready to consolidate. approved is not integrated and must not be treated as done. `spec-kitty consolidate` owns the approved -> done transition.
  status: active
- id: done
  name: done
  definition: WP state meaning the WP has been consolidated into the mission target branch, or explicitly force-marked as integrated with evidence. Review approval alone is not done.
  status: active
- id: accepted-work-package
  name: accepted work package
  definition: A WP counted by mission acceptance readiness because its WP state is approved or done. Accepted does not imply done; approved accepted work packages remain consolidation-pending.
  status: active
- id: merge-pending-work-package
  name: merge-pending work package
  definition: An approved WP that mission acceptance may count as accepted-ready but that has not yet been consolidated. Such WPs stay in the approved state until `spec-kitty consolidate` records done.
  status: active
- id: dependency-readiness
  name: dependency readiness
  definition: 'The condition the dependency gate evaluates before a work package may be claimed or implemented: every WP listed in its ``dependencies`` frontmatter must be in the ``approved`` or ``done`` WP state. ``approved`` is included deliberately — ``done`` is emitted only by whole-mission consolidation, so requiring a dependency to be strictly ``done`` would deadlock every same-mission dependency chain (the dependent WP could never start, so the mission could never consolidate, so the dependency could never reach ``done``). Computed by ``dependency_readiness_for_wp`` in ``src/specify_cli/core/dependency_graph.py``; intentionally matches the merge dependency gate (``policy/merge_gates.py`` treats ``{approved, done}`` as satisfied). ``for_review``, ``in_review``, ``blocked``, ``canceled``, and missing status are not ready.

    '
  status: active
- id: dependency-gate
  name: dependency gate
  definition: 'The pre-implementation enforcement point that refuses to start a work package until it meets dependency readiness (all declared dependencies are ``approved`` or ``done``). Enforced consistently at every claim path. The read-only surfaces — the ``next`` claim-discovery preview (``preview_claimable_wp``) and orchestrator-api ``list-ready`` — only ever surface ``planned`` candidates, so a dependency-blocked planned WP is simply withheld (preview returns ``dependencies_not_satisfied``; list-ready omits it). The imperative claim verbs — ``agent action implement``, the low-level ``implement`` command (before any workspace is created), and orchestrator-api ``start-implementation`` — additionally apply a resume guard: they enforce readiness only on the not-yet-started (``planned``/``claimed``) claim transition, so re-invoking implement on an already ``in_progress`` WP is a no-op resume, not a re-gated claim, and a dependency that later regresses out of ``approved``/``done`` does not block resuming in-flight work. On block the imperative verbs surface the stable ``dependencies_not_satisfied`` reason/error code.

    '
  status: active
- id: machine-level-runtime
  name: machine-level runtime
  definition: The ~/.kittify/ directory on a developer's machine, containing templates, global agent configs, and skills shared across all projects on that machine. Distinct from the per-project .kittify/ directory.
  status: active
- id: main-repo
  name: main repo
  definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout' for location or the explicit branch term you mean.
  status: deprecated
  see_also:
  - term:spec-kitty-core/repository-root-checkout
- id: main-repository
  name: main repository
  definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout' for location or the explicit branch term you mean.
  status: deprecated
  see_also:
  - term:spec-kitty-core/repository-root-checkout
- id: main-repository-root
  name: main repository root
  definition: DEPRECATED ambiguous phrase. It conflates checkout location with branch choice. Use 'repository root checkout' for location or the explicit branch term you mean.
  status: deprecated
  see_also:
  - term:spec-kitty-core/repository-root-checkout
- id: merge-state
  name: merge state
  definition: DEPRECATED. Replaced by `consolidation state`. The `.kittify/merge-state.json` file it named is retired. Only landing a Mission's lanes is called consolidation; a pull request merge and `git merge` keep their names.
  status: deprecated
  see_also:
  - term:spec-kitty-core/consolidation-state
- id: consolidation-state
  name: consolidation state
  definition: The per-Mission runtime record at `.kittify/runtime/merge/<mission_id>/state.json` that tracks a consolidation's progress, so `spec-kitty consolidate --resume` can continue an interrupted consolidation without data loss.
  status: draft
- id: merge-target-branch
  name: merge_target_branch
  definition: 'The branch where completed work-package code must ultimately land. Stored in every WP prompt''s frontmatter (alongside planning_base_branch) to give implementing agents an explicit merge destination. In meta.json: legacy alias for target_branch, read as a fallback by resolve_planning_branch_from_meta() when target_branch is absent (pre-WP03 missions). In 3.x all three — target_branch, planning_base_branch, and merge_target_branch — carry the same value; the separation makes intent explicit in agent-facing prompts and prevents the "prep branch leak" (pre-WP07 pattern in which finalize-tasks inherited the current branch instead of the persisted target).

    '
  status: active
- id: mid8
  name: mid8
  definition: The first 8 characters of a mission_id, used as a compact disambiguator in branch names and worktree paths. Not a stable identity on its own — always paired with mission_slug.
  status: active
- id: migration
  name: migration
  definition: A versioned, idempotent transformation that upgrades project filesystem state from one spec-kitty version to another. Migrations are applied in sequence and must not be re-applied once completed.
  status: active
- id: minimal-viable-trail
  name: minimal viable trail
  definition: The minimum auditable artifact trail that every spec-kitty action is required to leave, scaled to action weight. Lightweight actions leave a log entry; heavy actions leave provenance sidecars and durable state artifacts.
  status: draft
- id: mission
  name: mission
  definition: 'A unit of governed delivery: the concrete tracked item, stored under the Mission''s own spec directory and linked to exactly one Mission Type, that carries one piece of work from agreed intent to a verified result.'
  avoid:
  - Feature
  status: active
- id: mission-run
  name: mission run
  definition: One runtime execution of a Mission's step loop, keyed by `run_id`.
  avoid:
  - mission session
  status: active
- id: topic-branch
  name: topic branch
  definition: A short-lived branch carrying one change to a pull request.
  avoid:
  - feature branch
  - PR branch
  status: active
- id: mission-id
  name: mission_id
  definition: The ULID-based canonical, immutable machine identity for a mission, assigned at creation and used for all event routing and disambiguation. Never displayed as a mission number.
  status: active
- id: mission-number
  name: mission_number
  definition: A display-only sequential integer assigned to a mission at consolidation. Never used for lookup, locking, or event routing — use mission_id for those purposes.
  status: active
- id: mission-slug
  name: mission_slug
  definition: The human-readable kebab-cased identifier for a mission (e.g., my-feature), used alongside mid8 in branch and worktree names. Chosen by the mission owner at creation.
  examples:
  - my-feature
  status: active
- id: node-id
  name: node_id
  definition: Stable machine fingerprint (12-char hex). Unchanged from pre-081.
  status: active
- id: occurrence-classification
  name: occurrence classification
  definition: The act of categorizing each instance of a changing string by semantic context — source code, import paths, serialized keys, CLI commands, documentation, and so on. Required before bulk-edit work packages are approved.
  status: active
- id: occurrence-map
  name: occurrence map
  definition: A mission-level artifact (occurrence_map.yaml) that classifies every occurrence of a changing identifier by semantic context. Required before any bulk-edit work package may proceed.
  status: active
- id: plan-concern-refs
  name: plan_concern_refs
  definition: Field in wps.yaml work package entries listing the IC-## implementation concerns from plan.md that the work package addresses. The field is wps.yaml-only and must not be copied into WP prompt frontmatter.
  status: active
- id: phase
  name: phase
  definition: Grouping container for mission primitives, not the enforcement unit
  status: active
- id: pipeline-shape
  name: pipeline-shape
  definition: 'A classification label applied to a function whose body is a sequence of independent

    decisions over a shared input. Pipeline-shape functions are the principal refactor target

    for the `chain-of-responsibility-rule-pipeline` tactic. The shape marker is "3+ independent

    decisions over a common input" — not "function is long". Distinct from deliberate linearity,

    where the sequential structure is intentional and documented. See

    `docs/architecture/04_implementation_mapping/code-patterns.md` entry 1.

    '
  status: active
- id: planning-repository
  name: planning repository
  definition: DEPRECATED alias for 'repository root checkout'. Do not use — agents interpret this as a separate repository. Use 'repository root checkout' instead.
  status: deprecated
  see_also:
  - term:spec-kitty-core/repository-root-checkout
- id: planning-base-branch
  name: planning_base_branch
  definition: 'The branch that was active in the repository root checkout when WP prompts were generated (at finalize-tasks time). Stored in every WP prompt''s frontmatter and in lanes.json to root lane-worktree allocation correctly regardless of which branch the operator is on when running finalize-tasks. In 3.x equals target_branch. Introduced alongside merge_target_branch to close the "prep branch leak" bug (pre-WP07): when finalize-tasks ran from a temporary prep/... branch, that branch leaked into WP frontmatter and crashed lane allocation once the prep branch was deleted.

    '
  status: active
- id: preflight-validation
  name: preflight validation
  definition: Checks `spec-kitty consolidate` runs before it moves any branch (git state, target branch, review artefacts, origin freshness). A failing preflight check blocks the consolidation entirely.
  status: draft
- id: primary-branch
  name: primary branch
  definition: 'The repository''s default integration branch, normally resolved from origin/HEAD and commonly named main, master, or develop. The specify branch-context output exposes this value as primary_branch only for branch-strategy recommendation; it is not automatically the mission''s target_branch once target_branch has been persisted in meta.json.

    '
  status: active
- id: primitive
  name: primitive
  definition: Custom mission-defined executable operation or step unit
  status: active
- id: project
  name: project
  definition: SaaS collaboration surface grouping one or more repositories. Not the local Git resource.
  status: active
- id: project-root-checkout
  name: project root checkout
  definition: 'DEPRECATED (mission 081): Use ''repository root checkout'' instead. The non-worktree checkout at the root of the current repository.'
  status: deprecated
  see_also:
  - term:spec-kitty-core/repository-root-checkout
- id: project-uuid
  name: project_uuid
  definition: Optional SaaS-assigned collaboration identity. Absent until a repository is bound to a SaaS project. Never locally minted.
  status: active
- id: pr-bound-mission
  name: pr-bound mission
  definition: 'A mission expected to land through a pull request rather than direct work on the primary branch. During mission create, --pr-bound activates the branch strategy gate so the branch choice is explicit before planning artifacts are written.

    '
  status: active
- id: provenance
  name: provenance
  definition: A record of what generated a given artifact — the actor identity, timestamp, and source (seed file, user clarification, or LLM generation). Enables audit and reproducibility.
  status: active
- id: provenance-sidecar
  name: provenance sidecar
  definition: A metadata file co-located with a generated artifact, recording its synthesis provenance. Allows any artifact to be traced back to its origin without modifying the artifact itself.
  status: active
- id: repo-slug
  name: repo_slug
  definition: Optional owner/repo Git provider reference (e.g. spec-kitty/spec-kitty). Unchanged from pre-081 meaning.
  examples:
  - spec-kitty/spec-kitty
  status: active
- id: repository
  name: repository
  definition: Local Git resource (one .git directory) holding mission artifacts. Formerly called "project" in pre-081 code.
  status: active
- id: repository-root-checkout
  name: repository root checkout
  definition: The non-worktree checkout at the root of the current repository. Planning commands (specify, plan, tasks) run here. It is a location, not a branch name.
  status: active
- id: repository-label
  name: repository_label
  definition: Human-readable repository display name derived from git remote or directory name. Mutable, not a stable identity. Was called project_slug before mission 081.
  status: active
- id: repository-uuid
  name: repository_uuid
  definition: Stable local repository identity, minted once per repository. Required namespace key for body sync and dedup. Was mislabeled as project_uuid before mission 081.
  status: active
- id: rule-pipeline
  name: rule pipeline
  definition: 'A pipeline of small pure functions, each checking applicability, optionally executing its

    narrow piece of work, and returning a result threaded to the next function. Three flavors are

    recognized in this codebase: Validator (accumulating `list[Finding]`), Transformer (chained

    `(state, actions, error?)`), Scorer (weighted `float`). The Transformer flavor is implemented

    in `src/specify_cli/migration/canonicalization.py::CanonicalRule` and consumed by

    `mission_state.py::_canonicalize_status_row` and `rebuild_state.py`. See the

    `chain-of-responsibility-rule-pipeline` tactic and the code-patterns catalog at

    `docs/architecture/04_implementation_mapping/code-patterns.md` entry 1.

    '
  status: active
- id: scope
  name: scope
  definition: Bounded semantic scope (mission_local, team_domain, audience_domain, spec_kitty_core)
  status: active
- id: semantic-conflict
  name: semantic conflict
  definition: Mismatch or ambiguity in term usage with assigned severity score
  status: active
- id: skill
  name: skill
  definition: A markdown file encoding a domain-specific agent workflow, discoverable as a named command. Skills are the primary unit of reusable agent capability in spec-kitty. The word names three distinct artifacts, so name the sense. A pack skill is a charter-activatable skill that a team shares through an org pack or the project tier. A doctrine skill ships with the product under src/charter/offering/skills/. A command skill is a generated spec-kitty.<command> skill. See the Pack skill entry in docs/context/execution.md.
  status: active
- id: skill-package
  name: skill package
  definition: A self-contained agent capability directory with a SKILL.md descriptor, installable under .agents/skills/. Provides the discoverable packaging format for a skill.
  status: active
- id: sonar-quality-gate
  name: sonar quality gate
  definition: 'The SonarCloud project-level pass/fail evaluation for `spec-kitty_spec-kitty` on the

    new-code window. Aggregates six conditions (reliability rating, security rating,

    maintainability rating, new coverage, new duplicated lines density, new security hotspots

    reviewed). Reports `OK` or `ERROR` per condition plus a top-level status. Pulled via the

    public REST API at `https://sonarcloud.io/api/qualitygates/project_status`; the helper

    `work/snippets/sonarcloud_branch_review.sh` formats this for terminal use. Thresholds (as

    of 2026-05-14): new_reliability_rating GT 1 (A), new_security_rating GT 1 (A),

    new_maintainability_rating GT 1 (A), new_coverage LT 80%, new_duplicated_lines_density

    GT 3%, new_security_hotspots_reviewed LT 100%.

    '
  status: active
- id: status-commit
  name: status commit
  definition: 'An auto-commit created by spec-kitty to record workflow state changes (WP state transitions, lane assignment, WP claims). A status commit lands on the Mission''s resolved status surface: the coordination branch for coordination topologies, the write branch otherwise. It never lands on a lane branch, and never on a protected branch.'
  avoid:
  - ceremony commit
  - ceremony
  - ceremony write
  - status-writing operation
  - status-writing command
  status: active
- id: status-writing-operation
  name: status-writing operation
  definition: DEPRECATED. Replaced by `status commit`. This phrasing landed during a partial rename; it is forbidden in active source. See the canonical `status commit` entry.
  status: deprecated
  see_also:
  - term:spec-kitty-core/status-commit
- id: strictness
  name: strictness
  definition: Glossary enforcement mode (off, medium, max)
  status: active
- id: start-branch
  name: start branch
  definition: 'The branch passed to mission create with --start-branch. The CLI creates or switches to this branch before writing mission scaffolding, and it must match --target-branch when both options are supplied so mission metadata and the checked-out branch describe the same planning branch.

    '
  status: active
- id: structural-debt
  name: structural debt
  definition: 'A function whose cognitive complexity has accumulated beyond reviewable bounds AND whose

    responsibilities are independently dispatching concerns with no shared state between branches.

    A structural debt function is a refactor candidate per the `refactoring-extract-first-order-concept`

    and `refactoring-extract-class-by-responsibility-split` tactics. Distinguished from deliberate

    linearity by the *absence* of a documented design intent and by the presence of independent

    dispatch arms or triplicated patterns. Canonical example: `doctor.py::mission_state` at CC 57

    (three independent dispatch arms — `--audit`, `--fix`, `--teamspace-dry-run` — sharing no state

    after option parsing, plus triplicated JSON-vs-pretty emit logic). WP06 of mission

    `quality-devex-hardening-3-2-01KRJGKH` extracted it to a CC 3 thin orchestrator plus per-mode

    runners.

    '
  status: active
- id: styleguide
  name: styleguide
  definition: A doctrine artifact specifying coding or writing conventions for a project. Applied during implementation and review to keep outputs consistent.
  status: active
- id: synthesis-manifest
  name: synthesis manifest
  definition: The authoritative commit marker written last during charter synthesis. Its presence and hash integrity indicate a complete, valid synthesis run. Absence or hash mismatch signals a partial or corrupted run.
  status: active
- id: tactic
  name: tactic
  definition: A doctrine artifact describing a reusable workflow or procedure that agents follow to accomplish a specific class of task. Composed of ordered steps and cross-references.
  status: active
- id: target-branch
  name: target branch
  definition: 'The git branch on which a mission''s code, planning artifacts, and status events must ultimately land. Persisted in meta.json under the key target_branch at mission-create time and never overwritten. Read by resolve_planning_branch_from_meta() as the canonical key; merge_target_branch is its legacy alias in older meta.json fixtures. Since WP07 (FR-012), all downstream commands — finalize-tasks, implement, review, merge — derive the branch contract from this stored value, not from the operator''s current_branch at invocation time. In branch-context JSON output, target_branch and base_branch carry the same value when queried at the mission level.

    '
  status: active
- id: teamspace
  name: teamspace
  definition: A shared workspace or channel used for collaborative input to spec-kitty decision moments, particularly in widen mode flows.
  status: draft
- id: widen-mode
  name: widen mode
  definition: A CLI feature that allows a mission owner to escalate an interview question to a collaborative channel for group input, with the response written back into the local decision moment.
  status: draft
- id: work-package
  name: work package
  definition: Execution slice inside a Mission, the unit of human/agent handoff
  status: active
- id: workspace
  name: workspace
  definition: The checkout a work package is implemented in. For lane topologies it is the WP's lane worktree; for `single_branch` it is the write checkout. Resolve it with `spec-kitty implement`; never construct the path.
  status: active
- id: wp
  name: wp
  definition: Abbreviation for work package
  status: active
- id: lightweight-mode
  name: lightweight mode
  definition: '`spec-kitty review` invocation that performs consistency checks but is explicitly NOT a release gate. Skips dead-code and BLE001 audits; reports state with that limitation.'
  status: active
- id: post-merge-mode
  name: post-merge mode
  definition: '`spec-kitty review` invocation that enforces the full mission-review release-gate contract; requires `issue-matrix.md`, Gate 1-4 records, and `mission-exception.md` when applicable.'
  status: active
- id: mode-mismatch
  name: mode mismatch
  definition: Diagnostic class fired when an operator explicitly requests `--mode post-merge` against a mission whose `baseline_merge_commit` is absent.
  status: active
- id: issue-matrix-schema-drift
  name: issue-matrix schema drift
  definition: Diagnostic class fired when an `issue-matrix.md` file uses columns outside the canonical mandatory + named-optional vocabulary.
  status: active
- id: canonical-issue-matrix
  name: canonical issue-matrix
  definition: The canonical machine-readable issue-matrix artifact, `issue-matrix.json`, recording each mission issue's verdict; supersedes the legacy `issue-matrix.md`, which is still read via failover for pre-migration missions.
  status: active
- id: encoding-chokepoint
  name: encoding chokepoint
  definition: The single ingestion boundary at which charter content's source encoding is detected and recorded as provenance before downstream consumers see it.
  status: active
- id: encoding-provenance
  name: encoding provenance
  definition: The persisted audit trail (JSONL) of every encoding decision the chokepoint made, including detected encoding, confidence, normalization action, and bypass usage.
  status: active
- id: transition-gate
  name: transition gate
  definition: A check that must pass before a work-package status-transition edge (e.g. `in_progress->for_review`) is allowed. Resolved from the repo's active doctrine and dispatched through the inverted move-task hook (`_mt_run_transition_gates`); the flagship handler is the scoped pre-review regression check. Do NOT confuse with the five pre-existing `*gate*` senses (branch strategy gate / diff compliance gate / dependency gate / merge dependency gate / sonar quality gate) — those are unrelated one-off guards, not doctrine-resolved lane-edge checks.
  examples:
  - in_progress->for_review
  status: active
- id: unsafe-bypass
  name: unsafe bypass
  definition: 'An operator-chosen override of the encoding chokepoint''s hard-fail behavior; uses the highest-confidence decode candidate and records `bypass_used: true` in provenance.'
  status: active
- id: review-py-package
  name: review.py package
  definition: The post-WP07 layout of `src/specify_cli/cli/commands/review/` as a package of sibling files; was a single file pre-WP07.
  status: active
- id: charter-content-migration
  name: charter-content migration
  definition: The WP08 scan + normalize-or-fail-loud flow that brings existing missions' charter content into compliance with the WP06 chokepoint contract.
  status: active
- id: enhances
  name: enhances
  definition: 'Declarative field on a Charter Pack artifact (tactic, styleguide, paradigm, procedure, agent profile) that asserts the artifact augments a built-in artifact with the same ID via field-merge. Suppresses the same-ID-collision advisory and auto-emits an `ENHANCES` DRG edge.

    '
  avoid:
  - augments
  - extends
  status: active
- id: overrides
  name: overrides
  definition: 'Declarative field on a Charter Pack artifact that asserts the artifact fully replaces a built-in artifact with the same ID. Suppresses the same-ID advisory and auto-emits an `OVERRIDES` DRG edge.

    '
  avoid:
  - replaces
  - supersedes
  status: active
- id: requirement-id
  name: requirement id
  definition: A stable identifier for one spec requirement -- a kind (FR, NFR, C, or SC), a digit string whose width is significant, an optional single lowercase letter suffix, and an optional mission-slug qualifier; canonical form is kind uppercase, digits verbatim, suffix lowercase. Not to be confused with an implementation-concern ID (a separate plan-level grammar) or a work package ID.
  status: active
- id: success-criterion
  name: success criterion
  definition: A measurable outcome a spec declares with the SC kind; it is a requirement id that is tracked (reported in finalize-tasks' informational success-criteria coverage) but not gating -- an undeclared SC ref cited on a work package still fails as unknown_spec_id. Not to be confused with a user story's acceptance scenario or a functional requirement, whose mapping is coverage-gated.
  status: active
- id: qualified-citation
  name: qualified citation
  definition: A requirement id prefixed with another mission's slug and a hash separator (foreign-qualified). It belongs to the named mission, is never declared, required, flagged, or warned about, and is reported as foreign-qualified -- never failing -- when cited in a work package's refs; the qualifier itself is never resolved. Not to be confused with a GitHub issue reference or a file path.
  status: active
- id: tool-surface-drift
  name: tool-surface drift
  definition: 'The state of a generated tool surface file that Spec Kitty still tracks as managed but whose content no longer matches anything Spec Kitty wrote, so Spec Kitty will not overwrite it without consent. In practice someone edited a generated slash-command file, command skill, managed skill, agent profile or plugin-bundle component. `spec-kitty upgrade` keeps such a file, names it (`Not updated, your local edit was kept: <path>`) and exits non-zero (whether it should is still open) with the outcome `drift_unresolved` and the failure reason `surface_drift` (ADR 2026-10-04-3); `spec-kitty doctor tool-surfaces` reports the same file as drifted. Not tool-surface drift: a missing file (upgrade recreates it); a file that matches an older generated version (stale; upgrade rewrites it); a file Spec Kitty never generated (user-owned, left untouched); a difference between two branches'' copies of `.kittify/metadata.yaml`. A known defect can misclassify an unedited generated file as drifted; that is the defect, not this term. Never write bare ''drift'' in operator-facing text; say which file was kept and why. See the Tool-surface drift entry in docs/context/execution.md.'
  avoid:
  - drift
  status: active
- id: integrating-worktree
  name: integrating worktree
  definition: 'A linked git worktree whose checked-out branch is a mission, lane or coordination branch (a `kitty/mission-` branch, as recognized by the branch-naming authority), or whose branch cannot be read (a detached HEAD counts, to fail safe). Its branch will later be integrated into another branch of the same Mission. `spec-kitty upgrade`, run from the repository root checkout, skips integrating worktrees: it writes, stamps and commits nothing in them (ADR 2026-10-04-4), which is why a lane can still show a pre-upgrade `.kittify/metadata.yaml`. Not an integrating worktree: a worktree on an ordinary branch, such as a topic or landing branch, where upgrade still upgrades and commits; the repository root checkout, which never is one. For a per-work-package execution checkout in general, say lane worktree (see the `lane worktree` entry). See the integrating worktree entry in docs/context/execution.md.'
  status: active
- id: target-owned-bookkeeping
  name: target-owned bookkeeping
  definition: 'A tracked file at the project root that Spec Kitty fully generates, marks ''do not edit'', and that no work package authors, declared target-owned in the state contract; today only `.kittify/metadata.yaml`. Its authoritative copy is the one on the merge target branch. When two branches of one Mission carry different copies, each integration site (consolidate, review start, implement resume, lane sync) resolves the conflict to a fixed side without asking: the copy closer to the merge target branch wins, and between two lanes the receiving lane keeps its own until consolidation (per-site table in ADR 2026-10-04-4). The code identifiers `target_owned`, `is_target_owned_path` and the rule id `R-TARGET-OWNED-BOOKKEEPING` carry this sense. Not target-owned: an operator-editable file (`.gitattributes`, `.gitignore`, `.kittify/config.yaml`), whose conflicts still refuse. For where a Mission artifact is stored, say PRIMARY partition; `.kittify/metadata.yaml` is not a Mission artifact and has no partition. No site computes ''the repository root checkout''s copy''. Do not call it ''primary-owned'': that earlier name suggested the PRIMARY partition or the primary branch, and the merge target branch need not be the primary branch. See the Target-owned bookkeeping entry in docs/context/orchestration.md.'
  avoid:
  - primary-owned bookkeeping
  status: active
- id: charter-offering
  name: charter offering
  definition: 'Everything offered to a project: the Charter Packs it can draw from (the built-in pack and each configured org pack) plus the project layer. The offer side of the charter (src/charter/offering/, packs/); the activation side is the active charter. Not the project''s activated set: say active charter. See ADR 2026-10-06-1 and the Charter offering entry in docs/context/charter.md.'
  avoid:
  - doctrine catalog
  status: active
- id: charter-pack
  name: charter pack
  definition: A distributable bundle of charter components (artifacts and their DRG edges) together with optional activation presets shipped as presets/<name>.yaml. An org pack enforces activations through a governing activation preset whose items are must-have, and through the levels of its policy.yaml. Identified by charter_pack_id (built-in, an org pack's configured name, or project); org packs are configured under charter_packs.org.packs. Not a named starting set of activations (say activation preset) and not the project's activation state (say active charter). See the Charter Pack entry in docs/context/charter.md.
  avoid:
  - doctrine pack
  - doctrine pack id
  status: active
- id: activation-preset
  name: activation preset
  definition: A named set of activations that a Charter Pack ships (presets/<name>.yaml), applied with `spec-kitty charter activate [--pack <pack>] --preset <name>`. Applying it replaces every activation key it governs; changing a customised key needs --force; the applied preset name is not stored. The built-in pack ships default (no per-kind restriction, plus the built-in mission types) and minimal. Not a context-scoped activation entry (that is the activation registry). See the Activation preset entry in docs/context/charter.md.
  avoid:
  - pack default charter
  - default charter pack
  status: active
- id: active-charter
  name: active charter
  definition: 'What a project has activated: its activated_<kind> keys, activated_kinds and mission_type_activations, plus the deactivated_<kind> exclusions, held in the activation ledger .kittify/charter/activation.yaml (ADR 2026-10-19-1; a project not yet upgraded to 4.0.0rc8 still keeps the allow keys in .kittify/config.yaml or the charter.yaml it points to); listed by `spec-kitty charter list --json`. ''Active'' and ''inactive'' alone still describe one artifact (''an active directive''); ''active charter'' names the project''s activated set as a whole; the .kittify/charter/ tree is never called ''active'' (ADR 2026-10-06-1 section 1). See the Active charter entry in docs/context/charter.md.'
  avoid:
  - charter selection
  status: active
- id: activation-ledger
  name: activation ledger
  definition: 'The git-tracked file .kittify/charter/activation.yaml, the single authority for what a project has activated: activated_kinds, mission_type_activations, the three-state activated_<kind> allow state and the deactivated_<kind> exclusions. The effective set of a kind is its allow state minus its exclusions, and an exclusion never removes an org-required id. `spec-kitty init` writes it; `spec-kitty upgrade` or `spec-kitty migrate activation-ledger` moves an older project''s keys into it. Not the Migration Ledger (.kittify/migration-ledger.jsonl, which records the upgrade migrations that ran). See ADR 2026-10-19-1 and the Activation ledger entry in docs/context/charter.md.'
  status: active
- id: project-layer
  name: project layer
  definition: The project's own charter components under the one flat root .kittify/charter-packs/ (charter_pack_id project). Part of the charter offering; ships no presets; listed by `spec-kitty charter pack list` as project. Not the materialised .kittify/charter/ tree (say Charter Bundle). See the Project layer entry in docs/context/charter.md.
  status: active
- id: charter-bundle
  name: charter bundle
  definition: 'The materialised .kittify/charter/ tree as a unit: charter.md, the synthesis manifest, the DRG cache and provenance. Produced by `spec-kitty charter generate` and `spec-kitty charter synthesize`. Never called ''active'': the project''s activation state is the active charter. See the Charter Bundle entry in docs/context/charter.md.'
  status: active
- id: doctrine-pack
  name: doctrine pack
  definition: DEPRECATED. Replaced by `Charter Pack` (ADR 2026-10-06-1). Retired by the charter-pack cutover; see the Charter Pack entry in docs/context/charter.md.
  status: deprecated
- id: doctrine-pack-id
  name: doctrine pack id
  definition: DEPRECATED. Replaced by `charter_pack_id`, the identity of a Charter Pack (ADR 2026-10-06-1, Amendment ruling 1). See the Charter Pack entry in docs/context/charter.md.
  status: deprecated
- id: doctrine-catalog
  name: doctrine catalog
  definition: 'DEPRECATED. Replaced by `charter offering`: everything offered to a project (ADR 2026-10-06-1). See the Charter offering entry in docs/context/charter.md.'
  status: deprecated
- id: charter-selection
  name: charter selection
  definition: 'DEPRECATED. Replaced by `active charter`: what a project has activated (ADR 2026-10-06-1). See the Active charter entry in docs/context/charter.md.'
  status: deprecated
- id: pack-default-charter
  name: pack default charter
  definition: 'DEPRECATED. Replaced by `activation preset`: the built-in pack''s default preset (ADR 2026-10-06-1). See the Activation preset entry in docs/context/charter.md.'
  status: deprecated
