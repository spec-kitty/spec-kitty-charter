schema_version: "1.0"
id: java-conventions
title: Java Conventions
scope: code

principles:
  - name: Make absence explicit
    description: "Make absence explicit: a method that may find nothing returns Optional, never null, so the caller sees the empty case in the signature."
  - name: Close what you open
    description: "Close what you open: every resource is opened in a try-with-resources block, so it is closed on every path."

patterns:
  - name: Optional Return
    description: "Return Optional from a lookup that may find nothing."
    bad_example: |
      User find(String id) { return users.get(id); } // null when absent
    good_example: |
      Optional<User> find(String id) { return Optional.ofNullable(users.get(id)); }

anti_patterns:
  - name: Swallowed Exception
    description: "Catching an exception and doing nothing hides the failure from the caller."
    bad_example: |
      try { write(file); } catch (IOException e) { }
    good_example: |
      try { write(file); } catch (IOException e) { throw new UncheckedIOException(e); }

quality_test: "Does every lookup that may find nothing say so in its return type, and is every opened resource closed on every path?"
