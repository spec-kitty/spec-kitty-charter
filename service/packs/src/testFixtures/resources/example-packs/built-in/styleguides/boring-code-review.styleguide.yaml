schema_version: "1.0"
id: boring-code-review
title: Boring Code Review
scope: code

principles:
  - name: Prefer obvious control flow over clever
    description: "Prefer obvious control flow over clever control flow, unless the clever option clearly improves correctness, safety, or change cost."
  - name: Preserve a single source of truth
    description: "Preserve a single source of truth: consolidate duplicated business logic, state rules, constants, and fragile assumptions; leave harmless syntactic repetition alone when an abstraction would add indirection without preserving meaning."
  - name: A new abstraction must earn its
    description: "A new abstraction must earn its keep -- apply avoid-gold-plating's evidence-gate checklist (5+ of 7 checks, including 3+ real instances of failure) as the single owned threshold before adding one; do not restate a second, competing bar here."
  - name: Comment only where reasoning would otherwise
    description: "Comment only where reasoning would otherwise be lost -- explain why the implementation diverges from the obvious pattern or records a non-obvious constraint, not what the code already says."

patterns:
  - name: Direct control flow
    description: >
      Review branches, loops, and data flow for directness during code
      review. Replace cleverness with familiar language idioms unless the
      clever option clearly improves correctness, safety, or change cost.
  - name: Abstraction earns its keep
    description: >
      Accept a new abstraction in review only when it reduces real
      complexity, improves correctness, or makes future change safer.
      Apply avoid-gold-plating's evidence-gate checklist rather than a
      second, competing threshold.
  - name: Comment for lost reasoning only
    description: >
      Flag comments that narrate self-explanatory code, and require a
      comment where the implementation diverges from the obvious pattern or
      encodes a non-obvious constraint.

tooling:
  linters: "Boring-code-review is a review discipline, not a lint rule; apply it in human or agent code review."
applies_to_languages:
  - python
structural_lint_config:
  max_helper_lines: 3
  allow_wrappers: false
