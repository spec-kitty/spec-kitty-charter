  reason: "The reinforcement ('supporting') bridge the #3063 operator attested: the C4 architecture-documentation hub suggests the Domain-Driven Design paradigm so architecture diagrams and domain boundaries reinforce each other. `suggests` is the closest attested relation for a soft supporting/reinforces pointer (no new relation kind invented). INBOUND to the already-action-reachable DDD paradigm (Family A), so it delivers nothing new and moves no pin — composition-only under today's traversal. The documentation-family leg of 'supporting the documentation and DDD paradigms' is already covered by the member edge to paradigm:c4-incremental-detail-modeling, which IS the documentation/architecture-modelling paradigm."
