- source: directive:RECONCILE_CHANGE_SCOPE_TENSIONS
  target: procedure:change-scope-tension-resolution
  relation: requires
  when: the three change-scope rules pull in different directions on a change
  reason: 'Settles smallest viable diff, the Boy Scout Rule and Locality of Change in a fixed order and records the outcome, so scope decisions are predictable and reviewable.'
- source: directive:RECONCILE_CHANGE_SCOPE_TENSIONS
  target: procedure:keep-change-local
  relation: requires
  when: a change would extend beyond the touched area
  reason: 'Supplies the Locality of Change side of the reconciliation: requires any extension beyond the touched area to be justified and checked in the diff before commit.'
- source: directive:RECONCILE_CHANGE_SCOPE_TENSIONS
  target: procedure:tidy-first-campsite-clean
  relation: requires
  when: an opening tidy-first cleanup precedes the functional change
  reason: 'Protects the directive''s resolution order: opening cleanup lands as its own behavior-preserving step before the functional change, so it never enlarges the file set that order fixes.'
- source: directive:RECONCILE_CHANGE_SCOPE_TENSIONS
  target: procedure:touched-area-cleanup
  relation: requires
  when: applying touched-area cleanup inside the change's file set
  reason: 'Supplies the Boy Scout Rule side of the reconciliation: licenses cleanup but keeps it proportional and inside the change file set.'
- source: directive:RECONCILE_CHANGE_SCOPE_TENSIONS
  target: tactic:change-apply-smallest-viable-diff
  relation: reconciles_tension
