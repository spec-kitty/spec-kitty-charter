spring:
  application:
    name: deployable
  threads:
    virtual:
      enabled: true
  # No JMX: the management endpoints answer over HTTP only, behind the request guard (ADR-0041 decision 7).
  jmx:
    enabled: false
# Health is the one management endpoint, and it answers up or down and nothing else (ADR-0041 decision 7). Every other
# endpoint is off and unexposed, and no detail, component or sanitized value is ever shown. ExposureStartupCheck fails
# the start if the environment widens any of this. Under the container profile the guard lets exactly
# GET /actuator/health through without the token; locally it needs the token like every path.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # No liveness or readiness groups: one replica has nothing to drain (ADR-0060), and the groups would be listed in
      # the body.
      probes:
        enabled: false
    env:
      show-values: never
    configprops:
      show-values: never
server:
  # Loopback only (docs/architecture/service-lifecycle.md); port 0 until the launcher assigns one.
  address: 127.0.0.1
  port: 0
charter:
  # The one directory the service keeps its files under, with a subdirectory per domain:
  #   <root>/packs/<pack>/        every registered pack (built-in, org, project), at the level its pack.yaml declares
  #   <root>/activations/<id>/    reserved for the activation documents (ADR-0020); no activation API yet
  # The same layout serves one user's machine or a shared, hosted store. Nothing is created: a missing root serves no
  # packs; provision packs by copying them into <root>/packs/ until registration of new packs is served. Override with
  # --configRootLocation <path> (or --configRootLocation=<path>, or any Spring property source for charter.config-root).
  config-root: ${configRootLocation:${user.home}/.spec-kitty/charter}
