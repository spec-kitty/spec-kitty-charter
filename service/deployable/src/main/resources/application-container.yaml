# The container profile (ADR-0041): active only when SPRING_PROFILES_ACTIVE=container, never by default. Non-secret
# defaults only: no token, no allowed hosts and no configuration root (the image fixes its mount path, #234).
spring:
  config:
    # Required, without the optional: prefix (ADR-0041 decision 3): a container started without its secrets directory
    # fails the start, naming it. One file per property, named in dot form (<dir>/charter.worktree-token); an empty
    # directory is valid. An env var (CHARTER_WORKTREE_TOKEN) is the alternative and outranks the file, so an empty one
    # hides it. The directory is /run/secrets unless charter.container.secrets-dir (env CHARTER_CONTAINER_SECRETS_DIR)
    # names another: an absolute path, without a slash at the end.
    import: configtree:${charter.container.secrets-dir:/run/secrets}/
server:
  # All interfaces, on a fixed port a container can publish (ADR-0041 decision 4).
  address: 0.0.0.0
  port: 8080
