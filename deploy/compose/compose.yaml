# An example: the charter service in a container under the container profile (ADR-0041). Copy .env.example to .env,
# put each secret in ./secrets as a file named after its property (./secrets/charter.worktree-token), then
# `docker compose up`. No image is published yet (#234): set CHARTER_IMAGE to one you built.
# Never run `docker compose config` with a real .env: it prints the values.
name: charter
services:
  charter:
    image: ${CHARTER_IMAGE:?set CHARTER_IMAGE in .env to a charter service image}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: container
      # Local to this example until the image fixes its mount path (#234).
      CHARTER_CONFIGROOT: /var/lib/spec-kitty/charter
    ports:
      # Loopback only in this example. The service speaks plain HTTP and every request carries the token: publish it
      # wider only behind a proxy that terminates TLS, and list the names clients use in allowed-hosts.
      - "127.0.0.1:8080:8080"
    volumes:
      # Required: the service does not start without it. Not created when missing, so a forgotten directory fails.
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: charter-config
        target: /var/lib/spec-kitty/charter
    # A health check, once the image (#234) ships a client such as curl: GET /actuator/health answers {"status":"UP"}
    # without the token, with an allowed Host. Kept as a comment so the example does not mark a container unhealthy.
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:8080/actuator/health"]
    #   interval: 30s
volumes:
  charter-config:
