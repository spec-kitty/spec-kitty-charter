# One place for every external version. Convention plugins read it by name;
# strict verification of each artifact lives in gradle/verification-metadata.xml.
[versions]
spring-boot = "4.1.1"
openapi-generator = "7.26.0"
# GraalVM native build tools: the version Spring Boot 4.1.1 manages (native-build-tools-plugin.version); ADR-0046.
native-build-tools = "1.1.8"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
cucumber = "8.0.4"
snakeyaml-engine = "3.2"
# networknt json-schema-validator: reviewed under DIRECTIVE_051 (mission pack-schemas-and-level-policy-01M5AFMA, research R2).
json-schema-validator = "3.0.8"
# Apache Commons Compress: the tar and zip readers of the pack archive extractor (packs.infra.archive, IC-03). Reviewed
# under DIRECTIVE_051 (mission layer-merge-and-effective-reads-01M6R0J6, plan "Supply chain"): Maven Central, Apache-signed,
# published 2025-07-26, none of its optional codecs (zstd-jni, brotli, xz, asm) is resolved.
commons-compress = "1.28.0"
# Google re2j: linear-time regular expressions for the patterns a pack writes into an embedded config_schema (ReDoS).
re2j = "1.8"
# Google Jimfs: an in-memory file system for tests, configured without POSIX views to run the owner-only ACL path of
# OwnerOnly on Linux (#510). Test scope only (packs); Maven Central, Google-published, Apache-2.0; brings Guava only.
jimfs = "1.3.1"
# Quality gates (operator-vetted 2026-10-18; research.md section 10). jqwik is excluded (C-008).
spotless = "8.10.3"
palantir-java-format = "2.101.0"
checkstyle = "14.3.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.0"
jacoco = "0.8.15"
pitest-plugin = "1.19.0"
pitest = "1.30.0"
pitest-junit5 = "1.2.3"
# Tracks the version spring-boot-dependencies manages; moves with spring-boot.
mockito = "5.23.0"
# The generated Java client's runtime (#218): the versions openapi-generator's okhttp-gson library is written against,
# gson raised to the release the build already verifies. Jakarta annotations are pinned here, not by the Spring BOM:
# the client depends on no Spring.
okhttp = "4.12.0"
gson = "2.11.0"
gson-fire = "1.9.0"
jakarta-annotation-client = "3.0.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-web = { module = "org.springframework:spring-web" }
spring-context = { module = "org.springframework:spring-context" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
cucumber-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber" }
cucumber-java = { module = "io.cucumber:cucumber-java" }
cucumber-spring = { module = "io.cucumber:cucumber-spring" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
gson-fire = { module = "io.gsonfire:gson-fire", version.ref = "gson-fire" }
jakarta-annotation-api-client = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation-client" }
# Plugin artifacts, consumed by the build-logic convention plugins.
gradle-plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
gradle-plugin-openapi-generator = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }
gradle-plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradle-plugin-errorprone = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
gradle-plugin-pitest = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-plugin" }
gradle-plugin-graalvm-native = { module = "org.graalvm.buildtools:native-gradle-plugin", version.ref = "native-build-tools" }
# The generator itself, compiled against by the contract normalizer in build-logic; the plugin brings it at run time.
openapi-generator-lib = { module = "org.openapitools:openapi-generator", version.ref = "openapi-generator" }
