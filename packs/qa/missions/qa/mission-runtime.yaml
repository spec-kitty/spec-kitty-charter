# Schema C — the runtime MissionTemplate this mission's premise depends on.
#
# This is the ONLY schema `spec-kitty next`'s planner reads (`_resolve_next_unified_step`,
# `_state_to_action`). Step `id` values below are the seven canonical ids the planner
# special-cases for work-package discovery (`implement`/`review`) and artifact-presence
# guards (`specify`/`plan`). QA lifecycle identity lives in `title`/`description` only —
# never in `id`. `agent-profile` is bound on every step; `contract_ref` is set on none of
# them (no on-disk step contract exists for this mission type today, and the built-in
# profile-hint default table forbids expansion for custom missions).
mission:
  key: qa
  name: "QA"
  version: "1.0.0"
steps:
  - id: discovery
    title: "Discovery"
    description: "Investigate the feature under test and gather the context a test strategy will be authored against."
    agent-profile: researcher-robbie
    depends_on: []
    prompt_template: discovery.md
  - id: specify
    title: "Test Strategy"
    description: "Define the QA test strategy: scope, risk areas, and what will and will not be tested."
    agent-profile: qa-strategist-quinn
    depends_on: [discovery]
    prompt_template: specify.md
  - id: plan
    title: "Test Plan"
    description: "Translate the test strategy into a detailed, executable test plan with exit criteria, environments, and test data."
    agent-profile: qa-strategist-quinn
    depends_on: [specify]
    prompt_template: plan.md
  - id: tasks
    title: "Test Design"
    description: "Design the concrete test suite and work packages that implement the test plan, including exploratory charters."
    agent-profile: qa-test-designer-tessa
    depends_on: [plan]
    prompt_template: tasks.md
  - id: implement
    title: "Test Execution"
    description: "Execute the designed test suite and record defects found during execution."
    agent-profile: qa-test-executor-elena
    depends_on: [tasks]
    prompt_template: implement.md
  - id: review
    title: "Test Report Review"
    description: "Review execution results for genuine, no-fake-green outcomes and produce the test report."
    agent-profile: qa-reporter-rhea
    depends_on: [implement]
    prompt_template: review.md
  - id: accept
    title: "Acceptance"
    description: "Confirm exit criteria were actually met and record the release/acceptance decision."
    agent-profile: qa-reporter-rhea
    depends_on: [review]
    prompt_template: accept.md
