id: branded-document-generation
schema_version: '1.0'
tool: spec-kitty-branded-pdf
title: Branded Document Generation
guide_path: branded-document-generation.guide.md
summary: |
  How to turn a Markdown source into a Spec Kitty branded PDF using the maintainer-only generator (Markdown to HTML via pandoc, HTML to PDF via WeasyPrint). Documents the dependency setup, the generator invocation and its cover/footer flags, the brand constraints the pipeline enforces (light cream/paper print treatment led by the signature yellow with dark-ink headings; Falling Sky / Swansea / JetBrains Mono type; composed voice with no exclamation marks; sage green is never a lead colour), the sibling design-repo dependency for fonts and logo, and how to verify the rendered PDF with pdfinfo and pdftoppm. Covers the known gotchas: WeasyPrint's pyenv shim failing under a subprocess, the design-repo path auto-detect needing --design-repo when run from elsewhere, and a pandoc GFM bold-span parse trap.
commands:
- pandoc
- weasyprint
- spec-kitty-branded-pdf.py
- pdfinfo
- pdftoppm
